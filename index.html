    b.seg(P, B, { id: 'seg:PB', cls: 'layer-claim' });

      Present from the start (step 0) so step 1 / Replay open on the full true figure.

    const Ccol = b.at('Ccol', V(118, 0), { dir: [1, 0], label: 'C', cls: 'layer-claim' });

      if (UI.hlBeat && UI.hlBeat.i < UI.hlBeat.sets.length - 1) {
        UI.hlBeatTimer = setTimeout(advance, gap);
      }
    };
    if (sets.length > 1) UI.hlBeatTimer = setTimeout(advance, startDelay + gap);
  }
  const cur = UI.hlBeat && UI.hlBeat.sets[UI.hlBeat.i];
  if (cur === null) return 'CLEAR';
  return cur && cur.size ? new Set(cur) : null;
}

/* ============================================================

function renderScrollList(it) {
  const g = GROUPS.find(x => x.key === it._group);

  /* one live figure per entry, so each picture can be clicked and lit */
  const figsMap = {};
  peers.forEach(p => {
    if (window.FIGS && window.FIGS[p.id]) {

  let h = `<div class="wrap scrollwrap">
    <div class="kicker scrollhead">${esc(g ? g.label : '')}</div>`;
  peers.forEach(p => {
    const kick = (p._kicker || '') + (p.num !== null && p.num !== undefined ? ' ' + p.num : '');
    const fw = figsMap[p.id] || null;
    h += `<section class="scrollitem" data-sid="${p.id}">

      <h2 class="title">${esc(p.term || titleOf(p))}</h2>

  h += `</div>`;
  $('#main').innerHTML = h;

  /* -- per-figure selection: click a part (or a name in the text) to light it -- */
  const sels = {};
  const litSection = id => {
    const sec = $(`#main .scrollitem[data-sid="${id}"]`); if (!sec) return;
    const sel = sels[id];
    $$('.ref', sec).forEach(r => {
      const ids = (r.dataset.eids || '').split(' ');
      r.classList.toggle('lit', !!(sel && ids.some(i => sel.includes(i))));
    });
  };
  const wireOne = (svg, id) => {
    const fw = figsMap[id]; if (!svg || !fw) return;
    svg.addEventListener('click', ev => {
      const t = ev.target.closest('[data-eid]');
      if (t) {
        const ids = linkedIdList(fw, t.dataset.eid);
        const same = sels[id] && sels[id].join(' ') === ids.join(' ');
        sels[id] = same ? null : ids;
      } else sels[id] = null;
      drawOne(id); litSection(id);
    });
    svg.addEventListener('mouseover', ev => {
      const t = ev.target.closest('[data-eid]');
      const ids = t ? linkedIdList(fw, t.dataset.eid) : [];
      svg.querySelectorAll('[data-eid]').forEach(n => n.classList.toggle('hov', ids.includes(n.dataset.eid)));
    });
    svg.addEventListener('mouseleave', () => {
      svg.querySelectorAll('[data-eid]').forEach(n => n.classList.remove('hov'));
    });
  };
  const drawOne = id => {
    const el = $(`#main .scrollfig[data-fig="${id}"]`), fw = figsMap[id];
    if (!el || !fw) return;
    let hl = null;
    const sel = sels[id];
    if (sel && sel.length) {
      hl = new Set(sel);
      expandAliases(fw, hl); expandAngleRays(fw, hl); expandPolySides(fw, hl);
    }
    try { el.innerHTML = fw.render({ w: 640, h: 430, highlight: hl }); } catch (e) { return; }
    wireOne(el.firstChild, id);
  };
  peers.forEach(p => drawOne(p.id));

  /* names in the text also select in that entry's own picture */
  $('#main .scrollwrap').addEventListener('click', ev => {
    const r = ev.target.closest('.ref'); if (!r) return;
    const sec = ev.target.closest('.scrollitem'); if (!sec) return;
    const id = sec.dataset.sid; if (!figsMap[id]) return;
    ev.stopPropagation();                 /* keep the theorem-page ref handler out of it */
    const ids = (r.dataset.eids || '').split(' ').filter(Boolean);
    const same = sels[id] && sels[id].join(' ') === ids.join(' ');
    sels[id] = same ? null : ids;
    drawOne(id); litSection(id);
  });

  const sec = $(`#main .scrollitem[data-sid="${it.id}"]`);
  if (sec) setTimeout(() => sec.scrollIntoView({ block: 'start' }), 25);
  bindScrollSpy();
}
function bindScrollSpy() {
  const main = $('#main');

  const spy = () => {
    raf = 0;
    const secs = $$('#main .scrollitem'); if (!secs.length) return;
    const line = main.getBoundingClientRect().top + 90;
    let cur = secs[0];
    for (const s of secs) { if (s.getBoundingClientRect().top <= line) cur = s; else break; }
    const id = cur.dataset.sid;
    if (id && id !== UI.id && BY_ID[id]) {

/* ============================================================

const SCOPES = [
  { id: 'all', label: 'All 39 theorems', pick: i => i._group === 'theorems' },
  { id: 't1', label: 'Theorems 1 – 10', pick: i => i._group === 'theorems' && i.sort <= 10 },
  { id: 't2', label: 'Theorems 11 – 20', pick: i => i._group === 'theorems' && i.sort > 10 && i.sort <= 20 },
  { id: 't3', label: 'Theorems 21 – 30', pick: i => i._group === 'theorems' && i.sort > 20 && i.sort <= 30 },
  { id: 't4', label: 'Theorems 31 – 37', pick: i => i._group === 'theorems' && i.sort > 30 },
  { id: 'cons', label: 'The constructions only', pick: i => i._group === 'theorems' && i.kind === 'construction' },
  { id: 'defs', label: 'Definitions', pick: i => i._group === 'definitions' }
];
function recBuild(scope, ids) {
  REC.scope = scope;
  const sc = SCOPES.find(s => s.id === scope) || SCOPES[0];
  const list = ids || ITEMS.filter(sc.pick).map(i => i.id);
  for (let i = list.length - 1; i > 0; i--) {          // shuffle
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  REC.queue = list; REC.at = 0; REC.again = [];
  recReset();
}
function recReset() { REC.drawing = false; REC.proof = false; REC.key = false; REC.scaffold = false; }
function recNext(hadIt) {
  const id = REC.queue[REC.at];
  if (!hadIt && id) REC.again.push(id);
  REC.at++; recReset(); renderRecitation();
}

function drawWorkbench() {
  const wrap = $('#figwrap'); if (!wrap) return;
  const WB = window.WB, PR = window.WB_proof;
  const fig = G.makeFigure(window.WB_figure(), {});
  let lit = new Set(WB.sel || []);
  if (WB.mode === 'prove') {
    lit = new Set();
    const d = WB.draft || {};
    [d.lhs, d.rhs].forEach(p => { if (p) PR.eids(p).forEach(x => lit.add(x)); });
    (d.buf || []).forEach(x => lit.add(x));
    if (WB.litClaim) {
      const c = (WB.claims || []).find(x => x.n === WB.litClaim);

  }
  wrap.innerHTML = fig.render({
    w: WBV.w, h: WBV.h, view: WBV.view, showScaffold: true,

  if (!svg) return;
  svg.addEventListener('click', ev => {
    const API = window.WB_api, PR = window.WB_proof;
    const el = ev.target.closest('[data-eid]');
    let msg = '';

      msg = el ? PR.proofClick(el.dataset.eid) : 'Click a part of the figure.';
    } else if (el) {
      msg = API.pick(el.dataset.eid);
    } else {
      const ctm = svg.getScreenCTM();
      const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
      const q = p.matrixTransform(ctm.inverse());

    renderWorkbench();
  });
}

function drawFig(opt) {
  opt = opt || {};
  const it = BY_ID[UI.id]; if (!it) return;
  const fig = figFor(it.id);
  if (!fig) return;
  /* fullscreen studio, when open, owns the drawing surface */
  const wrap = document.getElementById('fs-figwrap') || $('#figwrap'); if (!wrap) return;
  const upTo = UI.step === null ? Infinity : UI.step;
  let hl = null;
  let hlKeep = false;
  let beatAnim = !!opt.beatAdvance;
  if (UI.sel) {
    hl = new Set(UI.sel);
    expandAliases(fig, hl);
    expandAngleRays(fig, hl);
    expandPolySides(fig, hl);
    if (!opt.beatAdvance) clearHlBeats();
  } else if (UI.step !== null && UI.step > 0 && it.steps && it.steps[UI.step - 1]) {
    const st = it.steps[UI.step - 1];
    /* multi-beat highlight (e.g. one congruent triangle, then the other) */
    const beatHl = (st.hlBeats && st.hlBeats.length) ? hlBeatsFor(it, st, fig) : null;
    if (beatHl === 'CLEAR') {
      hl = null;           /* full figure, normal strokes, all tick marks */
    } else if (beatHl) {
      hl = beatHl;
    } else if (st.hlIds && st.hlIds.length) {
      /* explicit ids win — used when auto refsIn pulls in too much */
      hl = new Set(st.hlIds);
      if (st.hlExpand !== false && st.hlExpand !== 'none') {
        if (st.hlExpand === 'sides') expandPolySides(fig, hl);
        else expandAngleRays(fig, hl); /* default: angles → their two rays only */
      }
    } else {
      const ids = [];
      refsIn(st.text, fig).forEach(r => ids.push(...r.ids));
      /*
        hl: "angles" — light only what this step names: angle marks (and any
        segments / points the text actually mentions). Dim everything else so
        the base and unrelated angles do not stay lit.
      */
      if (st.hl === 'angles' || st.hl === 'numbers') {
        hlKeep = false;
        const angs = ids.filter(id => id.startsWith('ang:') || id.startsWith('lab:'));
        const segs = ids.filter(id => id.startsWith('seg:'));
        const pts  = ids.filter(id => id.startsWith('pt:'));
        const pick = angs.length || segs.length ? angs.concat(segs, pts) : ids;
        hl = new Set(pick);
      } else if (ids.length) {
        hl = new Set(ids);
      }
      /* angle marks also light their two rays; triangles light their three sides */
      if (hl) {
        expandAngleRays(fig, hl);
        expandPolySides(fig, hl);
      }
    }
  } else if (!opt.beatAdvance) {
    clearHlBeats();
  }
  /* draw the new work on only when the proof moves forward (or a highlight beat) */
  const last = UI.lastDrawn;
  const stNow = (UI.step !== null && UI.step > 0 && it.steps) ? it.steps[UI.step - 1] : null;
  const hasBeats = !!(stNow && stNow.hlBeats && stNow.hlBeats.length);
  const stepAdvance = UI.step !== null && !!last && last.id === it.id &&
    UI.step > (last.step === null ? -1 : last.step);
  /*
    Steps with hlBeats (or a single full hlIds highlight): skip staggered
    construction draw-on so the whole figure does not drip in piece by piece
    (e.g. only A and BP first). Beats reflash only what is new to that beat.
  */
  const hasHlIds = !!(stNow && stNow.hlIds && stNow.hlIds.length);
  let noDrawAnim = (hasBeats || hasHlIds) && (beatAnim || stepAdvance);
  /* hlDraw: draw the step on as usual, and let the beats follow */
  if (noDrawAnim && stNow && stNow.hlDraw && !beatAnim) noDrawAnim = false;
  const animate = beatAnim || stepAdvance;
  let reflashIds = opt.reflashIds || null;
  if (hasBeats && stepAdvance && !beatAnim && UI.hlBeat && UI.hlBeat.reflashFor) {
    reflashIds = UI.hlBeat.reflashFor(0);
  } else if (hasHlIds && stepAdvance && !beatAnim && hl) {
    reflashIds = new Set(hl);
  }
  if (!opt.beatAdvance) UI.lastDrawn = { id: it.id, step: UI.step };
  const zoomDur = 0.62 / UI.speed;
  /* ids from this step's beats so far (so DA stays after its beat when AE draws) */
  let revealedIds = null;
  if (UI.hlBeat && UI.hlBeat.sets && UI.hlBeat.sets.length) {
    revealedIds = new Set();
    const upToBeat = Math.min(UI.hlBeat.i, UI.hlBeat.sets.length - 1);
    for (let bi = 0; bi <= upToBeat; bi++) {
      const s = UI.hlBeat.sets[bi];
      if (s) s.forEach(id => revealedIds.add(id));
    }
  }
  /*
    Beat staging. Whatever a later beat says it will draw or show is kept off
    the figure until that beat comes round; whatever an earlier beat drew stays,
    construction lines included, whether or not the checkbox is ticked.
  */
  let hideIds = null, forceIds = null, drawIds = null, fadeIds = null, keepIds = null, dimIds = null;
  if (UI.step !== null && it.steps) {
    /* everything staged by a beat in this step or any step before it */
    const staged = new Set();
    for (let s = 1; s < UI.step; s++) {
      const sp0 = it.steps[s - 1];
      (sp0 && sp0.hlBeats ? sp0.hlBeats : []).forEach(b => {
        const sp = beatSpec(b); if (!sp) return;
        sp.draw.concat(sp.show).forEach(id => staged.add(id));
      });
    }
    const later = new Set();
    if (UI.hlBeat && UI.hlBeat.specs && UI.hlBeat.id === it.id && UI.hlBeat.step === UI.step) {
      const specs = UI.hlBeat.specs, at = UI.hlBeat.i;
      specs.forEach((sp, k) => {
        if (!sp) return;
        const into = k > at ? later : staged;
        sp.draw.forEach(id => into.add(id));
        sp.show.forEach(id => into.add(id));
      });
      const cur = specs[at];
      if (cur) {
        if (cur.keep.length) keepIds = new Set(cur.keep);
        if (cur.dim.length) dimIds = new Set(cur.dim);
        if (animate) {
          if (cur.draw.length) drawIds = new Set(cur.draw);
          if (cur.show.length) fadeIds = new Set(cur.show);
        }
      }
    }
    staged.forEach(id => later.delete(id));
    hideIds = later.size ? later : null;
    forceIds = staged.size ? staged : null;
  }
  const fsBig = !!(window.FSX && window.FSX.active);
  const opts = {
    w: fsBig ? 1000 : 640, h: fsBig ? 700 : 480, showScaffold: UI.scaffold, upTo, highlight: hl, hlKeep,
    /* the studio holds one fixed scale, so altered lengths visibly change size */
    view: (fsBig && window.FSX.lockedView) ? window.FSX.lockedView() : undefined,
    animate, speed: UI.speed, noDrawAnim, reflashIds, revealedIds,
    hideIds, forceIds, drawIds, fadeIds, keepIds, dimIds,
    hlExclude: (stNow && stNow.hlNot && stNow.hlNot.length) ? new Set(stNow.hlNot) : null
  };
  let out = fig.render(opts);
  let z = { needed: false };
  if (animate && !beatAnim && !noDrawAnim) {
    z = G.zoomFor(fig.fig, { step: UI.step });
    if (z.needed) out = fig.render(Object.assign({}, opts, { delay0: zoomDur + 0.12 }));
  }
  wrap.innerHTML = out;
  clearTimeout(UI.zoomTimer);
  if (z.needed) {
    const body = wrap.firstChild && wrap.firstChild.querySelector
      ? wrap.firstChild.querySelector('.figbody') : null;
    if (body) {
    body.style.transitionDuration = zoomDur + 's';
    requestAnimationFrame(() => {
      body.style.transform = `translate(${f2(z.tx)}px,${f2(z.ty)}px) scale(${f2(z.s)})`;
    });
    /* let the finished figure sit still for a moment before coming back in */
    UI.zoomTimer = setTimeout(() => {
      if (body.isConnected) body.style.transform = '';
    }, (zoomDur + 0.12 + drawSpan(UI.step) + HOLD) * 1000);
    }
  }
  applyFigLayer(it, wrap.firstChild, stepAdvance && !beatAnim);
  wireFig(wrap.firstChild, fig);
  if (window.FSX && window.FSX.active) window.FSX.afterDraw(wrap.firstChild, fig);
}

/**
 * Theorem 12 (and similar): two diagram layers — the true claim figure and the
 * reductio figure. Swipe the claim up when the supposition begins; swipe the
 * reductio up when the proof restores the claim on the last step.
 */
function thm12Layer(step, n) {
  if (step === null || step === 0 || step === 1) return 'claim';
  if (step >= n) return 'claim';           /* final line: back to the truth */
  return 'reductio';                       /* steps 2 … n-1 */
}
function applyFigLayer(it, svg, doTransition) {
  if (!svg || !it) return;
  /* only thm 12 uses layered claim/reductio figures for now */
  if (it.id !== 'thm:12') {
    clearTimeout(UI.figLayerTimer); UI.figLayerTimer = 0; UI.figLayerSvg = null;
    svg.removeAttribute('data-layer');
    UI.figLayer = null;
    return;
  }
  const n = nSteps(it);
  const target = thm12Layer(UI.step, n);
  const prev = UI.figLayer;
  /* a swipe already under way on this very figure: leave it to finish, or it
     would start over from the beginning and the figure would judder */
  if (UI.figLayerTimer && UI.figLayerSvg === svg && prev === target) return;
  clearTimeout(UI.figLayerTimer); UI.figLayerTimer = 0;
  UI.figLayerSvg = svg;
  if (doTransition && prev && prev !== target) {
    const mode = (prev === 'claim' && target === 'reductio') ? 'to-reductio'
      : (prev === 'reductio' && target === 'claim') ? 'to-claim'
      : target;
    svg.setAttribute('data-layer', mode);
    UI.figLayer = target;
    /* the swipe itself is 0.72 * --dur; let it land before settling */
    UI.figLayerTimer = setTimeout(() => {
      UI.figLayerTimer = 0;
      if (svg.isConnected) svg.setAttribute('data-layer', target);
    }, 700 / UI.speed);
  } else {
    svg.setAttribute('data-layer', target);
    UI.figLayer = target;
  }
}

function isPhoneLayout() {
  return !!(window.matchMedia && matchMedia('(max-width:900px)').matches);
}

/** Corner badge: only while Replay is running, and only for real proof lines (≥ 1). */
function syncStepBadge() {
  const badge = $('#fig-stepbadge');
  if (!badge) return;
  const show = !!UI.playing && UI.step !== null && UI.step >= 1;
  badge.textContent = show ? String(UI.step) : '';
  badge.classList.toggle('on', show);
  badge.hidden = !show;
  badge.setAttribute('aria-hidden', show ? 'false' : 'true');
  if (show) badge.setAttribute('aria-label', 'Proof step ' + UI.step);
  else badge.removeAttribute('aria-label');
}

function syncSteps() {
  const it = BY_ID[UI.id]; if (!it) return;
  const n = nSteps(it);
  $$('#main ol.steps li, #fsov ol.steps li').forEach(li => {
    const s = +li.dataset.step;
    li.classList.toggle('on', UI.step === s);
    li.classList.toggle('done', UI.step !== null && s < UI.step);
    li.classList.toggle('future', UI.step !== null && s > UI.step);
  });
  const chipTxt = UI.step === null ? '' : (UI.step === 0 ? 'what is given' : 'step ' + UI.step + ' of ' + n);
  const chip = $('#stepchip');
  if (chip) chip.textContent = chipTxt;
  const chip2 = $('#fs-stepchip'); if (chip2) chip2.textContent = chipTxt;
  const pl = $('#b-play'); if (pl) pl.textContent = UI.playing ? '❙❙ pause' : '▶ Play';
  const pl2 = $('#fs-play'); if (pl2) pl2.textContent = UI.playing ? '❙❙ pause' : '▶ Play';
  const op = $('#ob-play'); if (op) op.textContent = UI.playing ? '❚❚' : '▶';
  /* on a phone, the line of the proof the figure has reached sits right
     under the drawing (the proof itself is further down the page) */
  const sl = $('#fig-stepline');
  if (sl) {
    const stx = (UI.step !== null && UI.step >= 1 && it.steps && it.steps[UI.step - 1])
      ? UI.step + '.  ' + it.steps[UI.step - 1].text : '';
    sl.textContent = stx;
    sl.hidden = !stx;
  }
  syncStepBadge();
}

function setStep(s) {
  const it = BY_ID[UI.id]; if (!it) return;
  const n = nSteps(it);
  if (s === null) UI.step = null;
  else UI.step = Math.max(0, Math.min(n, s));
  UI.sel = null;
  clearHlBeats();
  drawFig(); syncSteps();
  /* On phone the diagram sits above the proof; auto-scrolling to each line
     steals focus and fights the user’s free scroll. Desktop keeps follow-along. */
  if (UI.playing && !isPhoneLayout()) {
    const li = $(`#main ol.steps li[data-step="${UI.step}"]`);
    if (li) li.scrollIntoView({ block: 'nearest' });
  }
}
const f2 = n => Math.round(n * 100) / 100;
/* how many things are drawn on at this step, and how long that takes */
function animCount(s) {
  const fig = figFor(UI.id); if (!fig) return 1;
  let n = 0;
  fig.fig.objs.forEach(o => {
    if ((o.step || 0) !== s) return;
    if (o.role === 'scaffold' && !UI.scaffold) return;
    if (o.role === 'hidden' || (o.step || 0) > 90) return;
    n++;
  });
  return Math.max(1, n);
}
const HOLD = 0.55;                 // the finished figure stays put before anything moves
function drawSpan(s) {
  const n = animCount(s);
  let late = 0;
  const fig = figFor(UI.id);
  if (fig) fig.fig.objs.forEach(o => {
    if ((o.step || 0) === s && o.late && (o.role !== 'scaffold' || UI.scaffold)) late = Math.max(late, o.late);
  });
  return ((n > 5 ? 0.13 : 0.17) * (n - 1) + 0.82 + late) / UI.speed;
}
function stepTime(s) {
  const fig = figFor(UI.id); if (!fig) return 1400;
  const it = BY_ID[UI.id];
  const st = it && it.steps && s > 0 ? it.steps[s - 1] : null;
  const z = G.zoomFor(fig.fig, { step: s });
  const zoomOut = z.needed ? (0.62 + 0.12) / UI.speed : 0;
  const zoomBack = z.needed ? 0.62 / UI.speed : 0;
  const nBeats = st && st.hlBeats ? st.hlBeats.length : 1;
  const beatGap = (st && st.hlBeatMs ? st.hlBeatMs : 950) / UI.speed / 1000;
  const beatExtra = nBeats > 1 ? (nBeats - 1) * beatGap + 0.35 : 0;
  /* thm 12 layer swipe claim ↔ reductio */
  const n = it ? nSteps(it) : 0;
  const layerSwipe = (it && it.id === 'thm:12' && (s === 2 || s === n)) ? 0.85 / UI.speed : 0;
  const t = (zoomOut + drawSpan(s) + HOLD + zoomBack + 0.35 + beatExtra + layerSwipe) * 1000;
  return Math.max(1100, Math.min(9000, t));
}
function play() {
  if (UI.playing) { stopPlay(); syncSteps(); return; }
  const it = BY_ID[UI.id], n = nSteps(it);
  /*
    Play from wherever the reader is standing: if a step of the proof is
    showing, that step is drawn again from its own beginning and the proof
    runs on to the end. With no step chosen, it plays from the start.
    (Thm 12 begins on step 1: its claim figure is already the "given".)
  */
  const chosen = (UI.step !== null && UI.step >= 1) ? UI.step : null;
  const startAt = chosen !== null ? chosen : ((it && it.id === 'thm:12') ? 1 : 0);
  UI.step = startAt; clearHlBeats();
  UI.figLayer = null; clearTimeout(UI.figLayerTimer);
  /* pretend we have just come from the step before, so this one draws itself on */
  UI.lastDrawn = startAt >= 1 ? { id: it.id, step: startAt - 1 } : null;
  drawFig(); syncSteps();
  const tick = () => {
    if (UI.step >= n) { stopPlay(); syncSteps(); return; }
    setStep(UI.step + 1);
    UI.playing = setTimeout(tick, stepTime(UI.step));
  };
  UI.playing = setTimeout(tick, startAt >= 1 ? stepTime(startAt) : 700 / UI.speed);
  syncSteps();
}
function stopPlay() {
  if (UI.playing) { clearTimeout(UI.playing); UI.playing = 0; }
  clearHlBeats();
  syncStepBadge();
}

/* ---------- dragging & clicking in the figure ---------- */
function linkedIdList(fig, id) {
  const set = new Set([id]);
  expandAliases(fig, set);
  return Array.from(set);
}
function wireFig(svg, fig) {
  if (!svg) return;
  svg.addEventListener('click', ev => {
    const el = ev.target.closest('[data-eid]');
    if (el) {
      const ids = linkedIdList(fig, el.dataset.eid);
      const same = UI.sel && UI.sel.length === ids.length && ids.every((x, i) => x === UI.sel[i]);
      UI.sel = same ? null : ids;
    } else UI.sel = null;
    drawFig(); litText();
  });
  svg.addEventListener('mouseover', ev => {
    const el = ev.target.closest('[data-eid]');
    if (!el) { hover(null); return; }
    hover(el.dataset.eid, linkedIdList(fig, el.dataset.eid));
  });
  svg.addEventListener('mouseleave', () => hover(null));
}
/* soft highlight while the mouse is over a part (group = co-linked ids) */
function hover(id, group) {
  const ids = group && group.length ? group : (id ? [id] : []);
  const hit = eid => ids.includes(eid);
  $$('#main .fig [data-eid], #fsov .fig [data-eid]').forEach(el => el.classList.toggle('hov', hit(el.dataset.eid)));
  $$('#main .ref, #fsov .ref').forEach(r => {

}

  $$('#main .ref, #fsov .ref').forEach(r => {
    const ids = (r.dataset.eids || '').split(' ');
    r.classList.toggle('lit', !!(UI.sel && ids.some(i => UI.sel.includes(i))));
  });
}

/* ---------- citation popover ---------- */
let pop = null;
function showCite(id, x, y) {
  hideCite();

  pop = document.createElement('div');
  pop.className = 'pop';
  const f = FIGS[id] ? G.makeFigure(FIGS[id], {}) : null;
  const figHtml = f
    ? `<div class="pop-fig">${f.render({ w: 480, h: 320, showScaffold: false, pad: 0.04, preview: true })}</div>`
    : '';
  pop.innerHTML = `<button class="close">✕</button><h5>${esc(shortRef(id))}</h5>
    <div><b>${esc(titleOf(it))}</b></div>
    <div style="color:var(--muted);font-size:14.5px;margin-top:4px">${esc(it.statement || it.text || '')}</div>
    ${figHtml}
    <div style="margin-top:8px"><a data-goto="${id}" style="font-family:var(--sans);font-size:12px;cursor:pointer">open →</a></div>`;
  document.body.appendChild(pop);
  const r = pop.getBoundingClientRect();
  pop.style.left = Math.max(12, Math.min(x, innerWidth - r.width - 14)) + 'px';
  pop.style.top = Math.max(12, Math.min(y + 12, innerHeight - r.height - 14)) + 'px';
  pop.addEventListener('click', ev => {

<script>/* ============================================================

       proof line stays true (clamps forbid degenerate edits);

       can be moved or resized; each proof line is re-checked live
       and flagged when its claim stops being true, and the flag
       lifts again the moment the edit makes it true once more.

function angleAt(p, v, q) {
  const a = sub(p, v), b = sub(q, v);
  const la = Math.hypot(a.x, a.y) || 1e-12, lb = Math.hypot(b.x, b.y) || 1e-12;
  let c = (a.x * b.x + a.y * b.y) / (la * lb);
  c = Math.max(-1, Math.min(1, c));
  return Math.acos(c);
}
const triArea = (a, b, c) => Math.abs((b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x)) / 2;
const polyArea = ps => {
  let s = 0;
  for (let i = 0; i < ps.length; i++) { const p = ps[i], q = ps[(i + 1) % ps.length]; s += p.x * q.y - q.x * p.y; }
  return Math.abs(s) / 2;
};

function checkCtx() {
  let pts, objs;
  if (FS.alter && FS.mode === 'free' && FS.free[FS.id]) {
    pts = FS.free[FS.id].pts; objs = FS.free[FS.id].objs;
  } else {
    const fw = E.figFor(FS.id); if (!fw) return null;
    pts = fw.fig.pts; objs = fw.fig.objs;
  }
  /* tolerance scales with the figure */
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, any = false;
  for (const k in pts) { const p = pts[k]; if (!p) continue; any = true;
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
  const diag = any ? Math.hypot(x1 - x0, y1 - y0) : 200;
  return {
    P: n => pts[n] || null,
    circ: id => objs.find(o => o.kind === 'circle' && o.id === id) || null,
    d(a, b) { const p = this.P(a), q = this.P(b); return (p && q) ? dist(p, q) : null; },
    a3(p, v, q) { const A = this.P(p), Vv = this.P(v), B = this.P(q); return (A && Vv && B) ? angleAt(A, Vv, B) : null; },
    area(ns) { const ps = ns.map(n => this.P(n)); return ps.some(p => !p) ? null : polyArea(ps); },
    tol: Math.max(2, diag * 0.02),
    aTol: 0.038,           /* ≈ 2.2° */
    areaTol: Math.max(40, diag * diag * 0.012)
  };
}

const CLAIM = {
  eqSeg(c, x) { const u = x.d(c[1], c[2]), v = x.d(c[3], c[4]);
    return u === null || v === null || Math.abs(u - v) <= x.tol; },
  /* comparisons are lenient: they flag only when the figure is clearly
     against them, never on a borderline case */
  ltSeg(c, x) { const u = x.d(c[1], c[2]), v = x.d(c[3], c[4]);
    return u === null || v === null || u < v + x.tol * 0.4; },
  gtSeg(c, x) { const u = x.d(c[1], c[2]), v = x.d(c[3], c[4]);
    return u === null || v === null || u > v - x.tol * 0.4; },
  gtAng(c, x) { const a = x.a3(c[1], c[2], c[3]), b = x.a3(c[4], c[5], c[6]);
    return a === null || b === null || a > b - x.aTol; },
  acute(c, x) { const a = x.a3(c[1], c[2], c[3]);
    return a === null || a < Math.PI / 2 + x.aTol; },
  rightAng(c, x) { const a = x.a3(c[1], c[2], c[3]);
    return a === null || Math.abs(a - Math.PI / 2) <= x.aTol; },
  sumSeg(c, x) { const u = x.d(c[1], c[2]), v = x.d(c[3], c[4]), w = x.d(c[5], c[6]);
    return u === null || v === null || w === null || Math.abs(u + v - w) <= x.tol * 1.2; },
  gtSumSeg(c, x) { const u = x.d(c[1], c[2]), v = x.d(c[3], c[4]), w = x.d(c[5], c[6]);
    return u === null || v === null || w === null || u + v > w - x.tol * 0.4; },
  sum2R(c, x) { const a = x.a3(c[1], c[2], c[3]), b = x.a3(c[4], c[5], c[6]);
    return a === null || b === null || Math.abs(a + b - Math.PI) <= x.aTol * 1.6; },
  angEqSum(c, x) { const a = x.a3(c[1], c[2], c[3]), b = x.a3(c[4], c[5], c[6]), d = x.a3(c[7], c[8], c[9]);
    return a === null || b === null || d === null || Math.abs(a - b - d) <= x.aTol * 1.6; },
  para(c, x) { const a = x.P(c[1]), b = x.P(c[2]), p = x.P(c[3]), q = x.P(c[4]);
    if (!a || !b || !p || !q) return true;
    const u = unit(sub(b, a)), v = unit(sub(q, p));
    return Math.abs(u.x * v.y - u.y * v.x) <= 0.055; },
  eqQuad(c, x) { const A1 = x.area(c.slice(1, 5)), A2 = x.area(c.slice(5, 9));
    return A1 === null || A2 === null || Math.abs(A1 - A2) <= x.areaTol * 1.4; },
  halfQuad(c, x) { const T = x.area(c.slice(1, 4)), Q = x.area(c.slice(4, 8));
    return T === null || Q === null || Math.abs(2 * T - Q) <= x.areaTol * 1.6; },
  sumQuad(c, x) { const A1 = x.area(c.slice(1, 5)), A2 = x.area(c.slice(5, 9)), A3 = x.area(c.slice(9, 13));
    return A1 === null || A2 === null || A3 === null || Math.abs(A1 + A2 - A3) <= x.areaTol * 2.2; },
  pythag(c, x) { const u = x.d(c[1], c[2]), v = x.d(c[3], c[4]), w = x.d(c[5], c[6]);
    return u === null || v === null || w === null || Math.abs(Math.hypot(u, v) - w) <= x.tol; },
  betw(c, x) { const u = x.d(c[1], c[2]), v = x.d(c[2], c[3]), w = x.d(c[1], c[3]);
    return u === null || v === null || w === null || Math.abs(u + v - w) <= x.tol; },
  eqAng(c, x) { const p = [1, 2, 3].map(i => x.P(c[i])), q = [4, 5, 6].map(i => x.P(c[i]));
    if (p.some(z => !z) || q.some(z => !z)) return true;
    return Math.abs(angleAt(p[0], p[1], p[2]) - angleAt(q[0], q[1], q[2])) <= x.aTol; },
  circAt(c, x) { const o = x.circ(c[1]), p = x.P(c[2]);
    return !o || !p || dist(o.c, p) <= x.tol; },
  circR(c, x) { const o = x.circ(c[1]), u = x.d(c[2], c[3]);
    return !o || u === null || Math.abs(o.r - u) <= x.tol; },
  onCirc(c, x) { const p = x.P(c[1]), o = x.circ(c[2]);
    return !p || !o || Math.abs(dist(p, o.c) - o.r) <= x.tol; },
  cong(c, x) {
    return CLAIM.eqSeg(['', c[1], c[2], c[4], c[5]], x) &&
           CLAIM.eqSeg(['', c[2], c[3], c[5], c[6]], x) &&
           CLAIM.eqSeg(['', c[1], c[3], c[4], c[6]], x);

  eqArea(c, x) { const p = [1, 2, 3].map(i => x.P(c[i])), q = [4, 5, 6].map(i => x.P(c[i]));

};

function runChecks() {
  if (!FS.on) return;
  const lis = $$('#fsov ol.steps li');
  if (!lis.length) return;
  const spec = CHECKS[FS.id];
  const ctx = spec ? checkCtx() : null;
  let broken = 0;
  lis.forEach(li => {
    const s = +li.dataset.step;
    let ok = true;
    if (spec && ctx && spec[s]) ok = spec[s].every(cl => (CLAIM[cl[0]] || (() => true))(cl, ctx));
    li.classList.toggle('fs-broken', !ok);
    if (!ok) broken++;
  });
  const badge = $('#fs-badge');
  if (badge) {
    const modeTxt = !FS.alter ? 'viewing'
      : (FS.mode === 'preserve' ? 'altering — <b>proof preserved</b>' : 'altering — <b>free edit</b>');
    badge.innerHTML = modeTxt + (broken ? ` · <b style="color:var(--accent)">${broken} line${broken > 1 ? 's' : ''} broken</b>` : (FS.alter && FS.mode === 'free' ? ' · all lines hold' : ''));

/* ============================================================
   Free-edit snapshot: a detached copy of the built figure whose
   shared endpoints stay shared, so connected geometry moves as
   one — but nothing is constrained.
   ============================================================ */
function makeSnapshot() {
  const src = E.figFor(FS.id).fig;
  const map = new Map();
  const cp = p => {
    if (!p || typeof p.x !== 'number') return p;
    if (!map.has(p)) { const q = V(p.x, p.y); if (p.name) q.name = p.name; map.set(p, q); }
    return map.get(p);
  };
  const objs = src.objs.map(o => {
    const n = Object.assign({}, o);
    ['at', 'a', 'b', 'c', 'v', 'p', 'q'].forEach(k => { if (n[k] && typeof n[k].x === 'number') n[k] = cp(o[k]); });
    if (o.pts) n.pts = o.pts.map(cp);
    return n;
  });
  const pts = {};
  map.forEach(q => { if (q.name && !(q.name in pts)) pts[q.name] = q; });
  const pseudo = { objs, alias: src.alias, pts, state: {}, free: [] };
  return { objs, pts, map, pseudo, pf: { fig: pseudo } };
}

/* ---------- coordinate mapping ---------- */
function svgPt(svg, cx, cy) {
  const p = svg.createSVGPoint(); p.x = cx; p.y = cy;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function currentProj() {
  if (FS.alter && FS.mode === 'free' && FS.free[FS.id]) return FS.free[FS.id].pseudo._proj;
  const fw = E.figFor(FS.id); return fw && fw.fig._proj;
}
function toWorld(svg, cx, cy) {
  const proj = currentProj(); if (!proj) return null;
  const vp = mApply(mInv(FS.cam.m), svgPt(svg, cx, cy));
  return Scene.unproject(proj.inv(vp));
}

/* ---------- camera application ---------- */
function applyCam(svg) {
  if (!svg) return;
  let g = svg.querySelector('g.fs-camg');
  if (!g) {
    g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'fs-camg');
    const kids = ['g.figbody', 'g.hitlayer'].map(s => svg.querySelector(s)).filter(Boolean);
    if (kids.length) svg.insertBefore(g, kids[0]);
    kids.forEach(k => g.appendChild(k));
  }
  g.setAttribute('transform', 'matrix(' + FS.cam.m.map(v => Math.round(v * 1e4) / 1e4).join(' ') + ')');
  syncHandles(svg);
  syncAxisPreview(svg);
}

/* ---------- draggable handles (preserve mode) ---------- */
function syncHandles(svg) {
  if (!svg) return;
  let g = svg.querySelector('g.fs-handles');
  const want = FS.alter && FS.mode === 'preserve';
  if (!want) { if (g) g.remove(); return; }
  const fw = E.figFor(FS.id); if (!fw || !fw.fig._proj) return;
  if (!g) {
    g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'fs-handles');
    svg.appendChild(g);
  }
  g.innerHTML = '';
  fw.fig.free.forEach(fr => {
    const sp = mApply(FS.cam.m, fw.fig._proj.P(fr.at));
    /* a generous invisible ring first, so fingers can find the handle */
    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    hit.setAttribute('cx', sp.x); hit.setAttribute('cy', sp.y); hit.setAttribute('r', 26);
    hit.setAttribute('data-free', fr.name);
    hit.setAttribute('class', 'fs-handle-hit');
    g.appendChild(hit);
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', sp.x); c.setAttribute('cy', sp.y); c.setAttribute('r', 10);
    c.setAttribute('data-free', fr.name);
    g.appendChild(c);
  });
}

/* which free point should a touched element move, in preserve mode? */
function preserveTargetFor(eid, svg, ev) {
  const fw = E.figFor(FS.id); if (!fw) return null;
  const freeNames = new Set(fw.fig.free.map(f => f.name));
  if (eid.startsWith('pt:')) {
    const n = eid.slice(3);
    return freeNames.has(n) ? n : null;
  }
  const ob = fw.fig.objs.find(o => o.id === eid);
  if (!ob) return null;
  const cand = [];
  const push = p => { if (p && p.name && freeNames.has(p.name)) cand.push(p); };
  if (ob.kind === 'seg' || ob.kind === 'line' || ob.kind === 'arrow' || ob.kind === 'tick') { push(ob.a); push(ob.b); }
  else if (ob.kind === 'circle') push(ob.c);
  else if (ob.kind === 'poly' || ob.kind === 'face') (ob.pts || []).forEach(push);
  else if (ob.kind === 'angle') { push(ob.v); push(ob.p); push(ob.q); }
  if (!cand.length) return null;
  const w = toWorld(svg, ev.clientX, ev.clientY);
  if (w && cand.length > 1) cand.sort((a, b) => dist(a, w) - dist(b, w));
  return cand[0].name;
}

/* ---------- axis-flip preview ---------- */
function syncAxisPreview(svg) {
  if (!svg) return;
  let ln = svg.querySelector('line.fs-axisline');
  const pick = FS.axisPick;
  const proj = currentProj();
  if (!pick || !pick.length || !proj) { if (ln) ln.remove(); return; }
  if (!ln) {
    ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('class', 'fs-axisline');
    svg.appendChild(ln);
  }
  const a = mApply(FS.cam.m, proj.P(pick[0]));
  const b = pick[1] ? mApply(FS.cam.m, proj.P(pick[1])) : a;
  ln.setAttribute('x1', a.x); ln.setAttribute('y1', a.y);
  ln.setAttribute('x2', b.x); ln.setAttribute('y2', b.y);

/* ---------- transforms ---------- */

function centroidOf(pts) {

  for (const k in pts) { const p = pts[k]; if (!p) continue; n++; x += p.x; y += p.y; }
  return n ? V(x / n, y / n) : V(0, 0);
}
function applyXform(fn) {

    const movable = fw.fig.free.filter(fr => fr.param !== 't' && !fr.noXform);
    if (!movable.length) {
      E.toast('This figure has no free choices to move — switch to free edit to transform it.');
      return;
    }
    movable.forEach(fr => {
      const p = fn(fr.at); fw.state[fr.name] = { x: p.x, y: p.y };

    const snap = FS.free[FS.id]; if (!snap) return;
    snap.map.forEach(q => { const p = fn(q); q.x = p.x; q.y = p.y; });

}
function xformCentroid() {
  if (FS.mode === 'free' && FS.free[FS.id]) return centroidOf(FS.free[FS.id].pts);
  const fw = E.figFor(FS.id); if (!fw) return V(0, 0);
  /* rotate about the free points' own centroid: it turns with them, so

  const mv = fw.fig.free.filter(fr => fr.param !== 't' && !fr.noXform);
  if (!mv.length) return centroidOf(fw.fig.pts);
  let x = 0, y = 0;
  mv.forEach(fr => { x += fr.at.x; y += fr.at.y; });
  return V(x / mv.length, y / mv.length);

/* ============================================================
   Free-edit rendering & interaction
   ============================================================ */
function freeHl(snap) {
  const it = BY_ID[FS.id];
  if (UI.sel && UI.sel.length) {
    const hl = new Set(UI.sel);
    E.expandAliases(snap.pf, hl); E.expandAngleRays(snap.pf, hl); E.expandPolySides(snap.pf, hl);
    return hl;
  }
  if (UI.step !== null && UI.step > 0 && it.steps && it.steps[UI.step - 1]) {
    const ids = [];
    E.refsIn(it.steps[UI.step - 1].text, snap.pf).forEach(r => ids.push(...r.ids));
    if (ids.length) {
      const hl = new Set(ids);
      E.expandAngleRays(snap.pf, hl); E.expandPolySides(snap.pf, hl);

function drawFree() {

  const snap = FS.free[FS.id] || (FS.free[FS.id] = makeSnapshot());
  wrap.innerHTML = G.render(snap.pseudo, {
    w: 1000, h: 700, upTo: Infinity, showScaffold: UI.scaffold, highlight: freeHl(snap),
    view: FS.view || undefined       /* frozen scale: edits change visible size */

function freeTargetFor(el, svg, ev) {
  const snap = FS.free[FS.id]; if (!snap) return null;
  const eid = el.dataset.eid;
  const w = toWorld(svg, ev.clientX, ev.clientY); if (!w) return null;
  const proj = currentProj();
  const wpx = 14 / (proj.k * FS.cam.scale());        /* 14 screen px in world units */
  const ob = snap.objs.find(o => o.id === eid);
  if (eid.startsWith('pt:')) {
    const p = snap.pts[eid.slice(3)];
    return p ? { kind: 'pt', pts: [p] } : null;
  }
  if (!ob) return null;
  if (ob.kind === 'seg' || ob.kind === 'line' || ob.kind === 'arrow') {
    if (dist(w, ob.a) < wpx * 1.4) return { kind: 'pt', pts: [ob.a] };
    if (dist(w, ob.b) < wpx * 1.4) return { kind: 'pt', pts: [ob.b] };
    return { kind: 'move', pts: [ob.a, ob.b] };
  }
  if (ob.kind === 'circle') {
    if (ev.shiftKey || dist(w, ob.c) < wpx * 1.6) return { kind: 'pt', pts: [ob.c] };
    return { kind: 'radius', ob };
  }
  if (ob.kind === 'poly' || ob.kind === 'face') {
    for (const p of ob.pts) if (dist(w, p) < wpx * 1.4) return { kind: 'pt', pts: [p] };

/* ============================================================
   Stage interaction: pan / zoom always; axis picking; dragging
   (handles in preserve mode, anything in free mode).
   ============================================================ */
function wireStage(svg) {
  if (!svg || svg.__fsWired) return;
  svg.__fsWired = true;

  /* the click at the end of a drag must not toggle a selection */
  svg.addEventListener('click', ev => { if (FS.suppressClick) ev.stopPropagation(); }, true);

  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const f = Math.exp(-ev.deltaY * 0.0016);
    FS.cam.zoomAt(svgPt(svg, ev.clientX, ev.clientY), f);
    applyCam(currentSvg());
  }, { passive: false });

  svg.addEventListener('pointerdown', ev => {
    if (ev.button !== 0) return;
    const stage = $('#fsov .fs-stage');

    /* a further finger during a camera gesture always joins the gesture */
    if (pts.size) { gestureAdd(ev); ev.preventDefault(); return; }

    /* placing a flip axis */
    if (FS.axisPick) {
      const w = toWorld(svg, ev.clientX, ev.clientY);
      if (w) {
        FS.axisPick.push(V(w.x, w.y));
        if (FS.axisPick.length === 2) {
          const [Aa, Bb] = FS.axisPick;
          FS.axisPick = null;
          if (stage) stage.classList.remove('axispick');
          if (dist(Aa, Bb) > 1e-6) applyXform(reflectAcross(Aa, Bb));
          setHint();
        } else { syncAxisPreview(svg); setHint('Now click the second point of the axis.'); }
      }

    }

       free choice */
    if (FS.alter && FS.mode === 'preserve') {
      const hd = ev.target.closest && ev.target.closest('.fs-handles circle');
      const el = !hd && ev.target.closest ? ev.target.closest('[data-eid]') : null;
      const name = hd ? hd.dataset.free : (el ? preserveTargetFor(el.dataset.eid, svg, ev) : null);
      if (name) {
        if (hd) hd.classList.add('grabbing');
        startDrag(ev, (cx, cy) => {
          const s = currentSvg(); if (!s) return;
          const w = toWorld(s, cx, cy); if (!w) return;
          const fw = E.figFor(FS.id);

          E.drawFig();                  /* afterDraw re-applies camera + handles */
          runChecks();

        ev.preventDefault(); return;
      }
    }

    /* free-mode element drag */
    if (FS.alter && FS.mode === 'free') {
      const el = ev.target.closest && ev.target.closest('[data-eid]');
      const tgt = el ? freeTargetFor(el, svg, ev) : null;
      if (tgt) {
        let last = toWorld(svg, ev.clientX, ev.clientY);
        const snap = FS.free[FS.id];
        const cen = tgt.kind === 'scale'
          ? (() => { let x = 0, y = 0; tgt.pts.forEach(p => { x += p.x; y += p.y; }); return V(x / tgt.pts.length, y / tgt.pts.length); })()

          const s = currentSvg(); if (!s) return;
          const w = toWorld(s, cx, cy); if (!w || !last) { last = w; return; }

            const dx = w.x - last.x, dy = w.y - last.y;
            const seen = new Set();
            tgt.pts.forEach(p => { if (seen.has(p)) return; seen.add(p); p.x += dx; p.y += dy; });
          } else if (tgt.kind === 'radius') {
            tgt.ob.r = Math.max(4, dist(w, tgt.ob.c));
          } else if (tgt.kind === 'scale' && cen) {
            const r0 = dist(last, cen) || 1e-6, r1 = dist(w, cen);
            const f = Math.max(0.05, r1 / r0);
            const seen = new Set();
            tgt.pts.forEach(p => {
              if (seen.has(p)) return; seen.add(p);
              p.x = cen.x + (p.x - cen.x) * f; p.y = cen.y + (p.y - cen.y) * f;

    if (FS.editDrag) return;

  /* ---- camera gestures ----
     one finger: pan.  two fingers: pinch to zoom, twist to rotate (2-D),
     and slide to pan — all about the fingers' midpoint.  While a geometry

     steady while a length or angle is being adjusted. */
  const pts = new Map();

  svg.addEventListener('pointermove', ev => {

    pts.set(ev.pointerId, cur);
    if (Math.abs(cur.x - prev.x) + Math.abs(cur.y - prev.y) > 0.5) {
      gestureMoved = true; FS.suppressClick = true;
    }
    if (pts.size >= 2 && pinch) {
      const [p1, p2] = [...pts.values()];
      const d = Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1;
      const a = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
      FS.cam.zoomAt({ x: mx, y: my }, d / pinch.d);
      FS.cam.rotateAt({ x: mx, y: my }, a - pinch.a);
      FS.cam.pan(mx - pinch.mx, my - pinch.my);
      pinch = { d, a, mx, my };
      applyCam(svg);
    } else if (pts.size === 1) {
      FS.cam.pan(cur.x - prev.x, cur.y - prev.y);

    }
  });
  const gestureEnd = ev => {
    if (!pts.has(ev.pointerId)) return;
    pts.delete(ev.pointerId);

    }

  svg.addEventListener('pointercancel', gestureEnd);
}

  window.addEventListener('pointercancel', up);

        <div class="fs-hint" id="fs-modehint"></div>
      </div>
    </div>
  </div>
  <div class="fs-stage">
    <div id="fs-figwrap"></div>
    <div class="fs-badge" id="fs-badge">viewing</div>
    <div class="fs-viewbar">
      <button class="tbtn vb" id="fs-zin" title="Zoom in">＋</button>
      <button class="tbtn vb" id="fs-zout" title="Zoom out">－</button>
      <button class="tbtn vb" id="fs-rotl" title="Rotate the view counter-clockwise">⟲</button>
      <button class="tbtn vb" id="fs-rotr" title="Rotate the view clockwise">⟳</button>
      <button class="tbtn vb" id="fs-vreset" title="Recenter: undo pan, zoom and view rotation">recenter view</button>
      <button class="tbtn fs-viewtoggle" id="fs-viewtoggle" title="Show or hide the view controls">⚙</button>
      <button class="tbtn" id="fs-exit" title="Exit full screen (Esc)">✕ exit</button>
    </div>
    <button class="tbtn fs-railtoggle" id="fs-railtoggle" title="Show or hide the proof and the alter tools">☰ Proof &amp; alter tools</button>
  </div>`;
  document.body.appendChild(ov);
  setHint();
  /* phone: swipe the sheet down to drop it to the bottom bar; swipe the bar up to raise it */
  const rail = ov.querySelector('.fs-rail');
  rail.addEventListener('pointerdown', ev => {
    if (!(window.matchMedia && matchMedia('(max-width:900px)').matches)) return;
    if (ev.target.closest('.fs-railbody')) return;      /* that part scrolls */
    const sy = ev.clientY, sx = ev.clientX;
    const mv = e => {
      if (e.clientY - sy > 50 && Math.abs(e.clientX - sx) < 90) { ov.classList.remove('railopen'); fin(); }
    };
    const fin = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', fin); };
    window.addEventListener('pointermove', mv);
    window.addEventListener('pointerup', fin);
  });
  const rt = ov.querySelector('#fs-railtoggle');
  rt.addEventListener('pointerdown', ev => {
    const sy = ev.clientY;
    const mv = e => { if (sy - e.clientY > 25) { ov.classList.add('railopen'); fin(); } };
    const fin = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', fin); };
    window.addEventListener('pointermove', mv);
    window.addEventListener('pointerup', fin);
  });
}
function setHint(msg) {
  const el = $('#fs-modehint'); if (!el) return;
  if (msg) { el.textContent = msg; return; }
  if (!FS.alter) el.textContent = '';
  else if (FS.mode === 'preserve')
    el.textContent = 'Drag the round handles: those are the figure’s free choices. Everything constructed from them is redrawn exactly, so every line of the proof stays true — degenerate edits are simply not allowed.';
  else
    el.textContent = 'Drag any point, line, circle rim or triangle — nothing is constrained. Shift-drag scales a triangle, shift-drag moves a circle’s centre. Lines of the proof that stop being true are flagged, and recover when the figure satisfies them again.';
}

/* ---------- open / close ---------- */
function open(id) {
  if (FS.on) close();
  FS.on = true; FS.id = id; FS.alter = false; FS.mode = 'preserve';
  FS.cam = new Camera(); FS.axisPick = null;
  E.stopPlay();
  buildOverlay();
  primeView();
  E.drawFig();
  E.syncSteps();
  runChecks();
}
function close() {
  if (!FS.on) return;
  FS.on = false; FS.axisPick = null; FS.view = null;
  const ov = document.getElementById('fsov'); if (ov) ov.remove();
  E.stopPlay();
  E.drawFig();          /* back into the page's own figure box */
  E.syncSteps();
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  if (ev.target.closest && ev.target.closest('.fsx-cta')) { open(UI.id); return; }
  if (!FS.on) return;
  if (FS.suppressClick) return;
  const t = ev.target;
  if (t.closest('#fs-exit')) { close(); return; }
  if (t.closest('#fs-railtoggle')) { const ov = document.getElementById('fsov'); if (ov) ov.classList.toggle('railopen'); return; }
  if (t.closest('#fs-whole')) { E.stopPlay(); E.setStep(null); return; }
  if (t.closest('#fs-speed')) {
    const S = E.SPEEDS;
    const i = S.findIndex(x => x.v === UI.speed);
    const nx = S[(i + 1) % S.length];
    UI.speed = nx.v;
    const b1 = $('#fs-speed'); if (b1) b1.textContent = nx.label;
    const b2 = $('#b-speed'); if (b2) b2.textContent = nx.label;
    return;
  }
  if (t.closest('#fs-scaf')) {
    UI.scaffold = !UI.scaffold;
    ['fs-scaf', 'b-scaf'].forEach(id => {
      const b = document.getElementById(id);
      if (b) b.classList.toggle('on', UI.scaffold);
    });
    primeView();                       /* the frozen fit depends on what is shown */
    E.drawFig(); runChecks();
    return;
  }
  if (t.closest('#fs-restore')) {
    const fw = E.figFor(FS.id); if (fw) fw.reset();
    delete FS.free[FS.id];               /* a fresh free-edit copy, too */
    primeView();
    E.drawFig(); runChecks();
    return;
  }
  if (t.closest('#fs-viewtoggle')) { const ov = document.getElementById('fsov'); if (ov) ov.classList.toggle('viewopen'); return; }
  if (t.closest('#fs-zin')) { zoomCenter(1.3); return; }
  if (t.closest('#fs-zout')) { zoomCenter(1 / 1.3); return; }
  if (t.closest('#fs-rotl')) { rotCenter(-15); return; }
  if (t.closest('#fs-rotr')) { rotCenter(15); return; }
  if (t.closest('#fs-vreset')) { FS.cam.reset(); applyCam(currentSvg()); return; }
  if (t.closest('#fs-prev')) { E.stopPlay(); E.setStep(UI.step === null ? 0 : UI.step - 1); return; }
  if (t.closest('#fs-next')) { E.stopPlay(); E.setStep(UI.step === null ? 1 : UI.step + 1); return; }
  if (t.closest('#fs-play')) { E.play(); return; }
  if (t.closest('#fs-alterbtn')) {
    FS.alter = !FS.alter;
    $('#fs-alterbtn').classList.toggle('on', FS.alter);
    $('#fs-altermenu').classList.toggle('open', FS.alter);
    if (!FS.alter && FS.axisPick) { FS.axisPick = null; $('#fsov .fs-stage').classList.remove('axispick'); }
    setHint();
    E.drawFig(); runChecks();
    return;
  }
  const xb = t.closest('.fs-xforms [data-x]');
  if (xb && FS.alter) { doXform(xb.dataset.x); return; }
  /* proof rail: step lines and name references */
  const li = t.closest('#fsov ol.steps li');
  if (li && !t.closest('.ref') && !t.closest('.cite')) {
    E.stopPlay();
    const s = +li.dataset.step;
    E.setStep(UI.step === s && !UI.sel ? null : s);
    return;
  }
  const rf = t.closest('#fsov .ref');
  if (rf) {
    const ids = (rf.dataset.eids || '').split(' ');
    const same = UI.sel && UI.sel.length === ids.length && UI.sel.every((x, i) => x === ids[i]);
    UI.sel = same ? null : ids;
    E.drawFig(); E.litText();
    return;
  }
});
function zoomCenter(f) {
  const svg = currentSvg(); if (!svg) return;
  const vb = svg.viewBox.baseVal;
  FS.cam.zoomAt({ x: vb.width / 2, y: vb.height / 2 }, f);
  applyCam(svg);
}
function rotCenter(deg) {
  const svg = currentSvg(); if (!svg) return;
  const vb = svg.viewBox.baseVal;
  FS.cam.rotateAt({ x: vb.width / 2, y: vb.height / 2 }, deg * Math.PI / 180);
  applyCam(svg);
}
function doXform(x) {
  const stage = $('#fsov .fs-stage');
  if (x === 'axis') {
    FS.axisPick = [];
    if (stage) stage.classList.add('axispick');
    setHint('Click two points on the figure to place the mirror axis.');
    return;
  }
  if (x === 'reset') {
    if (FS.mode === 'preserve') { const fw = E.figFor(FS.id); fw.reset(); primeView(); E.drawFig(); runChecks(); }
    else { delete FS.free[FS.id]; drawFree(); }
    return;
  }
  const c = xformCentroid();
  const th = 15 * Math.PI / 180;
  if (x === 'rotl') applyXform(p => G.rotAbout(p, c, th));
  else if (x === 'rotr') applyXform(p => G.rotAbout(p, c, -th));
  else if (x === 'fliph') applyXform(p => V(2 * c.x - p.x, p.y));
  else if (x === 'flipv') applyXform(p => V(p.x, 2 * c.y - p.y));
}

document.addEventListener('keydown', ev => {
  if (!FS.on) return;
  if (ev.target && ev.target.tagName === 'INPUT' && ev.target.type !== 'radio') return;
  if (ev.key === 'Escape') {
    ev.preventDefault(); ev.stopPropagation();
    if (FS.axisPick) {
      FS.axisPick = null;
      const st = $('#fsov .fs-stage'); if (st) st.classList.remove('axispick');
      syncAxisPreview(currentSvg()); setHint();
    } else close();
    return;
  }
  if (ev.key === 'ArrowRight') { ev.preventDefault(); ev.stopPropagation(); E.stopPlay(); E.setStep(UI.step === null ? 1 : UI.step + 1); }
  else if (ev.key === 'ArrowLeft') { ev.preventDefault(); ev.stopPropagation(); E.stopPlay(); E.setStep(UI.step === null ? 0 : UI.step - 1); }
  else if (ev.key === ' ') { ev.preventDefault(); ev.stopPropagation(); E.play(); }
}, true);

document.addEventListener('change', ev => {
  if (!FS.on) return;
  const r = ev.target;
  if (r && r.name === 'fs-mode') {
    FS.mode = r.value;
    if (FS.axisPick) { FS.axisPick = null; $('#fsov .fs-stage').classList.remove('axispick'); }
    setHint();
    E.drawFig(); runChecks();
  }
});

/* ---------- public surface ---------- */
window.FSX = {
  get active() { return FS.on; },
  lockedView() { return FS.view || undefined; },
  open, close,
  Scene, Camera,                          /* scaffolding for later (3D) books */
  afterDraw(svg, fig) {
    if (!FS.on) return;
    if (FS.alter && FS.mode === 'free') { drawFree(); return; }
    applyCam(svg);
    wireStage(svg);
    runChecks();
  },
  leaveTheorem(id) {
    delete FS.free[id];
    if (FS.on && FS.id === id) close();
  },
  /* introspection (tests, tooling): the free-edit snapshot and a re-check */
  freeSnapshot(id) { return FS.free[id] || null; },
  recheck() { if (FS.on) { if (FS.alter && FS.mode === 'free') drawFree(); else runChecks(); } }
};
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
</body>
</html>
