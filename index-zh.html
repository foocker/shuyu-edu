ine, hence right angles.":"所以 ∠PHG = ∠PHE;它们在一条直线上相邻且相等，因此成直角。","This pairs with Theorem 17: a straight line is the shortest path between two points.":"这与定理 17 配对：直线是两点之间的最短路径。","No — until the sentence is well formed, there is nothing definite for logic to judge":"不——在句子结构良好之前，没有任何明确的逻辑可以判断","Given a straight line AB and a point P not on it, drop a perpendicular from P to AB.":"给定一条直线AB和不在其上的点P，从P到AB做垂线。","It holds of them taken together, so it looks as though it must hold of each of them.":"它把它们结合在一起，所以看起来它必须把它们中的每一个都包含在内。","We made a perfectly equilateral triangle without measuring anything — using circles!":"我们不用测量任何东西就用圆制作了一个完美的等边三角形！","A well is a shaft dug down into the ground so as to reach the water lying beneath it":"井是挖入地下的竖井，以便到达其下方的水","They meet in a single interior point (the incenter), center of the inscribed circle.":"它们在一个内点（内切圆的中心）处相交。","In fact nothing follows : no arrangement of these premises yields a valid syllogism.":"事实上，没有任何结论：这些前提的排列不会产生有效的三段论。","a stone is not a living thing at all — it does not belong to the whole being divided":"一块石头根本不是一个有生命的东西——它不属于被分割的整体","a virtue perfecting appetite and conduct: justice, courage, temperance and their kin":"完善食欲和行为的美德：正义、勇气、节制及其同类","These are contradictories, not equipollents: they always take opposite truth-values.":"这些是矛盾的，而不是对等的：它们总是采用相反的真值。",") is the governing rule an argument from that place depends on. From the wider kind:":") 是该地方的论证所依赖的控制规则。从更广泛的角度来说：","But a good knife in the hands of a murderer does harm — so a good knife is not good.":"但一把好刀在杀人犯手中却会造成伤害——所以一把好刀就不好了。","and state your claim again more narrowly — because sometimes the objection is right.":"并再次更狭窄地陈述你的主张——因为有时反对意见是正确的。","a virtue perfecting the intellect: understanding, science, wisdom, art, and prudence":"完善智力的美德：理解、科学、智慧、艺术和谨慎","a mark that belongs to the thing alone and always is used to identify or exclude it.":"单独属于该事物的标记，通常用于识别或排除该事物。","— once the premises are pictured, the conclusion is already contained in the diagram":"——一旦前提被描绘出来，结论就已经包含在图表中","Primary substance (this man) differs from secondary substance (man, animal) in that…":"主要物质（这个人）与次要物质（人、动物）的不同之处在于……","You must show that this shape is not a square — and you have its definition in hand.":"你必须证明这个形状不是正方形——并且你已经掌握了它的定义。","Click a principle in the list or in the sidebar — the selection is highlighted here.":"单击列表或侧栏中的原则 - 此处突出显示所选内容。","I know the man who is coming. Coriscus is the man who is coming. So I know Coriscus.":"我认识即将到来的那个人。科里斯库斯就是即将到来的那个人。所以我认识科里斯库斯。","The consequent may hold on other grounds; positing it does not posit the antecedent.":"结果可能因其他理由而成立；放置它并不放置先行词。","It stands before a noun and subordinates that noun to something else in the sentence":"它位于名词之前，并将该名词从属于句子中的其他事物","when its conclusion must be true if its premises are, whatever they are about; it is":"如果它的前提是什么，无论它们是关于什么的，它的结论必定是正确的；这是","This machine is heavy. So every part of it is heavy — including that one small screw.":"这台机器很重。所以它的每个部分都很重——包括那个小螺丝。","The conjunctive forbids the two together: to posit one member is to remove the other.":"连接词禁止将两者放在一起：放置一个成员就意味着删除另一个成员。","what holds of the kind is carried up to the family, or applied to one of its members.":"此类的情况会延续到家庭，或适用于其中一名成员。","Through D draw a parallel to AB; through B draw a parallel to AD; let them meet at C.":"通过D画一条与AB平行的线；过B 与AD 平行；让他们在C见面。","Theorem 10 is the opposite of Theorem 9: the point is off the line rather than on it.":"定理 10 与定理 9 相反：该点位于直线之外而不是在线上。","the two circles cross above and below; the line joining the crossings cuts AB in half":"两个圆圈上下交叉；连接交叉点的线将 AB 切成两半","A widow is a woman whose husband has died. She has never married. So she is no widow.":"寡妇是指丈夫去世的妇女。她从未结过婚。所以她不是寡妇。","Why are the rules of grammar what they are, and what do all languages have in common?":"为什么语法规则是这样的？所有语言有什么共同点？","Since AM = AN, △AMN is isosceles, so its base angles are equal: ∠AMN = ∠ANM (Thm. 3).":"由于AM = AN，△AMN 是等腰，所以它的底角相等：∠AMN = ∠ANM (Thm. 3)。","You must show that this tool is a bad one — and everyone agrees what the tool is for.":"你必须证明这个工具是一个糟糕的工具——并且每个人都同意这个工具的用途。","animal is the genus of man — the wider kind, said of many species at once (Porphyry).":"动物是人类的属——更广泛的种类，同时表示许多物种（斑岩）。","Whatever fits the definition fits the thing defined, and whatever does not, does not.":"凡符合定义的，就符合所定义的事物，凡不符合定义的，就是不符合的。","No — though it is a convention whether this particular word-sound is a noun or a verb":"不——尽管这个特定的单词声音是名词还是动词是一种约定","does the mode bind the whole composed statement, or only the subject taken by itself?":"该模式是否绑定整个组合语句，或者仅绑定其本身的主题？","Not while running — the compound is impossible; but the power to rest belongs to him.":"跑步时不行——复合是不可能的；但休息的权力属于他。","Porphyry gives several senses of “property.” In the strict sense, a property belongs…":"斑岩赋予“财产”多种含义。从严格意义上来说，财产属于……","On ray PR, cut off PS = XA, PT = XB, and TV = AB (using circles/postulates as needed).":"在射线 PR 上，截断 PS = XA、PT = XB 和 TV = AB（根据需要使用圆/公设）。","man is the lowest species under the genus animal — beneath it lie only individual men.":"人是动物属中最低等的物种——在它之下只有个体的人。","Converse of Theorem 15. Strategy: process of elimination among three trichotomy cases.":"定理15的逆。策略：三个三分法情况的消除过程。","Because ambiguity is threefold, and two of the three divide again into word and phrase":"因为歧义有三重，三重中的两重又分为单词和短语","Punishment aims at the good of the one punished, and not only at the good of the city.":"惩罚的目的是为了受惩罚者的利益，而不仅仅是为了整个城市的利益。","If he will not lend a penny to his brother, he will hardly lend a pound to a stranger.":"如果他不借给他的兄弟一分钱，他也几乎不会借给陌生人一英镑。","is the irrelevant conclusion, with the straw man and the red herring as species of it;":"是无关紧要的结论，稻草人和红鲱鱼是它的物种；","pairing: A with O, E with I, each always taking the opposite truth-value of the other.":"配对：A 与 O，E 与 I，每个总是取另一个的相反真值。","Are these two expressions equipollent — equal in force, the same corner of the square?":"这两个表达式是否相等——力量相等，正方形的同一个角？","stones into the precious and the heavy — a heavy gem falls under both members at once.":"宝石分为珍贵的和沉重的——一颗沉重的宝石同时落在两个成员的身下。","Among all straight segments from a point to a line, the perpendicular is the shortest.":"从点到线的所有直线段中，垂线是最短的。","Whether the proposition is true, and how it relates to the truth of other propositions":"该命题是否为真，以及它与其他命题的真实性有何关系","When some parts are given equal, how do you decide which remaining parts “correspond”?":"当某些部分相等时，您如何确定其余部分“对应”？","adds a restriction that need not hold, and so leaves out part of what it should cover.":"添加了不需要保留的限制，因此遗漏了它应该涵盖的部分内容。","You may use the equilateral triangle and the bisected angle, but not Theorem 8 itself.":"您可以使用等边三角形和二等分角，但不能使用定理 8 本身。","(the syllogism) appears; and when its reasoning is passed entire, the final sections —":"（三段论）出现；当它的推理全部通过时，最后的部分——","the passengers are no part of the ship — they do not belong to the whole being divided":"乘客不是船的一部分——他们不属于被分割的整体","Time for today’s syllogism practice. Open Ars Syllogistica and keep your streak alight.":"今天的三段论练习时间到了。打开 Ars Syllogica，让你的连胜之路继续燃烧。","Corresponding sides: AB = CD, AD = BC. Corresponding angles give opposite angles equal.":"对应边：AB=CD，AD=BC。对应角使对角相等。","Not while silent — speaking-in-silence is nothing. But the power of speech remains his.":"沉默的时候不行——沉默的说话算不了什么。但言论的力量仍然是他的。","Diagram the full syllogism — shading, ×s, and the import × if its conclusion needs one.":"画出完整的三段论——阴影、×s，以及导入×（如果结论需要的话）。","What do we know about the second triangle, and what do we want to know about the first?":"关于第二个三角形我们知道什么，关于第一个三角形我们想知道什么？","Given a straight line AB and a point P on it, draw a line from P at right angles to AB.":"给定一条直线AB和其上的一个点P，从P画一条与AB成直角的直线。","— sure knowledge — by drawing its conclusion from premises that are not merely true but":"- 确定的知识 - 通过从不仅正确而且正确的前提中得出结论","The genus narrowed by a difference, and said of the individuals that share that nature.":"该属因差异而缩小，并表示具有这种性质的个体。","Pick any point D on AB, and draw a circle around B with radius BD, cutting off BE = BD.":"选取AB上的任意点D，并以B为半径画一个圆，半径为BD，截断BE = BD。","When two straight lines cut each other, they make the vertical (opposite) angles equal.":"当两条直线相交时，它们的垂直（对角）角度相等。","Ask whether the thing is taken as what it is, or under some feature it happens to wear.":"询问该事物是否被认为是它本来的样子，或者是在它碰巧具有的某些特征下。","Similarly, by bisecting BC and extending AC, ∠ACD > ∠ABC (using vertical angles again).":"类似地，平分 BC 并延伸 AC，∠ACD > ∠ABC（再次使用垂直角）。","Because truth is the joining of what is joined in reality, and only a proposition joins":"因为真理是现实中所连接事物的连接，而只有一个命题才能连接起来","Tie all three sides together — each of the two new sides to AB, and then to each other.":"将所有三个边连接在一起 - 将两个新边分别连接到 AB，然后连接到彼此。","gives little more than the general kind, and so covers far more than the thing defined.":"给出的只是一般类型的内容，因此涵盖的内容远远超出了定义的内容。","if it holds where it is less likely, it holds where it is more likely — or the reverse.":"如果它在可能性较小的地方成立，那么它在可能性较大的地方成立，反之亦然。","each correct answer earns points and each error takes away points; a set is complete at":"每个正确答案都会得分，每个错误都会扣分；一组完成于","— the manner in which the predicate belongs to the subject. Three modes are in play: the":"——谓语属于主语的方式。三种模式正在发挥作用：","These two considerations are wholly separate, and you can have either without the other.":"这两个考虑因素是完全独立的，您可以只选择其中一个。","Triangle = 3 sides. Quadrilateral = 4 sides. Polygon = many sides (more than four here).":"三角形 = 3 条边。四边形 = 4 条边。多边形=多条边（此处多于四条边）。","region: a further premise about the outer terms, not a conclusion drawn from the others.":"区域：关于外部条件的进一步前提，而不是从其他条件得出的结论。","WHERE (place) sets the substance in a place: in the school, in the marketplace, at home.":"WHERE（地点）将内容设置在一个地方：在学校、在市场、在家里。","A ladder is a set of rungs joined by rails, made and used for the purpose of climbing up":"梯子是一组由导轨连接的梯级，制造和使用的目的是攀爬","A modern book calls an argument a “straw man.” Which of the thirteen is it a species of?":"一本现代书籍将论证称为“稻草人”。它属于这十三种中的哪一种？","The equilateral triangle is the simplest rectilineal figure: fewest sides, all the same.":"等边三角形是最简单的直线图形：边数最少，但都相同。","A plane is a perfectly flat surface — like a perfect sheet of paper that never wrinkles.":"飞机是一个完全平坦的表面——就像一张完美的纸，永远不会起皱。","This is a universal truth: it holds for every isosceles triangle, always and everywhere.":"这是一个普遍真理：它适用于每一个等腰三角形，无论何时何地。","A circle is a round figure. Every point on the rim is the same distance from the center.":"圆是圆形的图形。边缘上的每个点到中心的距离都相同。","Ask what else carries the same mark. If anything else does, the argument proves nothing.":"询问还有什么带有相同标记。如果还有其他事情的话，这个论证就证明不了什么。","having three sides — the difference that marks the triangle off from every other figure.":"具有三个边——三角形与其他图形的区别。","Now △ABC and △DEF have their three sides equal, each to each: AB = DE, AC = DF, BC = EF.":"现在△ABC和△DEF的三边相等，每条边分别为：AB = DE，AC = DF，BC = EF。","what a thing comes from, or what it is for, is used to settle what it is or ought to be.":"一个事物从何而来，或者它有什么用途，用来决定它是什么或应该是什么。","Angles are NOT proportional to opposite sides — double a side does not double the angle!":"角度与相对边不成比例——边加倍并不等于角度加倍！","reaches down and picks one individual out at random — “some dog” — without saying which;":"伸手随机挑选一个人——“某只狗”——但没有说出是哪条狗；","says a thing rather than by what makes it so — hence the weakest, and hence not nothing.":"说一件事，而不是通过什么使它如此——因此是最弱的，因此不是什么都没有。","sitting — a posture the man takes up and puts off again, changing nothing of what he is.":"坐着——男人采取的一种姿势，然后又推迟，这对他的本质没有任何改变。","The disjunction pledges at least one member: remove one and the other cannot be refused.":"分离保证至少有一名成员：除掉一名成员，而另一名则不能被拒绝。","the classic property: the power to laugh picks out man alone, without saying what he is.":"经典属性：笑的力量可以单独识别出一个人，而无需说明他是什么。","The link really does hold one way, so it looks as though it must hold the other way too.":"该链接确实以一种方式存在，因此看起来它也必须以另一种方式存在。","You know this. This is a stone. Therefore you know stone — which is not how the words go.":"你知道这一点。这是一块石头。因此你知道石头——这不是字面上的意思。","He was asked whether the boy had told the truth, and answered that the boy is a good boy.":"当被问到男孩是否说真话时，他回答说男孩是个好孩子。","A “manuscript” means something written by hand. This was printed. So it is no manuscript.":"“手稿” s of its own.":"砖块的平坦顶部是一个表面——像桌面一样平坦，本身没有厚度。","Which is the SUPREME genus — said of everything below it, but itself under no higher kind?":"哪一个是最高属——指的是低于它的一切，但它本身不属于更高的属？","If two triangles have two angles equal to two angles, then the remaining angles are equal.":"如果两个三角形有两个角等于两个角，则其余角相等。","A noun refers to a stable thing; a verb is a doing, a becoming, or a being in a certain way":"名词指稳定的事物；动词是一种行为、一种生成或某种方式的存在","sitting — a separable accident that comes and goes while the man stays the same (Porphyry).":"坐着——一种可分离的事故，来来去去，而人却保持不变（Porphyry）。","disjunction (“but not both”) excludes its members, so positing one does remove the other. A":"析取（“但不是两者”）排除其成员，因此放置一个会删除另一个。一个","A circle can be drawn around any point as its center and with a radius of any given length.":"可以以任意点为圆心、以任意给定长度为半径绘制圆。","On which category do all the others depend, since they exist only in it or by affecting it?":"所有其他类别都依赖于哪个类别，因为它们仅存在于其中或通过影响它而存在？","A harbour is a sheltered stretch of water, ringed about, where ships may lie safe at anchor":"港口是一片受庇护的水域，周围环绕，船只可以安全地停泊在那里","One and the same substance can receive contraries — being at one time pale, at another dark":"一种物质可能会出现相反的情况——有时苍白，有时黑暗","Parallel lines never meet — like railroad tracks that stay the same distance apart forever.":"平行线永远不会相交——就像永远保持相同距离的铁轨一样。","treats them better than any list does, because it explains where each one had to come from.":"比任何列表都更好地对待它们，因为它解释了每一个都必须来自哪里。","The division uses features the subject can gain or lose without becoming a different thing.":"该部门使用主体可以获得或失去的特征，而不会成为不同的事物。","it follows from what a square is and holds of every square, yet it is not what a square is.":"它是从正方形的本质出发的，并且适用于每个正方形，但它并不是正方形。","Only a bell rings when struck like that. This rings when struck like that. So it is a bell.":"像这样敲击，只有铃声响起。像这样敲击时就会响起。所以它是一个钟。","Since the new master came the harvest has been poor. So the master has spoiled the harvest.":"自从新主人到来以来，收成一直很差。所以主人破坏了收获。","Click any part of the figure — or any name in the proof n line exactly one quarter of another given line.":"使用定理 1b 和 8 从给定线截取另一给定线的四分之一。","being able to reason — the difference that divides animal and makes man (Porphyry; the tree).":"能够推理——动物与人的区别（斑岩；树）。","animals into the footed and the white — two different bases at once, and the members overlap.":"动物分为有脚和白色——同时是两个不同的基础，并且成员重叠。","Dividing “living thing” into plant, animal, and fungus is sound because the three members are…":"将“生物”分为植物、动物和真菌是合理的，因为这三个成员是……","Nothing is lighter than a feather. This box is lighter than a feather. So this box is nothing.":"没有什么比羽毛更轻的了。这个盒子比羽毛还轻。所以这个盒子没什么。","What holds of the whole holds of the parts, when it holds of the whole by reason of the parts.":"当整体因部分而成立时，适用于整体的东西也适用于部分。","Because everything we meet is either stable or going on, and words must signify it accordingly":"因为我们遇到的一切要么是稳定的，要么是持续的，而言语必须相应地表示它","If two adjacent angles add up to two right angles, then the outer legs form one straight line.":"如果两个相邻的角加起来是两个直角，则外侧的腿形成一条直线。","Does the construction still work if the equilateral triangle is built on the other side of DE?":"如果在 DE 的另一条边上构建等边三角形，该构造还有效吗？","Things that coincide are equal: the triangles have equal corresponding angles and equal areas.":"重合的事物是相等的：三角形具有相等的对应角和相等的面积。","The members together compose the whole, and no one of them is called by the name of the whole.":"各个成员共同组成了一个整体，其中没有一个人被称为整体的名字。","You know your brother. That man in the mask is your brother. So you know that man in the mask.":"你了解你的兄弟。那个戴面具的人是你的兄弟。所以你认识那个戴面具的人。","the nearest kind (a sheep) with a single difference (young) — as brief as a definition can be.":"最接近的种类（一只羊），只有一个区别（年轻的）——定义尽可能简短。","So AL = BC, since each of them is equal to BG. And AL was drawn from the given point A. Q.E.F.":"所以 AL = BC，因为它们都等于 BG。 AL 是从给定点 A.Q.E.F. 绘制的。","Animals into those that mainly live in the water, on the land, under the ground, and in the air":"动物分为主要生活在水中、陆地上、地下和空中的动物","A nest is a shelter a bird builds to hold its eggs and its young, made of twigs and set high up":"鸟巢是鸟类为容纳蛋和幼鸟而建造的庇护所，由树枝制成并设置在高处","Aristotle’s stock accident: the same man may be musical or not, and be the same man either way.":"亚里士多德的常见事故：同一个人可能有音乐天赋，也可能没有音乐天赋，但无论如何，他都是同一个人。","In a right triangle the two acute angles are complementary; the hypotenuse is the longest side.":"在直角三角形中，两个锐角互补；斜边是最长的边。","in subalternation — falsity ascends from the weaker mode to the stronger; truth does not ascend":"在次交替中——虚假从较弱的模式上升到较强的模式；真理不会上升","In △ABC suppose ∠ABC = ∠ACB. First take side AB, the base BC, and the angle they contain, ∠ABC.":"在△ABC中，假设∠ABC = ∠ACB。首先取边AB，底边BC，以及它们所含的角∠ABC。","Prove: any point on the perpendicular bisector of a segment is equidistant from both endpoints.":"证明：线段垂直平分线上的任意点到两个端点的距离相等。","Give the nearest kind and the difference, and nothing extra; wasted words spoil the definition.":"给出最接近的种类和差异，没有多余的内容；浪费的词语破坏了定义。","Corollary: any two angles of a triangle sum to less than 180° (converse flavor of Postulate 5).":"推论：三角形的任意两个角之和小于 180°（与公设 5 相反）。","Not sighted-and-blind at once; but sight can be lost — privation is possible for the possessor.":"不是既看见又失明；但视力可能会丧失——拥有者可能会陷入贫困。","The three sides coincide; by SSS (or coincidence) the triangles are congruent with equal areas.":"三边重合；通过 SSS（或巧合），三角形全等且面积相等。","Both — a genus in relation to man, a species in relation to living body; the terms are relative":"两者——与人相关的属，与生命体相关的种；这些条款是相对的","Hence ∠ANM = ∠ANM + ∠AMB + ∠BNA — an angle equal to itself plus two further angles. Impossible!":"因此 ∠ANM = ∠ANM + ∠AMB + ∠BNA — 一个等于自身的角度加上另外两个角度。不可能的！","Imagine moving △ABC so that AB lies on DE. Since they are equal, they coincide: A on D, B on E.":"想象一下移动△ABC，使AB 位于DE 上。由于它们相等，因此它们重合：A 对 D，B 对 E。","the soul of an animal into sense and the paw — a paw is a bodily part, not a power of the soul.":"动物的灵魂分为感觉和爪子——爪子是身体的一部分，而不是灵魂的力量。","So the three sides of △FBD equal the three sides of △FBE; corresponding angles are equal (SSS).":"所以△FBD的三边等于△FBE的三边；对应的角度相等（SSS）。","Falsity does not descend: that a thing is not necessary leaves it possibly so and possibly not.":"虚假不会降临：如果某件事是不必要的，那么它可能是必要的，也可能不是。","The angles under the base, ∠DBC and ∠ECB, are also equal (corresponding angles of △BDC & △CEB).":"底下角∠DBC和∠ECB也相等（对应角△BDC和△CEB）。","Likewise, since BM = BN, △BMN is isosceles, so its base angles are equal: ∠BMN = ∠BNM (Thm. 3).":"同样，由于BM = BN，所以△BMN 是等腰，所以它的底角相等：∠BMN = ∠BNM (Thm. 3)。","Because AB ∥ DC with the transversal BD, the alternate angles ∠ABD and ∠BDC are equal (Thm. 25).":"因为 AB ∥ DC 与横向 BD，所以交替角 ∠ABD 和 ∠BDC 相等 (Thm. 25)。","If A = C and B = C, then A = B. (36 inches = 1 yard and 3 feet = 1 yard, so 36 inches = 3 feet.)":"如果 A = C 且 B = C，则 A = B。（36 英寸 = 1 码，3 英尺 = 1 码，因此 36 英寸 = 3 英尺。）","A definition should be brief: the nearest kind (genus) and the difference, with no wasted words.":"定义应该简短：最接近的种类（属）和区别，不要浪费任何词语。","You must show that this oak will one day die — and everyone grants that every living thing dies.":"你必须证明这棵橡树有一天会死去——每个人都承认所有生物都会死亡。","Sometimes for brevity; sometimes because it is too obvious to state; and sometimes because it is":"有时是为了简洁；有时是因为它太明显而无法表述；有时因为它是","Right triangle ABC with right angle at A; squares ABFG on AB, ACKH on AC, BCED on hypotenuse BC.":"直角三角形ABC，A点为直角；在AB 上平方ABFG，在AC 上平方ACKH，在斜边BC 上平方BCED。","Each of these stones can be lifted by one man. So all of them together can be lifted by one man.":"这些石头中的每一块都可以由一个人举起。因此，一个人就可以将所有这些都抬起来。","— affirmative or negative. Cross these two and exactly four forms result, named by the vowels of":"——肯定或否定。交叉这两个，正好有四种形式的结果，由元音命名","They are second intentions — the mind’s ways of saying one thing of another, grounded in reality":"它们是第二意图——基于现实的头脑表达另一件事的方式","lets you mark Venn diagrams freely — shade regions, place ×s — and shows what your marks assert.":"让您可以自由地标记维恩图 - 阴影区域、位置 × - 并显示您的标记所主张的内容。","A semicircle is the figure contained by a circle’s diameter and the circumference cut off by it.":"半圆是由圆的直径和被圆截取的周长所包含的图形。","is what actually breaks it. You are deceived by the two together: something appears, and is not.":"才是真正打破它的原因。你被这两者欺骗了：有些东西出现了，但又没有。","∠EBA = ∠DCA (from △ADC ≅ △AEB) and ∠EBC = ∠DCB (from △CEB ≅ △BDC), so the remainders ∠CBA = ∠BCA.":"∠EBA = ∠DCA（根据△ADC ≅ △AEB）和∠EBC = ∠DCB（根据△CEB ≅ △BDC），所以余数∠CBA = ∠BCA。","PASSION (being-acted-upon) is the receiving of that change: being cut, being burnt, being heated.":"激情（被采取行动）是接受这种变化：被切割、被燃烧、被加热。","In any parallelogram, the “complements” of the parallelograms about a diagonal are equal in area.":"在任何平行四边形中，关于对角线的平行四边形的“补数”面积相等。","Each “some” may pick out a different portion of the middle term, so the premises need never meet.":"每个“一些”可能会选择中间项的不同部分，因此前提永远不需要满足。","in subalternation — ab necesse ad posse valet consequentia: truth descends from the stronger mode":"in subalternation — ab necesse ad posse valet consequentia：真理源自更强的模式","Theorem 4 is the converse of Theorem 3: equal base angles ⇔ isosceles (at least two equal sides).":"定理4是定理3的逆：等底角⇔等腰（至少有两条相等的边）。","Given an angle X and a ray PR, construct an angle at P, with one side along PR, equal to angle X.":"给定一个角 X 和一条射线 PR，在 P 处构造一个角，其中一侧沿 PR，等于角 X。","MANY QUESTIONS AS ONE hides a second question inside the first, so that yes and no both grant it.":"问题多多，在第一个问题中隐藏了第二个问题，因此“是”和“否”都承认它。","Let ∠APB + ∠BPC = two right angles. Claim: A, P, C are collinear (AP and PC form a straight line).":"设 ∠APB + ∠BPC = 两个直角。主张：A、P、C共线（AP和PC形成一条直线）。","And the tacit premise is true by the classical definitions — validity and soundness both restored.":"经典定义的默认前提是正确的——有效性和合理性都得到了恢复。","A conjunctive promises neither member: both may be absent together, so denying one posits nothing.":"连词对任何一个成员都没有承诺：两者都可能一起缺席，因此否认一个成员就没有任何意义。","and turn tracking on. Nothing is recorded until you do. Your record never leaves this browser; use":"并打开跟踪。在您执行此操作之前，不会记录任何内容。您的记录永远不会离开此浏览器；使用","The three medians meet in a single point (the centroid), which divides each median in a 2:1 ratio.":"三个中位数交汇于一个点（质心），该点以 2:1 的比例划分每个中位数。","What holds of the thing holds of what is named from it: if justice is good, acting justly is good.":"事物的适用性也适用于它的命名：如果正义是善的，那么公正行事就是善的。","The definition and the term must cover exactly the same things — neither too broad nor too narrow.":"定义和术语必须涵盖完全相同的事物——既不能太宽泛，也不能太狭隘。","Cutting people with knives is a crime. Surgeons cut people with knives. So surgeons are criminals.":"用刀砍人是犯罪行为。外科医生用刀割伤人。所以外科医生是罪犯。","It divides the genus and makes the species; it answers “what sort of thing, in its very nature?” (":"它划分属，产生种；它回答“从本质上讲，是什么样的事情？” （","Let AB ∥ CD cut by transversal EGHF. Claim: alternate ∠1 = ∠3 and co-interior ∠2 + ∠3 = two rights.":"令 AB ∥ CD 被横向 EGHF 割断。主张：交替∠1=∠3且共内∠2+∠3=二权。","a property — it follows from the thing’s nature and always goes with it, but it is not that nature.":"属性——它源于事物的本质，并且总是伴随着事物的本质，但它不是那个本质。","If health is to be sought, then the healthy life is to be led, and healthy things are to be chosen.":"如果要追求健康，就要过健康的生活，就要选择健康的事物。","still probable, and still usable — but you must expect to defend it, since the many do not hold it.":"仍然有可能，仍然可用——但你必须做好捍卫它的准备，因为很多人并不持有它。","You must show that this creature is a man — and you have marks that belong to men alone and always.":"你必须证明这个生物是一个人——而且你有永远只属于男人的标记。","If it holds where it is less to be expected, it holds all the more where it is more to be expected.":"如果它在不太令人期待的地方成立，那么它在更值得期待的地方就更成立了。","That reason is his defining faculty, so the art that governs reason governs every well-directed act":"理性是他的决定性能力，因此支配理性的艺术也支配着每一个指导良好的行为","From AB cut off BD = AC further down AB toward A (by a circle around B with radius AC) and join CD.":"从 AB 切断 BD = AC，进一步沿着 AB 向 A（通过以 AC 为半径围绕 B 的圆）并加入 CD。","you cannot infer that, being clever, he is not also lucky. Mark the connective before you conclude.":"你不能因为他聪明就推断他不幸运。在结束之前标记连接词。","the whiteness is in the wall but is no part of what a wall is (Aristotle’s “present in a subject”).":"白色存在于墙壁中，但不属于墙壁的一部分（亚里士多德的“存在于主体中”）。","What the name means tells something of what the thing is — though not always, and never on its own.":"这个名字的含义说明了事物是什么——尽管并不总是如此，而且从来都不是单独的。","St Thomas: sophistica quasi apparens sapientia. The sophist argues for glory, wanting to seem wise.":"圣托马斯： sophistica quasi apparens sapientia。智者争论的是荣耀，想要显得明智。","Primary substance is the individual thing; secondary substance is the species or genus it belongs to":"原始实体是个体事物；次要物质是它所属的种或属","He wins by driving his opponent into saying something ungrammatical, and then laughs at the grammar.":"他通过迫使对手说出不合语法的话，然后嘲笑语法而获胜。","is the truth of the premises themselves. An argument both valid in form and true in matter is called":"是场所本身的真相。形式上有效且实质上正确的论证称为","Adding equal half-parallelograms and comparing with the whole shows complement (1) = complement (2).":"将相等的半平行四边形相加并与整体比较可知补码(1) = 补码(2)。","Damp air rusts iron. This gate has stood in damp air for years. So we should expect it to be rusted.":"潮湿的空气会使铁生锈。这扇门多年来一直矗立在潮湿的空气中。所以我们应该预料到它会生锈。","If even the innocent are punished under this law, how much more the guilty who are merely suspected.":"如果连无辜者都受到这条法律的惩罚，何况那些仅仅被怀疑有罪的人呢？","Figures of speech please but explain nothing; a definition must be clearer than the term it defines.":"请使用修辞手法，但不做任何解释；定义必须比它所定义的术语更清晰。","The term being defined must not appear inside its own definition: nothing is made clearer by itself.":"被定义的术语一定不能出现在它自己的定义中：没有什么可以通过它本身变得更清楚。","The notice says dogs must be carried on the escalator. I have no dog. So I may not use the escalator.":"通知称，乘坐自动扶梯必须携带宠物狗。我没有狗。所以我可能不会使用自动扶梯。","“Philosopher” means a lover of wisdom. He hates to be corrected. So he is a philosopher in name only.":"“哲学家”的意思是热爱智慧的人。他讨厌被纠正。所以他只是一个名义上的哲学家。","Nothing can be white-and-black at once in the same respect; but the white thing can come to be black.":"在同一方面，没有什么可以同时是黑白的。但白色的东西可以变成黑色。","It is right to give people back what belongs to them. So it is right to hand a madman back his sword.":"把属于别人的东西还给别人是正确的。所以，把疯子的剑还给他是正确的。","Show △FBC ≅ △ABD by SAS (FB = AB, BC = BD, included angles equal as each is ∠ABC plus a right angle).":"用SAS表示△FBC≅△ABD（FB=AB，BC=BD，夹角相等，各为∠ABC加一个直角）。","Five sticks make a pentagon (one nail per corner). How many cross braces are needed to make it rigid?":"五根棍子组成一个五边形（每个角一个钉子）。需要多少个横撑才能使其坚固？","Why do we need the equilateral triangle at all? Why not simply draw a circle around A with radius BC?":"为什么我们需要等边三角形？为什么不简单地围绕 A 画一个半径为 BC 的圆呢？","Assume for contradiction that AB > AC. We will cut from the longer side a piece equal to the shorter.":"假设矛盾AB > AC。我们将从较长的一侧切下与较短的一侧相等的一块。","Students supply the missing conclusion out of habit; here the mood is fallacious and nothing follows.":"学生出于习惯而补充缺失的结论；这里的情绪是错误的，没有任何结果。","In △ABC with angles 1, 2, 3, extend BC to X. Claim: exterior ∠ACX = 2 + 3, and 1 + 2 + 3 = two rights.":"在角为1、2、3的△ABC中，将BC延伸至X。 命题：外∠ACX=2+3，且1+2+3=二权利。","Whoever can be beaten by someone is unhappy. A king can be beaten by an enemy. So the king is unhappy.":"谁能被人打，谁就不高兴。国王可以被敌人击败。所以国王不高兴。","You must show that this chapter is worth reading — and everyone grants that the book is worth reading.":"你必须表明这一章值得一读——而且每个人都承认这本书值得一读。","These are adjacent angles formed by PR standing on AB and are equal — therefore they are right angles.":"这些是 PR 站在 AB 上形成的相邻角，并且相等 - 因此它们是直角。","“Every man is necessarily mortal; every scholar is (in fact) a man; therefore every scholar is mortal”":"“每个人都必然会死；每个学者（事实上）都是人；因此每个学者都会死”","The shortest distance from a point to a straight line is the perpendicular from the point to the line.":"一点到直线的最短距离是该点到直线的垂线。","Corresponding angles give ∠ADB = ∠DBC; these are alternate angles for AD and BC, so AD ∥ BC (Thm. 23).":"相应的角度给出 ∠ADB = ∠DBC；这些是 AD 和 BC 的交替角度，因此 AD ∥ BC (Thm. 23)。","Porphyry’s Isagoge, the classic introduction to Aristotle’s Categories, sets out the five predicables.":"波菲利的《伊萨戈格》是亚里士多德范畴的经典介绍，列出了五个可预测的内容。","In the equality ∠AMB + ∠BMN = ∠ANM, replace ∠BMN by ∠ANM + ∠BNA. That gives ∠AMB + ∠ANM + ∠BNA = ∠ANM.":"在等式 ∠AMB + ∠BMN = ∠ANM 中，将 ∠BMN 替换为 ∠ANM + ∠BNA。这就给出 ∠AMB + ∠ANM + ∠BNA = ∠ANM。","2△FBC equals square ABFG (triangle and square/parallelogram on same base in same parallels — Thm. 33).":"2△FBC 等于正方形 ABFG（同底同纬线的三角形和正方形/平行四边形 — Thm. 33）。","replaced by their complements — but it is really three familiar steps in succession, not a single leap:":"被它们的补充所取代——但这实际上是连续的三个熟悉的步骤，而不是一次飞跃：","), though the wording differs. In the modals, a claim is equipollent to another when both reduce to the":"），尽管措辞不同。在情态中，当一个主张与另一个主张都归结为","No matter where P is inside an equilateral triangle, the three little heights add up to the big height!":"无论P在等边三角形内的什么位置，三个小高加起来就是大高！","First essential use of Postulate 4 (all right angles equal) in comparing “two right angles” quantities.":"公设 4（所有直角相等）的首次重要用途是比较“两个直角”数量。","A definition should say what a thing IS, not what it is not — wherever a positive account is available.":"只要有积极的解释，定义就应该说明事物是什么，而不是它不是什么。","Given ∠BCA = ∠EFD, ∠BAC = ∠EDF, and AB = DE (sides opposite a pair of equal angles, in Augros’s setup).":"给定 ∠BCA = ∠EFD、∠BAC = ∠EDF 和 AB = DE（在 Augros 的设置中，与一对等角相对的边）。","In neither sense: natures do not migrate; the compound is impossible and the subject has no such power.":"在这两种意义上：自然不会迁移；自然不会迁移。这种复合是不可能的，并且主体没有这种能力。","Conversion per accidens: the universal drops to a particular, existential import supplying the witness.":"每个意外的转换：普遍性下降到提供见证的特定的、存在的进口。","Mind the quality: ask whether the premises place the subject inside the other predicate or shut it out.":"注意质量：询问前提是否将主语置于其他谓词内或将其排除在外。","But then their areas are equal — yet △DBC is a part of △ACB, and a part is less than the whole. Absurd!":"但它们的面积相等——但△DBC是△ACB的一部分，而且部分小于整体。荒诞！","The bond of the conditional is exactly this: grant the antecedent, and the consequent cannot be refused.":"条件句的纽带正是这样的：给予前件，而后件则不能被拒绝。","From point P drop perpendicular PL to line AB (Thm. 10). Let R be any other point on AB. Claim: PR > PL.":"从点 P 垂直 PL 下降到线 AB (Thm. 10)。设R为AB上的任意其他点。要求：PR > PL。","The consequent was never made to depend on the antecedent alone; removing the antecedent leaves it free.":"结果从来不只依赖于前因。删除先行词使其自由。",". These are the dangerous ones, because the language behaves perfectly and only the thinking is crooked.":"。这些都是危险的，因为语言表现得很完美，只有思维是歪曲的。","— fails for the same reason. A conditional runs one way only: from antecedent to consequent, never back.":"——同样的原因失败了。条件语句仅以一种方式运行：从前件到后件，从不返回。","In neither sense: the essence of man excludes it, so no power reaches it and the compound is impossible.":"在这两种意义上都不是：人的本质排除了它，因此没有力量到达它并且复合是不可能的。","The construction places AL equal to BC on one particular side of A. Could we get it on any side we like?":"该结构将 AL 等于 BC 放在 A 的某一侧。我们可以将其放在我们喜欢的任何一侧吗？","Greatest side opposite greatest angle; least opposite least. Equal sides opposite equal angles (Thm. 3).":"最大角对面的最大边；最少相反最少。等边对等角（Thm. 3）。","a bird into its power to fly, to sing, and to build a nest; a person into the powers of body and of mind.":"鸟儿拥有飞翔、歌唱和筑巢的能力；一个人进入身体和心灵的力量。","Answering by dividing a term into the sense in which the claim is true and the sense in which it is false":"通过将术语分为正确的含义和错误的含义来回答","Two premises are given in standard form. Type the conclusion that follows — or “none” if nothing follows.":"以标准形式给出了两个前提。输入下面的结论 - 如果没有任何结论，则输入“无”。","— not the converse. So too “none but” and “no one except.” What follows the “only” becomes the predicate.":"——反之则不然。 “除了”和“没有人除外”也是如此。 “唯一”后面的内容成为谓语。","But a promise made to a madman to give back his sword ought not to be kept. So promises need not be kept.":"但对一个疯子许下的归还剑的诺言不应该被遵守。因此，不必遵守承诺。","Likewise the other two inequalities. Also BA > BC − AC by subtracting AC from both sides of BA + AC > BC.":"其他两个不等式也是如此。另外，BA + AC > BC 两边减去 AC，得到 BA > BC − AC。","Habit (echein / habitus) is Aristotle’s tenth category — having shoes or arms on the body (Categories 4).":"习惯（echein/habitus）是亚里士多德的第十类——身上有鞋子或手臂（类别4）。","Where in the circle around A does the point E lie, and how do we know there is only one such point on AB?":"E 点位于 A 周围的圆的什么位置，我们如何知道 AB 上只有一个这样的点？","Acute = sharp and skinny (less than a square corner). Obtuse = wide and open (more than a square corner).":"Acute = 尖锐且细长（小于方角）。钝角 = 宽且开放（大于方角）。","In any triangle, any side is less than the sum of the other two sides, but greater than their difference.":"在任何三角形中，任何一条边都小于另外两条边的和，但大于它们的差。","De fallaciis gives this one: the aim is a conclusion nobody would accept, though it is not exactly false.":"谬论给出了这样一个结论：目标是一个没人会接受的结论，尽管它并不完全错误。","Ray MB cuts ∠AMN into ∠AMB and ∠BMN, so ∠AMN = ∠AMB + ∠BMN. But ∠AMN = ∠ANM; therefore ∠AMB + ∠BMN = ∠ANM.":"Ray MB 将∠AMN 切割为∠AMB 和∠BMN，因此∠AMN = ∠AMB + ∠BMN。但∠AMN = ∠ANM；因此 ∠AMB + ∠BMN = ∠ANM。","This is why bridges and roof frames are full of triangular braces. Rectangles fold over; triangles do not.":"这就是为什么桥梁和屋顶框架充满了三角形支撑。矩形折叠；三角形则不然。","A species is the genus narrowed by the difference that constitutes it: rational added to animal gives man.":"物种是因构成它的差异而缩小的属：动物的理性加上人的理性。","Whenever he is losing the argument, he changes what he claimed and says he meant something else all along.":"每当他在争论中败北时，他都会改变自己的主张，并说自己一直以来的意思都是不同的。","Drop AL perpendicular to DE (side of the hypotenuse square), forming rectangles BL and CL. Join AD and CF.":"将 AL 垂直于 DE（斜边正方形的边）下降，形成矩形 BL 和 CL。加入AD和CF。","Essential in both senses: the dictum cannot be false, and of each triangle the property holds necessarily.":"在这两种意义上都是重要的：该格言不可能是错误的，并且对于每个三角形，该属性都必然成立。","Subcontraries may both be true — the truth of one settles nothing. Only their joint falsehood is excluded.":"一些相反的观点可能都是正确的——一个人的真理并不能解决任何问题。只有他们共同的谎言被排除在外。","Choose a level. You have passed this exercise, so the Master levels are open — reach Level V to master it.":"选择一个级别。您已经通过了此练习，因此大师级别已开放 - 达到 V 级即可掌握它。","(Conversion per accidens : the universal drops to a particular, existential import supplying the witness.)":"（每次意外的转换：普遍性下降到提供证人的特定的、存在主义的进口。）","You must show that laziness is to be blamed — and everyone already grants that hard work is to be praised.":"你必须表明懒惰是应该受到谴责的——而且每个人都已经承认努力工作是应该受到赞扬的。","A circle is a plane figure bounded by one line, every point of which lies equally distant from the centre.":"圆是由一条线界定的平面图形，其每一点到中心的距离相等。","Which of these is an individual — neither a genus nor a species, but only something things are said about?":"其中哪一个是个体——既不是属也不是种，而只是一些被谈论的东西？","An ACCIDENTAL division sorts a subject by features it can gain or lose without becoming a different thing.":"偶然的划分根据一个主题可以获得或失去的特征对其进行排序，而不会成为不同的东西。","aimed at a reasoned opinion, from what is probable — what seems so to everyone, or to most, or to the wise.":"旨在从可能的情况（对每个人、大多数人或智者来说似乎如此）得出合理的意见。","A division must sort on a single basis at a time: members sorted on different bases cut across one another.":"一个部门必须一次按单一基础进行排序：按不同基础进行排序的成员会相互交叉。","Food is healthy. A complexion is healthy. A body is healthy. So all three have health in them the same way.":"食物是健康的。肤色健康。身体是健康的。所以这三个人都以同样的方式拥有健康。","Ask what else the two have in common, and whether the supposed cause can be removed while the effect stays.":"询问两者还有什么共同点，以及是否可以在保留效果的同时消除假定的原因。",". Here the links are shown in full, in schematic letters, so that you may judge the reasoning link by link.":"。这里以示意性字母的形式完整地显示了链接，以便您可以通过链接来判断推理链接。","What holds of them one by one need not hold of them taken together: the joining itself can change the case.":"使它们一一对应的东西并不需要将它们组合在一起：连接本身就可以改变情况。","probable in the fullest sense: it seems so to all, and an opponent who denied it would be thought perverse.":"从最完整的意义上来说，这是可能的：对所有人来说似乎都是如此，而否认这一点的对手会被认为是反常的。","the power of sense — the difference that divides living things and makes the animal (the tree of Porphyry).":"感觉的力量——区分生物和创造动物的差异（斑岩树）。","The predicate belongs by essence: the dictum is necessary, and of each man the predicate holds of necessity.":"该谓词本质上属于：该格言是必然的，并且该谓词对于每个人来说都是必然的。","lacking the power of sense — the difference that marks the plant off from the animal (the tree of Porphyry).":"缺乏感觉的力量——植物与动物的区别（斑岩树）。","whiteness never leaves the swan, yet being a swan does not consist in being white — an inseparable accident.":"白色永远不会离开天鹅，但成为天鹅并不意味着是白色的——这是一个不可分割的偶然。","The middle term never appears in the conclusion: its whole office is to join the extremes and then withdraw.":"中间项从来不会出现在结论中：它的全部作用就是加入极端，然后退出。","The whole is a shared nature; the members are its kinds, marked off from one another by opposed differences.":"整体是一个共有的性质；成员们各不相同，彼此之间因对立的差异而区分开来。","A parallelogram may be slanted without limit and keep the same area on a fixed base between fixed parallels.":"平行四边形可以无限制地倾斜，并在固定平行线之间的固定底座上保持相同的面积。","(the diagonals, A–O and E–I) can never share a truth-value: of each pair, exactly one is true and one false.":"（对角线，A-O 和 E-I）永远无法共享真值：每一对中，只有一条为真，一条为假。","You must show that a state needs one person at its head — and your hearers know that a ship needs one pilot.":"你必须表明一个国家需要一个人来领导——而且你的听众知道一艘船需要一名飞行员。","What does it mean to say the probable is what seems so “to the wise, and among the wise to the most eminent”?":"说“对智者来说，以及对最杰出的智者来说”似乎是可能的事情是什么意思？","You may not reason the reverse: denying one member proves nothing of the other, for perhaps he is in neither.":"你可能不会得出相反的结论：否认一个成员并不能证明另一个成员的任何证据，因为也许他不属于其中任何一个。","Click a region: once to shade it (declared empty) · twice for an × (something exists) · a third time to clear":"单击某个区域：一次将其遮蔽（声明为空）·两次为 ×（存在某物）·第三次为清除","Do not simply convert first — an A will not convert. E contraposes only to an O, and I has no contrapositive.":"不要简单地先转换——A 不会转换。 E 只与 O 形成对立关系，而 I 没有对立关系。","Bisect the three sides of a triangle and join each vertex to the midpoint of the opposite side. What happens?":"将三角形的三边平分，并将每个顶点连接到相对边的中点。会发生什么？","Truth does not ascend. A true particular leaves its universal entirely open: falsity ascends, truth descends.":"真理不会提升。真正的特殊性使其普遍性完全开放：虚假上升，真理下降。","a matter of science: it follows from what cannot be otherwise, so it is not the business of dialectic at all.":"这是一个科学问题：它是从不可能的事物中得出的，所以它根本不是辩证法的事。","You must show that a rich man should give to the poor — and your hearers already grant that a poor man should.":"你必须表明富人应该向穷人施舍——而你的听众已经同意穷人应该这样做。","it may be true, but it is not yet probable in the required sense, and an opponent may refuse it without shame.":"它可能是真的，但在所要求的意义上它还不是可能的，对手可能会毫无羞耻地拒绝它。","it is the honest answer when the objection is simply sound: concede, and state the claim again more carefully.":"当反对意见很合理时，这是诚实的答案：承认，并更仔细地再次陈述主张。","The mind’s first act, before all judging or reasoning: simply to grasp what a thing is. Here we learn the five":"在所有判断或推理之前，头脑的第一个行为是：简单地理解事物是什么。下面我们就来学习一下这五种","A definition must fit exactly what it defines: it must not be TOO BROAD, covering more than the thing defined.":"定义必须完全符合它所定义的内容：它不能太宽泛，涵盖的范围不能超过所定义的内容。","An examiner asks a boy questions he can answer from his own opinions, to see how far his knowledge really goes.":"考官问一个男孩一些问题，他可以根据自己的观点回答，看看他的知识到底有多深。","A straight line standing on another at right angles is said to be perpendicular to the line on which it stands.":"一条直线与另一条直线成直角的直线称为垂直于它所站立的线。","A physician weighs two treatments. Neither is certain, but one is favoured by nearly every physician of repute.":"医生权衡两种治疗方法。两者都不确定，但几乎所有知名医生都青睐其中一种。","Any straight line can be extended continuously in a straight line in either direction and as far as you please.":"任何直线都可以沿任一方向连续延伸，并且可以延伸到任意远的距离。","This one depends on a rule that is simply true, which is why the argument holds. Every man really is an animal.":"这取决于一条完全正确的规则，这就是该论证成立的原因。每个人其实都是动物。","If health is to be sought, sickness is to be avoided — they are contraries, and the one follows from the other.":"如果要追求健康，就必须避免疾病——它们是对立的，一是相辅相成的。","Reasoning rarely halts at a single syllogism. More often one conclusion becomes a premise of the next, and so a":"推理很少停留在单一的三段论上。更多时候，一个结论成为下一个结论的前提，因此","Nobody who doubted the conclusion could have granted that premise. The argument has helped itself to the point.":"任何怀疑这个结论的人都不会承认这个前提。这个论点已经说到点上了。","An objection is granted in every premise, and the conclusion still does not follow. What has gone wrong with it?":"每个前提都提出反对意见，但结论仍然不成立。它出了什么问题？","Which kind of definition must come first, since we cannot ask what a thing is until we know what its name means?":"哪种定义必须首先出现，因为在我们知道事物名称的含义之前我们无法询问事物是什么？","Number (discrete) and magnitude — line, surface, body (continuous) — are the species of quantity (Categories 6).":"数（离散）和大小——线、面、体（连续）——是数量的种类（类别 6）。","the “some” has two open cells — shade a universal first, and its × will find a single home (or place it by hand)":"“some”有两个开放的单元格——首先遮蔽一个通用单元，它的×将找到一个单独的家（或手动放置它）","The two are compossible — nothing hinders the musician building while a musician — and the power belongs to him.":"两者是可以共存的——没有什么可以阻碍音乐家的创作——而权力属于他。","A law is made for the common good. This one serves only the lawmaker. So it falls short of what a law should be.":"法律是为了共同利益而制定的。这个只为立法者服务。所以它不符合法律应有的样子。","— if you want a foundation in the parts of speech before logic. Or you may begin with the introduction to logic,":"——如果你想在逻辑之前先打好词类基础。或者你可以从逻辑学的介绍开始，","having no body — the difference that divides substance into the bodily and the spiritual (the tree of Porphyry).":"没有身体——将物质分为身体和精神的区别（斑岩树）。","teaches the second. So the real use of a topic is not to name what somebody else did, but to answer the question":"教第二个。所以主题的真正用途不是命名别人做了什么，而是回答问题","Complementary pair = one right angle together. Supplementary pair = two right angles (a straight line) together.":"互补对=一个直角。补充对=两个直角（一条直线）在一起。","— what seems so to everyone, or to most, or to the wise — and reaches an opinion held for good reasons. Learn the":"——对每个人、大多数人或智者来说都是如此——并得出一个有充分理由持有的观点。学习","5, 12, 13 (25 + 144 = 169) and 8, 15, 17 (64 + 225 = 289). Also every multiple of one of these, such as 6, 8, 10.":"5、12、13（25 + 144 = 169）和 8、15、17（64 + 225 = 289）。还有其中一个的每个倍数，例如 6、8、10。","“He is shod” and “he is armed” fall under which category — what a man has on him, attached but not measuring him?":"“他穿着鞋子”和“他携带武器”属于哪一类——一个人身上有什么东西，是附着在身上却无法衡量他的？","taking up space — the difference that divides substance into the bodily and the spiritual (the tree of Porphyry).":"占据空间——将物质分为身体和精神的区别（斑岩树）。","Falsity does not descend. A false universal leaves its particular entirely open: truth descends, falsity ascends.":"虚假不会降临。虚假的普遍性将其特殊性完全开放：真理下降，虚假上升。","superaltern and subaltern — truth descends from universal to particular, existential import supplying the witness":"上等与下等——真理从普遍性下降到特殊性，存在的意义提供了证人","Say what the thing IS. A purely negative account fails to explain the thing whenever a positive one is available.":"说一下这是什么东西。只要有积极的解释，纯粹的消极解释就无法解释事情。","You must show that what he calls a democracy is nothing of the sort — and the word itself says rule by the people.":"你必须表明他所谓的民主根本不是这样的——而这个词本身就是指人民统治。","A weakened (subaltern) mood — valid on the traditional reading, where universal premises carry existential import.":"一种弱化的（底层）情绪——在传统解读中有效，普遍前提具有存在意义。","Corresponding sides give AD = BC. So both pairs of opposite sides are parallel and equal: ABCD is a parallelogram.":"相应边给出 AD = BC。所以两对相对边平行且相等：ABCD 是平行四边形。","“White” signifies a quality present in a subject; man, horse, and stone signify substances existing in themselves.":"“白色”表示主体中存在的品质；人、马、石，象征本身存在的物质。","Take the universals first and shade what they empty; then let the shading force each × into its one possible cell.":"首先采取普遍性，并遮蔽它们空洞的部分；然后让着色将每个 × 强制放入其一个可能的单元格中。","He left the book of Aristotle to his son. Aristotle owned that book. So the son inherited nothing Aristotle wrote.":"他把亚里士多德的书留给了他的儿子。亚里士多德拥有那本书。所以这个儿子没有继承亚里士多德的著作。","aimed at certain knowledge, from premises that are true and known in themselves — between a teacher and a learner.":"以教师和学习者之间真实且已知的前提为目标，针对某些知识。","“Possible” and “possible not” may both be true — of everything contingent. Only their joint falsehood is excluded.":"“可能”和“不可能”可能都是真的——一切都是偶然的。只有他们共同的谎言被排除在外。","In any right triangle, the square on the hypotenuse is equal to the sum of the two squares on the remaining sides.":"在任何直角三角形中，斜边上的平方等于其余边上的两个平方之和。","Anything that can be said about a thing falls under one of ten highest kinds — the categories of Aristotle. One is":"任何可以描述的事物都属于十种最高类型之一——亚里士多德的范畴。一是","rules: join a necessary premise to a merely contingent one, and the conclusion can be no stronger than contingent.":"规则：将一个必要前提与一个偶然条件相结合，得出的结论不能强于偶然条件。","Given two unequal straight lines AB and C, cut off from the greater one AB a straight line equal to the less one C.":"给定两条不相等的直线AB和C，从较大的一条AB截取一条等于较小的C的直线。","True compounded — whatever is white, is white; false divided — whiteness does not belong to the thing of necessity.":"真正的复合——凡是白的就是白的；假分——白不属于必然之物。","Since ∠EDF is right, the square on EF equals the squares on DE and DF together — that is, the squares on AB and AC.":"由于 ∠EDF 是正确的，EF 上的平方等于 DE 和 DF 上的平方加起来，即 AB 和 AC 上的平方。","A definition must fit exactly what it defines: it must not be TOO NARROW, leaving out part of what it should cover.":"定义必须完全符合它所定义的内容：它不能太狭窄，遗漏了它应该涵盖的部分内容。","Marked “but not both”, the disjunction is strict: exactly one member holds, so to posit one is to remove the other.":"标记为“但不是两者”，析取是严格的：只有一个成员成立，因此放置一个成员就是删除另一个成员。","Well done. Now attempt the same exercise in English terms — the harder dress, where the matter tempts the judgment.":"干得好。现在尝试用英语术语进行同样的练习——更硬的衣服，其中的问题会引起判断。","A partial converse: equal angles sharing a vertex with alternate legs collinear force the remaining legs collinear.":"部分相反：与交替的腿共线共享一个顶点的相等角度迫使其余的腿共线。","You must show that the fever should be let run — and you are no physician, but every physician of standing says so.":"你必须表明应该让发烧停止——你不是医生，但每一位有资格的医生都这么说。","Restated: if two segments are parallel and equal, the lines joining corresponding endpoints are parallel and equal.":"重申：如果两条线段平行且相等，则连接相应端点的线平行且相等。","Undistributed middle: the middle term is distributed in neither premise, so the premises are never made to connect.":"未分布的中间项：中间项在两个前提中都不分布，因此前提永远不会连接。","ACTION is what a substance does as a principle of change passing into another: cutting, burning, heating, building.":"行动是一种物质作为变化原理传递给另一种物质的行为：切割、燃烧、加热、建造。","If someone gives us a point A and a straight line BC, how can we draw from the point A a straight line equal to BC?":"如果有人给我们一个点A和一条直线BC，我们如何从A点画一条等于BC的直线呢？","Work from the diagram: shade the universal premises, mark the particulars, and assert only what the premises force.":"根据图表进行工作：画出普遍前提，标记细节，并仅断言前提所强制的内容。","Because the triangle inequalities hold, the circles overlap and each passes outside the other — they must intersect.":"因为三角形不等式成立，所以圆重叠并且每个圆都经过另一个圆之外——它们必须相交。","Everything in this round came back to you. Pick a wider range, or come back tomorrow — a day later is the real test.":"这一轮的一切都回到了你身上。选择更大的范围，或者明天再回来——一天后才是真正的考验。","Yes — SSS still compares the two small triangles formed with the bisector, as long as F is equidistant from D and E.":"是的 - SSS 仍然比较由平分线形成的两个小三角形，只要 F 与 D 和 E 等距即可。","Lines that lean toward each other on one side of a cutting line will eventually meet on that side (see Postulate 5).":"在切割线一侧相互倾斜的线最终将在那一侧相交（参见假设 5）。","An ESSENTIAL division divides a general kind (a genus) into the kinds beneath it, marked off by opposed differences.":"基本划分将一般类型（属）分为其下的类型，并以对立的差异来区分。","The members must be opposed, so that nothing belongs to two of them at once; overlapping members spoil the division.":"成员之间必须相互对立，这样任何事物都不能同时属于其中两个人；成员重叠会破坏分裂。","But “man is a rational animal” fits every man, and so does “man is a featherless biped.” So exact fit is not enough.":"但“人是理性的动物”适合每个人，“人是没有羽毛的两足动物”也是如此。所以精确的配合是不够的。","If two straight lines are cut by a third making the alternate angles equal, then the two straight lines are parallel.":"如果两条直线被第三条直线切割，使得交替角度相等，则这两条直线平行。","You said the tax was too high. But you pay it every year without complaint. So you think it is about right after all.":"你说税太高了。但你每年都付钱，毫无怨言。所以你认为这毕竟是对的。","An INTEGRAL division divides a whole into the parts that make it up — and no part is called by the name of the whole.":"积分除法将整体划分为组成它的部分，并且没有任何部分以整体的名称命名。",": one sound is taken for one thing, as the several things called “dog” look like one thing because “dog” is one word.":"：一个声音代表一件事，因为“dog”是一个词，所以称为“dog”的几个事物看起来像一件事。","Aristotle says it, and on such a question there is no better judge. So it is to be held, until better reason appears.":"亚里士多德是这么说的，在这个问题上没有更好的判断者。所以它应该被保留，直到出现更好的理由。","the name explained — which must come first, since we cannot ask what a thing is until we know what its name refers to.":"名称的解释——这必须是第一位的，因为在我们知道一个事物的名称所指的含义之前，我们不能问它是什么。","You must show that this particular act was unjust — and it has already been granted that acts of that kind are unjust.":"你必须证明这一特定行为是不公正的——而且人们已经承认这种行为是不公正的。","You must show that acting bravely is worth doing — and your opponent has already granted that bravery is worth having.":"你必须表明勇敢的行动是值得的——而且你的对手已经承认勇敢是值得拥有的。","The objection is sound and the thesis must be narrowed: a law binds when it has been made known. Concede, and restate.":"反对意见是合理的，而且必须缩小论点：法律一旦公布就具有约束力。承认并重申。","converse accident, or secundum quid — modern books usually call it hasty generalisation, or ignoring the qualification":"相反的意外事件，或 secundum quid — 现代书籍通常称其为仓促概括，或忽略限定条件","by its characteristic effects — the heat and light it gives off — which point the thing out without saying what it is.":"通过它的特征效应——它发出的热和光——它指出了事物的本质，而无需说明它是什么。","Every member must actually belong to the whole being divided: a division may not list something that falls outside it.":"每个成员实际上都必须属于被划分的整体：一个划分不能列出不属于它的东西。",": two things that agree somehow are taken to be simply one. Six fallacies fall on the first side, seven on the second.":"：以某种方式一致的两件事被认为是简单的一件事。第一方面有六个谬论，第二方面有七个谬论。","ignoratio elenchi, the irrelevant conclusion, or missing the point; the straw man and the red herring are species of it":"ignoratio elenchi、不相关的结论或没有抓住要点；稻草人和红鲱鱼都是它的种类","Congruent figures (≅) are the same size and same shape. △ABC ≅ △DEF means all corresponding sides and angles are equal.":"全等图形 (≅) 大小相同、形状相同。 △ABC ≅ △DEF 表示所有对应边和角都相等。","making honey belongs to bees alone, to every bee, and always — it follows from what a bee is, yet is not what a bee is.":"酿造蜂蜜只属于蜜蜂，属于每只蜜蜂，而且始终属于蜜蜂——它源于蜜蜂的本质，但又不是蜜蜂的本质。","In △PLR, the greater angle has the greater opposite side (Thm. 16). Side opposite ∠PLR is PR; side opposite ∠PRL is PL.":"在△PLR 中，角度越大，对边越大（Thm.16）。 ∠PLR 的对面是 PR； ∠PRL 的对面是 PL。","Right triangle has a square corner. The long side opposite that corner is the hypotenuse; the other two sides are legs.":"直角三角形有一个直角。该角对面的长边是斜边；另外两侧是腿。","Into which two categories does St Thomas divide what affects a substance from within — the doing and the being-done-to?":"圣托马斯把从内部影响实体的因素分为哪两类——做的事和被做的事？","In △ABC let the square on AB together with the square on AC be equal to the square on BC. Claim: ∠BAC is a right angle.":"在△ABC中，设AB上的平方与AC上的平方一起等于BC上的平方。主张：∠BAC是直角。","POSTURE (situs) is how a thing’s parts are arranged in the place it occupies: he lies, he sits, he stands, he reclines.":"姿势（位置）是指物体的各个部分在其所在位置的排列方式：他躺着，他坐着，他站着，他斜倚。","Obversion has two steps: change the quality and replace the predicate with its complement. You changed the quality only.":"Obversion 有两个步骤：改变质量并用其补语替换谓语。您只改变了质量。","an inseparable accident: blackness never leaves the raven, yet being a raven does not consist in being black (Porphyry).":"一个不可分割的意外：黑色永远不会离开乌鸦，但成为乌鸦并不意味着是黑色的（斑岩）。",": answer all correctly to move to the longer interval; miss one and the set lapses back to daily review. The reviews are":"：回答全部正确即可进入更长的间隔；错过一个，整个系列就会回到每日回顾。评论是","speech belongs to man alone, to every man, and always — it follows from his reason, yet is not what a man is (Porphyry).":"言语只属于人类，属于每个人，并且始终属于人类——它源于人类的理性，但并不是人类本身（波菲利）。","whiteness is present in him but is no part of what he is; he might be dark and still be Socrates (a separable accident).":"白色存在于他身上，但并不是他本质的一部分；他可能是黑暗的，但仍然是苏格拉底（一个单独的意外）。","Composite — “possibly: the winner loses” — contradicts itself. Divided is true: the man who in fact won might have lost.":"综合——“可能：赢者输了”——自相矛盾。分裂是真实的：实际上获胜的人可能已经失败了。","You denied that you ate the raw meat. He argues: whatever you bought, you ate; you bought raw meat; so you ate raw meat.":"你否认你吃过生肉。他认为：无论你买什么，你都吃什么；你买了生肉；所以你吃了生肉。",", which exist only in a substance. St Thomas shows how the nine follow from the different ways they relate to substance (":"，仅存在于物质中。圣托马斯展示了这九个人如何从与物质相关的不同方式中得出结论（","In any parallelogram, opposite sides and opposite angles are equal, and a diagonal bisects the area of the parallelogram.":"在任何平行四边形中，对边和对角都相等，并且对角线平分平行四边形的面积。","All right angles are equal. Not only are adjacent right angles equal to each other, but even those that are not adjacent.":"所有直角都相等。不仅相邻的直角彼此相等，甚至那些不相邻的直角也相等。","That those who know a subject judge so is a real reason, and the tradition counts it among the topics. But it moves us by":"那些了解某个学科的人会这样判断，这是一个真正的原因，传统也将其视为主题。但它却让我们感动","In an isosceles triangle, the base angles are equal to each other, and the angles under the base are equal to each other.":"在等腰三角形中，底角彼此相等，底下的角也彼此相等。","What affects the subject from within is action (in the doer) and passion (in the thing done to) — Metaphysics V, lect. 9.":"从内部影响主体的是行动（在行动者中）和激情（在所做的事情中）——形而上学V，lect。 9.","' + (due.length ? 'Start Today\\u2019s Review \\u27f6' : learnVerb+' '+ROMAN[learn.id]+' \\u00b7 '+learn.title+' \\u27f6') + '":"' + (due.length ? '今天开始复习\\u27f6' : learnVerb+' '+ROMAN[learn.id]+' \\u00b7 '+learn.title+' \\u27f6') + '","The art of coming to understand someone else’s words — their truth, their form, and how they relate to the speaker’s goals":"理解别人话语的艺术——它们的真实性、它们的形式以及它们与说话者的目标的关系","Order matters: we first learn when lines must be parallel (constructible criteria), then what follows from being parallel.":"顺序很重要：我们首先了解线何时必须平行（可构造标准），然后了解平行后会发生什么。","MISSING THE POINT — the schools call it ignorance of the refutation — proves something, but not the thing that was denied.":"没有抓住要点——学校称之为对反驳的无知——证明了一些事情，但不是被否认的事情。","That is the subcontrary. The contradictory of a particular is the universal of opposite quality: I pairs with E, O with A.":"这就是相反的情况。特殊性的矛盾是相反性质的普遍性：I 与 E 配对，O 与 A 配对。","On the classical account heat belongs to fire’s nature: the compound is impossible, and no power in fire reaches coldness.":"根据经典的说法，热属于火的本质：化合物是不可能的，火中的任何力量都无法达到寒冷。","Obversion has two steps: change the quality and replace the predicate with its complement. You negated the predicate only.":"Obversion 有两个步骤：改变质量并用其补语替换谓语。您仅否定了谓词。","You must show that this argument is worthless — and you can show what produced it was a wish to win, not a wish for truth.":"你必须证明这个论点毫无价值——你可以证明它的产生是一种获胜的愿望，而不是对真理的渴望。","it is the answer when every premise stands and the conclusion still does not follow — the matter is sound, the form is not.":"当每个前提都成立但结论仍然不成立时，这就是答案——内容是合理的，但形式却不然。","a musical instrument into strings, winds, and percussion; a vertebrate into fish, amphibians, reptiles, birds, and mammals.":"一种乐器，分为弦乐、管乐和打击乐；脊椎动物分为鱼类、两栖动物、爬行动物、鸟类和哺乳动物。","The oracle said that if he crossed the river he would destroy a great kingdom. He crossed. So the enemy kingdom was doomed.":"神谕说，如果他渡过这条河，他就会毁灭一个伟大的王国。他穿越了。所以敌国注定灭亡。","the judgement of those who know is offered as a reason — the weakest of the topics, says the tradition, though not nothing.":"知情者的判断被作为一个理由——传统上说，这是最薄弱的话题，但并非没有。","DA = DB, since DAB is equilateral. Take these equals away from the equals DL and DG, and the remainders are equal: AL = BG.":"DA = DB，因为 DAB 是等边的。将这些等式从等式 DL 和 DG 中去掉，余数相等：AL = BG。","Truth does not ascend: a posse ad necesse non valet consequentia. Only falsity climbs from the weaker mode to the stronger.":"真理不会提升：一群非代客后果。只有虚假才会从较弱的模式上升到较强的模式。","Which category has for its whole being a “bearing toward another,” so that one term cannot be understood without the other?":"哪个类别的整体具有“对另一个类别的影响”，因此一个术语不能脱离另一个术语而被理解？","bearing acorns belongs to oaks alone, to every oak, and always — it follows from what an oak is, yet is not what an oak is.":"结橡子只属于橡树，属于每一棵橡树，而且始终属于橡树——它源于橡树的本质，但又不是橡树的本质。","QUANTITY belongs to a substance by reason of its matter and answers “how much?”: two feet long, a number, a line, a surface.":"数量因其物质而属于一种物质，并回答“多少？”：两英尺长，一个数字，一条线，一个表面。","Ask what each word is actually naming. If the grammar runs parallel and the things do not, the grammar is doing the arguing.":"询问每个单词的实际名称是什么。如果语法是并行的，而事物却不是，则语法正在进行争论。","Whoever gives away what he owns becomes poor. The generous man gives away what he owns. So the generous man is to be pitied.":"谁放弃自己拥有的东西，谁就会变得贫穷。慷慨的人捐出他所拥有的东西。所以，慷慨的人是值得怜悯的。","A DIVISION BY POWERS divides one thing according to what it is able to do — as a person into the powers of body and of mind.":"权力的划分根据一件事的能力来划分它——作为一个人，分为身体的权力和精神的权力。","Every premise here is true, and true matter makes a form feel trustworthy — but no truth of matter can repair a broken form.":"这里的每个前提都是真实的，真实的物质使形式感到值得信赖——但物质的真相无法修复破碎的形式。","The link runs one way only: the mark belongs to more things than the one named, so finding the mark does not find the thing.":"该链接仅以一种方式运行：该标记属于比指定的事物更多的事物，因此找到该标记并不能找到该事物。","Aristotle’s Categories names ten: substance, quantity, quality, relation, action, passion, when, where, position, and habit.":"亚里士多德的范畴列出了十个：物质、数量、质量、关系、行动、激情、时间、地点、位置和习惯。","HABIT (having) is what a substance has on it — attached to it, but not measuring it: he is shod, he is armed, he is clothed.":"习惯（拥有）是一种物质所具有的东西——附着在它上面，但不衡量它：他穿鞋，他武装，他穿衣服。","(a) yes (b) no — 1+2=3 (c) yes? 1+1>1 (d) yes (e) no — 1+10=11 (f) yes (g) yes (h) yes. Degenerate when equality holds (b,e).":"(a) 是 (b) 否 — 1+2=3 (c) 是？ 1+1>1 (d) 是 (e) 否 — 1+10=11 (f) 是 (g) 是 (h) 是。当等式成立 (b,e) 时退化。","A circle is a plane figure contained by one curved line whose every point is the same distance from a single point inside it.":"圆是由一条曲线包含的平面图形，该曲线的每个点到其内部的单个点的距离相同。","It appears acute: all three angles look (and later prove) less than a right angle. After Thm. 28 we know each is exactly 60°.":"它看起来很锐：所有三个角度看起来（后来证明）都不是直角。在Thm之后。 28 我们知道每个都是 60°。","An essential division divides a general kind into the kinds beneath it. What does an integral division divide, and into what?":"基本划分将一般类型分为其下的类型。积分除法能除什么，又除什么？","Using SSS, prove that the two equilateral triangles on the same straight line (one above, one below) are equal to each other.":"使用 SSS，证明同一直线上的两个等边三角形（一个在上面，一个在下面）彼此相等。","If PB is perpendicular to CD, clearly ∠PBC + ∠PBD = two right angles. Now let AB stand on CD not necessarily perpendicularly.":"如果 PB 垂直于 CD，显然 ∠PBC + ∠PBD = 两个直角。现在让AB 不一定垂直地站在CD 上。","Locate the subject: shade what the major forbids, place the subject where the minor puts it, and read off what region remains.":"定位主题：遮蔽专业禁止的内容，将主题放置在未成年人放置的位置，然后读出剩下的区域。","Going together is not producing. Both may follow from some third thing, as ice cream and drowning both follow the hot weather.":"在一起并不是生产。两者都可能源于第三件事，就像冰淇淋和溺水都伴随着炎热的天气一样。","It explains the word, not the thing, and must come first: we cannot ask what a thing is until we know what its name refers to.":"它解释的是词，而不是事物，并且必须放在第一位：在我们知道事物的名称所指的含义之前，我们不能问事物是什么。","In fact nothing can complete it : no arrangement of the middle with the orphaned term yields a valid mood for that conclusion.":"事实上，没有什么可以完成它：中间项与孤立项的排列无法产生该结论的有效基调。","You have weakened further than the premises require: the conclusion may take the mode of the weaker premise itself — here, the":"你的弱化程度超出了前提的要求：结论可能采用较弱前提本身的模式——这里，","— the Predicables, the Categories, Division, and Definition — are open from the start; work them in any order. The gate to the":"— 谓词、类别、划分和定义 — 从一开始就是开放的；以任何顺序操作它们。通往的大门","It picks the thing out by a mark that follows from its nature, or merely goes along with it, without saying what the thing is.":"它通过遵循事物本质的标记来挑选事物，或者只是顺应事物的本质，而不说明事物是什么。","what a thing essentially is — the arts by which a concept is made clear and distinct, and the road to everything that follows.":"事物的本质是什么——使概念变得清晰明确的艺术，以及通往后续一切的道路。","If two lines lean toward each other, they will meet if you extend them far enough. This is Euclid’s famous parallel postulate!":"如果两条线相互倾斜，只要将它们延伸得足够远，它们就会相遇。这就是欧几里得著名的平行公设！","Postulate 5: if co-interior angles sum to less than 180°, lines meet. Thm. 24: if they sum to exactly 180°, lines do not meet.":"假设 5：如果共内角之和小于 180°，则直线相交。嗯。 24：如果它们的总和恰好为 180°，则线条不会相交。","If any side of a triangle is extended, the exterior angle is greater than either of the interior and opposite (remote) angles.":"如果延伸三角形的任何一条边，则外角大于内角和对角（远角）。","BEGGING THE QUESTION puts the conclusion into the premises, usually in different words, so that the argument goes in a circle.":"提出问题将结论放入前提中，通常用不同的语言，这样论证就可以循环进行。","Judge the form first, then the matter: validity concerns what would follow; soundness adds that the premises are in fact true.":"首先判断形式，然后判断实质：有效性关系到接下来发生的事情；健全性补充说，前提实际上是正确的。","The complements are right, but the terms must also change places: the contrapositive of “All S are P” is “All non-P are non-S.”":"补语是正确的，但术语也必须改变位置：“所有 S 都是 P”的逆否词是“所有非 P 都是非 S”。","So their corresponding angles are equal (SSS): ∠BAC = ∠EDF. But ∠EDF is a right angle, and therefore ∠BAC is a right angle too.":"所以它们对应的角度相等（SSS）：∠BAC = ∠EDF。但∠EDF 是直角，因此∠BAC 也是直角。","Quite right — no premise can complete this argument validly : the conclusion outruns any possible help from the remaining term.":"非常正确——没有任何前提可以有效地完成这个论证：结论超出了剩余术语的任何可能的帮助。","These three ways build on each other in that order. There is no arguing without sentences, and no persuading without arguments.":"这三种方式按顺序相互构建。没有句子就没有争论，没有论证就没有说服。","The circular definition teaches nothing: a definition must be clearer than the defined, and a thing is not clarified by itself.":"循环定义没有告诉我们什么：定义必须比被定义的更清楚，而事物本身并不能澄清。","St Thomas derives quantity and quality thus: quantity belongs to a substance by reason of its ___, quality by reason of its ___.":"圣托马斯由此推导出数量和质量：数量由于其___而属于某种物质，质量由于其___而属于某种物质。","Export downloads your progress as a .json file — the only way to carry it to another device or keep a copy. Import restores one.":"导出将您的进度下载为 .json 文件 - 这是将其传输到其他设备或保留副本的唯一方法。导入恢复一。","Said of many things of different kinds, naming the broader class they all share; it answers “what is it?” with the wider nature.":"谈到许多不同种类的事物，指出它们所共有的更广泛的类别；它回答“这是什么？”与更广泛的性质。","Nothing is better than lifelong happiness. A dry crust is better than nothing. So a dry crust is better than lifelong happiness.":"没有什么比一生的幸福更好的了。干皮总比没有好。所以，干枯的外壳胜过一生的幸福。","QUALITY belongs to a substance by reason of its form and answers “of what sort?”: white, hot, healthy, just, strong, triangular.":"质量因其形式而属于一种物质，并回答“哪种？”：白色、热、健康、公正、坚固、三角形。","ACCENT turns on how a word is stressed or pronounced. Shift the stress and you have changed the claim without changing a letter.":"重音打开单词的重读或发音方式。转移压力，你就改变了主张，而没有改变一个字母。","you are forced into a statement anyone can see is untrue. It offends against natural science and mathematics, where we can check.":"你被迫发表任何人都认为不真实的声明。它违反了自然科学和数学，我们可以在那里检查。","Radius: center to edge. Diameter: all the way across through the center (two radii in a line). All radii of one circle are equal!":"半径：中心到边缘。直径：一直穿过中心（一条线上的两个半径）。一圆的所有半径都相等！","The modal square. The scholastics tabled these equipollences under the mnemonic vowels of “Amabimus, Edentuli, Iliace, Purpurea”.":"模态平方。经院学者将这些等价词放在助记元音“Amabimus、Edentuli、Iliace、Purpurea”之下。","She does not argue for any view of her own. She only draws out what he already believes, until he sees it will not hold together.":"她不主张自己的任何观点。她只是把他已经相信的东西拿出来，直到他发现它无法结合在一起。","Every circle in these diagrams is such a universal seen from above, its individuals gathered inside. Two moves say everything: an":"这些图中的每个圆圈都是从上方看去的一个普遍体，它的个体聚集在里面。两个动作说明了一切：","A geometry master proves that the base angles of an isosceles triangle are equal, and the class sees that it cannot be otherwise.":"几何大师证明了等腰三角形的底角相等，而全班同学则发现不可能有其他情况。","An obtuse angle is a rectilineal angle greater than a right angle. An acute angle is a rectilineal angle less than a right angle.":"钝角是大于直角的直线角。锐角是小于直角的直线角。","The objection stands and the thesis as stated cannot. Concede, and state the thesis again with the qualification the case demands.":"反对意见成立，而所陈述的论文则不能成立。承认，并根据案例要求的资格再次陈述论文。","Claim: AB = AC — the triangle is isosceles (and drawn so). Both base angles are equal, so the sides opposite them should be equal.":"主张：AB = AC — 三角形是等腰三角形（并且如此绘制）。两个底角相等，因此它们相对的边也应该相等。","the fallacy of accident — also called a dicto simpliciter , destroying the exception, or applying a general rule to a special case":"事故谬误——也称为 dicto simpliciter ，破坏例外，或将一般规则应用于特殊情况","The conjunctive is a prohibition of company: where one member stands, the other must fall. Ponendo tollens is its one lawful mood.":"连接词是对同伴的禁止：一名成员站立的地方，另一名成员必须倒下。 Ponendo tollens 是它的一种合法情绪。","A CAUSAL definition identifies the thing through one of its causes: what made it, what it is made of, its form, or what it is for.":"因果定义通过事物的原因之一来识别事物：它是什么造成的、它是由什么构成的、它的形式或它的用途。","You get a larger equilateral triangle divided into four small equilateral triangles (the middle one upside-down), a classic figure.":"你会得到一个较大的等边三角形，分成四个小等边三角形（中间一个倒置），这是一个经典的图形。","Integral division takes a whole (a house) into the parts that make it up (foundation, walls, roof) — and no part is called a house.":"整体分割将一个整体（一座房子）分成组成它的各个部分（地基、墙壁、屋顶）——没有一个部分被称为房子。","Suppose △ABM and another △ABN stood on the same base AB, on the same side, with AM = AN and BM = BN, and yet with different angles.":"假设△ABM和另一个△ABN位于同一底AB上，同侧，AM=AN，BM=BN，但角度不同。","drawing iron belongs to magnets alone, to every magnet, and always — it follows from what a magnet is, yet is not what a magnet is.":"拉铁只属于磁铁，属于每一个磁铁，并且始终——它源于磁铁是什么，但又不是磁铁是什么。","it is the answer when the objection simply rests on something false — no distinction is needed; you refuse the premise and say why.":"当反对意见只是基于错误的东西时，这就是答案——不需要区分；你拒绝这个前提并说出原因。","— but there is more than one way of answering. The tradition distinguishes four kinds; learn to recognize each before you judge it.":"——但回答的方式不止一种。传统分为四种：在做出判断之前先学会识别它们。","That last part marks a real disputation off from an argument given merely to illustrate a pattern. A disputation is going somewhere.":"最后一部分将真正的争论与仅仅为了说明模式而给出的论点区分开来。一场争论正在向某个地方发展。","From the definition of an even number it is shown that no odd number can be even — and the conclusion could not have been otherwise.":"从偶数的定义可以看出，奇数不可能是偶数——而且结论不可能是其他的。","Ask: which term of the conclusion is left unsupported? The tacit premise must join it to the middle term, in a mood the rules allow.":"问：结论中哪一项没有得到支持？默示前提必须以规则允许的方式将其与中间项结合起来。","Right region, wrong mark: a universal proposition empties its region — shade it. The × asserts existence, which no universal claims.":"正确的区域，错误的标记：一个普遍的命题清空了它的区域——遮蔽它。 × 断言存在，但没有普遍的主张。","If A and B did not coincide, then △BCD would have sides equal to those of △ACD yet slant differently — triangles would not be rigid.":"如果 A 和 B 不重合，则 △BCD 的边与 △ACD 的边相等，但倾斜度不同 - 三角形不会是刚性的。","In any triangle the three angles add up to two right angles, and an exterior angle equals the sum of the two remote interior angles.":"在任何三角形中，三个角加起来都是两个直角，并且一个外角等于两个遥远的内角之和。","an argument may be drawn from, what standing a premise has before you offer it, and the four ways the schools answered an objection.":"可以从提出前提之前的立场以及学校回答反对意见的四种方式中得出论据。","A square of four hinged rods can be kicked over into a slanted shape, keeping every rod the same length. Can a triangle do the same?":"一个由四根铰接杆组成的正方形可以被踢成倾斜形状，保持每根杆的长度相同。三角形也能起到同样的作用吗？","a tree into root, trunk, and the soil — the soil is not a part of the tree at all, so it does not belong to the whole being divided.":"一棵树分为根、树干和土壤——土壤根本不是树的一部分，因此它不属于被分割的整体。","Later (Thm. 28) we learn the exterior angle equals the sum of the two remote interiors — which explains why it is greater than each.":"后来（Thm.28）我们了解到外角等于两个远程内部的总和 - 这解释了为什么它比每个内部都大。",". All moods and figures of the scholastic account are possible here — including the fourth figure and the weakened (subaltern) moods.":"。学术帐户的所有情绪和数字都可能在这里 - 包括第四个数字和弱化（底层）情绪。","floating belongs to ice alone among the forms of water, to all ice, and always — it follows from what ice is, yet is not what ice is.":"漂浮只属于水的形式中的冰，属于所有的冰，并且始终——它源于冰的本质，但又不是冰的本质。","EQUIVOCATION uses a single word in two senses. St Thomas’s own case: “dog” means the barking animal, the star, and a fish of the sea.":"EQUIVOCATION 使用一个词有两种含义。圣托马斯自己的例子：“狗”意味着吠叫的动物、星星和海里的鱼。","It belongs to every member of the species, to that species alone, and at all times — so wherever you find the one you find the other.":"它属于该物种的每一个成员，并且只属于该物种，并且在任何时候都是如此——所以无论你找到一个，你也会找到另一个。","Two townspeople argue whether the new bridge should be built. Neither can prove it; each gives reasons a sensible person would allow.":"两个镇民争论是否应该建造新桥。两者都无法证明这一点；每个都给出了明智的人会允许的理由。","Adjacent angles on the parallel with the perpendicular force all angles right (using Thm. 25 and opposite angles of a parallelogram).":"平行线上的相邻角与垂直线迫使所有角度都是直角（使用 Thm. 25 和平行四边形的对角）。","Two affirmations can only join terms. The separation asserted in the conclusion must come from somewhere, and no premise supplies it.":"两个肯定句只能连接项。结论中所断言的分离必定来自某个地方，并且没有前提提供它。","(A above I, E above O): truth descends from the universal to its particular, and falsity climbs from the particular to its universal.":"（A在I之上，E在O之上）：真理从普遍性下降到特殊性，虚假从特殊性上升到普遍性。","Diagonals AC, BD meet at O. Opposite sides parallel ⇒ alternate angles equal; then ASA or SAS on half-triangles shows AO=OC and BO=OD.":"对角线AC、BD交于O。对边平行⇒对角相等；那么半三角形上的 ASA 或 SAS 显示 AO=OC 且 BO=OD。","Fill the rectangle with a grid of unit squares: base counts columns, height counts rows; product is the number of unit squares (area).":"用单位正方形网格填充矩形：基数为列数，高度为行数；乘积是单位正方形（面积）的数量。","A teacher shows the class that the angles of a triangle add to two right angles, proving it step by step from what they already grant.":"老师向全班展示三角形的内角相加为两个直角，并根据他们已经给出的内容逐步证明这一点。","Square: equal sides + right angles. Rectangle: right angles. Rhombus: equal sides, tilted. Parallelogram: two pairs of parallel sides.":"正方形：等边+直角。长方形：直角。菱形：等边、倾斜。平行四边形：两对平行的边。","The enthymeme is the ordinary form of reasoning in real life — far more frequent than the full syllogism. Everyday speech runs on it (":"推理素是现实生活中推理的常见形式——比完整的三段论更为常见。日常言语都在其上运行（","Two terms placed in the four traditional relations. Choose any corner and see its converse, obverse, contrapositive, or contradictory.":"两个术语置于四种传统关系中。选择任何一个角，看看它的逆面、正面、对立或矛盾。","Strategy: first prove the large overlapping triangles congruent, then the small ones under the base; then subtract equals from equals.":"策略：先证明重叠的大三角形全等，再证明底下的小三角形全等；然后从 equals 中减去 equals。","No distinction is needed and nothing about the form is wrong. The premise of the thesis is simply false, and the observation shows it.":"不需要区分，形式也没有任何错误。这篇论文的前提完全是错误的，观察结果表明了这一点。","false cause; where the mistake is that one thing merely came after another, post hoc ergo propter hoc — “correlation is not causation”":"虚假原因；错误在于，一件事接二连三地发生，事后故此（post hoc ergo propter hoc）——“相关性不是因果关系”","One basis at a time: “leather/canvas” sorts by material, “left-footed” by something else entirely — mixing bases is the classic fault.":"一次一个基础：“皮革/帆布”按材料分类，“左脚”则完全按照其他东西分类——混合基础是典型的错误。","Right region, wrong mark: “some” asserts existence — an ×. Shading would declare that very region empty, the opposite of what is said.":"正确的区域，错误的标记：“某些”断言存在——一个×。阴影将声明该区域为空，与所说的相反。","Given three straight lines X, Y, Z such that any two together are greater than the third, construct a triangle with those side lengths.":"给定三条直线 X、Y、Z，其中任意两条直线加在一起都大于第三条直线，用这些边长构造一个三角形。","IN A CERTAIN RESPECT, TAKEN FLATLY: something true in one way, or at one time, or for one person, is asserted without any limit at all.":"在某些方面，坦率地说：以一种方式、在某一时刻、或对一个人来说，某件事是真实的，是没有任何限制的。","Illicit conversion — the classic slip. “All S are P” distributes its subject only, so it converts merely per accidens : “Some P are S.”":"非法转换——典型的失误。 “All S are P”仅分配其主语，因此它仅按意外转换：“Some P are S”。","A disputation turns between the one who puts the case and the one who answers. Each question ahead puts you in one of those two chairs.":"一场争论在提出问题的人和回答问题的人之间展开。前面的每个问题都会让你坐在这两把椅子中的一张上。","Judge validity for syllogisms clothed in ordinary English terms, general or singular. Attend to the form, not the truth of the premises.":"判断用普通英语术语（一般或单数）表达的三段论的有效性。注意形式，而不是前提的真实性。","a remote genus — an oak is a tree, a tree a plant, a plant a living thing. The genus need not be the nearest one (the tree of Porphyry).":"一个遥远的属——橡树是一棵树，一棵树是一种植物，一棵植物是一种生物。该属不必是最近的一个（斑岩树）。","the fallacy of grammatical analogy; where the words name different sorts of thing altogether it is what is now called a category mistake":"语法类比的谬误；这些词完全代表不同种类的事物，这就是现在所谓的类别错误","It identifies the thing by what made it, what it is made of, its form, or what it is for — the last fits everything made by human craft.":"它通过它的制造者、它的成分、它的形式或它的用途来识别事物——最后一个适合人类工艺制造的一切。","Ordinary language wears its logic loosely. Before judging the arguments, note where translation into standard form most often goes wrong.":"普通语言的逻辑是松散的。在判断论点之前，请注意标准形式的翻译最常出错的地方。","But the squares on AB and AC together equal the square on BC (given). So the square on EF equals the square on BC, and therefore EF = BC.":"但AB 和AC 上的平方加起来等于BC 上的平方（给定）。因此 EF 的平方等于 BC 的平方，因此 EF = BC。","The members taken together must cover the whole. If anything belonging to the whole falls under none of them, the division is incomplete.":"成员加在一起必须涵盖整体。如果属于整体的任何东西都不属于其中任何一个，那么划分就是不完整的。","FIGURE OF SPEECH — St Thomas calls it the likeness of a word — is when two expressions of the same shape are treated as of the same sort.":"修辞格——圣托马斯称之为单词的相似性——是指两个形状相同的表达方式被视为同一类型。","The disjunction pledges at least one member: deny one, and the other cannot be refused. Tollendo ponens is the disjunctive’s native mood.":"分离保证了至少一个成员：拒绝一个，而另一个不能被拒绝。 Tollendo ponens 是选言的原生语气。","Given something you must show, and something already granted, a topic tells you which place will turn the one into a reason for the other.":"给定一些你必须展示的东西，以及一些已经被授予的东西，一个主题会告诉你哪个地方会把一个变成另一个的理由。","A DESCRIPTIVE definition identifies the thing by a property, or by a telltale feature — marks that point it out without saying what it is.":"描述性定义通过属性或明显的特征来识别事物 - 指出它而不说明它是什么的标记。","it works whenever a word in the objection carries two senses: grant the sense that is true, deny the other, and the objection falls apart.":"每当反对意见中的一个词带有两种含义时，它就会起作用：承认正确的意思，否认另一个意思，那么反对意见就会崩溃。","Tollendo tollens runs backwards and so feels suspect — but deny the consequent and every region where the antecedent could live is closed.":"托伦多·托伦斯（Tollendo tollens）向后运行，因此感到可疑——但否认结果，并且前件可能存在的每个区域都被关闭。","A testing disputation works from what seems true to the respondent, and aims at taking his measure. It need not care which view is better.":"测试性争论是根据答辩人认为真实的情况进行的，旨在采取他的措施。它不需要关心哪个视图更好。","With Thm. 11 we can restate Postulate 5: if two lines make less than two right angles on one side of a transversal, they meet on that side.":"与Thm。 11 我们可以重申公设 5：如果两条线在一条截线的一侧形成的直角少于两个，则它们在那一侧相交。","This rule fails whenever the property belonged to the whole precisely as a whole. Sometimes it happens to hold; it never holds necessarily.":"当财产完全属于整体时，这条规则就失效了。有时它恰好成立；它从来都不是必然成立的。","), though they are grounded in how things really are. Each question ahead puts one category, or one point of the doctrine, in front of you.":"），尽管它们是基于事物的真实情况。前面的每个问题都将教义的一个类别或一个要点摆在您面前。","False in both senses: seeing-while-blind is contradictory, and blindness is a privation — the power itself is gone, not merely unexercised.":"两种意义上都是错误的：失明时看见是矛盾的，失明是一种匮乏——权力本身消失了，而不仅仅是没有行使。","affirming the consequent when it wears an “if”; in the categorical form, the undistributed middle — modern logic counts them the same fault":"当结果带有“如果”时，肯定结果；在分类形式中，未分布的中间——现代逻辑将它们视为同样的错误","Together, Theorems 36 and 37 say: a triangle is right-angled **if and only if** the square on one side equals the squares on the other two.":"定理 36 和 37 共同表明：**当且仅当**一侧的正方形等于另外两条的正方形时，三角形才是直角三角形。","The objection grants the pattern and shows it fails elsewhere — which is to attack the form of the inference, not the truth of any premise.":"反对意见认可了该模式，并表明它在其他地方失败了——这是为了攻击推论的形式，而不是任何前提的真实性。","sections below, which teach without keeping score. Or you may go straight into the exercises: choose a difficulty, then select an exercise.":"下面的部分，在不记分的情况下进行教学。或者您可以直接进入练习：选择难度，然后选择练习。","It is not the conclusion that was in dispute. A real refutation must contradict the very thing said, in the same respect, at the same time.":"有争议的并不是结论。真正的反驳必须在同一方面、同一时间与所说的话相矛盾。","St Thomas gives the qualification carefully. Not every opinion of every man is probable; but neither does dialectic need everyone to agree.":"圣托马斯仔细地给出了资格。并非每个人的每一个观点都是可能的；但辩证法也不需要所有人都同意。","Miss any of that and you have refuted something nobody claimed. This is the fault called missing the point, or ignorance of the refutation.":"错过任何一个，你就驳斥了没有人声称的东西。这就是所谓的“没有抓住要点”或“无知反驳”的错误。","Halves of equals are equal: the triangles have equal area. Also a triangle is half the parallelogram on the same base in the same parallels.":"等分的一半相等：三角形的面积相等。另外，三角形是同底、同纬线的平行四边形的一半。","Opposite sides of a parallelogram are equal (Thm. 31): AD = BE and CF = BE, so AD = CF. Take away the common piece CD from each and AC = DF.":"平行四边形的对边相等（Thm. 31）：AD = BE 且 CF = BE，因此 AD = CF。去掉每个人的公共棋子 CD，AC = DF。","The question is whether a promise made under threat still binds. There are respected authorities on each side, and the argument weighs them.":"问题是在威胁下做出的承诺是否仍然具有约束力。双方都有受人尊敬的权威，争论对他们产生了影响。","If two straight lines are cut by a third making interior angles on the same side add up to two right angles, then the two lines are parallel.":"如果两条直线被第三条直线相切，使同侧的内角加起来为两个直角，则两条直线平行。","you are made to repeat the same thing uselessly — what St Thomas calls nugatio. It offends against rhetoric, whose business is to speak well.":"你被迫无用地重复同样的事情——圣托马斯称之为nugatio。它冒犯了修辞学，修辞学的职责就是说得好。","Two negatives feel as though they position the terms against one another; in truth two denials sever every link and establish nothing at all.":"两个否定让人感觉这些术语相互对立；事实上，两次否认就切断了一切联系，根本无法建立任何东西。","“Not necessary” is not “impossible”: denying the stronger mode grants only the weaker denial, possible-not. This is the commonest modal slip.":"“不必要”并不是“不可能”：否认更强的模式只会授予更弱的否认，可能-不。这是最常见的模态滑移。","link is a valid syllogism. A single broken link breaks the chain — even if the last line happens to look plausible. So follow each step: does":"链接是一个有效的三段论。一个断开的链接就会破坏整个链条——即使最后一行恰好看起来合理。因此请遵循每个步骤：","Contradictories on the modal square always disagree; for the rest, ask what the square forbids — what it does not forbid remains undetermined.":"模态平方上的矛盾总是不一致；其余的，问问广场禁止什么——它不禁止什么仍然悬而未决。","Adds a repeating daily event to your own calendar to call you back to practice — no account or sign-in needed. Works on any phone or computer.":"将重复的每日活动添加到您自己的日历中，让您返回练习 - 无需帐户或登录。适用于任何手机或计算机。","“Good” is said in two ways: good as a knife, and good in what it is used for. Grant the first, deny the second, and the objection is answered.":"“好”有两种说法：一是刀好，二是用途好。同意第一个，拒绝第二个，然后反对就得到了答复。","AMPHIBOLY is ambiguity not in a word but in a whole phrase. St Thomas’s case: “the book of Aristotle” — the one he wrote, or the one he owned?":"AMPHIBOLY 不是一个词的歧义，而是整个短语的歧义。圣托马斯的案例：“亚里士多德的书”——他写的书，还是他拥有的书？","“Necessarily” and “contingently” cling to the conclusion at their peril: the conclusion may never be stronger in mode than the weaker premise.":"“必然”和“偶然”坚持结论是有风险的：结论在模式上可能永远不会比较弱的前提更强。","Standard form; write complements with “non-” (e.g. “No B are non-C”, “All non-C are non-B”). If the operation cannot be performed, type “none”.":"标准形式；用“non-”写补语（例如“没有 B 是非 C”、“所有非 C 都是非 B”）。如果无法执行该操作，请键入“none”。","Mark a Venn diagram freely — shade regions, place ×s — and read what your diagram asserts. One proposition, two premises, or a whole syllogism.":"自由地标记维恩图——阴影区域，放置×s——并阅读你的图表所断言的内容。一个命题，两个前提，或者整个三段论。","A wise man is a man who is wise. So a wise man is a man who is a man who is wise. So a wise man is a man who is a man who is a man who is wise.":"聪明人就是有智慧的人。所以，一个有智慧的人就是一个有智慧的人。所以，一个有智慧的人就是一个有智慧的人。","depends on the same rule reversed — which is false. Both premises may be true and the argument still worthless, because the floor is not there.":"取决于相反的相同规则——这是错误的。这两个前提都可能是正确的，但论证仍然毫无价值，因为底线不存在。","Porphyry: the genus answers “what is it?”, the difference “what sort of thing, in its nature?” — rational tells us what sort of animal a man is.":"斑岩：属回答“它是什么？”，区别是“它的本质是什么？” ——理性告诉我们人是一种什么样的动物。","Marked “but not both”, this disjunction is strict: its members exclude each other, so ponendo tollens holds her
