rns the whole proposition composed of its parts, taken together at once: is that whole package possible/necessary? · divided sense — the mode’s scope is narrowed to the subject alone: has the thing itself the power (or necessity), even if not while it is as it now is?":"复合意义——模式控制着由各个部分组成的整个命题，这些部分同时组合在一起：整个命题可能/必要吗？ · 分裂的意义——该模式的范围仅限于主题：事物本身是否具有力量（或必要性），即使不是像现在这样？","That is the deepest difference between the two. A noun refers to a thing, a stable entity under consideration; a verb is a doing, or a being done, or a becoming, or a being in a certain way. This distinction between nouns and verbs is the seed of the medieval account treated at the end of this introduction.":"这是两者之间最深刻的区别。名词指的是一个事物，一个正在考虑的稳定实体；动词是一种行为，或者一种正在做的事情，或者一种正在发生的事情，或者一种以某种方式存在的东西。名词和动词之间的这种区别是本引言末尾所讨论的中世纪叙述的基础。","equipollent = equal in force: same meaning and truth-value, same corner of the square (though the words differ) · laws : “impossible” = “necessary not” · a NOT before the mode flips the corner (“not possible” = “impossible”; “not necessary” = only “possible not”) · a NOT after the mode negates the content alone":"equalollent = 效力相等：含义和真值相同，正方形的角相同（尽管词语不同） · 法则：“不可能”=“不一定” · 模式翻转角之前的一个 NOT（“不可能”=“不可能”；“不必要”= 仅“不可能”） · 模式单独否定内容之后的一个 NOT","The members together must cover the whole, leaving nothing out; they must not overlap, so nothing falls under two of them at once; every member must actually belong to the whole being divided; and the whole division must be made on a single basis. Each question ahead puts one rule, or one kind, in front of you.":"成员必须共同覆盖整体，不遗漏任何内容；它们不能重叠，因此没有任何东西同时属于其中两个；每个成员实际上都必须属于分裂的整体；整个划分必须在单一基础上进行。前面的每个问题都会向您提出一种规则或一种规则。","Because to draw a circle around A with radius BC we would first have to carry the length BC over to A — which is the very thing we are trying to accomplish. Postulate 3 lets us draw a circle around a centre with a radius already given at that centre (like BC around B), not a radius borrowed from somewhere else.":"因为要围绕 A 画一个半径为 BC 的圆，我们首先必须将 BC 的长度转移到 A 上——这正是我们想要完成的事情。假设 3 让我们围绕一个中心画一个圆，其半径已经在该中心给出（就像 BC 围绕 B 一样），而不是从其他地方借用的半径。","The refutable sign in an older dress. The familiar thought — that angry gods blight the fields — runs the wrong way and merely affirms the consequent; the premise that actually concludes, that every failed harvest bespeaks divine anger, is the suspicious one, and drought, blight, and pest refute it every season.":"旧衣服上的可反驳的标志。人们熟悉的想法——愤怒的诸神会毁坏田野——是错误的，只是肯定了结果；实际上得出的结论是，每一次失败的收成都预示着神圣的愤怒，这一前提是可疑的，而干旱、枯萎病和害虫每个季节都会反驳它。","Given the truth or falsity of any one corner, the square lets you read off at once what must follow for the other three. It is the oldest engine of valid inference from a single premise — and the ground of the immediate inferences below, which you can try out on any pair of terms in the square at the foot of this page.":"考虑到任何一个角的真实或虚假，正方形可以让你立即读出其他三个角的必然结果。它是从单一前提进行有效推理的最古老的引擎，也是下面直接推理的基础，您可以在本页底部的方框中的任何一对术语上进行尝试。",", the rule the argument depends on. When that rule is true, the argument holds. A fallacy is that same machinery running backwards: an argument depending on a rule that is false and looks true. So the two exercises teach one thing from opposite ends, and the question below about the hidden rule is the hinge between them.":"，论证所依赖的规则。当该规则为真时，该论证成立。谬误是同样的机制倒退：一个论证依赖于一个看似正确但错误的规则。因此，这两个练习从相反的两端教导一件事，而下面关于潜规则的问题就是它们之间的铰链。","Learn the rules of definition by using them: each question puts one rule in front of you — exact fit, clarity, no circle, saying what a thing is rather than what it is not, and brevity — and asks which everyday definition breaks or keeps it. The four kinds (nominal, essential, descriptive, causal) are taught the same way.":"通过使用它们来学习定义规则：每个问题都会将一条规则摆在您面前 - 精确匹配、清晰、无循环、说出事物是什么而不是不是什么以及简洁 - 并询问哪种日常定义打破或保留了它。这四种类型（名义性、本质性、描述性、因果性）的教学方式相同。","Among triangles, a right triangle is one containing a right angle. An obtuse triangle is one containing an obtuse angle. An acute triangle is one with all three of its angles acute. In a right triangle, the side opposite the right angle is called the hypotenuse, and the two sides containing the right angle are called legs.":"在三角形中，直角三角形是包含直角的三角形。钝角三角形是包含钝角的三角形。锐角三角形是三个角均为锐角的三角形。在直角三角形中，与直角相对的边称为斜边，包含直角的两条边称为直角边。",", a place) is a standing relation you can draw an argument out of: from the definition, from the wider kind, from the narrower kind, from a property, from opposites, from the more and the less, from likeness, from whole and parts, or from authority. Name the topic and you can usually see at once what would answer the argument.":"，一个地方）是一种固定的关系，你可以从中得出论证：从定义，从更广泛的种类，从更窄的种类，从属性，从对立，从多与少，从相似，从整体和部分，或者从权威。说出主题，您通常可以立即看到如何回答该论点。","Each premise here is true by the classical definitions, though one may have sounded doubtful (remember: Euclid’s isosceles has two sides alone equal; no passion is a habit; the theological virtues observe no mean; and the oyster is an animal without sight). Test surprising premises against the definitions, not against first impressions.":"根据经典定义，这里的每个前提都是正确的，尽管听起来可能令人怀疑（记住：欧几里得的等腰三角形只有两条边相等；没有激情是一种习惯；神学美德不卑不亢；牡蛎是一种没有视力的动物）。根据定义而不是第一印象来测试令人惊讶的前提。","Any straight line drawn from the center of a circle and stopping at the circumference is called a radius of the circle. By definitions 15 & 16, all the radii of a circle are equal. Any straight line drawn through the center of a circle and terminated at each end by the circumference is called a diameter. Any diameter bisects the circle.":"从圆心画出并停在圆周上的任何直线称为圆的半径。根据定义 15 和 16，圆的所有半径都相等。任何穿过圆心并在两端终止于圆周的直线称为直径。任何直径都平分圆。","The rules of definition: it must fit exactly the thing defined — no more, no less — and be clearer than it; it must not contain the term being defined; it should say what a thing is rather than what it is not, wherever it can; and it should be brief — the nearest kind (genus) and the difference that marks the thing off, with no wasted words.":"定义规则：它必须完全符合所定义的事物——不多也不少——并且比它更清晰；它不得包含正在定义的术语；它应该尽可能地说明事物是什么而不是它不是什么；而且应该简短——最接近的种类（属）和区分事物的区别，没有多余的文字。","the mode negates the content alone — “possible that not.” Fold the negations step by step until each expression shows its corner; then ask whether the two corners match. The commonest slip is hearing “not necessary” as “impossible”: denying the strong mode grants only the weak denial. The scholastics drilled these with the mnemonic vowels of":"该模式仅否定内容——“可能不是。”逐步折叠否定，直到每个表达式都露出它的角；然后询问两个角是否匹配。最常见的错误是将“不必要”听成“不可能”：否认强模式只会授予弱否认。经院学者用助记元音来练习这些","A fallacy is an argument that looks sound and is not. St Thomas: every fallacy has two causes — the cause of the appearance, which makes it look good, and the cause of the failure, which makes it break. Six fallacies come from the words (the language is ambiguous); seven come from outside the words (the language is fine, the thinking is not).":"谬误是一种看似合理但实际上并非如此的论证。圣托马斯：每一个谬误都有两个原因——外观的原因，使它看起来不错，以及失败的原因，使它破裂。六谬从言出（语言有歧义）；七来自文字之外（语言可以，思维不行）。","declares that a region holds no individuals at all. When two or three circles overlap, their regions sort the individuals beneath — and the whole logic of propositions and syllogisms can be read off the picture. Use the buttons below to see any form drawn for you, or mark the regions yourself and let the readout say what your diagram asserts.":"声明一个区域根本不存在任何个人。当两个或三个圆圈重叠时，它们的区域会对下面的个体进行排序——并且命题和三段论的整个逻辑可以从图片中读出。使用下面的按钮查看为您绘制的任何表格，或者您自己标记区域并让读数说明您的图表所主张的内容。","The syllogism with a premise left unsaid — where arguments hide their weakness. Supply the tacit premise in standard form (or “none”, when nothing can complete it), and weigh specimens ancient and modern — from Aristotle, Plato, Descartes, and St Thomas to the arguments of the street, the field, and the market: what is being taken for granted?":"三段论有一个未说的前提——论证隐藏了它们的弱点。以标准形式提供默认前提（或者“无”，当没有任何东西可以完成它时），并权衡古代和现代的样本——从亚里士多德、柏拉图、笛卡尔和圣托马斯到街头、田野和市场的争论：什么是理所当然的？","Four answers are open to an objection. DISTINGUISH the term — the distinguo — when a word is true in one sense and false in another. DENY the premise when it is simply false. GRANT it all and deny that the conclusion follows, when the matter is sound but the form is not. Or GRANT the whole objection and narrow your claim, when the objection is right.":"有四个答案值得反对。当一个词在某种意义上是正确的而在另一种意义上是错误的时，请区分这个术语——区别。当前提完全错误时就否认它。当内容合理但形式不正确时，承认一切并否认结论随之而来。或者，当反对意见正确时，同意整个反对意见并缩小您的主张范围。","Arguments that look sound and are not, after St Thomas’s De fallaciis and Aristotle’s Sophistical Refutations. Six fallacies come from the words and seven from outside them; every one has two causes — what makes it look sound, and what makes it fail. Name the fallacy, name both causes, name the answer, and see the false rule an argument is standing on.":"在圣托马斯的《谬误论》和亚里士多德的《诡辩驳斥》之后，这些论点看似合理，实则不然。六谬来自于言，七谬来自于外。每个人都有两个原因——什么使它看起来合理，什么使它失败。说出谬误，说出两个原因，说出答案，然后看看论证所依据的错误规则。","Dialectic reasons from what is probable — what seems so to everyone, or to most, or to the wise — and reaches a reasoned opinion, not a proof. Its instrument is the topic (locus): a standing relation, such as genus to species or whole to part, from which an argument may be drawn. Its practice is the disputation, where one puts a case and another answers.":"辩证法从可能发生的事情（对每个人、大多数人或智者来说似乎如此）进行推理，并得出合理的意见，而不是证据。它的工具是主题（轨迹）：一种固定的关系，例如属与种或整体与部分，从中可以得出论证。它的做法就是争论，一个人提出一个案例，另一个人来回答。","Division — the road to definition: a general kind divided by differences until a single species stands alone. Each question shows one rule — the members must cover the whole, must not overlap, must each actually belong to the whole, and must be sorted on a single basis — and the four kinds (essential, integral, by powers, accidental) are taught alongside.":"划分——通向定义的道路：将一般种类除以差异，直到形成一个独立的物种。每个问题都显示一个规则——成员必须涵盖整体，不得重叠，每个成员必须实际上属于整体，并且必须在单一基础上排序——并且四种类型（本质、整体、权力、偶然）并列教授。","The ten highest kinds under which anything that can be said of a thing falls, after Aristotle and St Thomas: substance, and the nine accidents — quantity, quality, relation, action, passion, when, where, position, and habit. Place each predicate in its category, and learn St Thomas’s account of how the nine follow from their different relations to substance.":"继亚里士多德和圣托马斯之后，任何事物都可以归入十种最高类型：实质和九种偶然——数量、质量、关系、行动、激情、时间、地点、位置和习惯。将每个谓词放入其类别中，并学习圣托马斯关于这九个谓词如何从它们与实质的不同关系中得出结论的说明。","Among quadrilaterals, a square has all four sides equal and all four angles right; a rectangle has all four angles right but not all four sides equal; a rhombus has all four sides equal but no right angles. A parallelogram is any quadrilateral contained by two pairs of parallel straight lines. Quadrilaterals that are none of the above will be called trapezia.":"四边形中，正方形的四个边都相等，四个角都是直角；矩形的四个角都是直角，但四个边不相等；菱形的四个边都相等，但没有直角。平行四边形是由两对平行直线包含的任何四边形。不符合上述条件的四边形称为梯形。","THE CONSEQUENT supposes that a one-way link works both ways. Aristotle’s own cases: a man is called an adulterer because he dresses finely and walks abroad at night — but many men do that who are not adulterers; and a man in a fever is hot, yet a man who is hot need not have a fever. In “if” form it is the same fault: the ground is wet, so it must have rained.":"THE CONSEQUENT 假设单向链接是双向的。亚里士多德自己的案例：一个人被称为通奸者，因为他穿着考究，晚上出国散步——但许多男人并不是通奸者，他也会这样做；发烧的人很热，但热的人不一定发烧。在“如果”形式中，这是同样的错误：地面是湿的，所以一定是下雨了。","(can be false). These four stand on a square just like A, E, I, O: necessary and impossible are contraries, never both true; possible and possible-not are subcontraries, never both false; each universal-strength corner is contradicted by the weak corner diagonally opposite; and truth flows downward — what is necessary is thereby possible, but never the reverse.":"（可能是假的）。这四者就像A、E、I、O一样站在一个正方形上：必要和不可能是对立的，永远不会同时成立；可能和可能-不是矛盾的，绝不会同时都是假的；每个通用强度角都与对角相对的弱角相矛盾；真理向下流动——因此，必要的事情都是可能的，但反之则不然。","Study the outline of the first part of the trivium. From the beginning and assuming none of it: what a noun and a verb are, how they make a sentence that can be true or false, and where grammar stops and logic starts. Then the medieval question — why the parts of speech are what they are — and the modists’ answer, that grammar follows the shape of things. Not scored.":"研究三要素第一部分的大纲。从一开始就假设什么都没有：名词和动词是什么，它们如何造出一个可以是真或假的句子，以及语法在哪里停止而逻辑在哪里开始。然后是中世纪的问题——为什么词性是这样的——以及修饰主义者的回答，即语法遵循事物的形状。没有得分。","Whatever its kind, a good definition fits exactly what it defines — neither too broad nor too narrow; it is clearer than the thing defined, so no metaphor; it does not contain the term being defined; it says what a thing is rather than what it is not, wherever it can; and it is brief, with no wasted words. Each question ahead will put one rule, or one kind, in front of you.":"无论哪种定义，一个好的定义都准确地契合它所定义的内容——既不太宽泛，也不太狭隘；它比定义的事物更清楚，所以不需要隐喻；它不包含正在定义的术语；它尽可能地说明事物是什么，而不是它不是什么；而且很简短，没有任何废话。前面的每个问题都会将一种规则或一种规则摆在您面前。","The five ways a general term can be said of a subject, after Porphyry: genus and species, the difference that makes a species, the property that follows from a thing’s nature, and the accident that merely happens to be true of it. Name the predicable at work in each statement — and learn why “genus” and “species” are relative terms, and how a property differs from an accident.":"继斑岩之后，一个通用术语可以用五种方式来表示一个主题：属和种、构成种的差异、事物本质的属性以及碰巧发生的偶然。说出每个陈述中起作用的可谓词，并了解为什么“属”和“种”是相对术语，以及财产与事故有何不同。","sense the mode’s scope is divided off and narrowed to the man himself: “the man, who happens to be standing, has the power to sit” — true. Same words, two claims. It holds for necessity too: “whatever runs is necessarily running” is true composed (the whole “it runs and is running” cannot fail together) yet false divided (nothing runs by necessity — it could stop). Whenever a modal sentence puzzles you, ask first:":"感觉这种模式的范围被划分并缩小到人本身：“恰巧站着的人有能力坐着”——没错。同样的话，两种主张。它也必然成立：“无论运行什么都必然运行”是真正的组合（整个“它运行和正在运行”不能一起失败）但错误的划分（没有任何东西必然运行 - 它可能会停止）。每当情态句让你困惑时，先问：","The five predicables (Porphyry): genus, species, difference, property, and accident — the five ways a general term can be said of a subject. The genus is the wider kind; the species the narrower kind under it; the difference is the mark that divides the genus and makes the species; the property follows from what the thing is and belongs to that species alone, always; the accident may come or go while the subject stays the same thing.":"五个谓词（Porphyry）：属、种、差异、性质和偶然——表示一个主语的通用术语的五种方式。该属是较广泛的种类；该物种是其下较窄的种类；差异是划分属和种的标志；属性源自事物的本质，并且始终只属于该物种；事故可能会发生或消失，而主题却保持不变。","Arguments drawn from four matters: the everyday world of living things and things made, judged by ordinary knowledge; classical mathematics after Euclid; the doctrine of virtue after Aristotle and St Thomas; and the soul and living things after De Anima. Judge the form (is it valid?) and the matter (are the premises in fact true?) — hence whether the argument proves its conclusion. Any term you may not know is explained above the argument.":"论据来自四个方面：根据普通知识判断的日常生活中的生物和所制造的事物；欧几里得之后的古典数学；亚里士多德和圣托马斯之后的美德学说；以及德阿尼玛之后的灵魂和生物。判断形式（有效吗？）和内容（前提真的正确吗？）——从而判断论证是否证明其结论。任何您可能不知道的术语都在参数上方进行了解释。","In sum: simple conversion (E, I), obversion (all), and contraposition (A, O) are equivalences — truth passes both ways. Conversion of A and contraposition of E hold in one direction only, the universal weakening to a particular by existential import. And O cannot be converted, nor I contraposed, at all: “Some animals are not dogs” is true, yet its converse “Some dogs are not animals” is false — the O gives no purchase on the predicate beyond the part it names.":"总而言之：简单转换（E，I）、逆向（all）和对立（A，O）是等价的——真理是双向的。 A 的转换和 E 的对立仅在一个方向上成立，即存在主义意义对特殊性的普遍削弱。 O 根本不能被转换，我也不能反驳：“有些动物不是狗”是真的，但它的反面“有些狗不是动物”是假的——除了它所命名的部分之外，O 没有对谓词给出任何购买。","The ten categories (Aristotle): substance, quantity, quality, relation, action, passion, when (time), where (place), posture, and habit. Substance exists in its own right; the other nine are accidents, which exist only in a substance or affect it. St Thomas derives them (Metaphysics V, lect. 9): what belongs to the substance itself follows from its matter (quantity), from its form (quality), or from a bearing toward something else (relation); what affects the substance does so from within (action, passion) or from outside — either measuring it (when, where, posture) or merely attached to it (habit).":"十类（亚里士多德）：物质、数量、质量、关系、行动、激情、何时（时间）、何处（地点）、姿势和习惯。物质本身就存在；其余九种是事故，仅存在于物质中或影响物质。圣托马斯推导出它们（《形而上学》V，lect.9）：属于实体本身的东西来自于它的物质（数量），来自它的形式（质量），或者来自对其他事物的轴承（关系）；影响物质的因素是从内部（行动、激情）或从外部产生的——要么测量它（何时、何地、姿势），要么仅仅依附于它（习惯）。","Reasoning from what is granted rather than from what is proved. The probable, says the tradition, is what seems so to everyone, or to most, or to the wise — and dialectic reaches a reasoned opinion, not a proof. The Topics is the art of FINDING an argument, not merely of judging one: given something you must show, learn which of the twelve places will supply it, and what maxim the argument will depend on. Then judge what standing a premise has before you offer it, and answer an objection as the schools did — distinguish the term, deny the premise, grant it all and deny the consequence, or concede and narrow your claim.":"根据已授予的内容进行推理，而不是根据已证明的内容进行推理。传统上说，可能的事情对每个人、大多数人或智者来说都是如此——而辩证法得出的是合理的意见，而不是证明。主题是寻找论证的艺术，而不仅仅是判断一个论证：给定一些你必须展示的东西，了解十二个地方中的哪一个可以提供它，以及论证将依赖于什么准则。然后在你提出一个前提之前判断它的立场，并像学校那样回答反对意见——区分术语，否认前提，承认一切并否认结果，或者承认并缩小你的主张。","Two readings, two verdicts — the difference is one of scope . Composite (in sensu composito): the mode governs the whole proposition composed of its parts, taken together as one package — ask, is the whole package (subject with predicate, both at once) possible or necessary? Divided (in sensu diviso): the mode’s scope is divided off and narrowed to the subject alone — ask, does this subject, as it actually is, have the power (or the necessity) claimed , even if it cannot exercise it just now? So “the seated man can walk” is false composed (seated-and-walking together is impossible) but true divided (the man himself keeps the power to walk).":"两次阅读，两次判决——区别在于范围。复合（in sensu composito）：该模式控制着由其各部分组成的整个命题，将其视为一个包 - 问，整个包（主语与谓语，同时）是可能的还是必要的？分割（in sensu diviso）：模式的范围被分割并缩小到主体本身——试问，这个主体实际上是否拥有所声称的权力（或必要性），即使它现在无法行使它？所以“坐者能行”是假合成（坐与行是不可能的），但却是真分（人自己保留了行走的能力） ning is the conjunction’s work, telling how is the adverb’s, and pointing is the article’s.":"连接是连词的工作，告诉如何是副词的工作，指向是冠词的工作。","; the third would move from this to something further; and it is plainly the work of the mind.":";第三个将从此转向更进一步的事情；这显然是头脑的工作。","Sometimes the evidence stands nearly equal on both sides. To incline toward the better view we":"有时，双方的证据几乎相等。为了获得更好的视野，我们","to the sleeping, placing the one with respect to the other. That is the work of a preposition.":"睡觉时，将其中一个相对于另一个放置。这就是介词的作用。","— namely, as belonging to the noun modified; and this is why the adjective cannot stand alone.":"——即，属于被修饰的名词；这就是为什么这个形容词不能单独存在。","In “The old dog sleeps quietly by the fire,” which word names the thing the sentence is about?":"在“老狗在火边安静地睡觉”中，哪个词表示了这句话所讲的内容？","In “The very brave soldier fought fiercely,” which word is an adverb depending on an adjective?":"在“非常勇敢的士兵激烈战斗”中，哪个词是依赖形容词的副词？","Difficulty, age, and where a subject is taught tell you nothing about what kind of thing it is.":"难度、年龄以及教授科目的地点并不能告诉你它是什么类型的东西。","— and “All S are P” yields “Some S are P.” Modern set theory instead treats a class as possibly":"——“所有 S 都是 P”会产生“一些 S 是 P”。现代集合论将类视为可能","The premise may well be true, the words are clear enough, and something has plainly gone wrong.":"前提很可能是正确的，文字也足够清楚，而且显然有些地方出了问题。","Cause to effect is demonstration of the cause; and neither probable opinion nor story can yield":"因果关系是原因的证明；无论是可能的观点还是故事都不能产生","Set theory is built on classes, uses the same diagrams, and has universal statements in plenty.":"集合论建立在类的基础上，使用相同的图，并且有大量的通用陈述。","Person: who is doing the walking — the one speaking, the one spoken to, or the one spoken about.":"人：行走的人——说话的人、被谈话的人或被谈论的人。","something. A single concept asserts nothing, so there is nothing yet to be right or wrong about.":"某物。单一的概念没有任何断言，因此还没有什么是对或错的。","Silence, not a claim. A Venn diagram asserts only what is marked; everything else it leaves open.":"沉默，不是主张。维恩图仅断言标记的内容；其他一切都保持开放状态。","The building is the same in all three, one builder throughout, and something plainly has changed.":"这三栋建筑都是一样的，自始至终都是一个建筑商，而且显然有些东西发生了变化。","Two leaves out reasoning; four and ten belong to other divisions — the causes and the categories.":"两个省去了推理；四和十属于其他部分——原因和类别。","Flowing is the verb’s manner; nouns ask nothing; and a noun signifies as plainly as any word does.":"流畅是动词的方式；名词什么也不问；名词的含义与任何单词一样清楚。","Grasping, judging, reasoning. This course of study is ordered by those three and named after them.":"把握、判断、推理。这门课程是由这三人订购并以他们的名字命名的。","It is a perfectly good word with a perfectly good tense; what it lacks is something to be said of.":"这是一个非常好的词，时态也非常好。它缺少的是可说的东西。","The forms were pictured as falling away from the upright or nominative form — whence also the word":"这些形式被描绘为脱离了直立或主格形式——这个词也由此而来","It proceeds from the proper cause to what follows, and so shows why the thing cannot be otherwise.":"它从正确的原因出发，得出接下来的结果，从而表明为什么事情不可能是其他情况。","Aristotle began with the law courts and the assembly, but the art reaches much further than either.":"亚里士多德从法庭和集会开始，但艺术的影响远不止于此。","What does grammar consider about the joining of a noun and a verb, as against what logic considers?":"相对于逻辑的考虑，语法对名词和动词的连接有何考虑？","Poetics does not prove, does not count opinions, and does not close a question down — it opens one.":"诗学不证明，不计算意见，也不结束一个问题——它打开一个问题。","The words plainly differ and the alphabets differ; and translation of arguments manifestly succeeds.":"单词和字母明显不同；论点的翻译显然是成功的。","A proof needs no story, counting is not reasoning at all, and a hostile audience calls for rhetoric.":"证明不需要故事，计数根本不是推理，敌对的观众需要修辞。","Having concepts, the mind puts them together or holds them apart — the tradition’s phrase is that it":"有了概念，头脑就会将它们组合在一起或分开——传统的说法是，它","The doing is the same doing; only its place in time has moved. Carrying time is the verb’s own work.":"做事就是做同样的事；只是它的时间位置发生了变化。携带时间是动词自己的工作。","Certainty is demonstration’s work, persuasion is rhetoric’s, and a fitting story belongs to poetics.":"确定性是论证的工作，说服是修辞的工作，合适的故事属于诗学。","If reason is what marks man off, then the art that perfects reason bears on everything he does well.":"如果说理性是人的标志，那么完善理性的艺术则影响到他所做的一切。","They are not confined to grammar, nor to Latin, and rhetoric uses them only because logic does first.":"它们并不局限于语法，也不局限于拉丁语，修辞学使用它们只是因为逻辑首先使用它们。","names one particular city and takes a capital letter. The others name kinds, and can be said of many.":"命名一个特定的城市并采用大写字母。其他的名称有多种，而且可以说有很多。","in its fullest sense: knowledge of the reasoned fact, the very goal toward which the exercises point.":"其最完整的意义是：对推理事实的了解，即练习所指向的目标。","An adjective tells what sort of thing the noun refers to, so it must have a naming word to attach to.":"形容词告诉名词指的是哪一类事物，因此它必须有一个附加的命名词。",". It affirms or denies one concept of another, forming a proposition (a statement that makes a claim).":"。它肯定或否定另一个概念的一个概念，形成一个命题（提出主张的陈述）。","A and E shade a region empty; I and O plant an × to say something is there. Two marks do all the work.":"A 和 E 将区域遮蔽为空；我和 O 画一个 × 来表示那里有东西。两个标记即可完成所有工作。","Motion, time and person are all bound up with the verb, but none of them is what the Latin word means.":"动作、时间和人称都与动词联系在一起，但它们都不是拉丁词的意思。","Form is the arrangement of the terms; matter is whether what the premises say is so. You weigh both in":"形式是词项的排列；问题在于前提是否如此。你权衡两者","stands before a noun and subordinates that noun to something else in the sentence. With the noun alone:":"位于名词之前，并使该名词从属于句子中的其他事物。单独使用名词：","Before logic we must study grammar. The old course of study put three arts together and called them the":"在逻辑之前我们必须学习语法。旧学将三艺合而为之，称为“三艺”。","Shading declares a region empty. An × does the opposite, and what is left plain the diagram leaves open.":"阴影声明区域为空。 × 则相反，图表中剩下的部分是开放的。","If nothing is both, the lens where the circles meet must be declared empty — which is what shading does.":"如果两者都没有，则圆圈相交处的透镜必须被声明为空——这就是阴影的作用。","Length and writing are accidents; and single words have meaning in plenty — what they lack is assertion.":"篇幅和写作都是偶然的；单个词有很多意义——它们缺乏的是断言。",". That is why the verb carries time and the noun does not: time belongs to what becomes and is in motion.":"。这就是为什么动词带有时间而名词不带有时间：时间属于正在发生和正在运动的事物。","Words, letters and paragraphs are the concern of grammar and of style; logic fastens on what is asserted.":"单词、字母和段落是语法和风格的关注点；逻辑依赖于所断言的内容。","Shading a region declares it empty, so an × in the lens is the only way to assert that something is both.":"对一个区域施加阴影表明它是空的，因此镜头中的×是断言某物既是又是的唯一方法。","The word is narrower than the English “science.” It means knowledge of what could not have been otherwise.":"这个词比英语的“科学”更窄。它意味着了解否则不可能发生的事情。","They did not set out to teach children, to catalogue Latin afresh, or to settle which language came first.":"他们并没有打算教孩子们，重新编目拉丁语，或者确定哪种语言优先。","Demonstration proves through the proper cause, and its conclusion cannot be otherwise. The rest reach less.":"论证是通过正当理由来证明的，其结论不可能是其他的。其余的则较少。","Politeness and padding are no reasons at all, and both writers disagree with their predecessors constantly.":"礼貌和填充根本不是理由，两位作家都不断地与前人意见相左。","Simple apprehension: the mind takes in what a thing is, before anything at all is affirmed or denied of it.":"简单的理解：在任何事物被肯定或否定之前，心灵就先了解它是什么。",". The four categorical forms — universal or particular, affirmative or negative — are each drawn like this:":"。四种范畴形式——普遍的或特殊的、肯定的或否定的——各自绘制如下：","The first act grasps a single thing and asserts nothing; the third moves between propositions already made.":"第一幕抓住了单一的事物，没有断言什么；已经提出的建议之间的第三步。","Odds are beside the point; a rough proof is still a proof; and one man’s view may be refused without shame.":"赔率不是重点。粗略的证明仍然是证明；一个人的观点可以被拒绝而不会感到羞耻。","Forming sentences is grammar, drawing conclusions is logic, and memorising is no art of the trivium at all.":"造句是语法，得出结论是逻辑，记忆根本不是三门艺术。","Emptiness is what shading declares; the diagram never expresses uncertainty; and no region is a conclusion.":"阴影所宣告的是空虚；该图从不表达不确定性；没有一个地区是一个结论。","The history of a thing belongs to the study of that thing, and it is of real use to the one who studies it.":"一个事物的历史属于对该事物的研究，对于研究它的人来说，它才是真正有用的。","Grammar forms the sentence and logic tests the argument; neither of them is aimed at moving another person.":"语法构成句子，逻辑检验论证；两者的目的都不是为了感动另一个人。","Neither article goes with a verb, both go with singular nouns here, and the difference is real and constant.":"这两个冠词都没有动词，这里都带有单数名词，区别是真实且恒定的。","in front, and describing are all things a noun or an adjective can do. Only the verb has time built into it.":"前面的和描述的都是名词或形容词可以做的事情。只有动词才有时间。",", after demonstration and dialectic — you must know good reasoning before you can recognise the counterfeit.":"，经过论证辩证——你必须懂得道理，才能辨认出赝品。","A past tense belongs to the verb; syllables are irrelevant; and a noun may stand on either side of the verb.":"过去时态属于动词；音节无关；名词可以位于动词的两侧。","Each art supplies the matter the next one works upon. Logic works on statements; rhetoric works on arguments.":"每一种艺术都为下一种艺术提供了素材。逻辑适用于陈述；修辞作用于论点。","The conclusion follows from the meaning alone. Whether the premises happen to be true is a separate question.":"结论仅根据含义得出。前提是否恰好为真是一个单独的问题。","the conditional. The conjunction helps to determine the truth or falsity of the compound proposition it forms.":"有条件的。连词有助于确定它所形成的复合命题的真假。","Bad grammar never entails falsity, the grammar here is plainly broken, and the sense is clear enough to judge.":"糟糕的语法永远不会带来虚假，这里的语法显然是错误的，而且意义足够清晰，足以判断。","Literature at its height hands on the deepest truths of how to live, indirectly, by beautifully wrought story.":"文学在其鼎盛时期，通过精美的故事间接传达了如何生活的最深刻的真理。","Where proof cannot settle it and the reasons are near to balanced, we incline a hearer toward the better view.":"当证据无法解决问题且原因接近平衡时，我们会倾向于听众采取更好的观点。","Latin has no fewer words than English and certainly has verbs; and its sentences are often longer, not shorter.":"拉丁语的词汇量并不比英语少，当然也有动词。而且它的句子往往较长，而不是较短。","The two great modes of signifying answer to the two great ways things present themselves — at rest and in flow.":"这两种伟大的意指模式回应了事物呈现自身的两种伟大方式——静止和流动。","There are three ways of considering anything that we may wish to speak of. Take a thing — say, a running horse.":"我们可以通过三种方式来考虑我们想要谈论的任何事情。拿一个东西来说——比如说，一匹奔跑的马。","— there really are men, dogs, triangles — so a universal already carries existence with it — the term of art is":"——确实有人、狗、三角形——所以普遍性已经带着存在——艺术这个术语是","Length and endings are beside the point, and in English the adjective usually comes before the noun, not after.":"长度和结尾不是重点，在英语中形容词通常出现在名词之前，而不是之后。","presents it as something under way. The same thing is under consideration, but through two modes of signifying.":"将其呈现为正在进行的事情。人们正在考虑同一件事，但通过两种表示方式。","Reasoning, the third act. It is the whole reason logic is worth having: it gets you somewhere you had not been.":"推理，第三幕。这就是逻辑值得拥有的全部原因：它能带你到达你从未去过的地方。","What is laid underneath is the subject; pointing is the article’s work; standing in for a noun is the pronoun’s.":"下面是主题；指出是文章的工作；代替名词的是代词's。","Nouns have number; pronouns as well as verbs have person; and gender, where a language has it, belongs to nouns.":"名词有数；代词和动词都有人称；而性别，只要语言有性别，就属于名词。","Empty would need shading and occupied would need an ×; and a diagram may be complete and still leave much unsaid.":"空的需要阴影，占用的需要×；图表可能已经完成，但仍有很多未说的内容。",", thrown-toward) depends on a noun and tells what sort of thing the noun refers to, among what it could refer to:":"、 throw-toward) 取决于一个名词，并告诉该名词所指的是哪类事物，以及它可以指代的事物：","Length and position are accidents of no logical weight, and either sort of noun may be the subject of a sentence.":"长度和位置是没有逻辑分量的偶然事件，任何一种名词都可以作为句子的主语。","Dialectic is the art of reasoning well about the probable, where we have evidence on each side but not yet proof.":"辩证法是对可能性进行推理的艺术，我们双方都有证据，但还没有证据。","The modern senses of “case” as a box or a matter in hand are later; a rule and a place are other things entirely.":"“箱子”的现代意义是一个盒子或手中的东西，这是后来出现的。规则和地点完全是另外一回事。","This is why the verb carries time: what becomes and is in motion is measured by time, and the verb must say when.":"这就是为什么动词带有时间的原因：发生的事情和正在发生的事情是用时间来衡量的，动词必须说何时。",". Single words are not true or false. Only when a naming word and a verb are joined does truth or falsity appear.":"。单言无真假之分。只有当一个命名词和一个动词连接起来时，真实或虚假才会出现。","Poetics proposes what is merely possible, rhetoric inclines, dialectic reaches the probable — each short of proof.":"诗学提出了仅仅可能的东西，修辞倾向于，辩证法达到了可能的目的——每一个都缺乏证据。","Being belongs to the thing and understanding to the mind. The three are ordered, not held all at once by the word.":"存在属于事物，理解属于心灵。这三者是有秩序的，而不是一言以蔽之。","In every complete sentence something is talked about, and something is said about it. The part talked about is the":"每一个完整的句子都在谈论某件事，并且谈论它。谈到的部分是",". The others are pieces — you can neither agree nor disagree with them. Truth first appears when something is said":"。其他的都是碎片——你既不能同意也不能不同意。当某事被说出时，真相首先出现","Doing belongs to the verb, and joining to the conjunction; a place is only one of the many things a noun may name.":"Doing 属于动词，join 属于连词；地点只是名词可以命名的众多事物之一。","Their doctrine turns on three modes — of being, of understanding, and of signifying — and the name follows from it.":"他们的学说以三种模式为基础——存在、理解和表示——而名字也由此而来。","Dialectic does not deal in what is already demonstrated, nor in what is known false, nor in what is merely imagined.":"辩证法不处理已经被证明的东西，也不处理已知的错误的东西，也不处理仅仅想象的东西。","The subject, the length, and the wording may all vary without touching either the form or the truth of the premises.":"主题、长度和措辞都可能有所不同，但不会影响前提的形式或真实性。","The order is neither historical nor a ranking of difficulty or importance; it follows from what each art works upon.":"该顺序既不是历史性的，也不是难度或重要性的排名；它源于每一种艺术的创作原理。","It is primarily an art — reasoning well — and secondarily a science of the very acts the mind performs as it reasons.":"它首先是一门艺术——良好的推理——其次是一门关于大脑在推理时所执行的行为的科学。","does the opposite — it declares that at least one thing falls there. Whatever is left plain, the diagram leaves open.":"则相反——它声明至少有一个东西落在那里。无论剩下什么，图表都是开放的。","All three are in the present, so tense is unchanged; all are singular, so number is unchanged; and none marks gender.":"这三个词都是现在时，所以时态没有改变；都是单数，所以数量不变；并且没有标记性别。","Replacing is the pronoun’s work, joining equals is the conjunction’s, and telling which one is meant is the article’s.":"替换是代词的工作，加入等号是连词的工作，而分辨出哪个是冠词的工作。","If the class may be empty, “All S are P” no longer guarantees that any S exists, and the step to “Some S are P” fails.":"如果类可能为空，“所有 S 都是 P”不再保证任何 S 存在，并且“某些 S 是 P”步骤失败。","The joining together of a word that names with a verb — where truth first becomes possible — is which act of the mind?":"将一个与动词命名的单词连接在一起——真理首先成为可能——是哪种心灵行为？","Yes. To compose is to affirm, to divide is to deny; either way the second act makes a statement that is true or false.":"是的。写是肯定，分是否定；无论哪种方式，第二幕都会做出正确或错误的陈述。","Grammar guarantees the form and stops there. Whether the moon is in fact made of cheese is not a grammatical question.":"语法保证了形式并就此止步。月亮是否真的是由奶酪制成并不是一个语法问题。","A noun is a naming word — of a person, a place, a thing, or something you cannot sense, such as an idea or a property.":"名词是一个命名词——一个人、一个地方、一个事物或你无法感知的东西，比如一个想法或一个属性。","What is demonstrated needs no persuading; counting settles itself; and rhetoric is by definition addressed to somebody.":"所展示的内容无需说服；计数会自行解决；修辞根据定义是针对某人的。","of a word — not accidents in the sense of mishaps, but things a word can take on or lose while remaining the same word.":"一个词的含义——不是不幸意义上的意外，而是一个词在保持同一个词的情况下可以承受或失去的东西。",", a word — as though the primary word were really the word for action, the verb) says what is done or what is going on:":"，一个词——就好像主要词实际上是表示行动的词，动词）表示已完成的事情或正在发生的事情：","It is not a matter of vocabulary, of missing premises, or of hidden questions — those are other faults with other names.":"这不是词汇量、前提缺失或隐藏问题的问题——这些都是其他名称的错误。","signifies its thing in the manner of something standing still, or stable — Thomas of Erfurt says that the noun signifies":"以静止或稳定的方式表示其事物——爱尔福特的托马斯说，该名词表示","To call them arbitrary is the conventionalism the modists opposed; and the account is meant to hold of language as such.":"称它们为任意的，是现代主义者所反对的约定主义。该帐户旨在保留语言本身。","Because the term is taken to stand for real things, the universal carries existence with it, and the particular follows.":"因为这个词代表真实的事物，普遍性伴随着存在，特殊性随之而来。","You see the effect and reason back: the ground is churned, so an army passed. Certain that it is so, though not yet why.":"你会看到结果和原因：地面被搅动，所以一支军队过去了。确实如此，但还不清楚为什么。","Every discipline studies how its own objects have changed over time. The oceans’ past belongs to the study of the oceans.":"每个学科都研究其自身的对象如何随着时间的推移而变化。海洋的过去属于海洋研究。","Certainty comes last, not first. Reverse the order and you would be demonstrating before you had anything to demonstrate.":"确定性是最后的，而不是第一位的。颠倒顺序，你就会在有任何东西要演示之前就进行演示。","To call them wholly conventional is just the view the modists opposed; and the point is not confined to any one language.":"称它们为完全传统的正是调制派所反对的观点。而且这一点并不局限于任何一种语言。","Truth and consequence are logic’s business; persuasion is rhetoric’s. Grammar goes only as far as the well-made sentence.":"真理和结果是逻辑的事；说服是修辞的。语法只限于造句精良的句子。","It is the same sense of the word as among the predicables: an accident may come or go while the thing remains what it is.":"这个词的含义与谓词中的含义相同：事故可能会发生或消失，而事物仍保持原样。","The subject is what is laid under the statement — the thing talked about, on which everything else in the sentence rests.":"主语是陈述中的内容——所讨论的事物，句子中的其他所有内容都依赖于此。","Words are not fixed to one function; the point holds in English as much as in Latin; and length has nothing to do with it.":"词语并不固定于一种功能；这个观点在英语和拉丁语中同样成立；和长度无关。","Modifying neither replaces nor moves the word, and the change of ending is a matter of the accidents, not of modification.":"修改既不取代字，也不移动字，结尾的改变是偶然的，而不是修改的。","The mirror is a real mirror, but not a perfect one. Two expressions built alike can name utterly different sorts of thing.":"镜子是一面真正的镜子，但不是完美的镜子。两个构造相似的表达式可以命名完全不同的事物。","The running is one and the same, the runners are not in question, and something has plainly changed between the two forms.":"跑步是一回事，跑步者没有问题，两种形式之间明显发生了一些变化。",", where two words that have the same form and grammar as words are taken to draw their meaning from things in the same way.":"，其中两个与单词具有相同形式和语法的单词被用来以相同的方式从事物中提取它们的含义。","History as a discipline of its own chiefly means the affairs of our human community; and the question is not left homeless.":"历史作为一门独立的学科，主要意味着我们人类社会的事务；问题并不在于无家可归。","Adverbs depend on verbs and on adjectives; and a preposition is itself a subordinating word, not something to be qualified.":"副词依赖于动词和形容词；介词本身就是一个从属词，而不是被限定的东西。","Arithmetic, geometry and music belong to the quadrivium; poetry, law, physics and ethics are not arts of the trivium at all.":"算术、几何和音乐属于四科；诗歌、法律、物理学和伦理学根本不是三门艺术。","Everything in these exercises is ordered to the proposition — what it asserts, whether it is true, and what follows from it.":"这些练习中的一切都按照命题排序——它主张什么，它是否正确，以及由此得出的结论。","It is the reverse motion to rhetoric: rhetoric goes out from the speaker, hermeneutics comes back from the words of another.":"这是修辞学的反向运动：修辞学从说话者那里发出，解释学从另一个人的话语中回来。","The man may very well have gone to the store. Broken grammar makes a sentence hard to work with; it does not make it untrue.":"该男子很可能去了商店。语法错误使得句子难以使用；这并不意味着它不真实。","True or false: composing and dividing — affirming or denying one thing of another — is the second operation, called judgment.":"对或错：组合和划分——肯定或否定一件事或否定另一件事——是第二个操作，称为判断。","Two nouns side by side assert nothing, nor do two adjectives; and a preposition with a noun gives only a phrase, not a claim.":"两个并排的名词没有任何断言，两个形容词也没有断言。带有名词的介词仅给出一个短语，而不是一个主张。","A list of words would break down at once, since one word may serve twice; endings and sentences are other matters altogether.":"一个单词列表会立刻崩溃，因为一个单词可能出现两次；结尾和句子完全是另一回事。","Demonstration reaches science; dialectic reaches opinion held for good reasons. Knowing which you are doing keeps you honest.":"论证达到科学；辩证法得出的观点是有充分理由的。知道自己在做什么可以让你保持诚实。",": language is the first and highest tool of reason, and it is language one wields in every exercise. Begin when you are ready.":"：语言是理性的第一个也是最高的工具，它是人们在每次练习中运用的语言。准备好后就开始吧。","Effect to cause is demonstration of the fact; likeness and authority are topics of dialectic, which reaches only the probable.":"果对因是事实的证明；相似性和权威性是辩证法的主题，它只触及可能的情况。","The grammar of the famous example is faultless, each word in its right place. It is not an argument at all, and it has a verb.":"这个著名例子的语法是完美的，每个单词都在正确的位置。它根本不是一个论证，它有一个动词。","A term said of many is universal; a term said of one is singular. Nearly every rule of the syllogism turns on that difference.":"表示“许多”的术语是通用的；指一个人的术语是单数的。几乎三段论的每条规则都以这种差异为基础。","by itself names nothing; it needs a noun to be combined with. The medieval schools said that the adjective signifies a quality":"其本身并无名称；它需要一个名词来组合。中世纪学派说这个形容词表示一种品质","is the art of coming to understand someone else’s words — their truth, their form, and how they relate to the speaker’s goals.)":"是理解别人话语的艺术——它们的真相、它们的形式，以及它们如何与说话者的目标联系起来。）","The first two furnish the materials without moving beyond them, and if logic reached nothing new there would be no point to it.":"前两者提供了材料，但没有超越它们，如果逻辑没有达到新的目的，那么它就没有意义了。","Starting from what we see is a convenience, not a perfection; the two are not equal; and both yield certainty, not probability.":"从我们看到的开始是一种方便，而不是完美；两者并不相等；两者都产生确定性，而不是概率。","Truth of premises is the argument’s matter, not its form; order does not affect what follows; and no dictionary will settle it.":"前提的真实性是论证的内容，而不是其形式；顺序不影响后续内容；没有任何字典可以解决这个问题。","depends on a verb or on an adjective, and says how, when, or where the verb takes place, or how the adjective applies to a noun:":"取决于动词或形容词，表示动词如何、何时或何地发生，或者形容词如何应用于名词：","Greek precedent, sentence length, and the order in which children learn are all beside the point: the reason lies in the things.":"希腊先例、句子长度以及孩子们学习的顺序都不是重点：原因在于事物。","The hearer supplies the missing premise himself, which is part of what makes it persuasive — and part of what makes it dangerous.":"听者自己补充了缺失的前提，这是使其具有说服力的部分原因，也是使其危险的部分原因。","The order is not one of difficulty or of history, and logic has rules in abundance; the order follows from what logic works upon.":"这个顺序不是困难的，也不是历史的，逻辑有丰富的规则；顺序遵循逻辑的运作方式。","The mind grasps the horse as something stable, with an essence, and the running as something happening with respect to the horse.":"头脑将马视为某种稳定的、具有本质的东西，而将奔跑视为与马有关的事情。","Rhetoric is the art of bringing another person to see what is so. It comes third because there is no persuading without arguments.":"修辞是一门让他人了解真相的艺术。它排在第三位是因为没有论证就没有说服力。","Grammar and logic stop short of the other person; hermeneutics runs the other way, from another’s words toward understanding them.":"语法和逻辑都跟不上对方；解释学则相反，从他人的话语到理解它们。","The first operation, simple apprehension, is the bare grasp of what a thing is, before anything at all is affirmed or denied of it.":"第一个操作，简单的理解，是在任何事物被肯定或否定之前，对事物的本质的简单理解。","— by fitting examples, the character of the speaker, the circumstances, even the hearer’s feelings. This part of logic is rhetoric.":"——通过恰当的例子，讲述说话者的性格、当时的情况，甚至听话者的感受。这部分逻辑就是修辞。","Length and position are accidents of the sentence, not of what the words signify — and the difference is the deepest one in the art.":"长度和位置是句子的偶然，而不是单词的含义——而这种差异是艺术中最深刻的差异。","It is not a branch of mathematics, and it is not confined to proofs or to speech-making — those are parts of it or neighbours to it.":"它不是数学的一个分支，也不局限于证明或演讲——这些是它的一部分或邻居。","something is so, often reasoned from an effect or a sign. It does not yet lay bare the proper cause; that is the work of demonstration":"事情就是这样，通常是根据效果或标志来推理的。目前还没有揭示正确的原因；这就是示范工作","of our reasoning — “everyone does it, so it must be good.” The study of these typical errors is the study of fallacies, in Aristotle’s":"我们的推理是——“每个人都这样做，所以它一定是好的。”对这些典型错误的研究就是对谬误的研究，在亚里士多德的著作中","Two concepts have been separated and the separation asserted. That is judgment, and it is the sort of thing that can be true or false.":"两个概念已经被分离并且这种分离被断言了。这就是判断，它是一种可以是真也可以是假的东西。","the conclusion holds. The last option describes demonstration of the fact, which runs the other way — from effect or sign to the fact.":"结论成立。最后一个选项描述了事实的证明，它以另一种方式运行——从效果或符号到事实。","We begin knowing little and propose an account; find reasons to prefer one; reach what is probable; and at last demonstrate the cause.":"我们开始了解甚少，并提出了一个解释；找到选择其中一个的理由；达到可能的程度；并最后论证原因。","Medicine aims at health and is also a science of the body. Logic aims at reasoning well and is also a science of the mind’s operations.":"医学以健康为目的，也是一门研究身体的科学。逻辑旨在进行良好的推理，也是一门关于思维运作的科学。","An × in the lens asserts the contrary; shading the whole of S would say there are no S at all; and nothing is drawn outside the circles.":"镜头中的 × 表示相反的情况；将整个 S 涂上阴影就表示根本不存在 S；圆圈之外没有绘制任何内容。","its premises are true, its conclusion must be true as well. The form alone guarantees that truth is carried from premises to conclusion.":"它的前提是正确的，它的结论也必须是正确的。形式本身就保证了从前提到结论的真实性。",". Hold on to that distinction: logic uses it constantly, because a common noun can be said of many things and a proper noun of only one.":"。坚持这种区别：逻辑经常使用它，因为一个普通名词可以表示许多事物，而一个专有名词只能表示一个事物。","Verbs are not longer than nouns, endings are a feature of the language rather than the reason, and word order settles nothing about time.":"动词并不比名词长，词尾是语言的特征而不是原因，词序与时间无关。","Custom and convenience would make grammar arbitrary, which is the view they were arguing against; the alphabet has nothing to do with it.":"习惯和方便会使语法变得任意，这是他们所反对的观点；字母表与它无关。","Grammar cannot tell you what is true; but it supplies the well-formed sentence, without which there is no determinate proposition to test.":"语法无法告诉你什么是真实的；但它提供了结构良好的句子，没有这个句子就没有确定的命题可供检验。","Roman decision and convenience are versions of the conventionalism they rejected; and logic follows grammar here rather than dictating it.":"罗马人的决定和便利是他们所拒绝的传统主义的版本。这里逻辑遵循语法而不是命令语法。","They are not errors, they are not confined to Latin, and they matter a great deal — they are simply not what makes the word the word it is.":"它们不是错误，它们并不局限于拉丁语，而且它们非常重要——它们根本不是使这个词成为这个词的原因。","Length and spelling are unchanged between the two sentences, and the difference survives perfectly well in writing, where there is no tone.":"两个句子的长度和拼写没有变化，而且在没有语气的书面形式中，这种差异仍然存在。","Traditional logic presumes every general term stands for real things — there are dogs — which is why a universal carries existence with it.":"传统逻辑假定每个通用术语都代表真实的事物——有狗——这就是为什么普遍性伴随着存在。","Mere information may be shaky; modern science is one field among many; and well-supported opinion is exactly what dialectic reaches instead.":"单纯的信息可能是不可靠的；现代科学只是众多领域之一；而有充分支持的观点正是辩证法所达到的目的。","Change over time is beside the point, grammar plainly has rules, and denying that things have natures would undo the modist claim altogether.":"随着时间的推移而发生的变化不是重点，语法显然有规则，否认事物具有本质就会完全推翻现代主义的主张。","From the barest possibility (poetics), through persuasion (rhetoric) and the probable (dialectic), to proof through the cause (demonstration).":"从最基本的可能性（诗学），通过说服（修辞学）和可能（辩证法），到通过原因进行证明（论证）。","until something is shown to fall within it, and so denies that step. This course follows the classical way: every term stands for real things.":"直到有东西被证明落入其中，因此否认了这一步。本课程遵循经典方式：每个术语都代表真实的事物。","there. With these one sees at a glance what a proposition includes, what it excludes, and whether a thing with a given property exists or not.":"那里。通过这些，人们可以一眼看出一个命题包括什么、排除什么，以及具有给定属性的事物是否存在。","The time is the same in both, so tense has not moved; English marks no gender here; and case belongs to nouns and pronouns, not to this change.":"两者时间相同，所以时态没有移动；英语在这里不区分性别；而格属于名词和代词，不属于这种变化。","It is neither the first act, which grasps a single thing, nor the third, which moves between statements — and it is certainly one of the three.":"它既不是抓住单一事物的第一幕，也不是在陈述之间移动的第三幕——而且它肯定是三者之一。","is settled by custom. That there should be naming words at all is not: things really are various ways, and words must signify them as they are.":"是按习惯解决的。根本不应该给词语命名：事物确实有各种各样的方式，词语必须按其本来面目来表示它们。","Logic works upon statements and so needs them well made; the point holds in every language, and rhetoric depends on both of the arts before it.":"逻辑依赖于陈述，因此需要精心设计；这一观点适用于所有语言，而修辞学则依赖于它之前的两种艺术。","Why does every language have a noun and a verb? Because everything we meet is either stable or going on — and words must signify it accordingly.":"为什么每种语言都有名词和动词？因为我们遇到的一切要么是稳定的，要么是持续的——而言语必须相应地表达它。","— to make sense of what little we know, and to teach others who cannot yet follow an argument. This part of logic is poetics, and at its height,":"——理解我们所知甚少的知识，并教导那些尚不能理解论证的人。这部分逻辑是诗学，在其高度，","Words and sentences have to signify things as they are; and since things really are various ways, the general rules of universal grammar follow.":"单词和句子必须按事物本来的样子来表示；由于事物确实有多种多样的方式，因此通用语法的一般规则如下。","for the premises to be true while the conclusion is false. Whether the premises happen to be true is a separate question — that is the argument’s":"前提为真而结论为假。前提是否恰好为真是一个单独的问题——这是论证的问题","Children understand words perfectly well, stories are usually longer than arguments, and this is a way of answering the question, not dodging it.":"孩子们完全理解单词，故事通常比争论长，这是回答问题而不是回避问题的一种方式。","Seeing how a distinction was arrived at is a large part of understanding it. The history is not decoration; it is the first stage of the inquiry.":"了解这种区别是如何产生的是理解它的一个重要部分。历史不是装饰，而是历史。这是调查的第一阶段。","At the very beginning of an inquiry, where little is known, we propose a possible account — often a story — to make sense of what little we have.":"在调查一开始，我们所知甚少，我们会提出一个可能的解释——通常是一个故事——来理解我们所拥有的一切。","Even were it true that everyone does it, nothing about its goodness follows. The fault is in the shape of the argument, not in any single premise.":"即使每个人都这么做，也并不能说明其好处。错误在于论证的形式，而不是任何单一的前提。","This is the first of the three things that serve the rest of the course of study, and it is what makes grammar worth the trouble of learning well.":"这是为余下的学习课程服务的三件事中的第一件事，也是语法值得不辞辛劳学好的原因。","A free mode of signifying would make grammar arbitrary; and the mind is not bypassed, since the word signifies the thing as the mind has taken it.":"自由的意指模式将使语法变得任意；头脑并没有被绕过，因为这个词所指的是头脑所接受的事物。","Grammar cannot reach truth or falsity, a single statement is not an argument, and the sentence means something perfectly clear — something untrue.":"语法无法达到真或假，单一陈述不是论证，句子意味着完全清楚的东西——不真实的东西。","They took the rules as given and asked what accounts for them — and why every language should have something like a noun and something like a verb.":"他们认为这些规则是给定的，并询问是什么解释了这些规则——以及为什么每种语言都应该有像名词和动词这样的东西。","It does not stop at the probable, does not work by feeling, and does not run from sign back to fact — that last is the other kind of demonstration.":"它不会停留在可能性上，不会凭感觉起作用，也不会从符号回到事实——最后是另一种论证。","The name was given as though the word for action were the word above all others. It is at least the only part of speech that carries time in itself.":"这个名字的命名就好像“行动”这个词高于其他所有词一样。它至少是唯一本身带有时间的词类。","Understanding belongs to the mind and signifying to the word; and if all three belonged to the word, grammar would answer to nothing outside itself.":"理解属于头脑，意指属于言语；如果这三个都属于这个词，那么语法就无法回答其本身以外的任何问题。","makes a proposition visible. Each circle stands for a term; where circles overlap lie the things that fall under both. Two marks do all the work: to":"使一个提议变得可见。每个圆圈代表一个术语；圆圈重叠的地方就是属于两个圆圈的东西。两个标记即可完成所有工作：","Grammar makes the sentence well formed; logic asks whether the proposition is true and what follows from it; rhetoric brings another person to see it.":"语法使句子结构良好；逻辑询问命题是否正确以及由此得出的结论；修辞让另一个人看到它。","Most inquiries never reach demonstration and are not thereby worthless; the four apply within one and the same subject; and they are plainly distinct.":"大多数询问从未得到证实，因此并非毫无价值；这四者适用于同一主题；它们是明显不同的。",", the parts of speech are not an arbitrary list to memorise. They answer to real differences in things, or in how we understand, or in how we signify.":"，词性不是一个需要记忆的任意列表。它们回答了事物中的真正差异，或者我们如何理解，或者我们如何表达的差异。",": a body of sure knowledge about the operations of the mind. Compare medicine, whose goal is health (an art), yet which is also a science of the body.":"：关于心灵运作的可靠知识体系。比较一下医学，其目标是健康（一门艺术），但同时也是一门关于身体的科学。","Language is grammar’s concern; certainty belongs to demonstration, only one part of logic; and debate is the business of dialectic, again only a part.":"语言是语法的关注点；确定性属于论证，只是逻辑的一部分；辩论是辩证法的事，但也只是一部分。","Soundness requires both good form and true premises; the form here is not at fault, so it is not invalid; and it is an argument, merely a failing one.":"健全性需要良好的形式和真实的前提；这里的表格没有错误，所以它不是无效的；这只是一种论证，只是一个失败的论证。","The way the thing is is the mode of being; the way the word signifies is the mode of signifying; the arrangement of the sentence is not a mode at all.":"事物的存在方式就是存在的方式；这个词所表示的方式就是表示方式；句子的排列根本就不是一种模式。","This is why logic is more general than any given language. If grammar were determined purely by custom, the translation would lose something essential.":"这就是为什么逻辑比任何给定语言都更通用的原因。如果语法纯粹由习惯决定，翻译就会失去一些本质的东西。","The same word can perform different functions in different sentences, so the list cannot be a list of words. It divides up the work, not the vocabulary.":"相同的单词在不同的句子中可以执行不同的功能，因此该列表不能是单词列表。它划分的是工作，而不是词汇。","are the two terms of every proposition. And the joining together of a word that names with a verb — which is where truth first becomes possible — is the":"是每个命题的两个项。将一个带有动词的单词连接在一起——这是真理首先成为可能的地方——就是","Judgment joins two concepts and asserts something; reasoning moves from statements already held to a new one. Neither is the bare grasp of a single thing.":"判断将两个概念结合起来并断言某事；推理从已有的陈述转向新的陈述。仅仅掌握单一事物也不是。","— true for the most part — weighing the arguments on each side and the opinions of those who know. This part of logic is dialectic, treated in Aristotle’s":"——在大多数情况下是正确的——权衡双方的论点和知情者的意见。这部分逻辑是辩证的，在亚里士多德的著作中进行了处理","The word’s own manner of presenting the thing — as at rest, or as in flow — is its mode of signifying, and it takes its shape from the two modes before it.":"这个词本身呈现事物的方式——静止的或流动的——就是它的表示模式，它的形状来自于它之前的两种模式。","Demonstration of the fact yields real certainty, not a guess and not a speech; and knowledge of the proper cause belongs to the other kind of demonstration.":"对事实的论证产生真正的确定性，而不是猜测或演讲；而正当因的知识则属于另一种论证。","That the premises happen to be true is a separate question — the argument’s matter. And a conclusion’s truth never runs backwards to guarantee its premises.":"前提恰好为真是一个单独的问题——论证的问题。结论的真理永远不会倒退以保证其前提。","Grammar considers to what extent a sentence is well formed. Logic takes the proposition the sentence expresses and asks after its truth and its consequences.":"语法考虑句子的结构良好程度。逻辑接受句子所表达的命题，并询问其真实性及其后果。","If they answered only to custom, every language might have had wholly different parts of speech. That they do not is the fact the modists set out to explain.":"如果它们只符合习惯，每种语言可能会有完全不同的词类。但他们并没有这样做，这正是现代主义者试图解释的事实。",", the mode of understanding. The mind grasps the horse as something stable, with an essence, and the running as something happening with respect to the horse.":"，理解方式。头脑将马视为某种稳定的、具有本质的东西，而将奔跑视为与马有关的事情。","Grammar mirrors reality, but the mirror is imperfect. Two words that have the same form and grammar may draw their meaning from things in quite different ways.":"语法反映了现实，但镜子并不完美。具有相同形式和语法的两个单词可能会以完全不同的方式从事物中获取含义。","Put signifying first and you would be saying that words decide how things are. The mind cannot come before the thing it grasps, nor the word before the thought.":"把意义放在第一位，你会说词语决定事物的本质。头脑不能先于它所掌握的事物，也不能先于词语先于思想。","A verb alone leaves the thing unnamed, just as a noun alone leaves you waiting for what is done. Neither is a complete thought, and neither can be true or false.":"单独一个动词会让事情变得未命名，就像单独一个名词会让你等待完成的事情一样。两者都不是完整的思想，也不可能是真或假。","Noun and verb are parts of speech, not terms of a proposition; premise and conclusion are whole propositions; and article and adjective are modifiers, not terms.":"名词和动词是词性，而不是命题术语；前提和结论是完整的命题；冠词和形容词是修饰语，而不是术语。","The horse really is a stable thing and its running really is going on, whether or not anybody notices or names it. These facts are due not to us but to the world.":"马确实是一个稳定的东西，它确实在奔跑，无论是否有人注意到或命名它。这些事实不是我们的责任，而是世界的责任。","If you do not know what a word is doing in a sentence, you cannot say what a proposition asserts — and the proposition is the centre of the whole course of study.":"如果你不知道一个词在句子中的作用，你就无法说出一个命题主张什么——而命题是整个学习过程的中心。",", grammar mirrors reality, but the mirror is imperfect, and you must never argue directly from a word as a word to the way things are. That error is the fallacy of":"，语法反映了现实，但是镜子是不完美的，你绝对不能直接从一个词作为一个词来争论事物的本来面目。该错误是以下谬误","Logic is not the property of scholars; the beasts are marked off precisely by lacking reason; and a faculty can be used well or badly, which is why it needs an art.":"逻辑不是学者的财产，而是学者的财产。这些野兽正是因为缺乏理性而被区别开来的。一种能力可以用得好也可以用坏，这就是为什么它需要一门艺术。","Simple apprehension grasps a single thing; judgment joins two concepts; and definition, though it is a work of logic, does not draw a new statement out of old ones.":"简单的理解抓住单一的事物；判断将两个概念结合起来；定义虽然是逻辑性的工作，但并不能从旧的陈述中推导出新的陈述。","dogs — which is why a universal carries existential import, and “All S are P” yields “Some S are P.” Modern set theory allows empty classes and drops that inference.":"狗——这就是为什么普遍性具有存在意义，而“所有 S 都是 P”会产生“有些 S 是 P”。现代集合论允许空类并放弃该推论。","Reasoning, the third act, derives a fresh proposition from those already granted. In this course those three are named the First, Second, and Third Acts of the Mind.":"推理是第三幕，它从那些已经被认可的命题中得出一个新的命题。在本课程中，这三个行为被称为“心灵的第一行为”、“第二行为”和“第三行为”。","Being is first; understanding is drawn from how things are; and signifying brings this to the mind, for oneself and for others. Each mode is based on the one before.":"存在是第一；理解源自事物的本来面目；意指将这一点带入脑海，为自己和他人。每种模式都基于之前的模式。","The modists showed that grammar answers to how things are. The fallacies remind you that it answers imperfectly, and that the form of a word is not proof of anything.":"模组论者表明语法可以回答事物的本来面目。这些谬误提醒你，它的答案并不完美，而且单词的形式并不能证明任何事情。","The noun holds its thing still as an entity under consideration; the verb has it happening. This is the seed of the medieval account given at the end of this introduction.":"名词将其事物作为一个正在考虑的实体保持静止；动词让它发生。这是本引言末尾给出的中世纪叙述的种子。","Case endings carry the information that English carries by word order. Change the ending and you change the function; change the order and you have only changed the emphasis.":"格结尾携带英语按词序携带的信息。改变结局，你就改变了功能；改变顺序，你只是改变了重点。","Judgment is the joining or separating of two concepts so as to affirm or deny. Grammar calls it subject and predicate; logic calls it a proposition. The same act, named twice.":"判断是连接或分离两个概念，以肯定或否定。语法称之为主语和谓语；逻辑称其为命题。同一个动作，被点名两次。",", leaving the empty ones blank; but that is not the convention here.) Beneath the choice of shading lies a deeper one. The older logic of Aristotle treats every general term as":"，将空的留空；但这不是这里的惯例。）在阴影的选择之下隐藏着更深层次的选择。亚里士多德的旧逻辑将每个通用术语视为","Time belongs to what becomes and is in motion. A word that signifies its thing as at rest has no use for tense; a word that signifies it as flowing must say when the flowing is.":"时间属于正在发生和正在运动的事物。表示事物处于静止状态的词没有时态的用处。表示流动的词必须在流动时说。",", the mode of being. The horse really is a settled, stable thing; and its running really is something going on, unfolding in time. These facts are due not to us but to the world.":"，存在模式。马确实是一种安定、稳定的东西。它的运行确实是一件正在发生的事情，随着时间的推移而展开。这些事实不是我们的责任，而是世界的责任。","it cannot be otherwise. Where demonstration of the fact reasons from effect to cause, demonstration of the cause reasons the other way — from the cause down to its effect. This is":"不可能有其他的情况。如果事实的论证是从结果到原因的论证，那么原因的论证则以相反的方式论证——从原因到结果。这是",", which occupies the middle of these exercises. The final part of the exercises focuses on reasoning from one proposition to another, which is not primarily determined by grammar.":"，它占据了这些练习的中间位置。练习的最后一部分侧重于从一个命题到另一个命题的推理，这主要不是由语法决定的。","The thing is some way first; the mind takes it as it is; the word signifies it as the mind has taken it. Reverse the order and you would be saying that words decide how things are.":"事情是首先发生的；心如实接受它；这个词所表示的意思是头脑所接受的。颠倒顺序，你会说言语决定事情的真相。","Grammar takes the judgment in so far as the words have been rightly put together. Logic takes it in so far as it signifies the truth or falsity of the relation between the two terms.":"语法的判断依据是单词是否正确地组合在一起。逻辑认为它表示两个术语之间关系的真或假。","Everything to the left of the bar is the subject; everything to the right is the predicate. These two words are used in logic as well: every proposition has a subject and a predicate.":"栏左侧的所有内容都是主题；右边的所有内容都是谓词。这两个词也用在逻辑中：每个命题都有一个主语和一个谓语。","Every word is in its right place — noun, adjectives, verb, adverb. The famous example shows exactly how far grammar goes and where it stops: it can guarantee the form and nothing else.":"每个单词都在正确的位置——名词、形容词、动词、副词。这个著名的例子准确地表明了语法的发展和停止：它只能保证形式，仅此而已。","Formal argument and symbolic inference are part of logic, but only a part. Logic also governs probable argument, persuasion, the proposing of explanations, and how we define and classify.":"形式论证和符号推理是逻辑的一部分，但只是一部分。逻辑还支配着可能的论证、说服、解释的提出以及我们如何定义和分类。","The second act is judgment, and it occupies the middle of these exercises. The final part turns to reasoning from one proposition to another, which is not primarily determined by grammar.":"第二幕是判断，它占据了这些练习的中间部分。最后一部分转向从一个命题到另一个命题的推理，这主要不是由语法决定的。","The first act grasps a single thing and asserts nothing; the third moves between statements already made; and this is exactly where grammar and logic meet, not a matter for grammar alone.":"第一幕抓住了单一的事物，没有断言什么；已发表声明之间的第三步；这正是语法和逻辑的交汇点，而不仅仅是语法的问题。","Grammar puts words together rightly, logic reasons rightly, and rhetoric persuades well. The remaining four of the seven liberal arts — arithmetic, geometry, music, astronomy — make up the":"语法能够正确地组合词语，逻辑能够正确地推理，修辞能够很好地说服人。七门文科中的其余四门——算术、几何、音乐、天文学——构成了","objects have changed over time: the history of the oceans belongs to marine biology, the history of the stars to astronomy. Only when we mean the affairs of our own human community do we call":"物体随着时间的推移而发生变化：海洋的历史属于海洋生物学，星星的历史属于天文学。只有当我们指的是我们自己的人类社会的事务时，我们才称",", a name) names something: a person, a place, a thing, or even something you cannot sense, like an idea or a property. To determine whether something is a noun, one simple rule is this: can you put":"，名字）命名某些东西：一个人，一个地方，一个东西，甚至是你无法感知的东西，比如一个想法或一个财产。要确定某物是否是名词，一个简单的规则是：你能把","word-sound is a noun or a verb. The parts of speech, and the general rules of universal grammar, exist because things really are various ways, and words and sentences have to signify them as they are.":"词音是名词或动词。词类和通用语法的一般规则之所以存在，是因为事物确实有多种方式，单词和句子必须按其本来面目表示它们。","— the different kinds of work, divided up by what they do in the sentence. The list of parts of speech is not a list of words, since the very same word can have different functions in different sentences:":"——不同种类的工作，按照它们在句子中所做的事情来划分。词类列表不是单词列表，因为同一个单词在不同的句子中可以具有不同的功能：","takes up the enthymeme, the argument with a premise left unsaid — reason at work in persuasion. One instrument appears from the first exercise onward, and deserves a word before you begin: the Venn diagram.":"讨论了“enthymeme”，即有一个未言明的前提的论证——理性在说服中发挥作用。从第一个练习开始就有一个工具出现，在开始之前值得先介绍一下：维恩图。","Before the exercises, a brief orientation — what logic is, its parts, and the three acts of the mind it perfects. Read each panel, answer its question, then read the answer given. Nothing here is scored or tracked.":"在练习之前，先做一个简短的介绍——逻辑是什么、它的组成部分以及它完善的三种思维行为。阅读每个面板，回答其问题，然后阅读给出的答案。这里没有任何内容被评分或跟踪。","The history of a thing falls within the study of that thing — the stars’ history belongs to astronomy, as logic’s history belongs to logic. “History” as a discipline of its own chiefly means the affairs of our human community.":"事物的历史属于对该事物的研究——星星的历史属于天文学，就像逻辑的历史属于逻辑一样。 “历史”作为一门独立的学科，主要指的是我们人类社会的事务。","Man is the rational animal: reason is his defining faculty, and every human act, so far as it is well directed, is directed by reason. Reason itself is carried out with skill, according to its governing art — and that art is logic.":"人是理性的动物：理性是他的决定性能力，人类的每一个行为，只要有良好的指导，都是由理性指导的。理性本身是根据其统治艺术以技巧来实现的——而艺术就是逻辑。","The parts of logic often mark the stages of an inquiry. We may begin knowing little and propose stories (poetics); find reasons to prefer one (rhetoric); reach what is probable (dialectic); and at last demonstrate the cause (science).":"逻辑部分通常标志着探究的阶段。我们可能开始知之甚少并提出故事（诗学）；找到选择其中一种的理由（修辞）；达到可能的程度（辩证法）；最后证明原因（科学）。","Logic is far broader. It directs every use of reason to reach truth — demonstration and proof, probable argument, persuasion, the proposing of explanations, and the avoiding of error — and it governs too how we define and classify things.":"逻辑要广泛得多。它指导理性的每一种运用以达到真理——论证和证明、可能的论证、说服、提出解释以及避免错误——它也支配着我们如何定义和分类事物。","It is easy to confuse the two. Grammar considers to what extent a sentence is well formed. Logic considers whether the proposition that the sentence expresses is true, and how that proposition relates to the truth or falsity of other propositions.":"两者很容易混淆。语法考虑句子的结构良好程度。逻辑考虑句子所表达的命题是否为真，以及该命题与其他命题的真假有何关系。",", logic is more general than any given language. If grammar were determined purely by custom, a Greek argument could not be translated into English without loss. But it can be, because underneath the different words the modes of signifying are the same.":"，逻辑比任何给定的语言都更普遍。如果语法纯粹由习惯决定，那么希腊论证就不可能毫无损失地翻译成英语。但这是可能的，因为在不同的词语下面，其表示的方式是相同的。","Aristotle began there, but rhetoric is far more general: we use it in teaching, among friends and family, and in business — wherever direct evidence does not settle the question. In this course, rhetoric’s own form of reasoning is the argument with a premise left unsaid — the":"亚里士多德从这里开始，但修辞更为普遍：我们在教学中、在朋友和家人之间以及在商业中使用它——只要直接证据不能解决问题。在本课程中，修辞学本身的推理形式是有一个未言明的前提的论证——","Poetics opens an inquiry with possible explanations; and literature, at its summit, hands on the deepest truths of how to live — indirectly, through beautifully wrought story — teaching the soul as no bare argument can. So we tell a child a tale to teach him to honour his parents.":"诗学开启了一个带有可能解释的探究；文学在其顶峰，通过精美的故事间接地传达了如何生活的最深刻的真理，这是任何简单的论证都无法做到的。所以我们给孩子讲一个故事，教他孝敬父母。",", which is persuading well. They come in that order for a reason. Logic works on statements, and a statement is made of words. If you do not know what a word is doing in a sentence, you cannot say what a proposition asserts — and the centre of this whole course of study is the proposition.":"，这很有说服力。它们按这个顺序出现是有原因的。逻辑作用于陈述，而陈述是由文字组成的。如果你不知道一个词在句子中的作用，你就无法说出一个命题所主张的内容——而整个研究过程的中心就是命题。",". Literature has its own high end: not merely to teach by a story, nor merely to propose an explanation, but to convey the deepest truths of moral philosophy — how a human being ought to live — by means of story and beautifully crafted, indirect expression, which reaches the soul where a bare argument cannot.":"。文学有它自己的高端：不仅仅是通过故事来教导，也不仅仅是提出解释，而是通过故事和精心设计的间接表达来传达道德哲学最深刻的真理——人应该如何生活，这是纯粹的论证所无法触及的灵魂。",", modes or ways — went beyond the usual questions about what the rules of grammar are for different languages, and asked what all languages have in common, and why the rules of grammar are what they are and not something different. Why should every language have something like a noun and something like a verb?":"、模式或方式——超越了关于不同语言的语法规则是什么的常见问题，并询问所有语言有什么共同点，以及为什么语法规则是它们本身而不是不同的东西。为什么每种语言都应该有名词和动词之类的东西？","Useful as they are, these diagrams prove nothing by themselves; they only display what a proposition already says, so that the eye may help the mind keep track of what is included, what is excluded, and whether a thing exists. The diagram is a servant, never a master. And the greatest instrument of the mind is not the circle but the":"尽管这些图表很有用，但它们本身并不能证明什么。它们只显示一个命题已经说过的内容，以便眼睛可以帮助大脑跟踪包含什么、排除什么以及某个事物是否存在。图表是仆人，而不是主人。心灵最伟大的工具不是圆而是圆","A word before we go on, for the history of logic is woven through the exercises. The history of a thing is not a subject of its own but a part of the study of that thing. Aristotle and St Thomas open almost every inquiry with an account of how it has been studied — to bring its terms, distinctions, and principles to light, and to show how and why they were discovered. And every discipline also studies how":"在我们继续之前先说一句话​​，因为逻辑的历史是通过练习交织在一起的。事物的历史并不是其本身的主题，而是该事物研究的一部分。亚里士多德和圣托马斯几乎在每次探究时都会描述其研究方式——揭示其术语、区别和原理，并展示它们是如何以及为何被发现的。每个学科也研究如何","— mapped terms, propositions, syllogisms, demonstration, dialectic, and fallacy; the Stoics soon added a logic of whole propositions. This Aristotelian logic served as the common logic of the Western world for some two thousand years — from about 300 BC to AD 1900 — underlying the rise of nearly every discipline; and it was brought to its highest refinement, and enlarged, by the medieval schoolmen — Albert the Great, Aquinas, Buridan, and later John of St Thomas. Only in the early twentieth century was it displaced in the schools by modern symbolic (mathematical) logic, descended from Frege — an instrument of great power, though its dream of grounding all reasoning in itself foundered (as Gödel showed). This course of study follows the older, classical tradition of Aristotle and the scholastics: the tradition that most shaped Catholic thought, and that can still make sense of all the rest.":"——映射术语、命题、三段论、论证、辩证法和谬误；斯多葛学派很快就增加了整个命题的逻辑。从公元前约 300 年到公元 1900 年，这种亚里士多德逻辑在大约 2000 年来一直是西方世界的共同逻辑，几乎所有学科的兴起都基于这种逻辑。中世纪的经院学者——阿尔伯特大帝、阿奎那、布里丹以及后来的圣托马斯的约翰，将它推向了最高的完善和扩展。直到二十世纪初期，它才在学校中被源自弗雷格的现代符号（数学）逻辑所取代——这是一种强大的工具，尽管它将所有推理建立在自身之上的梦想破灭了（正如哥德尔所示）。本课程遵循亚里士多德和经院哲学的古老古典传统：这一传统对天主教思想影响最大，并且仍然可以理解其他所有思想。","b-fsx":"b-fsx","sum2R":"总和2R","fs-zin":"FS津","fs-zout":"FS-Zout","ob-next":"下一个对象","fs-hint":"FS 提示","ob-play":"OB-播放","tbtn vb":"VB","fs-play":"FS播放","fs-next":"FS-下一个","fsx-cta":"fsx-cta","fs-camg":"FS-CAMG","fs-scaf":"FS-SCAF","fs-stmt":"FS-STMT","fs-rotl":"FS-旋转","ob-prev":"观察前","b-reset":"b-重置","Zoom in":"放大","fs-rail":"FS-铁路","fs-exit":"fs-退出","fs-prev":"前一个 fs","fs-rotr":"飞速旋转","nav-lbl":"导航-lbl","fs-mode":"FS 模式","fs-modes":"fs 模式","lbl-long":"磅长","nav-abbr":"导航缩写","fs-badge":"FS-徽章","fs-stage":"fs阶段","fs-whole":"FS-整体","Zoom out":"缩小","fs-speed":"fs 速度","b-fsx-top":"b-fsx-顶部","free-drag":"自由拖动","fs-broken":"FS-损坏","Next step":"下一步","fs-xforms":"fs-xforms","g.figbody":"g.figbody","fs-vreset":"fs-vreset","obtn play":"获取播放","lbl-short":"lbl-短","g.fs-camg":"g.fs-camg","fs-stepbar":"FS-步进条","fs-figwrap":"fs-figwrap","fs-restore":"fs 恢复","fs-handles":"fs 句柄","fs        line; the clamps keep the triangle inequality, so the circles of the

    const gl = (f, name, dflt, anchor) => { const s = f.state[name]; return (s ? s.x : dflt) - anchor; };
    const x1 = b.pt('x1', -70, gy, { show: false, noXform: true, clamp: (q, f) => {
      const Yl = gl(f, 'y1', 15, -50), Zl = gl(f, 'z1', 130, 35);
      const lo = Math.max(16, Yl - Zl + 12), hi = Yl + Zl - 12;
      return V(-150 + Math.max(lo, Math.min(hi, q.x + 150)), gy);
    } });
    const y1 = b.pt('y1', 15, gy, { show: false, noXform: true, clamp: (q, f) => {
      const Xl = gl(f, 'x1', -70, -150), Zl = gl(f, 'z1', 130, 35);
      const lo = Math.max(16, Math.abs(Xl - Zl) + 12), hi = Xl + Zl - 12;
      return V(-50 + Math.max(lo, Math.min(hi, q.x + 50)), gy);
    } });
    const z1 = b.pt('z1', 130, gy, { show: false, noXform: true, clamp: (q, f) => {
      const Xl = gl(f, 'x1', -70, -150), Yl = gl(f, 'y1', 15, -50);
      const lo = Math.max(16, Yl - Xl + 12), hi = Yl + Xl - 12;
      return V(35 + Math.max(lo, Math.min(hi, q.x - 35)), gy);
    } });
    /* given lengths: X one tick, Y two, Z three — match triangle sides AC, AB, BC */
    b.seg(x0, x1, { id: 'seg:X', w: 2.4, ticks: 1 }); b.text('X', mid(x0, x1), { dy: 12, anchor: 'middle', size: 13, italic: true, id: 'lab:X' });
    b.seg(y0, y1, { id: 'seg:Y', w: 2.4, ticks: 2 }); b.text('Y', mid(y0, y1), { dy: 12, anchor: 'middle', size: 13, italic: true, id: 'lab:Y' });
    b.seg(z0, z1, { id: 'seg:Z', w: 2.4, ticks: 3 }); b.text('Z', mid(z0, z1), { dy: 12, anchor: 'middle', size: 13, italic: true, id: 'lab:Z' });
    const X = dist(x0, x1), Y = dist(y0, y1), Z = dist(z0, z1);
    const A = b.at('A', V(-62, 0), { dir: [-0.2, -1] });
    const Bp = b.at('B', V(-62 + Y, 0), { dir: [0.2, -1] });
    const D = b.at('D', V(-62 - X, 0), { dir: [-1, -0.3] });
    const F = b.at('F', V(-62 + Y + Z, 0), { dir: [1, -0.3] });
    const E = b.at('E', V(-62 + Y + Z + 24, 0), { dir: [1, 0.4] });
    /*

      keepThroughBeats only on DA so AE+AB+BF do not stack into a fully lit D–E.

    /* DA only on its beat. AE stays as a full (unhighlighted) background stroke

    b.seg(D, A, { step: 1, id: 'seg:DA', w: 2.2, hideUntilHl: true, keepAfterStep: true });

    b.circle(Bp, Z, { step: 1, id: 'cir:cutZ', role: 'scaffold', wide: true, hideUntilHl: true });

function expandAngleRays(fig, idSet) {

const SCOPES = [
  { id: 'all', label: 'All 39 theorems', pick: i => i._group === 'theorems' },
  { id: 't1', label: 'Theorems 1 – 10', pick: i => i._group === 'theorems' && i.sort <= 10 },
  { id: 't2', label: 'Theorems 11 – 20', pick: i => i._group === 'theorems' && i.sort > 10 && i.sort <= 20 },
  { id: 't3', label: 'Theorems 21 – 30', pick: i => i._group === 'theorems' && i.sort > 20 && i.sort <= 30 },
  { id: 't4', label: 'Theorems 31 – 37', pick: i => i._group === 'theorems' && i.sort > 30 },
  { id: 'cons', label: 'The constructions only', pick: i => i._group === 'theorems' && i.kind === 'construction' },
  { id: 'defs', label: 'Definitions', pick: i => i._group === 'definitions' }
];
function recBuild(scope, ids) {
  REC.scope = scope;
  const sc = SCOPES.find(s => s.id === scope) || SCOPES[0];
  const list = ids || ITEMS.filter(sc.pick).map(i => i.id);
  for (let i = list.length - 1; i > 0; i--) {          // shuffle
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  REC.queue = list; REC.at = 0; REC.again = [];
  recReset();
}
function recReset() { REC.drawing = false; REC.proof = false; REC.key = false; REC.scaffold = false; }
function recNext(hadIt) {
  const id = REC.queue[REC.at];
  if (!hadIt && id) REC.again.push(id);
  REC.at++; recReset(); renderRecitation();
}
function renderRecitation() {

      ${REC.again.length ? `<button class="tbtn big" id="rec-again">Go again with those ${REC.again.length}</button> ` : ''}

  if (REC.drawing) {

    if (K) h += `<button class="tbtn${REC.key ? ' on' : ''}" id="rec-key">${REC.key ? 'plain figure' : 'emphasise the key parts'}</button>`;
    if (fig && fig.fig.objs.some(o => o.role === 'scaffold'))
      h += `<label><input type="checkbox" id="rec-scaf"${REC.scaffold ? ' checked' : ''}> construction lines</label>`;
    h += `<span class="sp"></span></div>`;

  }
  if (REC.proof && it.steps) {
    h += `<h4 class="sec">${it.kind === 'construction' ? 'Construction &amp; proof' : 'Proof'}</h4><ol class="steps">`;
    it.steps.forEach(st => {

      h += `<li>${esc(st.text)}${cites ? `<span class="cites">${cites}</span>` : ''}</li>`;

function provePalette() {

    `<button class="wbtool${d.picking === p.kind ? ' on' : ''}" data-pick="${p.kind}" title="${esc(p.hint)}">${esc(p.label)}</button>`).join('');

function drawWorkbench() {
  const wrap = $('#figwrap'); if (!wrap) return;
  const WB = window.WB, PR = window.WB_proof;
  const fig = G.makeFigure(window.WB_figure(), {});
  let lit = new Set(WB.sel || []);
  if (WB.mode === 'prove') {

    [d.lhs, d.rhs].forEach(p => { if (p) PR.eids(p).forEach(x => lit.add(x)); });
    (d.buf || []).forEach(x => lit.add(x));

  if (!svg) return;
  svg.addEventListener('click', ev => {
    const API = window.WB_api, PR = window.WB_proof;
    const el = ev.target.closest('[data-eid]');
    let msg = '';
    if (window.WB.mode === 'prove') {
      msg = el ? PR.proofClick(el.dataset.eid) : 'Click a part of the figure.';
    } else if (el) {
      msg = API.pick(el.dataset.eid);
    } else {
      const ctm = svg.getScreenCTM();
      const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
      const q = p.matrixTransform(ctm.inverse());
      msg = API.clickEmpty(fig.toWorld({ x: q.x, y: q.y }));

    window.WB.msg = msg;
    renderWorkbench();
  });

function drawFig(opt) {
  opt = opt || {};
  const it = BY_ID[UI.id]; if (!it) return;
  const fig = figFor(it.id);
  if (!fig) return;
  /* fullscreen studio, when open, owns the drawing surface */
  const wrap = document.getElementById('fs-figwrap') || $('#figwrap'); if (!wrap) return;
  const upTo = UI.step === null ? Infinity : UI.step;
  let hl = null;
  let hlKeep = false;

  if (UI.sel) {
    hl = new Set(UI.sel);
    expandAliases(fig, hl);
    expandAngleRays(fig, hl);
    expandPolySides(fig, hl);
    if (!opt.beatAdvance) clearHlBeats();
  } else if (UI.step !== null && UI.step > 0 && it.steps && it.steps[UI.step - 1]) {
    const st = it.steps[UI.step - 1];
    /* multi-beat highlight (e.g. one congruent triangle, then the other) */
    const beatHl = (st.hlBeats && st.hlBeats.length) ? hlBeatsFor(it, st, fig) : null;
    if (beatHl === 'CLEAR') {
      hl = null;           /* full figure, normal strokes, all tick marks */
    } else if (beatHl) {
      hl = beatHl;
    } else if (st.hlIds && st.hlIds.length) {

      const ids = [];
      refsIn(st.text, fig).forEach(r => ids.push(...r.ids));
      /*
        hl: "angles" — light only what this step names: angle marks (and any
        segments / points the text actually mentions). Dim everything else so
        the base and unrelated angles do not stay lit.
      */
      if (st.hl === 'angles' || st.hl === 'numbers') {
        hlKeep = false;
        const angs = ids.filter(id => id.startsWith('ang:') || id.startsWith('lab:'));
        const segs = ids.filter(id => id.startsWith('seg:'));
        const pts  = ids.filter(id => id.startsWith('pt:'));
        const pick = angs.length || segs.length ? angs.concat(segs, pts) : ids;
        hl = new Set(pick);
      } else if (ids.length) {
        hl = new Set(ids);

    clearHlBeats();

  const last = UI.lastDrawn;
  const stNow = (UI.step !== null && UI.step > 0 && it.steps) ? it.steps[UI.step - 1] : null;
  const hasBeats = !!(stNow && stNow.hlBeats && stNow.hlBeats.length);

  /* hlDraw: draw the step on as usual, and let the beats follow */
  if (noDrawAnim && stNow && stNow.hlDraw && !beatAnim) noDrawAnim = false;
  const animate = beatAnim || stepAdvance;
  let reflashIds = opt.reflashIds || null;
  if (hasBeats && stepAdvance && !beatAnim && UI.hlBeat && UI.hlBeat.reflashFor) {
    reflashIds = UI.hlBeat.reflashFor(0);
  } else if (hasHlIds && stepAdvance && !beatAnim && hl) {
    reflashIds = new Set(hl);
  }
  if (!opt.beatAdvance) UI.lastDrawn = { id: it.id, step: UI.step };
  const zoomDur = 0.62 / UI.speed;
  /* ids from this step's beats so far (so DA stays after its beat when AE draws) */
  let revealedIds = null;
  if (UI.hlBeat && UI.hlBeat.sets && UI.hlBeat.sets.length) {
    revealedIds = new Set();
    const upToBeat = Math.min(UI.hlBeat.i, UI.hlBeat.sets.length - 1);
    for (let bi = 0; bi <= upToBeat; bi++) {
      const s = UI.hlBeat.sets[bi];

      const sp0 = it.steps[s - 1];
      (sp0 && sp0.hlBeats ? sp0.hlBeats : []).forEach(b => {

    const later = new Set();
    if (UI.hlBeat && UI.hlBeat.specs && UI.hlBeat.id === it.id && UI.hlBeat.step === UI.step) {
      const specs = UI.hlBeat.specs, at = UI.hlBeat.i;
      specs.forEach((sp, k) => {
        if (!sp) return;
        const into = k > at ? later : staged;
        sp.draw.forEach(id => into.add(id));
        sp.show.forEach(id => into.add(id));

        if (cur.keep.length) keepIds = new Set(cur.keep);
        if (cur.dim.length) dimIds = new Set(cur.dim);

    /* the studio holds one fixed scale, so altered lengths visibly change size */
    view: (fsBig && window.FSX.lockedView) ? window.FSX.lockedView() : undefined,
    animate, speed: UI.speed, noDrawAnim, reflashIds, revealedIds,

      ? wrap.firstChild.querySelector('.figbody') : null;
    if (body) {
    body.style.transitionDuration = zoomDur + 's';
    requestAnimationFrame(() => {
      body.style.transform = `translate(${f2(z.tx)}px,${f2(z.ty)}px) scale(${f2(z.s)})`;
    });

    UI.zoomTimer = setTimeout(() => {
      if (body.isConnected) body.style.transform = '';

  applyFigLayer(it, wrap.firstChild, stepAdvance && !beatAnim);
  wireFig(wrap.firstChild, fig);
  if (window.FSX && window.FSX.active) window.FSX.afterDraw(wrap.firstChild, fig);
}

/**
 * Theorem 12 (and similar): two diagram layers — the true claim figure and the
 * reductio figure. Swipe the claim up when the supposition begins; swipe the
 * reductio up when the proof restores the claim on the last step.
 */
function thm12Layer(step, n) {
  if (step === null || step === 0 || step === 1) return 'claim';
  if (step >= n) return 'claim';           /* final line: back to the truth */
  return 'reductio';                       /* steps 2 … n-1 */
}
function applyFigLayer(it, svg, doTransition) {
  if (!svg || !it) return;
  /* only thm 12 uses layered claim/reductio figures for now */
  if (it.id !== 'thm:12') {
    clearTimeout(UI.figLayerTimer); UI.figLayerTimer = 0; UI.figLayerSvg = null;
    svg.removeAttribute('data-layer');
    UI.figLayer = null;
    return;
  }
  const n = nSteps(it);
  const target = thm12Layer(UI.step, n);
  const prev = UI.figLayer;
  /* a swipe already under way on this very figure: leave it to finish, or it
     would start over from the beginning and the figure would judder */
  if (UI.figLayerTimer && UI.figLayerSvg === svg && prev === target) return;
  clearTimeout(UI.figLayerTimer); UI.figLayerTimer = 0;
  UI.figLayerSvg = svg;
  if (doTransition && prev && prev !== target) {
    const mode = (prev === 'claim' && target === 'reductio') ? 'to-reductio'
      : (prev === 'reductio' && target === 'claim') ? 'to-claim'
      : target;
    svg.setAttribute('data-layer', mode);
    UI.figLayer = target;
    /* the swipe itself is 0.72 * --dur; let it land before settling */
    UI.figLayerTimer = setTimeout(() => {
      UI.figLayerTimer = 0;
      if (svg.isConnected) svg.setAttribute('data-layer', target);
    }, 700 / UI.speed);
  } else {
    svg.setAttribute('data-layer', target);
    UI.figLayer = target;
  }
}

function isPhoneLayout() {
  return !!(window.matchMedia && matchMedia('(max-width:900px)').matches);
}

/** Corner badge: only while Replay is running, and only for real proof lines (≥ 1). */
function syncStepBadge() {
