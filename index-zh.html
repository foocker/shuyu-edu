<script>window.CONTENT={"definitions":[{"id":"def:1","num":1,"term":"Solid","text":"A solid is whatever has length, width, and depth.","kid":"A gold brick is a solid: it goes this way, that way, and up-down."},{"id":"def:2","num":2,"term":"Surface","text":"A solid stops at its surface (or surfaces); so a surface has length and width, but no depth.","kid":"The flat top of a brick is a surface — flat like a tabletop, with no thickness of its own."},{"id":"def:3","num":3,"term":"Line","text":"When a surface comes to an end, it stops at a line (or lines); so a line has length, but no width or depth. (In this book, “line” usually means a finite line, often called a line segment today.)","kid":"An edge of a table is a line: it has length, but no width or thickness."},{"id":"def:4","num":4,"term":"Point","text":"When a line comes to an end, it stops at a point; so a point has no length, no width, no depth. Although it has no shape or size, a point does have one positive feature: its location.","kid":"A point is just a place — like a perfect tiny dot with no size at all."},{"id":"def:5","num":5,"term":"Straight line","text":"A straight line is a perfectly uniform line. Every part of it is the same “shape” as every other part, regardless of length, and different straight lines differ only in length, location, and orientation. Every other kind of line is called a curved line.","kid":"A straight line never bends. Look at it end-on and it looks like a point."},{"id":"def:6","num":6,"term":"Plane (flat surface)","text":"A flat surface is a perfectly uniform surface. Every part of it, regardless of size, is the same “shape” all over and on both sides. A flat surface can also be called a plane.","kid":"A plane is a perfectly flat surface — like a perfect sheet of paper that never wrinkles."},{"id":"def:7","num":7,"term":"Plane angle","text":"When two distinct lines in the same plane meet at a point, the inclination of one to the other is a plane angle. The point at which the lines meet is called the vertex of the angle.","kid":"An angle is how much two lines “open” when they meet at a point (the vertex)."},{"id":"def:8","num":8,"term":"Rectilineal angle","text":"A rectilineal angle is an angle formed by two different straight lines.","kid":"A corner made by two straight lines is a rectilineal angle."},{"id":"def:9","num":9,"term":"Right angle","text":"When one straight line stands on another in such a way that the two adjacent angles formed are equal to each other, each angle is called a right angle.","kid":"A right angle is a perfect square corner — like the corner of a book."},{"id":"def:10","num":10,"term":"Perpendicular","text":"A straight line standing on another at right angles is said to be perpendicular to the line on which it stands.","kid":"Perpendicular means “standing straight up” on another line — making right angles."},{"id":"def:11","num":11,"term":"Obtuse and acute angles","text":"An obtuse angle is a rectilineal angle greater than a right angle. An acute angle is a rectilineal angle less than a right angle.","kid":"Acute = sharp and skinny (less than a square corner). Obtuse = wide and open (more than a square corner)."},{"id":"def:12","num":12,"term":"Supplementary and complementary","text":"An obtuse angle and an acute angle are called supplementary when they add up to two right angles. Two acute angles are called complementary when they add up to one right angle.","kid":"Complementary pair = one right angle together. Supplementary pair = two right angles (a straight line) together."},{"id":"def:13","num":13,"term":"Boundary","text":"A boundary of a thing is its limit, or where it stops. For example, a sphere is bounded by one surface, a square by four lines, a straight line by two points.","kid":"A boundary is the edge where something stops."},{"id":"def:14","num":14,"term":"Figure","text":"A figure is something contained by its boundary or boundaries — something which cannot be entered or departed from without cutting across its boundary or boundaries.","kid":"A figure has an inside. A triangle is a figure; a lone straight line is not, because you can pass through it without going through its endpoints."},{"id":"def:15","num":15,"term":"Circle","text":"A circle is a plane figure contained by one curved line whose every point is the same distance from a single point inside it.","kid":"A circle is a round figure. Every point on the rim is the same distance from the center."},{"id":"def:16","num":16,"term":"Center and circumference","text":"The single point inside a circle which is the same distance from every point along the curved line bounding the circle is called the circle’s center. The curved line bounding the circle is called the circle’s circumference.","kid":"Center = the middle point. Circumference = the round edge."},{"id":"def:17","num":17,"term":"Radius and diameter","text":"Any straight line drawn from the center of a circle and stopping at the circumference is called a radius of the circle. By definitions 15 & 16, all the radii of a circle are equal. Any straight line drawn through the center of a circle and terminated at each end by the circumference is called a diameter. Any diameter bisects the circle.","kid":"Radius: center to edge. Diameter: all the way across through the center (two radii in a line). All radii of one circle are equal!"},{"id":"def:18","num":18,"term":"Semicircle","text":"A semicircle is the figure contained by a circle’s diameter and the circumference cut off by it.","kid":"A semicircle is half a circle, cut along a diameter."},{"id":"def:19","num":19,"term":"Rectilineal figures","text":"A rectilineal figure is a plane figure contained by straight lines only. A triangle is a plane figure contained by three straight lines. A quadrilateral is a plane figure contained by four straight lines. A polygon is any plane figure contained by more than four straight lines.","kid":"Triangle = 3 sides. Quadrilateral = 4 sides. Polygon = many sides (more than four here)."},{"id":"def:20","num":20,"term":"Equilateral, isosceles, scalene","text":"Among triangles, an equilateral triangle is one with all three sides equal. An isosceles triangle is one with only two sides equal. A scalene triangle is one without any equal sides.","kid":"Equilateral: all sides same. Isosceles: exactly two sides same. Scalene: all sides different."},{"id":"def:21","num":21,"term":"Right, obtuse, acute triangles; hypotenuse","text":"Among triangles, a right triangle is one containing a right angle. An obtuse triangle is one containing an obtuse angle. An acute triangle is one with all three of its angles acute. In a right triangle, the side opposite the right angle is called the hypotenuse, and the two sides containing the right angle are called legs.","kid":"Right triangle has a square corner. The long side opposite that corner is the hypotenuse; the other two sides are legs."},{"id":"def:22","num":22,"term":"Parallel","text":"If two straight lines lie in one plane together, but never meet each other in either direction however far they are extended, they are said to be parallel to each other.","kid":"Parallel lines never meet — like railroad tracks that stay the same distance apart forever."},{"id":"def:23","num":23,"term":"Square, rectangle, rhombus, parallelogram, trapezium","text":"Among quadrilaterals, a square has all four sides equal and all four angles right; a rectangle has all four angles right but not all four sides equal; a rhombus has all four sides equal but no right angles. A parallelogram is any quadrilateral contained by two pairs of parallel straight lines. Quadrilaterals that are none of the above will be called trapezia.","kid":"Square: equal sides + right angles. Rectangle: right angles. Rhombus: equal sides, tilted. Parallelogram: two pairs of parallel sides."},{"id":"def:24","num":24,"term":"Inclined toward each other","text":"Two straight lines are inclined toward each other if, when cut by a third straight line, the sum of the two interior angles on one side is less than the sum of the two exterior angles on that same side.","kid":"Lines that lean toward each other on one side of a cutting line will eventually meet on that side (see Postulate 5)."}],"postulates":[{"id":"post:1","num":1,"term":"Draw a straight line","text":"A straight line can be drawn from any point to any point.","kid":"You may always connect two points with a straight line (use a straightedge)."},{"id":"post:2","num":2,"term":"Extend a straight line","text":"Any straight line can be extended continuously in a straight line in either direction and as far as you please.","kid":"You may always make a straight line longer in either direction."},{"id":"post:3","num":3,"term":"Draw a circle","text":"A circle can be drawn around any point as its center and with a radius of any given length.","kid":"You may always draw a circle with any center and any radius (use a compass)."},{"id":"post:4","num":4,"term":"Right angles are equal","text":"All right angles are equal. Not only are adjacent right angles equal to each other, but even those that are not adjacent.","kid":"Every perfect square corner is the same size as every other perfect square corner."},{"id":"post:5","num":5,"term":"Inclined lines meet","text":"Straight lines inclined towards each other eventually meet, when extended far enough. (Restated with Thm. 11: if two straight lines make less than two right angles on one side of a third straight line, then they will eventually meet on that side.)","kid":"If two lines lean toward each other, they will meet if you extend them far enough. This is Euclid’s famous parallel postulate!"}],"commonNotions":[{"id":"cn:1","num":1,"term":"Transitivity of equality","text":"Things equal to the same thing are also equal to each other.","kid":"If A = C and B = C, then A = B. (36 inches = 1 yard and 3 feet = 1 yard, so 36 inches = 3 feet.)"},{"id":"cn:2","num":2,"term":"Adding equals","text":"When equals are added to equals, the wholes are equal.","kid":"If two kids are the same height and each grows the same amount, they stay the same height."},{"id":"cn:3","num":3,"term":"Subtracting equals","text":"When equals are subtracted from equals, the remainders are equal.","kid":"Two equal pencils sharpened by the same amount stay equal."},{"id":"cn:4","num":4,"term":"Coincidence","text":"Things that can be made to coincide with each other are equal.","kid":"If two shapes can sit exactly on top of each other with nothing sticking out, they are equal."},{"id":"cn:5","num":5,"term":"Whole and part","text":"Every whole is greater than any one of its parts.","kid":"A whole pizza is bigger than any single slice. Always!"}],"extra":[{"id":"prin:two-lines","num":null,"term":"Two straight lines cannot enclose a space","text":"Two straight lines cannot cut each other more than once; they cannot enclose a space. This follows from the perfect uniformity of straight lines.","kid":"Straight lines can’t bend back to cross twice. They meet at most once."},{"id":"prin:halves","num":null,"term":"Halves of equals are equal","text":"The halves of equal things are equal.","kid":"If two cakes are the same size, half of each is also the same size."}],"theorems":[{"id":"thm:1","num":1,"title":"How to make an equilateral triangle","aka":null,"kind":"construction","statement":"Given a straight line AB, construct an equilateral triangle on it so that AB is the base.","steps":[{"text":"Draw circle X around point A with radius AB.","cites":["post:3"]},{"text":"Draw circle Z around point B with radius BA.","cites":["post:3"]},{"text":"These two circles intersect each other at points C and D."},{"text":"Join points A and C with a straight line.","cites":["post:1"]},{"text":"Join points B and C with a straight line.","cites":["post:1"]},{"text":"AC = AB, since these two lines are radii of circle A.","cites":["def:17"]},{"text":"BC = AB, since these are both radii of circle B.","cites":["def:17"]},{"text":"AC = BC, since each is equal to AB.","cites":["cn:1"],"note":"Steps 6 & 7; Common Notion 1"},{"text":"So all three sides of triangle ABC are equal — it is equilateral.","cites":["def:20"]}],"remarks":["We made a perfectly equilateral triangle without measuring anything — using circles!","The equilateral triangle is the simplest rectilineal figure: fewest sides, all the same.","It will be very useful for later constructions (see Theorem 7)."],"questions":[{"q":"Does an equilateral triangle appear to be right, obtuse, or acute?","hint":"Look at each corner compared with a square corner.","answer":"It appears acute: all three angles look (and later prove) less than a right angle. After Thm. 28 we know each is exactly 60°."},{"q":"Looking at the diagram, find a way to make a rhombus. Prove all four of its sides are equal.","hint":"Use both intersection points C and D of the two circles.","answer":"Join both intersection points C and D of the two circles. Then AC = AD = BC = BD = AB (all radii of circle A or B), so quadrilateral ACBD has all four sides equal — a rhombus. (Angles not yet shown non-right.)"},{"q":"What happens if you make 3 more equilateral triangles, one on each side of △ABC?","hint":"You are building toward a larger figure made of equilateral triangles.","answer":"You get a larger equilateral triangle divided into four small equilateral triangles (the middle one upside-down), a classic figure."}],"end":"Q.E.F.","sort":1.0},{"id":"thm:1a","num":"1a","sort":1.1,"kind":"construction","title":"How to place at a given point a line equal to a given line","aka":"Euclid, Elements I.2","statement":"If someone gives us a point A and a straight line BC, how can we draw from the point A a straight line equal to BC?","steps":[{"text":"Join the points A and B with a straight line.","cites":["post:1"]},{"text":"On AB make the equilateral triangle DAB.","cites":["thm:1"]},{"text":"Extend DA to E, and DB to F, as far as we please.","cites":["post:2"]},{"text":"Draw a circle around B with radius BC. It cuts DB extended at G.","cites":["post:3"]},{"text":"Draw a circle around D with radius DG. It cuts DA extended at L.","cites":["post:3"]},{"text":"BG = BC, since both are radii of the circle around B.","cites":["def:17"]},{"text":"DL = DG, since both are radii of the circle around D.","cites":["def:17"]},{"hlBeats":[["seg:AD","seg:BD"],["seg:AL","seg:BG"]],"hlBeatMs":1150,"text":"DA = DB, since DAB is equilateral. Take these equals away from the equals DL and DG, and the remainders are equal: AL = BG.","cites":["def:20","cn:3"]},{"text":"So AL = BC, since each of them is equal to BG. And AL was drawn from the given point A. Q.E.F.","cites":["cn:1"],"hlBeats":[["seg:AL","seg:BG"],["seg:AL","seg:BG","seg:BC"],["seg:AL","seg:BC"]],"hlBeatMs":1100}],"remarks":["Notice what we may **not** do: we may not pick up the line BC and carry it over to A. A straight-edge only draws and extends lines; a compass only draws circles. This theorem shows that a length can nevertheless be transferred from one place to another by construction alone.","The equilateral triangle of Theorem 1 is doing the real work here: it gives us two equal lines DA and DB starting from one point, so that when we take equal pieces away from equal wholes, the remainders are equal.","This is Euclid’s second proposition, and it is exactly the tool needed for Theorem 1b, which in turn is used over and over again (Theorems 3, 4, 15, 17 …) whenever we “cut off” one length equal to another."],"questions":[{"q":"Why do we need the equilateral triangle at all? Why not simply draw a circle around A with radius BC?","hint":"A compass in Euclid’s hands opens between two points that are already drawn.","answer":"Because to draw a circle around A with radius BC we would first have to carry the length BC over to A — which is the very thing we are trying to accomplish. Postulate 3 lets us draw a circle around a centre with a radius already given at that centre (like BC around B), not a radius borrowed from somewhere else."},{"q":"The construction places AL equal to BC on one particular side of A. Could we get it on any side we like?","hint":"Where was there a choice in the construction?","answer":"Yes. The equilateral triangle could be built on either side of AB, and afterwards Theorem 7 (or a circle around A with radius AL) lets us swing the line AL around A into any direction we please."},{"q":"What happens if the given point A happens to lie on the line BC itself?","hint":"Try the construction anyway.","answer":"Nothing breaks: A and B are still two distinct points, so AB can be joined and the equilateral triangle built on it. The only case needing care is A coinciding with B, and then the line BC already starts at the given point."}]},{"id":"thm:1b","num":"1b","sort":1.2,"kind":"construction","title":"How to cut off from the greater of two lines a line equal to the less","aka":"Euclid, Elements I.3","statement":"Given two unequal straight lines AB and C, cut off from the greater one AB a straight line equal to the less one C.","steps":[{"text":"At the point A place a straight line AD equal to C.","cites":["thm:1a"]},{"text":"Draw a circle around A with radius AD.","cites":["post:3"]},{"text":"Since AD is less than AB, the circle cuts AB at a point E between A and B.","cites":["def:15"]},{"hlIds":["seg:AE","seg:AEfinal","seg:C","seg:Cshow","seg:Cfinal"],"hlExpand":"none","text":"AE = AD, since both are radii of the same circle; and AD = C; therefore AE = C. So from the greater line AB we have cut off the shorter piece AE equal to C.","cites":["def:17","cn:1"]}],"remarks":["This little construction is the workhorse of the whole book. Whenever a proof says “cut off a line equal to …”, this is what is meant, and it is done with a circle, never with a ruler’s markings.","Notice why AB has to be the greater line: if AD were longer than AB the circle around A would swallow B entirely and cut the extension of AB instead of AB itself.","Together, Theorems 1, 1a and 1b give us everything we need to move and compare lengths: make an equilateral triangle, carry a length to a point, and cut a length off a longer line."],"questions":[{"q":"Where in the circle around A does the point E lie, and how do we know there is only one such point on AB?","hint":"How many times can a circle cut a straight line?","answer":"A straight line cuts a circle in at most two points, one on each side of the centre. Only one of them lies on the line AB going from A toward B; the other lies on AB extended backwards. So on AB itself E is unique."},{"q":"Could you use this theorem to cut off from AB a line equal to C if C were longer than AB?","hint":"What would you get instead?","answer":"No — you would not be cutting anything off AB. The circle around A with radius AD would meet the extension of AB beyond B, so you would be adding to AB rather than cutting from it."},{"q":"Use Theorems 1b and 8 to cut off from a given line exactly one quarter of another given line.","hint":"Bisect twice.","answer":"Bisect the second line (Thm. 8), bisect the half again: that gives a quarter. Then carry that quarter to the end of the first line (Thm. 1a) and cut it off with a circle (Thm. 1b)."}]},{"id":"thm:2","num":2,"title":"Side-Angle-Side (SAS)","aka":"SAS Congruence","kind":"theorem","statement":"If in one triangle a side, the next angle, and the next side are respectively equal to a side, the next angle, and the next side in another triangle, then all the corresponding sides and angles of the two triangles are equal, and they have equal areas.","steps":[{"text":"Imagine △ABC and △DEF with AB = DE, ∠ABC = ∠DEF, and BC = EF."},{"text":"Imagine moving △ABC so that AB lies on DE. Since they are equal, they coincide: A on D, B on E.","cites":["cn:4"]},{"text":"Since ∠ABC = ∠DEF, BC will fall along EF, and C will fall on F (since BC = EF)."},{"text":"So A, B, C sit on D, E, F. Then AC must coincide with DF — if it fell outside, two straight lines would cut each other at two points and enclose a space (impossible).","cites":["prin:two-lines"]},{"text":"So AB, BC, AC coincide with DE, EF, DF. The triangles coincide exactly and are identical.","cites":["cn:4"]},{"text":"Therefore AC = DF, ∠BAC = ∠EDF, ∠BCA = ∠EFD, and the triangles have equal areas."}],"remarks":["SAS is used throughout geometry to prove equality of lines, angles, and areas.","Congruent figures (≅) are the same size and same shape. △ABC ≅ △DEF means all corresponding sides and angles are equal.","Two straight lines cannot enclose a space — they cannot cut more than once."],"questions":[{"q":"When some parts are given equal, how do you decide which remaining parts “correspond”?","hint":"Match the order: side–angle–side in the same sequence around each triangle.","answer":"Match in order around each triangle: the given side, the given included angle, then the next side. Remaining parts that sit in the same relative place (opposite the same given part, or between the same pair) are corresponding."},{"q":"What if the triangles are mirror images? Can you still prove SAS?","hint":"Flip one triangle over (reflect), then superpose.","answer":"Reflect (flip) one triangle so it is no longer a mirror image; then the same superposition proof works. Congruence does not require same orientation."}],"end":"Q.E.D.","sort":2.0},{"id":"thm:3","num":3,"title":"Base angles of an isosceles triangle","aka":null,"kind":"theorem","statement":"In an isosceles triangle, the base angles are equal to each other, and the angles under the base are equal to each other.","steps":[{"hlNot":["pt:B"],"hlDraw":true,"hlBeats":[["seg:AB","seg:BF","seg:AC","seg:CG"],["pt:D","seg:AB","seg:BF"],["seg:BD","tick:BD","pt:D"]],"hlBeatDelay":1300,"hlBeatMs":1100,"text":"Let △ABC be isosceles with AB = AC. We claim ∠ABC = ∠ACB, and (extending the equal sides past the base to F and G) the angles under the base are equal too. Pick D at random on BF.","cites":["def:20"]},{"hlDraw":true,"hlIds":["seg:BD","tick:BD","seg:CE","tick:CE","pt:D","pt:E"],"hlExpand":"none","text":"Cut off CE = BD by drawing a circle around C with radius BD, meeting CG at E.","cites":["post:3"]},{"text":"Join BE and join CD.","cites":["post:1"]},{"text":"AB = AC (given) and BD = CE (Step 2), so AD = AE (sums of equals).","cites":["cn:2"]},{"text":"AC = AB (given isosceles) and ∠BAC is common to △ADC and △AEB."},{"text":"△ADC ≅ △AEB by Side-Angle-Side.","cites":["thm:2"]},{"text":"Corresponding parts: ∠ADC = ∠AEB and DC = EB. Also BD = CE, so △BDC ≅ △CEB by SAS.","cites":["thm:2"]},{"text":"∠EBA = ∠DCA (from △ADC ≅ △AEB) and ∠EBC = ∠DCB (from △CEB ≅ △BDC), so the remainders ∠CBA = ∠BCA.","cites":["cn:3"]},{"text":"The angles under the base, ∠DBC and ∠ECB, are also equal (corresponding angles of △BDC & △CEB)."}],"remarks":["Strategy: first prove the large overlapping triangles congruent, then the small ones under the base; then subtract equals from equals.","This is a universal truth: it holds for every isosceles triangle, always and everywhere."],"questions":[{"q":"Prove the same result by flipping △ABC onto itself.","hint":"AB = AC so the sides swap places; the base angles must swap places too.","answer":"Flip △ABC over the angle bisector of ∠A (or over the altitude from A). Side AB lands on AC because they are equal, so ∠ABC lands exactly where ∠ACB was — hence the base angles are equal."},{"q":"Use Theorem 3 to prove that all three angles of an equilateral triangle are equal.","hint":"Any two sides are equal, so any two base angles are equal.","answer":"In equilateral △ABC, AB = AC so base angles at B and C are equal (Thm. 3). Likewise AB = BC gives angles at A and C equal, and AC = BC gives angles at A and B equal. So all three angles are equal."}],"end":"Q.E.D.","sort":3.0},{"id":"thm:4","num":4,"title":"Converse of the isosceles base-angle theorem","aka":null,"kind":"theorem","statement":"If two angles in a triangle are equal to each other, then the sides opposite them are also equal — the triangle is isosceles (at least two sides equal).","steps":[{"text":"In △ABC suppose ∠ABC = ∠ACB. First take side AB, the base BC, and the angle they contain, ∠ABC."},{"text":"Likewise take the other side AC, the same base BC, and the equal angle they contain, ∠ACB."},{"text":"Claim: AB = AC — the triangle is isosceles (and drawn so). Both base angles are equal, so the sides opposite them should be equal."},{"text":"Assume for contradiction that AB > AC. We will cut from the longer side a piece equal to the shorter."},{"text":"From AB cut off BD = AC further down AB toward A (by a circle around B with radius AC) and join CD.","cites":["post:3","post:1"]},{"text":"In △DBC and △ACB: BD = AC, ∠DBC = ∠ACB (given), and BC is common — so △DBC ≅ △ACB by SAS.","cites":["thm:2"]},{"text":"But then their areas are equal — yet △DBC is a part of △ACB, and a part is less than the whole. Absurd!","cites":["cn:5"]},{"text":"So the assumption AB > AC is impossible. By the same reasoning AC is not greater than AB."},{"text":"Therefore neither side is greater: AB = AC."}],"remarks":["This is a reductio ad absurdum (reduction to the absurd / indirect proof).","Theorem 4 is the converse of Theorem 3: equal base angles ⇔ isosceles (at least two equal sides).","Not every converse of a true statement is true — this one needed a real proof."],"questions":[{"q":"Use Theorem 4 to prove that any triangle with three equal angles is equilateral.","hint":"Equal angles ⇒ opposite sides equal, thrice.","answer":"If all three angles are equal, then any two are equal, so by Thm. 4 the sides opposite those angles are equal. Doing this for each pair of angles shows all three sides equal — equilateral."}],"end":"Q.E.D.","sort":4.0},{"id":"thm:5","num":5,"title":"Two triangles cannot stand on the same base with the same sides","aka":"Triangles are rigid","kind":"theorem","statement":"If two triangles stand on the same base and on the same side of it, they cannot have the two sides drawn from one end of the base equal to each other, and the two sides drawn from the other end equal to each other, and yet be different triangles.","steps":[{"text":"A square of four hinged rods can be kicked over into a slanted shape, keeping every rod the same length. Can a triangle do the same?","note":"Motivation"},{"text":"Suppose △ABM and another △ABN stood on the same base AB, on the same side, with AM = AN and BM = BN, and yet with different angles."},{"text":"Join MN.","cites":["post:1"]},{"text":"Since AM = AN, △AMN is isosceles, so its base angles are equal: ∠AMN = ∠ANM (Thm. 3).","cites":["thm:3"],"hl":"angles"},{"text":"Ray MB cuts ∠AMN into ∠AMB and ∠BMN, so ∠AMN = ∠AMB + ∠BMN. But ∠AMN = ∠ANM; therefore ∠AMB + ∠BMN = ∠ANM.","hl":"angles"},{"text":"Likewise, since BM = BN, △BMN is isosceles, so its base angles are equal: ∠BMN = ∠BNM (Thm. 3).","cites":["thm:3"],"hl":"angles"},{"text":"Ray NA cuts ∠BNM into ∠ANM and ∠BNA, so ∠BNM = ∠ANM + ∠BNA. Therefore ∠BMN = ∠ANM + ∠BNA.","hl":"angles"},{"text":"In the equality ∠AMB + ∠BMN = ∠ANM, replace ∠BMN by ∠ANM + ∠BNA. That gives ∠AMB + ∠ANM + ∠BNA = ∠ANM.","hl":"angles"},{"text":"Hence ∠ANM = ∠ANM + ∠AMB + ∠BNA — an angle equal to itself plus two further angles. Impossible!","cites":["cn:5"],"hl":"angles"},{"text":"So the supposition is impossible: on one base, on one side, there cannot be two such triangles. Keep the three sides and the angles cannot change — triangles are rigid."}],"remarks":["This is what people mean when they say **triangles are rigid**: given three straight lines that make a triangle, you cannot take them apart and put them together again to get a different triangle. Try it.","The proof is a “reduction to the absurd” (reductio ad absurdum): we suppose the opposite of what we want, draw an impossible consequence out of it, and so condemn the supposition.","Two triangles on the same base *can* have identical sides without coinciding — △ABC and △ABD on opposite sides of AB. But they are mirror images: you get one from the other by flipping, not by tilting.","This is why bridges and roof frames are full of triangular braces. Rectangles fold over; triangles do not."],"questions":[{"q":"Five sticks make a pentagon (one nail per corner). How many cross braces are needed to make it rigid?","hint":"Think about triangulating the polygon.","answer":"A pentagon needs two non-crossing diagonals from one vertex (or equivalent bracing) to triangulate into three triangles — generally two braces. Many configurations work (different pairs of diagonals)."}],"end":"Q.E.D.","sort":5.0},{"id":"thm:6","num":6,"title":"Side-Side-Side (SSS)","aka":"SSS Congruence","kind":"theorem","statement":"If the three sides of one triangle are equal to the three corresponding sides of another triangle, then the two triangles also have their corresponding angles equal (those between equal sides), and equal areas.","steps":[{"text":"Let △A and △B have three pairs of equal corresponding sides. Place them on the same base CD with equal sides sharing endpoints C and D, so CA = CB and DA = DB."},{"text":"If A and B did not coincide, then △BCD would have sides equal to those of △ACD yet slant differently — triangles would not be rigid."},{"text":"But triangles are rigid (Thm. 5), so A and B must coincide.","cites":["thm:5"]},{"text":"Thus CA coincides with CB and DA with DB; all corresponding angles coincide."},{"text":"Things that coincide are equal: the triangles have equal corresponding angles and equal areas.","cites":["cn:4"]}],"remarks":["SSS is our second triangle-congruence theorem (after SAS).","Mirror images are fine: flip one triangle first."],"questions":[{"q":"Using SSS, prove that the two equilateral triangles on the same straight line (one above, one below) are equal to each other.","hint":"All three pairs of sides match by construction of Thm. 1.","answer":"Both equilateral triangles on AB (above and below) have sides AB, AC, BC and AB, AD, BD respectively with AC=AB=BC and AD=AB=BD by radii, so all three pairs of sides match; SSS gives congruence."}],"end":"Q.E.D.","sort":6.0},{"id":"thm:7","num":7,"title":"How to bisect any rectilineal angle","aka":null,"kind":"construction","statement":"Given any rectilineal angle ABC, construct the ray that bisects it.","steps":[{"text":"Pick any point D on AB, and draw a circle around B with radius BD, cutting off BE = BD.","cites":["post:3"]},{"text":"Join DE.","cites":["post:1"]},{"text":"Make equilateral triangle DEF on DE.","cites":["thm:1"]},{"text":"Join BF. Claim: BF bisects ∠DBE, i.e. ∠FBD = ∠FBE.","cites":["post:1"],"hlIds":["ang:FBD","ang:FBE"]},{"text":"BE = BD (by construction)."},{"text":"FE = FD (sides of equilateral triangle).","cites":["def:20"]},{"text":"BF is common to △FBD and △FBE.","hlIds":["seg:BF"],"hlExpand":"none"},{"text":"So the three sides of △FBD equal the three sides of △FBE; corresponding angles are equal (SSS).","cites":["thm:6"],"hlBeats":[["poly:FBD"],["poly:FBE"]],"hlBeatMs":1000},{"text":"Therefore ∠FBD = ∠FBE.","hlBeats":[["ang:FBD","ang:FBE","seg:BD","seg:BF","seg:BE"],["ang:ABC","ang:FBD","ang:FBE","seg:BA","seg:BC","seg:BF","seg:BD","seg:BE","pt:A","pt:B","pt:C"]],"hlBeatMs":1100}],"remarks":["There is no smallest rectilineal angle: any angle can be bisected again.","Trisection with only straightedge and compass is impossible for a general angle.","A right angle is 90°; half a turn (straight line) is 180°."],"questions":[{"q":"Does the construction still work if the equilateral triangle is built on the other side of DE?","hint":"Check whether SSS still applies to the two small triangles.","answer":"Yes — SSS still compares the two small triangles formed with the bisector, as long as F is equidistant from D and E."},{"q":"Draw any triangle and bisect all three angles. What do you notice?","hint":"The three bisectors meet at one point (the incenter).","answer":"They meet in a single interior point (the incenter), center of the inscribed circle."}],"end":"Q.E.F.","sort":7.0},{"id":"thm:8","num":8,"title":"How to bisect any straight line","aka":null,"kind":"construction","statement":"Given a straight line AB, construct its midpoint.","steps":[{"text":"Make equilateral triangle ABC on AB.","cites":["thm:1"]},{"text":"Bisect ∠ACB with line CD meeting AB at D.","cites":["thm:7"]},{"text":"AC = CB (equilateral).","cites":["def:20"]},{"text":"∠ACD = ∠BCD (CD bisects the angle)."},{"text":"CD is common to △ACD and △BCD."},{"text":"By SAS, corresponding sides and angles of △ACD and △BCD are equal.","cites":["thm:2"]},{"text":"Therefore AD = DB. D is the midpoint of AB."}],"remarks":["There is no smallest straight line: any segment can be bisected again.","Cutting a segment into three equal parts is possible later with more tools from this book."],"questions":[{"q":"Looking back at Theorem 1’s diagram, what is the fewest steps to bisect a segment?","hint":"The line joining the two circle intersections already bisects AB.","answer":"The line through the two intersection points of the circles in Thm. 1 already meets AB at its midpoint — fewer steps than equilateral + angle bisector."},{"q":"Bisect the three sides of a triangle and join each vertex to the midpoint of the opposite side. What happens?","hint":"The three medians meet at one point (the centroid).","answer":"The three medians meet in a single point (the centroid), which divides each median in a 2:1 ratio."}],"end":"Q.E.F.","sort":8.0},{"id":"thm:9","num":9,"title":"Erect a perpendicular from a point on a line","aka":null,"kind":"construction","statement":"Given a straight line AB and a point P on it, draw a line from P at right angles to AB.","steps":[{"text":"Pick any point C on AP; draw a circle around P with radius PC, cutting off PD = PC.","cites":["post:3"]},{"text":"Make equilateral triangle CDR on CD.","cites":["thm:1"]},{"text":"Join PR. Claim: PR ⊥ AB.","cites":["post:1"]},{"text":"PD = PC (construction)."},{"text":"CR = DR (equilateral).","cites":["def:20"]},{"text":"PR is common to △RPC and △RPD."},{"text":"By SSS, corresponding angles of △RPC and △RPD are equal.","cites":["thm:6"]},{"text":"So ∠RPC = ∠RPD."},{"text":"These are adjacent angles formed by PR standing on AB and are equal — therefore they are right angles.","cites":["def:9"]},{"text":"Thus PR is perpendicular to AB at P.","cites":["def:10"]}],"remarks":["We have now drawn right triangles (△RPC and △RPD).","In practice, carpenters use a square — but the square itself is made by geometry."],"questions":[{"q":"Prove: any point on the perpendicular bisector of a segment is equidistant from both endpoints.","hint":"Use SSS or SAS with the two right triangles formed.","answer":"Let RB be the perpendicular bisector of CD at B. For any R on that line, RC and RD: RB common, CB=DB, and right angles (or use SSS on the two right triangles) ⇒ RC=RD."}],"end":"Q.E.F.","sort":9.0},{"id":"thm:10","num":10,"title":"Drop a perpendicular from a point to a line","aka":null,"kind":"construction","statement":"Given a straight line AB and a point P not on it, drop a perpendicular from P to AB.","steps":[{"text":"Choose any point D on the opposite side of AB from P."},{"text":"Draw a circle around P with radius PD, cutting AB at G and E.","cites":["post:3"]},{"text":"Join GP and EP.","cites":["post:1"]},{"text":"Bisect GE at H.","cites":["thm:8"]},{"text":"Join PH. Claim: PH ⊥ AB.","cites":["post:1"]},{"text":"PG = PE (radii of circle P).","cites":["def:17"]},{"text":"HG = HE (bisected)."},{"text":"PH is common to △PHG and △PHE."},{"text":"By SSS, corresponding angles are equal.","cites":["thm:6"]},{"text":"So ∠PHG = ∠PHE; they are adjacent and equal on a straight line, hence right angles.","cites":["def:9"]},{"text":"Therefore PH is perpendicular to AB.","cites":["def:10"]}],"remarks":["Theorem 10 is the opposite of Theorem 9: the point is off the line rather than on it.","If P is not “above” the segment, extend AB first (Postulate 2)."],"questions":[{"q":"Do you need to draw PG and EP to construct PH, or only to prove it?","hint":"They serve the proof; a shorter construction exists for practice.","answer":"PG and EP are for the proof. In practice you can find the two intersections of a suitable circle with the line and join the midpoint of that chord to P — the essential construction steps, not every proof line."}],"end":"Q.E.F.","sort":10.0},{"id":"thm:11","num":11,"title":"Adjacent angles on a straight line","aka":null,"kind":"theorem","statement":"When one straight line stands on another, the adjacent angles add up to two right angles.","steps":[{"text":"If PB is perpendicular to CD, clearly ∠PBC + ∠PBD = two right angles. Now let AB stand on CD not necessarily perpendicularly."},{"text":"Draw BP perpendicular to CD.","cites":["thm:9"]},{"text":"Then ∠PBC + ∠PBD = two right angles.","cites":["def:9"]},{"text":"But ∠PBC + ∠PBD = ∠1 + ∠2 + ∠3 (the pieces of the same region)."},{"text":"So ∠1 + ∠2 + ∠3 = two right angles.","cites":["cn:1"],"hlBeats":[["ang:1","ang:2","ang:3"],["sq1","sq2","seg:CD","seg:BP"]],"hlBeatMs":1000},{"text":"But ∠1 + ∠2 + ∠3 = ∠ABC + ∠ABD."},{"text":"Therefore ∠ABC + ∠ABD = two right angles.","cites":["cn:1"]}],"remarks":["Angles supplementary to the same angle are equal to each other.","With Thm. 11 we can restate Postulate 5: if two lines make less than two right angles on one side of a transversal, they meet on that side."],"questions":[{"q":"If ∠ABC and ∠ABD are adjacent on a straight line, what is each called relative to the other?","hint":"Supplementary.","answer":"They are supplementary: adjacent angles on a straight line add to two right angles."}],"end":"Q.E.D.","sort":11.0},{"id":"thm:12","num":12,"title":"Converse: angles sum to two rights ⇒ straight line","aka":null,"kind":"theorem","statement":"If two adjacent angles add up to two right angles, then the outer legs form one straight line.","steps":[{"text":"Let ∠APB + ∠BPC = two right angles. Claim: A, P, C are collinear (AP and PC form a straight line).","hlIds":["ang:APB","ang:BPC","seg:AP1","seg:PC1","seg:PB","pt:A","pt:P","pt:B","pt:Ccol"]},{"text":"Suppose PC is not the extension of AP. Extend AP to some point X.","cites":["post:2"],"hlBeats":[["seg:AP","seg:rPB","seg:PC","ang:rAPB","ang:rBPC"],["seg:AP","seg:rPB","seg:PC","ang:rAPB","ang:rBPC","seg:PX","pt:X","txt:suppose"]],"hlBeatMs":1100,"hlFirstStatic":true,"hlBeatDelay":800},{"text":"Then ∠1 + ∠2 = two right angles (Thm. 11, since APX is straight).","cites":["thm:11"],"hlIds":["ang:1","ang:2"]},{"text":"But ∠APB + ∠BPX = two right angles is only ∠1 + ∠2; what is given, that ∠APB + ∠BPC = two right angles, is here ∠1 + ∠2 + ∠3 = two right angles.","hlBeats":[["ang:rAPB","ang:rBPC"],["seg:AP","seg:rPB","seg:PC","seg:PX"],["ang:1","seg:AP","seg:rPB","seg:PC","seg:PX"],["ang:1","ang:2","seg:AP","seg:rPB","seg:PC","seg:PX"],["ang:1","ang:2","ang:3","seg:AP","seg:rPB","seg:PC","seg:PX"]],"hlBeatMs":950,"hlFirstStatic":true},{"text":"So ∠1 + ∠2 = ∠1 + ∠2 + ∠3 (both equal two rights; using that all right angles are equal).","cites":["post:4","cn:1"]},{"text":"But then a whole equals a proper part, i.e. ∠2 = ∠2 + ∠3 — impossible.","cites":["cn:5"]},{"text":"Therefore PC is the straight extension of AP.","hlBeats":[null,["ang:APB","ang:BPC","seg:AP1","seg:PC1","seg:PB","pt:A","pt:P","pt:B","pt:Ccol"]],"hlBeatDelay":950,"hlBeatMs":950}],"remarks":["Theorem 12 is the converse of Theorem 11.","First essential use of Postulate 4 (all right angles equal) in comparing “two right angles” quantities."],"questions":[],"end":"Q.E.D.","sort":12.0},{"id":"thm:13","num":13,"title":"Vertical angles are equal","aka":null,"kind":"theorem","statement":"When two straight lines cut each other, they make the vertical (opposite) angles equal.","steps":[{"text":"Let AB and CD cut at P. Claim: vertical angles are equal — ∠1 = ∠3 and ∠2 = ∠4."},{"text":"∠1 + ∠2 = two right angles (Thm. 11).","cites":["thm:11"]},{"text":"∠3 + ∠2 = two right angles (Thm. 11).","cites":["thm:11"]},{"text":"So ∠1 + ∠2 = ∠3 + ∠2.","cites":["cn:1"]},{"text":"Subtract ∠2 from both sides: ∠1 = ∠3.","cites":["cn:3"],"hlBeats":[["ang:1","ang:2","ang:3"],["ang:1","ang:3"]],"hlBeatMs":1000},{"text":"Likewise ∠2 = ∠4.","cites":["cn:3"]}],"remarks":["Vertical angles are mirror images across the vertex — a symmetry of straight lines.","A partial converse: equal angles sharing a vertex with alternate legs collinear force the remaining legs collinear."],"questions":[{"q":"How many degrees do ∠1 + ∠2 + ∠3 + ∠4 make together?","hint":"Two pairs of two right angles.","answer":"∠1+∠2+∠3+∠4 = four right angles (360°), since two pairs each make two right angles."}],"end":"Q.E.D.","sort":13.0},{"id":"thm:14","num":14,"title":"Exterior angle greater than remote interior","aka":null,"kind":"theorem","statement":"If any side of a triangle is extended, the exterior angle is greater than either of the interior and opposite (remote) angles.","steps":[{"text":"In △ABC extend BC to D. Claim: exterior ∠ACD > ∠BAC and ∠ACD > ∠ABC."},{"text":"Bisect AC at E; join BE and produce it to F with EF = BE; join CF.","cites":["thm:8","post:1","post:2"]},{"text":"EF = BE and EA = EC."},{"text":"∠AEB = ∠CEF (vertical angles).","cites":["thm:13"]},{"text":"By SAS, corresponding angles of △AEB and △CEF are equal.","cites":["thm:2"]},{"text":"So ∠BAC = ∠ECF (corresponding). But ∠ACD > ∠ECF (whole > part).","cites":["cn:5"]},{"text":"Therefore ∠ACD > ∠BAC."},{"text":"Similarly, by bisecting BC and extending AC, ∠ACD > ∠ABC (using vertical angles again).","cites":["thm:13"]}],"remarks":["Later (Thm. 28) we learn the exterior angle equals the sum of the two remote interiors — which explains why it is greater than each."],"questions":[],"end":"Q.E.D.","sort":14.0},{"id":"thm:15","num":15,"title":"Greater side opposite greater angle","aka":null,"kind":"theorem","statement":"In any triangle, a greater side has opposite to it a greater angle.","steps":[{"text":"In △ABC suppose AC > AB. Claim: ∠ABC > ∠BCA."},{"text":"Cut off AD = AB on AC; join BD.","cites":["post:1"]},{"text":"∠ABD = ∠ADB (base angles of isosceles △ABD).","cites":["thm:3"]},{"text":"∠ADB > ∠ACB because ∠ADB is exterior to △BDC.","cites":["thm:14"]},{"text":"So ∠ABD > ∠ACB."},{"text":"But ∠ABC > ∠ABD (whole > part).","cites":["cn:5"]},{"text":"Therefore ∠ABC > ∠ACB."}],"remarks":["Greatest side opposite greatest angle; least opposite least. Equal sides opposite equal angles (Thm. 3).","Angles are NOT proportional to opposite sides — double a side does not double the angle!"],"questions":[],"end":"Q.E.D.","sort":15.0},{"id":"thm:16","num":16,"title":"Greater angle opposite greater side","aka":null,"kind":"theorem","statement":"In any triangle, a greater angle has opposite to it a greater side.","steps":[{"text":"In △ABC suppose ∠ABC > ∠ACB. Claim: AC > AB."},{"text":"Only three possibilities: AC = AB, or AC < AB, or AC > AB."},{"text":"If AC = AB, then ∠ABC = ∠ACB by Thm. 3 — contradicting the given inequality.","cites":["thm:3"]},{"text":"If AC < AB, then by Thm. 15 we would have ∠ABC < ∠ACB — again a contradiction.","cites":["thm:15"]},{"text":"Therefore AC is neither equal nor less than AB: AC > AB."}],"remarks":["Converse of Theorem 15. Strategy: process of elimination among three trichotomy cases.","No construction at all — pure logic from prior theorems."],"questions":[],"end":"Q.E.D.","sort":16.0},{"id":"thm:17","num":17,"title":"Triangle inequality","aka":null,"kind":"theorem","statement":"In any triangle, any side is less than the sum of the other two sides, but greater than their difference.","steps":[{"text":"In △ABC claim BA + AC > BC (and cyclic)."},{"text":"Extend BA to D with AD = AC; join CD.","cites":["post:2","post:1"]},{"text":"∠BCD > ∠ACD (whole > part), and ∠ACD = ∠ADC (isosceles △ACD), so ∠BCD > ∠ADC.","cites":["thm:3","cn:5"]},{"text":"In △DBC, the side opposite the greater angle is greater: BD > BC.","cites":["thm:16"]},{"text":"But BD = BA + AD = BA + AC, so BA + AC > BC."},{"text":"Likewise the other two inequalities. Also BA > BC − AC by subtracting AC from both sides of BA + AC > BC.","cites":["cn:3"]}],"remarks":["A straight line is the shortest distance between two points (“as the crow flies”).","Three lengths form a triangle only if any two sum to more than the third."],"questions":[{"q":"Which of these can form a triangle? (a) 3,4,5 (b) 1,2,3 (c) 1,1,1 (d) 1,10,11","hint":"Check each pair-sum against the third side.","answer":"(a) yes (b) no — 1+2=3 (c) yes? 1+1>1 (d) yes (e) no — 1+10=11 (f) yes (g) yes (h) yes. Degenerate when equality holds (b,e)."}],"end":"Q.E.D.","sort":17.0},{"id":"thm:18","num":18,"title":"Shortest path to a line is the perpendicular","aka":null,"kind":"theorem","statement":"The shortest distance from a point to a straight line is the perpendicular from the point to the line.","steps":[{"text":"From point P drop perpendicular PL to line AB (Thm. 10). Let R be any other point on AB. Claim: PR > PL.","cites":["thm:10"]},{"text":"Consider right triangle PLR. ∠PLR is a right angle.","cites":["def:9","def:10"]},{"text":"∠PRL is acute (less than a right angle), so ∠PLR > ∠PRL.","cites":["def:11"]},{"text":"In △PLR, the greater angle has the greater opposite side (Thm. 16). Side opposite ∠PLR is PR; side opposite ∠PRL is PL.","cites":["thm:16"]},{"text":"Therefore PR > PL. The perpendicular is shorter than any other straight line from P to AB.","hlBeats":[["seg:PL","seg:PR","pt:P","pt:L","pt:R","txt:gt"],["seg:PL","seg:AB","sq:PL","pt:P","pt:L"]],"hlBeatMs":1100}],"remarks":["Among all straight segments from a point to a line, the perpendicular is the shortest.","This pairs with Theorem 17: a straight line is the shortest path between two points."],"questions":[],"end":"Q.E.D.","sort":18.0},{"id":"thm:19","num":19,"title":"Construct a triangle from three sides","aka":null,"kind":"construction","statement":"Given three straight lines X, Y, Z such that any two together are greater than the third, construct a triangle with those side lengths.","steps":[{"text":"Place X as DA and extend to E as needed; cut off AB = Y and BF = Z.","cites":["post:2","post:3"],"hlBeats":[["seg:X"],["seg:DA","tick:DA"],["seg:AE"],["seg:Y","lab:Y","cir:cutY","seg:AB","pt:A","pt:B"],["seg:Y","lab:Y","seg:AB","tick:AB","pt:A","pt:B"],["seg:Z","lab:Z"],["seg:Z","lab:Z","cir:cutZ","seg:BF","pt:B","pt:F"],["seg:Z","lab:Z","seg:BF","tick:BF","pt:B","pt:F"]],"hlBeatMs":1100},{"text":"Draw circle around A with radius AD (= X).","cites":["post:3"]},{"text":"Draw circle around B with radius BF (= Z).","cites":["post:3"]},{"text":"Because the triangle inequalities hold, the circles overlap and each passes outside the other — they must intersect.","cites":["thm:17"],"hlIds":["pt:C"],"hlExpand":"none"},{"text":"Call an intersection C; join AC and CB.","cites":["post:1"]},{"text":"Then AC = X, AB = Y, BC = Z: △ABC is constructed.","hlBeats":[["seg:AC","seg:X","lab:X"],["seg:AB","seg:Y","lab:Y","tick:AB"],["seg:CB","seg:Z","lab:Z"],"clear"],"hlBeatMs":1100}],"remarks":["Converse of Theorem 17: the inequality condition is also sufficient."],"questions":[{"q":"Make a triangle with sides 3, 4, 5. What do you notice?","hint":"Check the angles — especially the one opposite 5.","answer":"It is a right triangle (3-4-5). The angle opposite 5 is a right angle (Thm. 37 later makes this rigorous; for now you may notice the square corner)."}],"end":"Q.E.F.","sort":19.0},{"id":"thm:20","num":20,"title":"Copy an angle","aka":null,"kind":"construction","statement":"Given an angle X and a ray PR, construct an angle at P, with one side along PR, equal to angle X.","steps":[{"text":"Pick points A and B on the legs of ∠X and join AB.","cites":["post:1"]},{"text":"On ray PR, cut off PS = XA, PT = XB, and TV = AB (using circles/postulates as needed).","cites":["post:3"]},{"text":"Construct △PZT with sides equal to those of △XAB (Thm. 19).","cites":["thm:19"]},{"text":"By SSS, corresponding angles are equal: ∠ZPT = ∠AXB.","cites":["thm:6"]},{"text":"∠ZPT begins at P with one leg along PR, as required."}],"remarks":["This construction also lets us duplicate an entire triangle."],"questions":[],"end":"Q.E.F.","sort":20.0},{"id":"thm:21","num":21,"title":"Angle-Side-Angle (ASA)","aka":"ASA Congruence","kind":"theorem","statement":"If in a triangle two angles and the side joining them are respectively equal to two angles and the side joining them in another triangle, then all corresponding sides and angles are equal, and the triangles have equal area.","steps":[{"text":"Given △ABC, △DEF with ∠BAC = ∠EDF, AB = DE, ∠ABC = ∠DEF."},{"text":"Place AB on DE (equal lengths): A on D, B on E.","cites":["cn:4"]},{"text":"Because ∠BAC = ∠EDF, ray AC lies along ray DF."},{"text":"Because ∠ABC = ∠DEF, ray BC lies along ray EF."},{"text":"Therefore C, the intersection of AC and BC, sits on F."},{"text":"The three sides coincide; by SSS (or coincidence) the triangles are congruent with equal areas.","cites":["thm:6","cn:4"]}],"remarks":["Third congruence criterion: SAS, SSS, ASA."],"questions":[],"end":"Q.E.D.","sort":21.0},{"id":"thm:22","num":22,"title":"Angle-Angle-Side (AAS)","aka":"AAS Congruence","kind":"theorem","statement":"If two triangles have two angles equal to two angles, and a side equal to a corresponding side opposite an equal angle, then they have all corresponding sides and angles equal, and equal areas.","steps":[{"text":"Given ∠BCA = ∠EFD, ∠BAC = ∠EDF, and AB = DE (sides opposite a pair of equal angles, in Augros’s setup)."},{"text":"Place AB on DE. A on D, B on E; AC along DF because ∠A = ∠D."},{"text":"Suppose AC < DF so C lands at C′ on DF. Then ∠ at E in △DC′E equals original ∠B, hence ∠C′ equals ∠F — making an exterior angle equal a remote interior. Impossible (Thm. 14).","cites":["thm:14"],"hlBeats":[["pt:C′","seg:DF","seg:ECq","pt:D","pt:F","pt:E"],["ang:Cq","ang:F","seg:ECq","seg:DF","seg:EF","pt:C′","pt:F","pt:E","pt:D"]],"hlBeatMs":1100},{"text":"Similarly AC cannot exceed DF. So AC = DF."},{"text":"Now AB = DE, ∠A = ∠D, AC = DF ⇒ congruent by SAS.","cites":["thm:2"],"hlBeats":[["seg:AB","seg:DE","ang:A","ang:D","seg:AC","seg:DF"],["poly:ABC","poly:DEF"],"clear"],"hlBeatMs":1100}],"remarks":["Fourth congruence criterion: SAS, SSS, ASA, AAS.","SSA is NOT a general congruence theorem (the ambiguous case)."],"questions":[],"end":"Q.E.D.","sort":22.0},{"id":"thm:23","num":23,"title":"Equal alternate angles ⇒ parallel","aka":null,"kind":"theorem","statement":"If two straight lines are cut by a third making the alternate angles equal, then the two straight lines are parallel.","steps":[{"text":"Let EF cut AB and CD with alternate angles ∠1 = ∠2. Claim: AB ∥ CD."},{"text":"Suppose not: extend so that EB and FD meet at X on one side, forming △EFX.","hlIds":["seg:EX","seg:FX","pt:X","seg:EF"],"hlExpand":"none"},{"text":"Then ∠1 is exterior to △EFX and ∠2 is a remote interior angle.","hlIds":["seg:EX","seg:FX","pt:X","ang:1","ang:2","seg:EF"]},{"text":"But ∠1 = ∠2 by given — contradicting Thm. 14 (exterior > remote interior).","cites":["thm:14"]},{"text":"Therefore AB and CD never meet: they are parallel.","cites":["def:22"]}],"remarks":["We can prove lines never meet without checking infinitely far!","The cutting line EF is called a transversal."],"questions":[],"end":"Q.E.D.","sort":23.0},{"id":"thm:24","num":24,"title":"Co-interior angles supplementary ⇒ parallel","aka":null,"kind":"theorem","statement":"If two straight lines are cut by a third making interior angles on the same side add up to two right angles, then the two lines are parallel.","steps":[{"text":"Let EF cut AB and CD with ∠2 + ∠3 = two right angles. Claim: AB ∥ CD."},{"text":"∠2 + ∠3 = two rights (given)."},{"text":"∠2 + ∠1 = two rights (adjacent on a straight line).","cites":["thm:11"]},{"text":"So ∠2 + ∠3 = ∠2 + ∠1, hence ∠3 = ∠1.","cites":["cn:1","cn:3"]},{"text":"But equal alternate angles ⇒ parallel.","cites":["thm:23"]}],"remarks":["Postulate 5: if co-interior angles sum to less than 180°, lines meet. Thm. 24: if they sum to exactly 180°, lines do not meet.","Corollary: only one perpendicular from a point to a line."],"questions":[],"end":"Q.E.D.","sort":24.0},{"id":"thm:25","num":25,"title":"Parallel ⇒ alternate equal and co-interior supplementary","aka":null,"kind":"theorem","statement":"If a straight line cuts two parallels, it makes alternate angles equal and interior angles on the same side supplementary (sum to two right angles).","steps":[{"text":"Let AB ∥ CD cut by transversal EGHF. Claim: alternate ∠1 = ∠3 and co-interior ∠2 + ∠3 = two rights.","cites":["def:22"]},{"text":"Suppose ∠1 > ∠3. Then ∠1 + ∠2 > ∠3 + ∠2."},{"text":"But ∠1 + ∠2 = two rights, so two rights > ∠3 + ∠2.","cites":["thm:11"]},{"text":"By Postulate 5 (restated), AB and CD would meet on that side — contradicting parallelism.","cites":["post:5"]},{"text":"Similarly ∠1 < ∠3 is impossible. Therefore ∠1 = ∠3."},{"text":"Then ∠2 + ∠3 = ∠2 + ∠1 = two right angles.","cites":["thm:11"]}],"remarks":["Converse of Theorems 23 and 24. First essential use of Postulate 5 in a theorem.","Order matters: we first learn when lines must be parallel (constructible criteria), then what follows from being parallel."],"questions":[{"q":"Prove that through a point P only one line can be parallel to a given line AB.","hint":"Assume two parallels through P and use a transversal.","answer":"Assume two parallels through P to AB. A transversal from P to a point on AB makes alternate angles that force the two supposed parallels to coincide — only one such line."}],"end":"Q.E.D.","sort":25.0},{"id":"thm:26","num":26,"title":"Transitivity of parallelism","aka":null,"kind":"theorem","statement":"Straight lines parallel to the same straight line are parallel to each other.","steps":[{"text":"Let A ∥ B and B ∥ C. Claim: A ∥ C."},{"text":"Cut all three with transversal D, forming angles 1, 2, 3, 4.","cites":["post:1"]},{"text":"∠1 = ∠2 (A ∥ B).","cites":["thm:25"]},{"text":"∠2 = ∠3 (vertical angles).","cites":["thm:13"]},{"text":"∠1 = ∠3.","cites":["cn:1"]},{"text":"∠3 = ∠4 (B ∥ C).","cites":["thm:25"]},{"text":"∠1 = ∠4, so A ∥ C (equal alternate angles).","cites":["thm:23"]}],"remarks":["Parallelism behaves like equality (transitive). Perpendicularity does not: two perpendiculars to the same line are parallel to each other, not perpendicular."],"questions":[],"end":"Q.E.D.","sort":26.0},{"id":"thm:27","num":27,"title":"Draw a parallel through a point","aka":null,"kind":"construction","statement":"Given a line AB and a point P not on it, draw the line through P parallel to AB.","steps":[{"text":"Pick any point X on AB; join PX.","cites":["post:1"]},{"text":"At P, construct ∠LPX = ∠PXB (copy the alternate angle).","cites":["thm:20"]},{"text":"Then PL ∥ AB by equal alternate angles.","cites":["thm:23"]}],"remarks":["In carpentry a more stable practical method uses two equal perpendiculars."],"questions":[],"end":"Q.E.F.","sort":27.0},{"id":"thm:28","num":28,"title":"Angle sum of a triangle","aka":"Triangular Angle-Sum Theorem","kind":"theorem","statement":"In any triangle the three angles add up to two right angles, and an exterior angle equals the sum of the two remote interior angles.","steps":[{"text":"In △ABC with angles 1, 2, 3, extend BC to X. Claim: exterior ∠ACX = 2 + 3, and 1 + 2 + 3 = two rights."},{"text":"Draw CP ∥ BA through C.","cites":["thm:27"]},{"text":"This splits exterior ∠ACX into ∠4 + ∠5."},{"text":"∠2 = ∠4 (alternate angles, BA ∥ CP).","cites":["thm:25"]},{"text":"∠3 = ∠5 (alternate / corresponding with parallels).","cites":["thm:25"]},{"text":"So exterior = 2 + 3 = 4 + 5.","cites":["cn:2"]},{"text":"Thus 1 + 2 + 3 = 1 + 4 + 5 = two right angles (adjacent on straight line BCX).","cites":["thm:11","cn:1"]}],"remarks":["Surprising: wildly different triangles still have the same angle sum!","Corollary: any two angles of a triangle sum to less than 180° (converse flavor of Postulate 5).","In a right triangle the two acute angles are complementary; the hypotenuse is the longest side."],"questions":[{"q":"What is the angle sum of any quadrilateral? Pentagon? Find a pattern for an n-gon.","hint":"Divide into triangles from one vertex.","answer":"Quadrilateral: 360° (two triangles). Pentagon: 540°. Hexagon: 720°. Convex n-gon: (n−2)×180°."},{"q":"Prove every angle of an equilateral triangle is 60°.","hint":"Three equal angles sum to 180°.","answer":"Three equal angles sum to 180°, so each is 60°."}],"end":"Q.E.D.","sort":28.0},{"id":"thm:29","num":29,"title":"Third angle equal","aka":null,"kind":"theorem","statement":"If two triangles have two angles equal to two angles, then the remaining angles are equal.","steps":[{"text":"In △ABC and △DEF let ∠1 = ∠4 and ∠2 = ∠5. Claim: ∠3 = ∠6."},{"text":"1 + 2 + 3 = two rights and 4 + 5 + 6 = two rights.","cites":["thm:28"]},{"text":"So 4 + 5 + 3 = two rights (substituting equals).","cites":["cn:1"]},{"text":"Therefore 4 + 5 + 3 = 4 + 5 + 6, so 3 = 6.","cites":["cn:3"]}],"remarks":["Knowing two angles of a triangle determines the third. Sides do not work that way: many third sides can complete two given sides (within the triangle inequality)."],"questions":[],"end":"Q.E.D.","sort":29.0},{"id":"thm:30","num":30,"title":"One pair parallel and equal ⇒ parallelogram","aka":null,"kind":"theorem","statement":"If one pair of opposite sides in a quadrilateral are both parallel and equal, then the quadrilateral is a parallelogram (the other pair is also parallel and equal).","steps":[{"text":"In quadrilateral ABCD let AB be parallel to DC and AB = DC. Join the diagonal BD.","cites":["post:1"]},{"text":"Because AB ∥ DC with the transversal BD, the alternate angles ∠ABD and ∠BDC are equal (Thm. 25).","cites":["thm:25"]},{"text":"AB = DC (given), and BD is common to △ABD and △CDB.","hlBeats":[["poly:ABD"],["poly:CDB"],["poly:ABD","poly:CDB"]],"hlBeatMs":1000},{"text":"By Side-Angle-Side, △ABD and △CDB are identical.","cites":["thm:2"],"hlBeats":[["seg:AB","seg:DC"],["ang:ABD","ang:BDC","seg:AB","seg:BD","seg:DC"],["seg:BD","tick:BD"],["seg:AB","seg:DC","ang:ABD","ang:BDC","seg:BD","tick:BD","poly:ABD","poly:CDB"]],"hlBeatMs":1000},{"text":"Corresponding angles give ∠ADB = ∠DBC; these are alternate angles for AD and BC, so AD ∥ BC (Thm. 23).","cites":["thm:23"],"hlBeats":[["ang:ADB","seg:AD","seg:BD","pt:A","pt:D","pt:B"],["ang:DBC","seg:BC","seg:BD","pt:D","pt:B","pt:C"],["ang:ADB","ang:DBC","seg:AD","seg:BC","seg:BD","pt:A","pt:D","pt:B","pt:C"]],"hlBeatMs":1000},{"text":"Corresponding sides give AD = BC. So both pairs of opposite sides are parallel and equal: ABCD is a parallelogram.","cites":["def:23"]}],"remarks":["Restated: if two segments are parallel and equal, the lines joining corresponding endpoints are parallel and equal.","This is one of the useful parallelogram criteria."],"questions":[],"end":"Q.E.D.","sort":30.0},{"id":"thm:31","num":31,"title":"Properties of a parallelogram","aka":null,"kind":"theorem","statement":"In any parallelogram, opposite sides and opposite angles are equal, and a diagonal bisects the area of the parallelogram.","steps":[{"text":"In parallelogram ABCD, AB ∥ CD and AD ∥ BC. Draw diagonal AC.","cites":["def:23","post:1"]},{"text":"Alternate angles: ∠BAC = ∠DCA and ∠BCA = ∠DAC.","cites":["thm:25"]},{"text":"AC common; by ASA, △ABC ≅ △CDA.","cites":["thm:21"]},{"text":"Corresponding sides: AB = CD, AD = BC. Corresponding angles give opposite angles equal."},{"text":"The two triangles have equal area, so diagonal AC bisects the parallelogram."}],"remarks":["Partial converse of Thm. 30: both pairs parallel ⇒ both pairs equal."],"questions":[{"q":"Prove that the diagonals of a parallelogram bisect each other.","hint":"Congruent triangles from ASA or SAS with alternate angles.","answer":"Diagonals AC, BD meet at O. Opposite sides parallel ⇒ alternate angles equal; then ASA or SAS on half-triangles shows AO=OC and BO=OD."}],"end":"Q.E.D.","sort":31.0},{"id":"thm:32","num":32,"title":"Parallelograms on the same base and in the same parallels","aka":null,"kind":"theorem","statement":"Parallelograms on the same base and in the same parallels have equal areas.","steps":[{"text":"Let parallelograms ABED and CBEF stand on base BE between parallels AF and BE."},{"text":"Opposite sides of a parallelogram are equal (Thm. 31): AD = BE and CF = BE, so AD = CF. Take away the common piece CD from each and AC = DF.","cites":["thm:31","cn:2"]},{"text":"Also AB = DE and BC = EF (opposite sides). By SSS, △ABC ≅ △DEF.","cites":["thm:6","thm:31"]},{"text":"Equal triangles plus/minus common regions show area(ABED) = area(CBEF).","cites":["cn:2","cn:3"]}],"remarks":["Equal area does not require the same shape — congruence is a stronger relation.","A parallelogram may be slanted without limit and keep the same area on a fixed base between fixed parallels."],"questions":[],"end":"Q.E.D.","sort":32.0},{"id":"thm:33","num":33,"title":"Triangles on the same base and in the same parallels","aka":null,"kind":"theorem","statement":"Triangles on the same base and in the same parallels have equal areas; a triangle on the same base and in the same parallels as a parallelogram has half the parallelogram’s area.","steps":[{"text":"Triangles ABC and ABG stand on base AB in the same parallels."},{"text":"Complete parallelograms ABGK and ABLC on the same base in those parallels.","cites":["thm:27"]},{"text":"Those parallelograms have equal area (Thm. 32).","cites":["thm:32"]},{"text":"Each triangle is half its parallelogram (diagonal bisects — Thm. 31).","cites":["thm:31","prin:halves"],"hlBeats":[["poly:ABC","poly:ABLC","seg:AB","seg:BC","seg:AC"],["poly:BCL","poly:ABLC","seg:BC","seg:CL","seg:BL"],["poly:ABG","poly:ABGK","seg:AB","seg:BG","seg:AG"],["poly:AGK","poly:ABGK","seg:AG","seg:GK","seg:AK"]],"hlBeatMs":1100},{"text":"Halves of equals are equal: the triangles have equal area. Also a triangle is half the parallelogram on the same base in the same parallels.","cites":["prin:halves"]}],"remarks":["This is why the area formulas A = bh (rectangle) and A = ½bh (triangle) work.","“Base” can be any side; the matching height is the perpendicular to that base."],"questions":[{"q":"Why is the area of a rectangle base × height?","hint":"Count unit squares in a grid; height counts rows.","answer":"Fill the rectangle with a grid of unit squares: base counts columns, height counts rows; product is the number of unit squares (area)."}],"end":"Q.E.D.","sort":33.0},{"id":"thm:34","num":34,"title":"Complements of parallelograms about a diagonal","aka":null,"kind":"theorem","statement":"In any parallelogram, the “complements” of the parallelograms about a diagonal are equal in area.","steps":[{"text":"In parallelogram ABCD draw diagonal AC. Through a point K on AC draw lines parallel to the sides, forming small parallelograms about the diagonal and two complementary parallelograms (1) and (2).","cites":["thm:27"]},{"text":"The diagonal bisects each small parallelogram it passes through.","cites":["thm:31"]},{"text":"Adding equal half-parallelograms and comparing with the whole shows complement (1) = complement (2).","cites":["cn:2","cn:3"]}],"remarks":["A famous “surprise equality” of regions that need not look alike."],"questions":[],"end":"Q.E.D.","sort":34.0},{"id":"thm:35","num":35,"title":"How to make a square","aka":null,"kind":"construction","statement":"Given a straight line AB, construct a square having AB as one side.","steps":[{"text":"Erect AE perpendicular to AB and cut off AD = AB.","cites":["thm:9","post:3"]},{"text":"Through D draw a parallel to AB; through B draw a parallel to AD; let them meet at C.","cites":["thm:27"]},{"text":"ABCD is a parallelogram (both pairs parallel).","cites":["def:23"]},{"text":"Adjacent angles on the parallel with the perpendicular force all angles right (using Thm. 25 and opposite angles of a parallelogram).","cites":["thm:25","thm:31","def:9"]},{"text":"Opposite sides equal and AD = AB ⇒ all four sides equal.","cites":["thm:31"]},{"text":"Equilateral + right-angled ⇒ square.","cites":["def:23"]}],"remarks":["We now have two regular polygons: equilateral triangle and square.","A square is a special rectangle and a special rhombus and a special parallelogram."],"questions":[],"end":"Q.E.F.","sort":35.0},{"id":"thm:36","num":36,"title":"The Pythagorean Theorem","aka":"Pythagorean Theorem","kind":"theorem","statement":"In any right triangle, the square on the hypotenuse is equal to the sum of the two squares on the remaining sides.","steps":[{"text":"Right triangle ABC with right angle at A; squares ABFG on AB, ACKH on AC, BCED on hypotenuse BC.","cites":["def:21","thm:35"]},{"text":"Drop AL perpendicular to DE (side of the hypotenuse square), forming rectangles BL and CL. Join AD and CF.","cites":["thm:10","post:1"]},{"text":"GAC is one straight line (two right angles adjacent).","cites":["thm:12"]},{"text":"Show △FBC ≅ △ABD by SAS (FB = AB, BC = BD, included angles equal as each is ∠ABC plus a right angle).","cites":["thm:2"]},{"text":"Double the equal triangles: 2△FBC = 2△ABD.","cites":["cn:2"]},{"text":"2△FBC equals square ABFG (triangle and square/parallelogram on same base in same parallels — Thm. 33).","cites":["thm:33"],"hlBeats":[["poly:FBC"],["poly:FCP","seg:FP6","seg:CP6","seg:BP6","pt:P"],["poly:FBCP","poly:FBC","poly:FCP"],["poly:ABFG"]],"hlBeatMs":1100},{"text":"2△ABD equals rectangle BL (same reason).","cites":["thm:33"],"hlBeats":[["poly:ABD"],["poly:ADQ","seg:AQ7","seg:DQ7","seg:BQ7","pt:Q"],["poly:ABDQ","poly:ABD","poly:ADQ"],["poly:BL"]],"hlBeatMs":1100},{"text":"Therefore square ABFG = rectangle BL. In the same way we can show that square ACKH equals rectangle CL by using steps 2 through 7 again, now treating △AMC as the right triangle in question; by that means square ACKH is equal to rectangle CL.","hlBeats":[["poly:ABFG"],["poly:BL"],["poly:AMC","pt:A","pt:M","pt:C","seg:AL"],["poly:ACKH"],["poly:CL"]],"hlBeatMs":1100},{"text":"Adding: both small squares = both rectangles = square BCED on the hypotenuse.","cites":["cn:2"]}],"remarks":["The most famous theorem in geometry — pure geometry, not algebra. Numerically: a² = b² + c².","Legend: Pythagoras sacrificed an ox in thanksgiving."],"questions":[{"q":"Legs 6 and 8; how long is the hypotenuse?","hint":"6² + 8² = c².","answer":"c² = 6²+8² = 36+64 = 100, so c = 10."},{"q":"Hypotenuse 15, one leg 12; find the other leg.","hint":"15² − 12² = b².","answer":"b² = 15²−12² = 225−144 = 81, so b = 9."}],"end":"Q.E.D.","sort":36.0},{"id":"thm:37","num":37,"title":"Converse of Pythagoras","aka":null,"kind":"theorem","statement":"If the square on one side of a triangle equals the sum of the squares on the other two sides, then the angle opposite that side is a right angle.","steps":[{"text":"In △ABC let the square on AB together with the square on AC be equal to the square on BC. Claim: ∠BAC is a right angle.","cites":[]},{"text":"Make another triangle DEF having ∠EDF a right angle, with DE = AB and DF = AC.","cites":["thm:9","thm:1a"]},{"text":"Since ∠EDF is right, the square on EF equals the squares on DE and DF together — that is, the squares on AB and AC.","cites":["thm:36"]},{"text":"But the squares on AB and AC together equal the square on BC (given). So the square on EF equals the square on BC, and therefore EF = BC.","cites":["cn:1"]},{"text":"Now △ABC and △DEF have their three sides equal, each to each: AB = DE, AC = DF, BC = EF.","cites":[]},{"text":"So their corresponding angles are equal (SSS): ∠BAC = ∠EDF. But ∠EDF is a right angle, and therefore ∠BAC is a right angle too.","cites":["thm:6"]}],"remarks":["This is the converse of Theorem 36, and Euclid puts it at the very end of Book I. Notice the strategy: build a triangle we *know* is right-angled, show it must be identical with the one we were given, and let the identity carry the right angle back.","So the three numbers 3, 4, 5 give a right triangle: since 9 + 16 = 25, any triangle with those sides must have a right angle between the 3 and the 4. Builders have used that rope-trick for thousands of years.","Together, Theorems 36 and 37 say: a triangle is right-angled **if and only if** the square on one side equals the squares on the other two."],"questions":[{"q":"Which triangles with whole-number sides are right-angled? Find two besides 3, 4, 5.","hint":"Look for a² + b² = c² in whole numbers.","answer":"5, 12, 13 (25 + 144 = 169) and 8, 15, 17 (64 + 225 = 289). Also every multiple of one of these, such as 6, 8, 10."},{"q":"A triangle has sides 6, 7 and 9. Is its largest angle right, acute or obtuse?","hint":"Compare 6² + 7² with 9².","answer":"36 + 49 = 85, which is greater than 81 = 9². The square on the greatest side falls short of the other two squares, so the angle opposite it is less than a right angle: the triangle is acute."},{"q":"Why does the proof need Theorem 6 (SSS) rather than just Theorem 36?","hint":"What do we know about the second triangle, and what do we want to know about the first?","answer":"Theorem 36 only tells us about the triangle we built. To carry its right angle over to the triangle we were given, we must first show the two triangles are identical — and all we know is that their three sides are equal, which is exactly what SSS needs."}],"end":"Q.E.D.","sort":37.0}],"hooks":[{"id":"hook:desargues","title":"Desargues’ Theorem (Hook)","text":"If two triangles ABC and abc in the same plane are such that the three lines joining corresponding vertices (Aa, Bb, Cc) meet in a single point V, then the three intersection points of corresponding sides (X, Y, Z) lie on one straight line.","kid":"A deep “perspective” surprise about two triangles aiming at one point."},{"id":"hook:perp-sum","title":"Sum of perpendiculars in an equilateral triangle (Hook)","text":"In equilateral triangle ABC, for any interior point P, if PQ, PR, PS are the perpendiculars to the three sides, then PQ + PR + PS equals the altitude of the triangle.","kid":"No matter where P is inside an equilateral triangle, the three little heights add up to the big height!"}],"labels":{"def":"Def.","post":"Post.","cn":"Gen. Pr.","thm":"Thm.","prin":"Pr.","hook":"Hook"}};</script>

hs. He laughs. So he is a man.":"凡是笑的都是人，而且只有人才会笑。他笑了。所以他是一个男人。","puts the defined term back into the definition; a circle teaches nothing.":"将定义的术语放回到定义中；圆圈没有任何教益。","The members must not overlap: nothing may fall under two of them at once.":"成员不得重叠：任何东西都不能同时属于其中两个成员。","What holds in one case holds in a case like it, so far as they are alike.":"一种情况适用的情况也适用于类似的情况，只要它们是相似的。","The premise is granted and the conclusion follows from it perfectly well.":"前提已成立，结论也完全由此而来。","Whatever produces an effect is the only thing that could have produced it":"凡是产生效果的东西都是唯一能够产生效果的东西","If it has rained, the ground is wet. The ground is wet. So it has rained.":"如果下雨了，地面是湿的。地面是湿的。所以下雨了。","a general kind divided into the kinds beneath it, each with its own work.":"一个一般类型又分为其下的几个类型，每个类型都有自己的工作。","youth — the difference that marks the lamb off from the rest of the sheep.":"年轻——区分羔羊与其他绵羊的区别。","Why does the tradition place dialectic between rhetoric and demonstration?":"为什么传统将修辞与示范辩证地放在一起？","Negations move modal claims around the square by fixed rules: a NOT placed":"否定按照固定规则在正方形周围移动模态声明：“NOT”","When a man reasons badly by himself, St Thomas says it always happens how?":"圣托马斯说，当一个人自己推理得很糟糕时，这种事总是会发生，怎么会发生呢？","Ask whether the claim was made of them together, or of each one by itself.":"询问该主张是对它们一起提出的，还是单独提出的。","The machine cannot be creative — it only does what it is programmed to do.":"机器无法发挥创造力——它只能做它被编程的事情。","Suppose not: extend so that EB and FD meet at X on one side, forming △EFX.":"假设不是：延伸使EB和FD在一侧X交汇，形成△EFX。","— change the quality and negate the predicate: “No foxes are non-animals.”":"— 改变质量并否定谓词：“没有狐狸是非动物。”","Complete parallelograms ABGK and ABLC on the same base in those parallels.":"在这些平行线中，在同一底上完成平行四边形 ABGK 和 ABLC。","But ∠1 = ∠2 by given — contradicting Thm. 14 (exterior > remote interior).":"但给定 ∠1 = ∠2 — 与 Thm 相矛盾。 14（外部>远程内部）。","Said with a different stress it is a different word, or a different claim.":"用不同的重音表示，这是一个不同的词，或者一个不同的主张。","Because grammar mirrors reality only imperf ument may be drawn from — carries a":"你会发现每个话题——每个可能引出论点的地方——都带有一个","It holds of each of them, so it looks as though it must hold of them all together.":"它容纳了它们中的每一个，因此看起来它必须将它们全部容纳在一起。","Corresponding parts: ∠ADC = ∠AEB and DC = EB. Also BD = CE, so △BDC ≅ △CEB by SAS.":"对应部分：∠ADC = ∠AEB 且 DC = EB。又BD = CE，所以SAS 得出△BDC ≅ △CEB。","one of the four hinges of the moral life: prudence, justice, fortitude, temperance":"道德生活的四个关键之一：审慎、正义、刚毅、节制","A straight line is the shortest distance between two points (“as the crow flies”).":"直线是两点之间的最短距离（“直线距离”）。","Medicine is good for the sick. So medicine is good, and the more of it the better.":"医学对病人有好处。所以说药是好的，而且越多越好。","Looking back at Theorem 1’s diagram, what is the fewest steps to bisect a segment?":"回顾定理 1 的图，平分线段最少需要多少步？","exists in its own right — not present in anything else, nor said of anything else.":"以其本身的形式存在——不存在于其他任何事物中，也不存在于其他任何事物中。","what the word itself means, or where it came from, is used to settle the question.":"这个词本身的意思，或者它的来源，用来解决这个问题。","What is the angle sum of any quadrilateral? Pentagon? Find a pattern for an n-gon.":"任意四边形的角和是多少？五角大楼？找到 n 边形的图案。","Use Theorem 3 to prove that all three angles of an equilateral triangle are equal.":"利用定理3证明等边三角形的三个角都相等。","what holds in one case is carried to a case that resembles it in the relevant way.":"一种情况下适用的情况会被带到以相关方式与其相似的情况中。","Justice is a virtue, and every virtue is worth having. So justice is worth having.":"正义是一种美德，每一种美德都值得拥有。所以正义是值得拥有的。","what holds of the whole, or of all the parts together, is used to settle the rest.":"整体或所有部分的结合，用于解决其余部分。","This is the discipline of the disputed question, and it is worth learning by heart.":"这是争议问题的纪律，值得熟记。","What those who know a subject agree on may be granted, until better reason appears.":"那些了解某个主题的人所达成的共识可能会被认可，直到出现更好的理由为止。","∠1+∠2+∠3+∠4 = four right angles (360°), since two pairs each make two right angles.":"∠1+∠2+∠3+∠4 = 四个直角 (360°)，因为两对角各形成两个直角。","De fallaciis gives this one: the aim is to force you into something
