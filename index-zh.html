e as it does for the conjunctive.":"标记为“但不是两者”，这种析取是严格的：它的成员相互排斥，所以 ponendo tollens 在这里成立，就像它对于合取词一样。","But ∠APB + ∠BPX = two right angles is only ∠1 + ∠2; what is given, that ∠APB + ∠BPC = two right angles, is here ∠1 + ∠2 + ∠3 = two right angles.":"但∠APB + ∠BPX = 两个直角只有∠1 + ∠2； ∠APB + ∠BPC = 两个直角，这里 ∠1 + ∠2 + ∠3 = 两个直角。","a property — it follows from what a triangle is and always goes with it, yet is not what a triangle is (Aristotle’s model of a per se accident).":"一个属性——它源于三角形并始终伴随着三角形，但它不是三角形（亚里士多德的本质事故模型）。","Beside the categorical syllogism stand arguments built not on terms but on whole propositions joined by a connective. Two are drilled here — the":"除了直言三段论之外，论证不是建立在术语上，而是建立在通过连接词连接的整个命题上。这里钻了两个——","To err is one thing, to do wrong another. The forger does not err about what he is doing; he chooses it. Distinguish erring from choosing badly.":"犯错是一回事，做错事又是另一回事。伪造者并没有犯下他所做的事情；他选择了它。区分错误和错误选择。","A figure has an inside. A triangle is a figure; a lone straight line is not, because you can pass through it without going through its endpoints.":"人物有内在。三角形是一个图形；孤独的直线则不然，因为你可以通过它而不需要经过它的端点。","the power to laugh belongs to man alone, to every man, and always; it follows from reason yet is no part of what a man is (the classic property).":"笑的力量只属于人类，属于每个人，并且永远属于；它源于理性，但并不是人的本质（经典属性）的一部分。","Two straight lines cannot cut each other more than once; they cannot enclose a space. This follows from the perfect uniformity of straight lines.":"两条直线不能多次相交；它们不能封闭空间。这是从直线的完美均匀性得出的。",". When no sign appears, judge from the sense — and “a” swings both ways: “a whale is a mammal” is universal, “a man came to the door” particular.":"。当没有迹象出现时，从感觉上判断——“a”是双向的：“鲸鱼是哺乳动物”是普遍性的，“一个人来到门口”是特殊性的。","Judge whether a syllogism in schematic letters is valid — the form laid bare. Capital letters are general terms; lower-case letters are singular.":"判断示意性字母中的三段论是否有效——形式暴露无遗。大写字母为通用术语；小写字母是单数。","If the square on one side of a triangle equals the sum of the squares on the other two sides, then the angle opposite that side is a right angle.":"如果三角形一侧的平方等于另外两条边的平方和，则与该侧相对的角是直角。","A man says he knows what courage is. His friend asks him to say what it is, and keeps asking — not to teach him, but to find out whether he knows.":"一个人说他知道什么是勇气。他的朋友让他说出那是什么，并不断地问——不是为了教他，而是为了看看他是否知道。","Composite — “necessarily: the literate is literate” — cannot be false. Divided it fails: literacy is acquired, and belongs to no one by necessity.":"综合——“必然：识字的人就是识字的”——不可能是假的。分裂就失败了：识字能力是后天习得的，并且必然不属于任何人。","Substance alone exists in its own right; the nine other categories are accidents, which exist only in a substance (Categories 5; Metaphysics VII).":"物质本身就存在；其他九类是意外事件，仅存在于物质中（类别 5；形而上学 VII）。","the mode flips it to the opposite corner — “not possible” is “impossible,” while “not necessary” yields only the weak “possible not”; a NOT placed":"该模式将其翻转到对角——“不可能”是“不可能”，而“不必要”只会产生弱的“可能不”；未放置","Categories 5: an individual is a substance in the fullest sense (primary); the species and genera it falls under are substances in a secondary way.":"第5类：个体是最完整意义上的实体（初级）；它所属的种和属是次要的物质。","A gentle notice: this browser is not permitting storage, so progress will last only for this visit. Use Export on the Progress page to keep a copy.":"温馨提示：此浏览器不允许存储，因此进度仅适用于本次访问。使用“进度”页面上的“导出”来保留副本。","An essential definition gives the nearest kind and the difference that marks the thing off from everything else of that kind — no more and no less.":"一个基本的定义给出了最接近的种类以及将该事物与该种类的其他事物区分开来的区别——不多也不少。","“If B, then C” does not say “only if B, C”. Removing the antecedent leaves the consequent standing free — the classic mirror-image of modus tollens.":"“如果 B，则 C”并不是说“仅当 B，C”。去掉先行词，结果就保持自由——这是托伦斯的经典镜像。","If a straight line cuts two parallels, it makes alternate angles equal and interior angles on the same side supplementary (sum to two right angles).":"如果一条直线与两条平行线相交，则互交角相等，同边的内角互补（两个直角之和）。","It is a right triangle (3-4-5). The angle opposite 5 is a right angle (Thm. 37 later makes this rigorous; for now you may notice the square corner).":"这是一个直角三角形（3-4-5）。与 5 相对的角是直角（Thm. 37 稍后对此进行了严格的规定；现在您可能会注意到方角）。","He argues that since Socrates is an animal he must be a man — and the argument works only because nobody notices the rule it is standing on is false.":"他认为，既然苏格拉底是一种动物，那么他一定是一个人——这个论证之所以有效，只是因为没有人注意到它所依据的规则是错误的。","Reflect (flip) one triangle so it is no longer a mirror image; then the same superposition proof works. Congruence does not require same orientation.":"反射（翻转）一个三角形，使其不再是镜像；那么同样的叠加证明就成立了。一致性并不需要相同的方向。",". No diagrams here — only the form, laid bare. The chains grow longer at the higher levels: two or three links at first, four or five for the master.":"。这里没有图表——只有形式，暴露无遗。等级越高，锁链就越长：一开始有两到三个环，主人则有四到五个环。","Substance is the highest genus of all (genus generalissimum) — said of everything beneath it, but falling under no wider kind (the tree of Porphyry).":"实体是所有事物中最高的属（genusgeneralissimum）——指的是它下面的一切，但不属于更广泛的种类（斑岩树）。","Weight adds up; lightness does not survive the addition. The rule looks true because many properties do carry from parts to whole — colour often does.":"重量加起来；添加后亮度无法幸存。这个规则看起来是正确的，因为许多属性确实是从部分到整体的——颜色通常也是如此。","Modal language makes sound arguments feel doubtful. Reduce to the form, test it, then apply the rule of the weaker part — here everything is in order.":"情态语言让合理的论证变得令人怀疑。简化为形式，测试它，然后应用较弱部分的规则——这里一切都井然有序。",", and would not survive being spoken aloud. The art of examining an enthymeme is to drag the hidden premise into the light and ask whether it is true.":"，并且无法被大声说出。检查一个enthymeme的艺术是将隐藏的前提拖入光中并询问它是否真实。","Ask first: does the proposition empty a region (shade it) or populate one (place an ×)? Then ask which region: the subject’s crescent, or the overlap.":"首先问：这个命题是清空一个区域（将其涂上阴影）还是填充一个区域（放置一个×）？然后询问哪个区域：拍摄对象的新月形或重叠部分。","The needed premise runs from the mark to the goodness — its converse (“good laws protect the poor”) would leave the argument affirming the consequent.":"所需的前提是从目标到善——它的反面（“善法保护穷人”）将使论证肯定结果。","Aristotle’s definition of the probable includes what seems so to the wise. What it does not do is excuse you from defending it when the many disagree.":"亚里士多德对可能性的定义包括了智者看来的情况。它不会让你在许多人不同意时为它辩护。","The line through the two intersection points of the circles in Thm. 1 already meets AB at its midpoint — fewer steps than equilateral + angle bisector.":"通过 Thm 中圆的两个交点的线。 1 已经在中点与 AB 相交 - 比等边 + 角平分线少了步数。","“Socrates is a man” takes its subject in its entirety: treat it as a universal with existential import — one thing, wholly included or wholly shut out.":"《苏格拉底是一个人》从整体上看待它的主题：将其视为具有存在意义的普遍性——一件事，完全包含或完全排除。","This form keeps every rule: the middle is distributed once, no term is distributed in the conclusion alone, and negatives and particulars are balanced.":"这种形式保留了所有规则：中间分布一次，没有项单独分布在结论中，并且否定和细节是平衡的。","When one straight line stands on another in such a way that the two adjacent angles formed are equal to each other, each angle is called a right angle.":"当一条直线重叠在另一条直线上，并且所形成的两个相邻角彼此相等时，每个角称为直角。","“Ought to be kept” holds without qualification of promises whose keeping does no grave harm. Distinguish, and the rule stands in the sense it was meant.":"“应该遵守”的说法不带任何条件，即遵守不会造成严重损害的承诺。区分一下，规则就按照它的意思表达。","It is the characteristic move of the disputed question, and it is not a dodge: most objections that look decisive turn on a word doing two jobs at once.":"这是有争议的问题的典型举动，而不是回避：大多数看上去具有决定性的反对意见都是因为一个词同时起到了两项作用。","A relative term — double and half, master and slave, knowledge and the knowable — is defined entirely by its reference to something else (Categories 7).":"相对术语——双重和一半、主人和奴隶、知识和可知的——完全是通过其对其他事物的引用来定义的（类别7）。","Mind the order of terms: A and O propositions do not convert simply, so a conclusion cannot merely be turned around. Only E and I convert term for term.":"注意术语的顺序：A 和 O 命题不能简单地转换，因此结论不能简单地颠倒过来。只有 E 和 I 将术语转换为术语。",", and the result is equivalent — truth passes both ways: “No fish are birds” ⇄ “No birds are fish”; “Some singers are poets” ⇄ “Some poets are singers”.":"，结果是等价的——真理是双向的：“没有鱼是鸟”⇄“没有鸟是鱼”； “有些歌手是诗人”⇄“有些诗人是歌手”。","If two angles in a triangle are equal to each other, then the sides opposite them are also equal — the triangle is isosceles (at least two sides equal).":"如果三角形中的两个角彼此相等，则它们的对边也相等——该三角形是等腰三角形（至少两条边相等）。","RELATION is said toward another (ad aliquid) — its whole being consists in a bearing toward something else: double, half, greater, a master, a neighbour.":"关系是指与另一个人（ad aliquid）有关——它的整个存在在于与其他事物的关系：双重的、一半的、更大的、一个主人、一个邻居。","The conclusion generalizes over the whole minor term, though the premise covered only part of it. This slips by easily when the premise sounds universal.":"结论概括了整个小术语，尽管前提只涵盖了其中的一部分。当这个前提听起来很普遍时，这一点很容易被忽视。","An ESSENTIAL definition says what the thing is, by giving its nearest kind (genus) and the difference that marks it off from everything else of that kind.":"基本定义通过给出其最接近的种类（属）以及将其与该种类的其他所有事物区分开来来说明该事物是什么。","— an argument that depends on a maxim which is false and merely looks true. Dialectic and the detection of fallacy are one doctrine learned from two ends.":"——一个论证依赖于一条看似正确但错误的格言。辩证法和发现谬误是一种从两端学习的学说。","The complete definition, saying what the thing is: the nearest wider kind (genus), narrowed by the difference that belongs to this thing and nothing else.":"完整的定义，说明该事物是什么：最接近的更广泛的种类（属），通过属于该事物而不是其他事物的差异来缩小范围。","It looks sound because the feature and the man really do go together here; it fails because a man and a feature he happens to wear are not the same thing.":"这看起来很合理，因为这个角色和这个人在这里确实很相配。它失败了，因为一个人和他碰巧佩戴的特征不是同一件事。","A denial in the premises can never yield a joining in the conclusion. Students often let the affirmative-sounding terms carry them past the negative sign.":"对前提的否定永远不会产生结论的加入。学生们经常让听起来肯定的术语带他们过去消极的符号。","Grant that we often cannot find it. That we cannot find a thing is no proof that it is not there — the conclusion simply does not follow from the premise.":"承认我们经常找不到它。我们找不到某样东西并不能证明它不存在——结论根本不能从前提得出。","It is genuinely a topic and genuinely probable — but it moves us by who says a thing rather than by what makes it so. Hence weakest, and hence not nothing.":"这确实是一个话题，也确实是可能的——但它感动我们的是谁说了一件事，而不是它的原因。因此是最弱的，因此并不是什么都没有。","The modal dress hides the flaw: reduce the argument to its form, then check the modes — a conclusion can never be stronger in mode than the weaker premise.":"莫代尔礼服掩盖了缺陷：将论证简化为形式，然后检查模式——结论永远不可能比较弱的前提更强。","Something does follow here — a connection easy to overlook, especially outside the first figure. Diagram the premises and read off what the shading forces.":"这里确实有一些东西可以遵循——一种很容易被忽视的联系，尤其是在第一幅图之外。绘制场地图并读出阴影的力量。","Every fallacy has a CAUSE OF THE APPEARANCE — what makes it look sound, and moves a person to accept it. Name that, and you understand why the trick works.":"每一个谬论都有一个出现的原因——是什么让它看起来合理，并促使人们接受它。只要说出这个名字，你就会明白为什么这个技巧会起作用。","This is the definition Aristotle gives and St Thomas repeats. The probable is not a guess about odds; it is what a reasonable person may be asked to grant.":"这是亚里士多德给出的定义，圣托马斯又重复了这一定义。概率不是对几率的猜测；而是对概率的猜测。这是一个有理智的人可能会被要求给予的。","An ACCIDENT is what a subject may have or lack while remaining the very same thing — present in it, but no part of what it is. White is an accident of man.":"意外是一个主体可能拥有或缺乏的东西，但仍然保持着同样的东西——存在于其中，但不是它本身的一部分。白色是人类的意外。","St Thomas: a disputation turns between the opponens and the respondens. Teacher and learner belong to demonstrative disputation, which is a different kind.":"圣托马斯：争论在反对者和被告之间进行。教师与学习者属于示范性争论，这是一种不同的类型。","Plato’s proof in the Phaedrus (245c). The whole dispute lives in the suppressed premise — as so often, the argument’s visible part is the least contestable.":"柏拉图在《斐德罗篇》（245c）中的证明。整个争论存在于被压抑的前提中——正如通常情况下，争论的可见部分是最没有争议的。","An Aristotelian commonplace against hedonism. Supplied, the argument is valid — and the fight moves, where it belongs, to whether the tacit premise is true.":"亚里士多德反对享乐主义的陈词滥调。事实证明，这个论点是有效的——而争论的焦点就在于默认前提是否为真。","A property (the power to laugh) always goes together with the species, even though it is not part of what the thing is; an accident (white) may come and go.":"一种属性（笑的能力）总是与物种相关联，即使它不是事物本身的一部分；事故（白色）可能会来来去去。","They cover every living thing — plants and animals alone would leave the fungi out — nothing falls under two of them, and they are sorted on a single basis.":"它们涵盖了所有生物——仅植物和动物就将真菌排除在外——没有任何东西属于其中两个，并且它们是在单一基础上进行分类的。","“Learned from a teacher” covers learning by instruction; discovery is another way of coming to know. Distinguish the two and the thesis stands of the first.":"“向老师学习”包括通过指导学习；发现是认识的另一种方式。区分两者和第一个的论文立场。","The objection is simply right, and it defeats the thesis as stated. The honest move is to concede and say instead that it is the shortest way when passable.":"这个反对意见是完全正确的，它推翻了所陈述的论点。诚实的举动是承认并在可行的情况下说这是最短路线。","AE = AD, since both are radii of the same circle; and AD = C; therefore AE = C. So from the greater line AB we have cut off the shorter piece AE equal to C.":"AE = AD，因为两者是同一个圆的半径； AD = C；因此 AE = C。因此，我们从较大的线 AB 切下较短的一段 AE，等于 C。","is a syllogism with a premise — or, at times, the conclusion — left unspoken: a “syllogism in the mind,” whose missing part the hearer is trusted to supply.":"是一种带有前提——或者有时是结论——未言明的三段论：一种“头脑中的三段论”，其缺失的部分可以由听者来补充。","Commentary on the Metaphysics V, lect. 9: what belongs to a substance in its own right follows either from the matter (quantity) or from the form (quality).":"形而上学评论 V，lect。 9：什么属于物质本身，要么来自物质（数量），要么来自形式（质量）。","Posture (situs) differs from where (the place itself) and from habit: it is the arrangement of the parts — lying, sitting, standing (Metaphysics V, lect. 9).":"姿势（地点）不同于地点（地点本身）和习惯：它是各个部分的排列——躺着、坐着、站着（形而上学 V，第 9 章）。","Contradictories always disagree — that much is fixed. For the other relations, ask what the square forbids; whatever it does not forbid remains undetermined.":"矛盾总是有分歧——这一点是固定的。对于其他关系，询问广场禁止什么；凡是它不禁止的都尚未确定。","Parallelism behaves like equality (transitive). Perpendicularity does not: two perpendiculars to the same line are parallel to each other, not perpendicular.":"并行性的行为类似于相等（传递）。垂直性不是：同一条直线的两条垂线彼此平行，而不是垂直。","It is tempting to hear the conjunctive as a disjunctive — as though one of the two must hold. But “not both” promises neither: both members may fail together.":"人们很容易将连词当作析取词来听——就好像两者之一必须成立一样。但“不是两者”都没有承诺：两个成员都可能一起失败。","The rule is false: many causes can produce one effect. It looks true because rain is the usual cause, and the usual cause is easy to mistake for the only one.":"这个规则是错误的：多种原因可以产生一种结果。看起来确实如此，因为下雨是通常的原因，而通常的原因很容易被误认为是唯一的原因。","“Willingly” is said of what a man chooses as good for him, and of what he chooses knowing it is bad. Distinguish the senses and the thesis holds in the first.":"“自愿”是指一个人选择对他有利的东西，以及他明知对他不利而选择的东西。区分感官和论文首先成立。","St Thomas’s worked case. The rule is false, because a thing and a feature it happens to wear are not the same. It looks true because here they do go together.":"圣托马斯的工作案例。这个规则是错误的，因为物体和它碰巧佩戴的特征并不相同。这看起来是真的，因为在这里他们确实在一起。","Contraries may both be false — the falsity of one settles nothing about the other. Treating contraries like contradictories is the classic slip on the square.":"相反的情况可能都是错误的——一个的错误并不能解决另一个的问题。将相反的事物当作矛盾对待是经典的错误。","A boundary of a thing is its limit, or where it stops. For example, a sphere is bounded by one surface, a square by four lines, a straight line by two points.":"事物的边界是它的极限，或者说它停止的地方。例如，球体由一个表面界定，正方形由四条线界定，直线由两点界定。","A SPECIES is the narrower kind under a genus, said of the individuals that share that nature. Man is a species of animal; Socrates falls under the species man.":"物种是属下较窄的一种，指的是具有该性质的个体。人是动物的一种；苏格拉底属于人这一物种。","A council debates whether the harvest should be brought in early. Most farmers think so, and the most experienced think so — so it is taken as the better view.":"议会正在讨论是否应该提早收割庄稼。大多数农民都这么认为，最有经验的人也这么认为——所以这被认为是更好的观点。","Demonstration reaches science; dialectic reaches opinion held for good reasons. Knowing which one you are doing keeps you honest about how much you have shown.":"论证达到科学；辩证法得出的观点是有充分理由的。知道自己在做什么可以让您诚实地了解自己已经展示了多少。","sets these four at its corners — A and E along the top, I and O beneath — so that the logical bonds between them may be seen at a glance. Four such bonds hold:":"将这四个放在其角上——A 和 E 位于顶部，I 和 O 位于下方——以便它们之间的逻辑联系一目了然。持有四种此类债券：","Let △A and △B have three pairs of equal corresponding sides. Place them on the same base CD with equal sides sharing endpoints C and D, so CA = CB and DA = DB.":"设△A和△B有三对相等的对应边。将它们放在相同的基本 CD 上，且等边共享端点 C 和 D，因此 CA = CB 且 DA = DB。","Diagram a whole valid syllogism on three circles: shade the universal premises, place the ×s — and, where a weakened conclusion demands existence, the import ×.":"在三个圆圈上画出一个完整有效的三段论：遮蔽普遍前提，放置×s——并且，在弱化的结论要求存在的地方，放置进口×。","Standard form, e.g. “Some B are not C” — to deny a proposition, assert its contradictory (or write “it is not the case that …”). Type “none” if nothing follows.":"标准形式，例如“有些 B 不是 C”——否认一个命题，断言其矛盾（或写“事实并非如此……”）。如果没有任何内容，请输入“none”。","The categories are about real things themselves (first intentions); the predicables are about the mind’s ways of saying one thing of another (second intentions)":"这些类别是关于真实事物本身（第一意图）；谓词是关于心灵表达另一件事的方式（第二意图）","Knowledge and virtue are habits — the first species of quality, a lasting state (Categories 8). (Spoken of as “knowledge of the knowable,” it is also relative.)":"知识和美德是习惯——第一种品质，一种持久的状态（第8类）。 （被称为“可知的知识”，它也是相对的。）","of its parts, taken together as one package: “it is possible that (he is standing and sitting at once)” — false, since the parts cannot be true together. In the":"它的各个部分，作为一个整体组合在一起：“有可能（他同时站着和坐着）”——错误，因为这些部分不可能同时成立。在","— the conclusion always follows the weaker premise. As a negative premise forces a negative conclusion, and a particular premise a particular one, so the weaker":"——结论总是遵循较弱的前提。由于否定前提迫使得出否定结论，而特定前提又会导致特定前提，因此较弱的前提会导致否定结论。","A NOMINAL definition gives what the name means. It must come first, says John of St Thomas: we cannot ask what a thing is until we know what its name refers to.":"名义定义给出了名称的含义。它必须是第一位的，圣托马斯的约翰说：我们不能问一个事物是什么，除非我们知道它的名字指的是什么。","Mind the quality: a negative premise demands a negative conclusion, and purely affirmative premises can only affirm. Count the negative signs before concluding.":"注意质量：否定的前提要求否定的结论，而纯粹肯定的前提只能肯定。在得出结论之前先数一下负号。","The conditional and its two lawful moods, ponendo ponens and tollendo tollens — beside the twin fallacies of affirming the consequent and denying the antecedent.":"条件句及其两种合法语气，ponendo ponens 和 tollendo tollens——除了肯定结果和否定前件的双重谬误之外。","is the orator’s syllogism — a premise left unsaid and silently supplied by the hearer. Learn to draw the hidden assumption into the open and look it in the face.":"是演说者的三段论——一个未言明的前提，由听者默默提供。学会将隐藏的假设暴露出来并正视它。","Aristotle’s example in Rhetoric I.2: the premise is dropped precisely because every hearer knows it — brevity, not concealment, is the honest enthymeme’s motive.":"亚里士多德在修辞学 I.2 中的例子：之所以放弃前提，正是因为每个听众都知道这一点——诚实的 enthymeme 的动机是简洁，而不是隐藏。","John of St Thomas: the nominal definition (the meaning of the name) comes first, since the question “what is it?” already assumes we know what the name refers to.":"圣托马斯的约翰：名义上的定义（名字的含义）是第一位的，因为问题是“它是什么？”已经假设我们知道这个名字指的是什么。","Knowing two angles of a triangle determines the third. Sides do not work that way: many third sides can complete two given sides (within the triangle inequality).":"知道三角形的两个角就可以确定第三个角。边不是这样工作的：许多第三边可以完成两个给定的边（在三角形不等式内）。",": one word standing over a host of individuals. Picture it looking down on them — the term above, and beneath it every single thing of which it can be truly said:":"：一个词代表了一群人。想象一下它俯视着他们——上面的术语，以及它下面可以真实表达的每一件事情：","Notice why AB has to be the greater line: if AD were longer than AB the circle around A would swallow B entirely and cut the extension of AB instead of AB itself.":"请注意为什么 AB 必须是更大的线：如果 AD 比 AB 长，则 A 周围的圆将完全吞没 B 并切断 AB 的延伸而不是 AB 本身。","Conditional, conjunctive, and disjunctive premises together in one drill. Type the conclusion that follows about the subject — or “none” if the mood is fallacious.":"条件前提、合取前提和析取前提一起在一次练习中进行。输入有关该主题的结论 - 如果情绪错误，则输入“无”。","A GENUS is said of many things of different kinds, naming the broader class they share; it answers “what is it?” with the wider nature. Animal is the genus of man.":"属是指许多不同种类的事物，命名它们所共有的更广泛的类别；它回答“这是什么？”与更广泛的性质。动物是人的属。","If one pair of opposite sides in a quadrilateral are both parallel and equal, then the quadrilateral is a parallelogram (the other pair is also parallel and equal).":"如果四边形中的一对对边都平行且相等，则该四边形是平行四边形（另一对对边也平行且相等）。","Descartes’s cogito, completed as the schools would: the tacit major “whatever thinks, is.” The converse — “whatever is, thinks” — would people the world with minds.":"笛卡尔的我思，按照学校的方式完成：默契的专业“所想即是”。相反——“无论是什么，思考”——都会让世界充满思想。","Fourth-figure syllogisms run against the natural flow of predication, so even valid ones feel wrong. Recite the premises slowly and test the rules — none is broken.":"四位数三段论与谓词的自然流程背道而驰，因此即使是有效的三段论也会感觉错误。慢慢地背诵前提并测试规则——没有一个被打破。","Socrates’s argument in the Meno. The tacit major is the battlefield: grant it, and Barbara concludes; the dialogue itself ends by doubting the stated minor instead.":"苏格拉底在《美诺》中的论证。默契的主要是战场：承认这一点，芭芭拉总结道；对话本身以怀疑所陈述的未成年人而结束。","Standard form, e.g. “All B are C”, “No B are C”, “Some B are C”, “Some B are not C” — or “none” if nothing follows. Any conclusion that validly follows is accepted.":"标准形式，例如“所有 B 都是 C”、“没有 B 是 C”、“有些 B 是 C”、“有些 B 不是 C”——如果没有任何后续内容，则“无”。任何有效遵循的结论都被接受。","The cause of the appearance makes the argument look good; the cause of the failure breaks it. A man is deceived by the two together — something appears, and is not.":"出现的原因使论证看起来不错；失败的原因打破了它。一个人被这两者共同欺骗了——有些东西出现了，但又没有。","A figure is something contained by its boundary or boundaries — something which cannot be entered or departed from without cutting across its boundary or boundaries.":"图形是由它的一个或多个边界所包含的东西——如果不跨越它的一个或多个边界，就无法进入或离开。","opens the exercises act by act, judges when each is mastered, and brings them back for spaced review. Only the Guided Path stores anything, and only in this browser.":"逐个打开练习，判断每个练习何时掌握，然后带回进行间隔复习。只有引导路径存储任何内容，并且仅存储在该浏览器中。","Compounded, it claims sitting-and-walking at once — impossible. Divided, it claims of the seated man the power to walk — true, for sitting does not destroy the power.":"更复杂的是，它声称同时坐着和行走是不可能的。分开来说，它声称坐着的人有行走的能力——确实如此，因为坐着并不会破坏这种能力。","In equilateral triangle ABC, for any interior point P, if PQ, PR, PS are the perpendiculars to the three sides, then PQ + PR + PS equals the altitude of the triangle.":"在等边三角形ABC中，对于任意内点P，如果PQ、PR、PS是三边的垂线，则PQ+PR+PS等于三角形的高。","Necessity is strongest, the plain assertion stands between, contingency is weakest. A conclusion may sink to the level of the weaker premise, but never rise above it.":"必然性最强，平白断言介于两者之间，偶然性最弱。结论可能会下降到较弱前提的水平，但永远不会超越它。","It is the reason the study of fallacies is aimed first at your own arguments. Reasoning badly to someone else may be deliberate; reasoning badly to yourself never is.":"这就是为什么研究谬误首先要针对你自己的论证。对别人说坏话可能是故意的；对自己进行错误的推理从来都不是。","So A, B, C sit on D, E, F. Then AC must coincide with DF — if it fell outside, two straight lines would cut each other at two points and enclose a space (impossible).":"所以 A、B、C 位于 D、E、F 上。那么 AC 必须与 DF 重合——如果它落在外面，两条直线将在两点处相互切割并包围一个空间（不可能）。","Let RB be the perpendicular bisector of CD at B. For any R on that line, RC and RD: RB common, CB=DB, and right angles (or use SSS on the two right triangles) ⇒ RC=RD.":"设 RB 为 CD 在 B 处的垂直平分线。对于该线上的任何 R，RC 和 RD：RB 公共、CB=DB 和直角（或在两个直角三角形上使用 SSS）⇒ RC=RD。","The argumentum ad populum in the enthymeme’s cloak. Spoken aloud, the major shrinks to its true size: the crowd’s custom is a fact about the crowd, not about the book.":"enthymeme斗篷中的argumentum ad populum。大声说出，专业缩小到其真实大小：人群的习俗是关于人群的事实，而不是关于书本的事实。","the animals, but it says nothing about the whole of the animals — “All animals are foxes” would claim far more than was given (the illicit conversion). Yet since there":"动物，但它没有提到整个动物——“所有动物都是狐狸”所要求的远远超过所给出的（非法转换）。然而自从有了","draws a new proposition from a single one — no middle term, no second premise; the conclusion is read straight off the first. Each turns on the four categorical forms:":"从一个命题得出一个新命题——没有中间项，没有第二个前提；结论直接从第一部分读出。每个都开启四种分类形式：","“Necessary” and “impossible” may both fail — precisely of whatever is contingent either way. The true contradictory of “necessary” is “possible not”, not “impossible”.":"“必要”和“不可能”都可能失败——无论哪种情况都是偶然的。 “必要”的真正矛盾是“不可能”，而不是“不可能”。","So the supposition is impossible: on one base, on one side, there cannot be two such triangles. Keep the three sides and the angles cannot change — triangles are rigid.":"所以这个假设是不可能的：在一个底边的一侧，不可能有两个这样的三角形。保持三个边并且角度不能改变——三角形是刚性的。","If two straight lines lie in one plane together, but never meet each other in either direction however far they are extended, they are said to be parallel to each other.":"如果两条直线一起位于一个平面上，但无论它们延伸多远，都不会在任一方向上彼此相交，则称它们彼此平行。","The four kinds: nominal (what the name means), essential (nearest kind and difference), descriptive (a property or telltale feature), causal (through one of its causes).":"这四种：名义性（名称的含义）、本质性（最接近的种类和差异）、描述性（属性或明显特征）、因果性（通过其原因之一）。","you are driven against what nearly everyone believes — which need not be false, but is hard to swallow. It offends against dialectic, which works from what people grant.":"你被驱使去反对几乎每个人都相信的东西——这不一定是错误的，但很难接受。它违背了辩证法，而辩证法是根据人们的认可而发挥作用的。","Assume two parallels through P to AB. A transversal from P to a point on AB makes alternate angles that force the two supposed parallels to coincide — only one such line.":"假设有两条从 P 到 AB 的平行线。从 P 到 AB 上一点的横向线形成交替角度，迫使两条假定的平行线重合——只有一条这样的线。","Everything in the objection is true, and none of it touches the thesis. The thesis was about birds, not about flying things. Grant it all; the conclusion does not follow.":"反对意见中的所有内容都是真实的，并且没有任何内容触及论文。这篇论文是关于鸟类的，而不是关于飞行的东西。给予一切；结论不成立。","Each syllogism draws a conclusion; that very conclusion serves as a premise of the syllogism that follows, joined to a fresh premise, until the last conclusion is reached.":"每个三段论都会得出一个结论；这个结论作为随后的三段论的前提，与一个新的前提相结合，直到得出最后的结论。","Being is first; then understanding is drawn from how things are; then signifying brings this to the mind, for oneself and for others. Each mode is based on the one before.":"存在是第一；然后从事物的本来面目中获得理解；然后，为自己和他人进行意指，将其带入头脑。每种模式都基于之前的模式。","Every fallacy also has a CAUSE OF THE FAILURE — what actually destroys the argument. It is never the same as what made it look good; that is exactly why a man is deceived.":"每一个谬误都有一个失败的原因——真正破坏论证的原因。它永远不会与让它看起来好看的东西相同；这正是人被欺骗的原因。","a sound form and true matter is exactly the discipline that scientific knowledge demands, and so this exercise prepares the mind for those later and higher demonstrations.":"健全的形式和真实的物质正是科学知识所要求的纪律，因此这个练习为以后和更高层次的演示做好了准备。","Composite — “possibly: a bachelor is married” — is contradictory, for no one is married while unmarried. Divided is true: the man who is a bachelor has it in him to marry.":"复合词——“可能：单身汉已婚”——是矛盾的，因为没有人在未婚时已结婚。分裂是真的：单身汉有结婚的欲望。","causes: what makes it look good, and what makes it fail. Six come from the words and seven from outside them. We study them not to use them but to see through those who do.":"原因：什么让它看起来不错，什么让它失败。六来自于言，七来自于言外。我们研究它们不是为了使用它们，而是为了看透那些使用它们的人。","Categories 5: substance has no contrary and no degrees; its peculiar mark is that numerically one and the same substance receives contrary qualities through its own change.":"第五类：实质没有相反、没有程度；其独特之处在于，在数量上同一种物质通过其自身的变化而获得相反的性质。","A DIFFERENCE (differentia) is the mark that divides a genus and makes a species — it answers “what sort of thing, in its very nature?” Rational divides animal and makes man.":"差异（difference）是划分属和种的标记——它回答“本质上是哪种东西？”理性分动物，造人。","Rhetoric inclines us where evidence is nearly even; dialectic reaches what is probable; demonstration proves through the cause. The three are stages of one inquiry ripening.":"言辞让我们倾向于证据几乎是均匀的；辩证法达到可能的程度；论证是通过因果来证明的。这三个阶段是一项探究成熟的阶段。","An I proposition has no contrapositive: contraposition obverts, then converts, then obverts — but the obverse of I is an O, and an O will not convert, so the process stalls.":"I 命题没有反证：对位颠倒，然后转换，然后颠倒——但 I 的反面是 O，而 O 不会转换，因此过程停滞。","Only the fourth sense — the power to laugh — always goes together with the species. Being a geometer, being two-footed, and growing grey each fail on one of the three marks.":"只有第四种感觉——笑的力量——总是与物种相伴。几何学家、两足动物和头发变白的人都未能满足这三个标准之一。","Every member must be something the whole really includes. A member that lies outside it does not divide that whole at all — as “stones” does nothing to divide living things.":"每个成员都必须是整体真正包含的东西。位于其外部的成员根本不会分割整个整体——就像“石头”无法分割生物一样。","when it seems so to everyone, or to most people, or to the wise — and among the wise, to all of them or to the best known. It is what you may fairly ask an opponent to grant.":"当每个人、大多数人或智者看来都是如此时——在智者中，对所有人或最有名的人来说。这是你可以公平地要求对手给予的。","Suppose AC < DF so C lands at C′ on DF. Then ∠ at E in △DC′E equals original ∠B, hence ∠C′ equals ∠F — making an exterior angle equal a remote interior. Impossible (Thm. 14).":"假设 AC < DF，则 C 落在 DF 上的 C' 处。那么 △DC′E 中 E 处的 ∠ 等于原来的 ∠B，因此 ∠C′ 等于 ∠F — 使得外角等于远内角。不可能（Thm.14）。","); politics and advertising trade on it; and even philosophy, for all its rigor, argues enthymematically more often than not. Aristotle called it the very body of persuasion.":"）；政治和广告贸易；甚至哲学，尽管其严谨性，也常常以热情的方式进行论证。亚里士多德称其为说服的主体。","An individual such as Socrates is never said of anything else; things are only ever said of him. Man is the lowest species, animal a middle genus, substance the highest genus.":"像苏格拉底这样的人从来没有被提及过。人们只谈论过他。人是最低等的属，动物是中等属，物质是最高等的属。","A flat surface is a perfectly uniform surface. Every part of it, regardless of size, is the same “shape” all over and on both sides. A flat surface can also be called a plane.":"平坦的表面是完全均匀的表面。它的每个部分，无论大小，全身和两侧都是相同的“形状”。平坦的表面也可以称为平面。","An obtuse angle and an acute angle are called supplementary when they add up to two right angles. Two acute angles are called complementary when they add up to one right angle.":"当钝角和锐角相加为两个直角时，称为补角。当两个锐角相加为一个直角时，这两个锐角称为互补角。","Both premises may be granted, and the conclusion still does not follow: the thesis said exact fit is necessary, not that it is sufficient. The form is at fault, not the matter.":"这两个前提都可能成立，但结论仍然不成立：论文说精确拟合是必要的，而不是充分的。形式有问题，而不是内容有问题。","A first-order enthymeme — the major lay hidden. Supplied, the argument is Barbara. “All mortals are men” is the illicit converse; “some men are mortal” is too weak to conclude.":"一级Enthymeme——主要隐藏着。提供的参数是芭芭拉。 “凡人都是人”是不合法的说法。 “有些人终有一死”这个结论太弱了。","The square of opposition and the operations upon a single proposition: converse, obverse, contrapositive, contradictory — and what truth or falsity each relation carries across.":"对立的平方和对单个命题的运算：相反、相反、反证、矛盾——以及每种关系所传达的真理或谬误。","That is the converse. Contraposition is not one move but three — obvert, then convert, then obvert : “All S are P” → “No S are non-P” → “No non-P are S” → “All non-P are non-S.”":"反之亦然。对位不是一招，而是三招——反转，然后转换，然后反转：“所有S都是P”→“没有S是非P”→“没有非P是S”→“所有非P都是非S”。","sets two terms in the four traditional relations and displays any immediate inference — converse, obverse, contrapositive, contradictory — drawn from whichever corner you choose.":"在四种传统关系中设置两个术语，并显示从您选择的任何角落得出的任何直接推论 - 逆向、逆向、反证、矛盾。","Triangles on the same base and in the same parallels have equal areas; a triangle on the same base and in the same parallels as a parallelogram has half the parallelogram’s area.":"同底、同纬线的三角形面积相等；与平行四边形同底同纬线的三角形，其面积是平行四边形的一半。","Type the tacit premise in standard form — e.g. “All B are C”, “No B are C” — or “none” if no premise can validly complete the argument. Any premise that completes it is accepted.":"以标准形式输入默认前提 - 例如“所有 B 都是 C”、“没有 B 都是 C”——如果没有前提可以有效地完成论证，则“无”。任何完成它的前提都被接受。","This is the third of the four answers: concede everything and deny the consequence. It is the answer to give whenever an objection is true in every part and still proves nothing.":"这是四个答案中的第三个：承认一切并否认后果。当一个反对意见在每个部分都是正确的但仍然不能证明什么时，就给出这个答案。","Choose a level to work at. Levels IV and V open once you pass this exercise at Level III — nine of your last ten answers correct at Level III or above, across two different days.":"选择要工作的级别。一旦您通过了 III 级练习，IV 级和 V 级就会开放——在不同的两天里，您最近 10 个答案中的 9 个答案达到 III 级或以上。","The proof is a “reduction to the absurd” (reductio ad absurdum): we suppose the opposite of what we want, draw an impossible consequence out of it, and so condemn the supposition.":"证明是“还原到荒谬”（reductio ad absurdum）：我们假设与我们想要的相反的结果，从中得出一个不可能的结果，从而谴责这个假设。","Watch the marker: this “or” is the broad one — the members may stand together, so positing one removes nothing. Only the strict “either–or, but not both” licenses ponendo tollens.":"注意标记：这个“或”是广义的——成员可以站在一起，所以放置一个不会删除任何内容。只有严格的“非此即彼，但不能两者兼而有之”才允许 ponendo tollens。","Only the universal concludes, and every fishing town that ever bred a landsman refutes it. The particular is true and powerless; the converse would conclude nothing of her at all.":"只有普遍性才能得出结论，而每一个曾经培育过土地居民的渔镇都会反驳它。特殊是真实的，也是无力的；反之亦然，对她来说根本就毫无意义。","So grammar cannot tell you what is true or false. But logic cannot begin without grammar — because until the sentence is well formed, there is nothing definite for logic to judge.":"所以语法不能告诉你什么是真什么是假。但没有语法，逻辑就无法开始——因为在句子结构良好之前，逻辑没有任何明确的判断依据。","Let △ABC be isosceles with AB = AC. We claim ∠ABC = ∠ACB, and (extending the equal sides past the base to F and G) the angles under the base are equal too. Pick D at random on BF.":"设△ABC 为等腰形，AB = AC。我们要求 ∠ABC = ∠ACB，并且（将等边延伸到底边到 F 和 G）底边下的角度也相等。 BF 上随机选择 D。","Together, Theorems 1, 1a and 1b give us everything we need to move and compare lengths: make an equilateral triangle, carry a length to a point, and cut a length off a longer line.":"定理 1、1a 和 1b 共同为我们提供了移动和比较长度所需的一切：制作一个等边三角形、将长度移至一点，以及从较长的直线上剪下一段长度。","The mood posits and removes whole propositions. Ask which component the minor posits or denies (to deny is to assert the contradictory), then posit or remove the other accordingly.":"情绪提出并消除整个命题。询问未成年人提出或否认哪一个组成部分（否认就是断言矛盾），然后相应地提出或删除另一个组成部分。","To divide is to break a whole into its members. But wholes come in different sorts, and so do divisions — here are the four kinds, each with two plain examples and one faulty case.":"分裂就是将整体分解成其成员。但整体有不同的种类，划分也有不同的种类——这里有四种，每种都有两个简单的例子和​​一个错误的例子。","No — you would not be cutting anything off AB. The circle around A with radius AD would meet the extension of AB beyond B, so you would be adding to AB rather than cutting from it.":"不——你不会从AB上切断任何东西。围绕 A 的半径为 AD 的圆将与 AB 超出 B 的延伸相交，因此您将添加到 AB，而不是从它切掉。","Bisect the second line (Thm. 8), bisect the half again: that gives a quarter. Then carry that quarter to the end of the first line (Thm. 1a) and cut it off with a circle (Thm. 1b).":"将第二条线平分（Thm.8），再次平分一半：即得到四分之一。然后将该四分之一带到第一行的末尾（Thm.1a）并用圆圈将其剪掉（Thm.1b）。","When two distinct lines in the same plane meet at a point, the inclination of one to the other is a plane angle. The point at which the lines meet is called the vertex of the angle.":"当同一平面内两条不同的直线交于一点时，一条直线与另一条直线的倾斜度就是平面角。线相交的点称为角的顶点。","Picture single propositions on a Venn diagram — shade what they declare empty, place an × where they assert existence. From 50 points onward, two premises together on three circles.":"在维恩图上想象单个命题——在他们宣称为空的地方涂上阴影，在他们断言存在的地方放置一个×。从 50 分开始，两个前提一起在三个圆圈上。","The likeliest culprit: the premises are implausible, and falsity feels like fallacy. But validity concerns form alone — grant the premises, however absurd, and see what must follow.":"最有可能的罪魁祸首是：前提不可信，虚假感觉像是谬论。但有效性只关心形式——承认前提，无论多么荒谬，然后看看会发生什么。","“Knowledge” is said strictly, of what is demonstrated and cannot be otherwise, and loosely, of what we are sure of at the time. Distinguish, and the thesis holds in the strict sense.":"“知识”严格地说是指已被证明的、不能以其他方式表达的东西，宽松的是指我们当时确定的东西。区分一下，命题在严格意义上成立。","Among triangles, an equilateral triangle is one with all three sides equal. An isosceles triangle is one with only two sides equal. A scalene triangle is one without any equal sides.":"在三角形中，等边三角形是三条边都相等的三角形。等腰三角形是只有两条边相等的三角形。不等边三角形是没有任何相等边的三角形。","Ordinary English arguments of every stripe — categorical, conditional, conjunctive, disjunctive, and modal — not in standard form. Discern the syllogism within and judge its validity.":"各种普通英语论证——绝对论证、条件论证、连接论证、析取论证和情态论证——都不是标准形式。辨别其中的三段论并判断其有效性。","Most questions worth arguing about cannot be proved. Dialectic is the art of reasoning well about them anyway — not from what is demonstrated, but from what may reasonably be granted.":"大多数值得争论的问题都无法得到证明。无论如何，辩证法是对它们进行良好推理的艺术——不是根据所证明的内容，而是根据可以合理地认可的内容。","When a line comes to an end, it stops at a point; so a point has no length, no width, no depth. Although it has no shape or size, a point does have one positive feature: its location.":"当一条线到达终点时，它会停在一个点上；所以一个点没有长度，没有宽度，没有深度。虽然点没有形状或大小，但它确实有一个积极的特征：它的位置。","That is the contrary, not the contradictory. Contradictories differ in both quantity and quality — A pairs with O, E with I. Contraries can both be false; contradictories never agree.":"这是相反的，而不是矛盾的。矛盾在数量和质量上都有所不同——A 与 O 配对，E 与 I 配对。矛盾永远不会达成一致。","— yet the conclusion is drawn only as a plain assertion, not as a necessity, since the minor premise was merely assertoric. Judge each argument for the mode its weakest premise allows.":"——然而，结论只是作为一个简单的断言得出的，而不是作为必然性得出的，因为小前提只是断言性的。判断每个论证的最弱前提所允许的模式。","Supply the unspoken premise that would make the argument valid — or, where none can, say that none will serve. To see what is being taken for granted is to hold an argument to account.":"提供一个不言而喻的前提，使论点有效——或者，如果没有人可以，就说没有人会起作用。看看什么被认为是理所当然的，就是要对一个论点进行解释。","Aristotle and St Thomas: the predicables come from the mind’s way of knowing, yet they are grounded in the real natures of things. The categories, by contrast, divide real being itself.":"亚里士多德和圣托马斯：可谓词来自心灵的认知方式，但它们植根于事物的真实本质。相比之下，这些类别划分了真实存在本身。","In the tree of Porphyry a middle term is a genus to whatever lies below it and a species to whatever lies above it; only the topmost is always a genus, only the lowest always a species.":"在斑岩树中，中间术语是位于其下方的属，以及位于其上方的物种。只有最上面的总是一个属，只有最低的总是一个种。","Flip △ABC over the angle bisector of ∠A (or over the altitude from A). Side AB lands on AC because they are equal, so ∠ABC lands exactly where ∠ACB was — hence the base angles are equal.":"将 △ABC 翻转到∠A 的角平分线上（或从 A 开始的高度）。 AB 边落在 AC 上，因为它们相等，因此 ∠ABC 恰好落在 ∠ACB 所在的位置 - 因此底角相等。","An O proposition has no converse. “Some S are not P” speaks of a part of S only, and nothing guarantees any P outside S — yet the habit of converting E and I carries many students along.":"O 命题没有逆命题。 “有些S不是P”仅指S的一部分，并不能保证S之外的任何P——但转换E和I的习惯却让许多学生深受困扰。","Aristotle’s own example (Rhetoric II.27) of the necessary sign — the one kind of sign-argument that concludes of necessity. Note it needs the premise in this direction, not its converse.":"亚里士多德自己的必然符号的例子（修辞学 II.27）——一种得出必然性结论的符号论证。请注意，它需要这个方向的前提，而不是相反的前提。","St Thomas’s own distinction, with his own example: that a star is bigger than the earth is against common opinion, and true. The sophist can win by driving you to the merely unbelievable.":"圣托马斯自己的区分，以及他自己的例子：恒星比地球大的说法违背了普遍观点，但却是事实。诡辩家可以通过让你达到难以置信的程度来获胜。","If all three angles are equal, then any two are equal, so by Thm. 4 the sides opposite those angles are equal. Doing this for each pair of angles shows all three sides equal — equilateral.":"如果所有三个角度都相等，则任何两个角度都相等，因此由 Thm 得出。 4 这些角的对边相等。对每对角度执行此操作会显示所有三个边相等 - 等边。","The categories divide real being. The predicables (genus, species, and the rest) are second intentions — ways the mind relates one term to another — though grounded in how things really are.":"这些类别划分了真实的存在。可谓词（属、种等）是第二个意图——大脑将一个术语与另一个术语联系起来的方式——尽管是基于事物的真实情况。","The conjunctions are also studied in logic, because conjunctions can join terms and propositions, and the conjunction helps to determine the truth or falsity of the new compound proposition.":"逻辑中也研究了连词，因为连词可以连接术语和命题，并且连词有助于确定新复合命题的真假。","36 + 49 = 85, which is greater than 81 = 9². The square on the greatest side falls short of the other two squares, so the angle opposite it is less than a right angle: the triangle is acute.":"36 + 49 = 85，大于 81 = 9²。最大边上的正方形比其他两个正方形短，因此它的对角小于直角：三角形是锐角。","Valid only with the universal, and the universal is false: fear also makes the innocent run. “The guilty often flee” is the true premise — and it concludes nothing. The refutable sign again.":"仅对普遍性有效，而普遍性是错误的：恐惧也会让无辜者逃跑。 “有罪者往往逃跑”是真正的前提——但它没有得出任何结论。又是可反驳的标志。","“Some S are not P” locates its witness in S outside P. Students often mark the overlap because both terms are mentioned — but the proposition asserts distance from P, not fellowship with it.":"“有些S不是P”将其证人定位在P之外的S中。学生经常标记重叠部分，因为这两个术语都被提及——但这个命题断言与P的距离，而不是与它的团契。","— nobody sets out to deceive himself. The honest man who has not noticed that his word shifted is commoner than the sophist who shifts it on purpose. So use this on your own arguments first.":"——没有人会去欺骗自己。没有注意到自己的言语被改变的诚实人比故意改变言语的诡辩者更常见。因此，首先将其用于您自己的论点。","ACCIDENT treats what is only incidentally true of a thing as if it belonged to the thing itself. St Thomas’s case: I know the man who is coming; Coriscus is the man coming; so I know Coriscus.":"事故将事物的偶然真实性视为事物本身。圣托马斯的案例：我认识即将到来的人；科里斯库斯就是那个来的人；所以我认识科里斯库斯。","A topic is the place an argument is drawn from: the definition, the wider kind, opposites, the cause, and so on. Its first use is finding — given something to show, it tells you where to look.":"主题是论证的来源：定义、更广泛的类型、对立面、原因等等。它的第一个用途是查找——给定要显示的东西，它会告诉你去哪里寻找。","are correct across two different days. Lower levels build your skill and score and carry you to a pass, but mastery waits at the top. Mastering a set earns the ★ and enrols it in spaced review.":"在不同的两天都是正确的。较低的级别可以培养你的技能和分数，并让你通过，但掌握在顶部等待着你。掌握一套即可获得 ★ 并参加间隔复习。","If two triangles have two angles equal to two angles, and a side equal to a corresponding side opposite an equal angle, then they have all corresponding sides and angles equal, and equal areas.":"如果两个三角形的两个角等于两个角，且一条边等于与一个等角相对的对应边，那么它们的所有对应边和角都相等，面积也相等。","Perhaps the conditional was read backwards — as though “if B, then C” also said “if C, then B”. The consequent can be true from other causes; the diagram leaves the subject two possible regions.":"也许条件句被倒过来读——就好像“如果 B，则 C”也说“如果 C，则 B”。从其他原因得出的结果也可能是正确的；该图给主题留下了两个可能的区域。","When a surface comes to an end, it stops at a line (or lines); so a line has length, but no width or depth. (In this book, “line” usually means a finite line, often called a line segment today.)":"当一个表面到达终点时，它停在一条线（或多条线）处；所以一条线有长度，但没有宽度或深度。 （在本书中，“线”通常指的是有限线，今天通常称为线段。）","Supply the major and the syllogism is Celarent — whereupon hemlock, nightshade, and the viper’s venom answer it at once. The appeal to nature persuades only while its premise stays out of sight.":"提供主要的三段论是塞拉伦特——于是铁杉、茄属植物和毒蛇的毒液立即回答了它。只有当其前提远离人们的视线时，对自然的吸引力才具有说服力。","Both equilateral triangles on AB (above and below) have sides AB, AC, BC and AB, AD, BD respectively with AC=AB=BC and AD=AB=BD by radii, so all three pairs of sides match; SSS gives congruence.":"AB 上的两个等边三角形（上面和下面）都有边 AB、AC、BC 和 AB、AD、BD，且半径分别为 AC=AB=BC 和 AD=AB=BD，所以三对边都匹配； SSS 给出一致性。","The argument stands only on the universal, and the universal is doubtful: examinations weigh the memory, not the bedside. Doubtful premises travel best unspoken — the enthymeme’s oldest service.":"这个论点只立足于普遍性，而普遍性是值得怀疑的：检查衡量的是记忆，而不是床边。可疑的场所旅行最好是不言而喻的——enthymeme最古老的服务。","Yes. The equilateral triangle could be built on either side of AB, and afterwards Theorem 7 (or a circle around A with radius AL) lets us swing the line AL around A into any direction we please.":"是的。等边三角形可以在 AB 的任一侧建立，然后定理 7（或围绕 A 半径为 AL 的圆）让我们可以将线 AL 绕 A 旋转到我们喜欢的任何方向。","Each universal premise empties a full lens of two cells — one inside the third circle and one outside it. Half-shading usually comes from forgetting that the zone continues into the third circle.":"每个通用前提都清空了两个单元的完整镜头——一个在第三个圆内，一个在第三个圆外。半阴影通常是由于忘记了该区域一直延伸到第三个圆圈。","A natural instinct: two statements sharing a middle term feel as if they must connect the extremes. But here the middle never does its work — no valid mood fits these premises in any arrangement.":"一种自然的本能：共享一个中间词的两个陈述感觉好像它们必须连接极端。但在这里，中间从来没有发挥作用——在任何安排中，没有有效的情绪适合这些前提。","In parallelogram ABCD draw diagonal AC. Through a point K on AC draw lines parallel to the sides, forming small parallelograms about the diagonal and two complementary parallelograms (1) and (2).":"在平行四边形ABCD中画对角线AC。通过AC上的点K画出与各边平行的直线，形成关于对角线的小平行四边形和两个互补的平行四边形（1）和（2）。","This little construction is the workhorse of the whole book. Whenever a proof says “cut off a line equal to …”, this is what is meant, and it is done with a circle, never with a ruler’s markings.":"这个小结构是整本书的主力。每当证明说“剪掉一条等于……的线”时，这就是这个意思，而且是用圆圈完成的，而不是用尺子的标记。","You concluded universally where only a particular follows. The premises secure a part of the subject term, not the whole of it — overclaiming the quantity is the most common slip in this exercise.":"你得出了普遍的结论，但只有一个特殊的结论。前提保护了主题术语的一部分，而不是全部——夸大数量是这个练习中最常见的失误。","In equilateral △ABC, AB = AC so base angles at B and C are equal (Thm. 3). Likewise AB = BC gives angles at A and C equal, and AC = BC gives angles at A and B equal. So all three angles are equal.":"在等边形 △ABC 中，AB = AC，因此 B 和 C 处的底角相等（Thm. 3）。同样，AB = BC 使 A 和 C 处的角度相等，AC = BC 使 A 和 B 处的角度相等。所以三个角都相等。","“Not both” — and “either–or”. The conjunctive concludes only by ponendo tollens; the disjunctive by tollendo ponens, and by ponendo tollens too only when strict (“but not both”). Watch the marker.":"“不是两者”——和“非此即彼”。连接词仅以 ponendo tollens 结尾；仅当严格时，才由 tollendo ponens 进行析取，并且也由 ponendo tollens 进行析取（“但不是两者”）。观察标记。","Peiorem sequitur semper conclusio partem: as the conclusion follows the negative and the particular premise, so it follows the weaker mode. A necessary conclusion needs necessity in both premises.":"Peiorem sequitur semper conclusio patem：由于结论遵循否定前提和特殊前提，因此它遵循较弱模式。一个必然的结论需要两个前提都有必然性。","alone: pass those two and the Second Act appears. (The Predicables and the Categories do not gate the path — take your time with them, and deepen them as you go.) Pass all of the Second Act, and the":"单独：通过这两个，第二幕出现。 （谓词和范畴并不会限制你的道路——慢慢来，边走边加深它们。）通过第二幕的所有内容，以及","Every answer is illustrated with a Venn diagram of the correct analysis — shading declares a region empty; an × declares an occupant; ⊗ marks the existential import assumed in the traditional reading.":"每个答案都用正确分析的维恩图来说明 - 阴影表明该区域为空； × 表示有占用者； ⊗ 标志着传统阅读中所假定的存在主义意义。","A pentagon needs two non-crossing diagonals from one vertex (or equivalent bracing) to triangulate into three triangles — generally two braces. Many configurations work (different pairs of diagonals).":"五边形需要从一个顶点（或等效支撑）两条不交叉的对角线来三角剖分成三个三角形——通常是两个支撑。许多配置都有效（不同的对角线对）。","Two triangles on the same base *can* have identical sides without coinciding — △ABC and △ABD on opposite sides of AB. But they are mirror images: you get one from the other by flipping, not by tilting.":"同底上的两个三角形*可以*具有相同的边而不重合——△ABC和△ABD位于AB的相对边上。但它们是镜像：你可以通过翻转而不是倾斜来得到另一个。","you are made to take back, in the same argument, something you had just said — the fault St Thomas calls redargutio. It offends against metaphysics, which holds that contradictories cannot both be true.":"在同一个论点中，你被迫收回你刚才所说的话——圣托马斯称之为“redargutio”的错误。它违背了形而上学，形而上学认为矛盾不可能同时成立。","Two straight lines are inclined toward each other if, when cut by a third straight line, the sum of the two interior angles on one side is less than the sum of the two exterior angles on that same side.":"如果两条直线被第三条直线切割时，一侧的两个内角之和小于该同一侧的两个外角之和，则两条直线彼此倾斜。","The conclusion speaks of the major term in its whole extension, though the premise engaged only part of it. The sweeping sound of the premise hides the gap — check what the premise actually distributes.":"结论谈到了主要术语的整个外延，尽管前提只涉及其中的一部分。场所的扫荡声音掩盖了间隙 - 检查场所实际分布的内容。","Every argument depends on a rule, usually unspoken. A good argument depends on a true one; a sophistical argument depends on one that is false but looks true. Find the rule and you have found the fault.":"每个争论都取决于一条通常不言而喻的规则。一个好的论证取决于一个真实的论证；一个诡辩论证依赖于一个看似错误但看起来正确的论证。找到规律，你就找到了毛病。","of the square: “it is not possible that he is not running” is equipollent to “it is necessary that he is running,” because both say necessary. If they land on different corners, they are not equipollent.":"正方形：“他不可能不跑步”与“他有必要跑步”是等价的，因为两者都说有必要。如果它们落在不同的角上，则它们不相等。","Syllogisms with premises necessary, assertoric, or contingent. The received rule: peiorem sequitur semper conclusio partem — the conclusion follows the weaker premise, in mode as in quality and quantity.":"带有必要前提、断言前提或偶然前提的三段论。公认的规则：peiorem sequitur semper conclusio patem——结论遵循较弱的前提，无论是在形式上还是在质量和数量上。","Valid only through the universal — and the universal kills: squirrels stomach amanitas that fell a grown man. Nature keeps separate tables; the tacit premise merges them, and stays tacit for good reason.":"只有通过普遍性才有效——并且普遍性的杀戮：松鼠胃里的鹅膏菌杀死了一个成年人。大自然保留了单独的表格；默契的前提将它们融合在一起，并有充分的理由保持默契。","This is what people mean when they say **triangles are rigid**: given three straight lines that make a triangle, you cannot take them apart and put them together again to get a different triangle. Try it.":"这就是人们所说的“三角形是刚性的”：给定构成三角形的三条直线，你不能将它们分开并再次组合在一起以获得不同的三角形。尝试一下。","All the argument’s force hides in the tacit premise, and the premise begs a number no one holds: numberless chances multiplied by an unknown chance conclude nothing. Infinity times ignorance is ignorance.":"所有论证的力量都隐藏在默示的前提中，而这个前提则要求得出一个没人能把握的数字：无数的机会乘以一个未知的机会，不会得出任何结论。无知无限次就是无知。","St Thomas’s example: “Socrates is an animal, therefore a man” has a true premise and a false conclusion — because the rule it rides on, that whatever the genus is said of the species is said of, is false.":"圣托马斯的例子：“苏格拉底是一种动物，因此是一个人”有一个正确的前提和一个错误的结论——因为它所遵循的规则，即无论对属的描述如何对物种的描述，都是错误的。","Porphyry: blackness never leaves the raven, yet being a raven does not consist in being black — the accident is inseparable, but still not part of the nature. Sitting, by contrast, is a separable accident.":"斑岩：黑色永远不会离开乌鸦，但成为乌鸦并不意味着是黑色的——事故是不可分割的，但仍然不是自然的一部分。相比之下，坐着是一个可分离的意外事件。","This is Euclid’s second proposition, and it is exactly the tool needed for Theorem 1b, which in turn is used over and over again (Theorems 3, 4, 15, 17 …) whenever we “cut off” one length equal to another.":"这是欧几里得的第二个命题，它正是定理 1b 所需的工具，每当我们“截断”一个长度等于另一个长度时，定理 1b 就会被一遍又一遍地使用（定理 3、4、15、17……）。","The terms are right, but that premise makes no valid mood with the given premise and conclusion — check quantity and quality: the conclusion follows the weaker part, and the middle must be distributed once.":"条款是正确的，但前提与给定的前提和结论没有形成有效的情绪 - 检查数量和质量：结论遵循较弱的部分，中间必须分配一次。","An O proposition does not convert: “Some animals are not dogs” is true, yet “Some dogs are not animals” is false. It speaks only of a part of its subject, and guarantees nothing of the predicate outside it.":"O 命题不能转换：“有些动物不是狗”是真的，但“有些狗不是动物”是假的。它只谈论其主语的一部分，并且不保证其之外的谓语。","The valid-but-unsound argument — flawless in form, false in a premise — is the commonest counterfeit of knowledge. To catch it is to glimpse what parts mere consistency from truth, and opinion from science.":"有效但不合理的论点——形式完美，前提错误——是最常见的知识伪造。抓住这一点就是要了解真理的一致性和科学的观点是由什么部分组成的。","St Thomas’s first way, with its weight-bearing premise tacit: deny the impossibility of an infinite regress, and the stated premise concludes nothing. “Some mover is unmoved” merely restates the conclusion.":"圣托马斯的第一种方法，其承重前提是默认的：否认无限回归的不可能性，并且所陈述的前提没有得出任何结论。 “有些推动者不为所动”只是重申了结论。","So the three numbers 3, 4, 5 give a right triangle: since 9 + 16 = 25, any triangle with those sides must have a right angle between the 3 and the 4. Builders have used that rope-trick for thousands of years.":"因此，三个数字 3、4、5 给出了一个直角三角形：由于 9 + 16 = 25，因此具有这些边的任何三角形都必须在 3 和 4 之间具有直角。建筑商使用这种绳索技巧已有数千年了。","Recall the four operations: conversion exchanges the terms; obversion changes the quality and negates the predicate; contraposition does both at once; the contradictory reverses quantity and quality together.":"回忆一下四个操作： 转换 交换术语；观察改变了性质并否定了谓词；对立同时做到了这两点；矛盾使数量和质量同时颠倒。","Post hoc ergo propter hoc, stated at last as the missing major — and it refutes itself in the speaking, for colds die of themselves within the week. The premise persuades only so long as no one pronounces it.":"Post hoc ergo propter hoc，最后被声明为失踪的专业——它在谈话中反驳了自己，因为感冒在一周内就会自行死亡。这个前提只有在没有人宣读的情况下才具有说服力。","COMPOSITION moves from what is true of things taken singly to what is claimed of them taken together. Each brick is light; the wall made of them is not. A seated man can walk, but he cannot walk while seated.":"组合从单个事物的真实情况转向对它们组合在一起的声称。每块砖都很轻；由它们制成的墙不是。坐着的人可以行走，但坐着就不能行走。","terms — capital letters stand for general terms, lower-case letters and proper names for singular. Letters are the easier dress: finish a set in letters, and it will invite you to attempt the same in English.":"术语——大写字母代表通用术语，小写字母和专有名称代表单数。字母是更容易的服装：完成一套字母，它会邀请你尝试用英语做同样的事情。","PG and EP are for the proof. In practice you can find the two intersections of a suitable circle with the line and join the midpoint of that chord to P — the essential construction steps, not every proof line.":"PG和EP是为了证明。在实践中，您可以找到合适的圆与线的两个交点，并将该弦的中点连接到 P - 这是基本的构造步骤，而不是每条证明线。","Join both intersection points C and D of the two circles. Then AC = AD = BC = BD = AB (all radii of circle A or B), so quadrilateral ACBD has all four sides equal — a rhombus. (Angles not yet shown non-right.)":"连接两个圆的交点 C 和 D。那么 AC = AD = BC = BD = AB（圆 A 或 B 的所有半径），因此四边形 ACBD 的所有四个边都相等 - 一个菱形。 （尚未显示非右角度。）","If the three sides of one triangle are equal to the three corresponding sides of another triangle, then the two triangles also have their corresponding angles equal (those between equal sides), and equal areas.":"如果一个三角形的三条边等于另一个三角形的三条对应边，则这两个三角形的对应角也相等（相等边之间的角），面积也相等。","The schools called them the science of finding (inventio) and the science of judging (judicium). The Prior and Posterior Analytics teach judging; the Topics teaches finding. This exercise is mostly about finding.":"学校将它们称为发现科学（inventio）和判断科学（judicium）。先验分析和后验分析教授判断力；主题教授发现。这个练习主要是关于发现。",": a freshly mastered set is reviewed gently (Level III), rising to Level IV and then back to the full Master level (Level V) only as it proves durable over the weeks. The Progress page gathers everything due into":"：刚掌握的一套会被温和地审查（III级），上升到IV级，然后回到完整的大师级（V级），只有当它在几周内被证明是持久的。进度页面将所有到期的内容收集到","“Since,” “because,” and “for” mark premises; “therefore,” “so,” “hence,” and “it follows that” mark the conclusion — which often comes first: “No oaks are shrubs, for every oak is a tree, and no tree is a shrub.”":"“Since”、“because”和“for”表示前提； “因此”、“所以”、“因此”和“由此可见”标志着结论——通常是最先出现的：“没有橡树是灌木，因为每棵橡树都是一棵树，没有一棵树是灌木。”","SUBSTANCE exists in itself, neither said of a subject nor present in one as in a subject: this man, this horse (primary substance); or the species and genera in which they fall — man, animal (secondary substance).":"实体本身存在，既不是说一个主体，也不是在一个主体中存在：这个人，这匹马（主要实体）；或它们所属的物种和属——人、动物（次要物质）。","The equilateral triangle of Theorem 1 is doing the real work here: it gives us two equal lines DA and DB starting from one point, so that when we take equal pieces away from equal wholes, the remainders are equal.":"定理 1 的等边三角形在这里发挥了真正的作用：它为我们提供了从一点开始的两条相等的线 DA 和 DB，因此，当我们从相等的整体中取出相等的部分时，余数相等。","A sophist wins by driving you somewhere awkward. St Thomas names five such places: to contradict yourself, to grant something plainly false, to grant something absurd, to say something ungrammatical, or to babble.":"智者会通过把你带到一个尴尬的地方来获胜。圣托马斯列举了五个这样的地方：自相矛盾、承认明显错误的事情、承认荒谬的事情、说不合语法的话，或者胡言乱语。","A straight line cuts a circle in at most two points, one on each side of the centre. Only one of them lies on the line AB going from A toward B; the other lies on AB extended backwards. So on AB itself E is unique.":"一条直线最多可以将圆切成两个点，中心的每一侧各有一个点。其中只有一个位于从 A 到 B 的直线 AB 上；另一个位于AB向后延伸。所以AB本身E是唯一的。",") is always a species and never a genus; an individual like Socrates is neither — he is only ever the thing being talked about. Each question ahead puts one predicable, or one point of the doctrine, in front of you.":") 始终是一个物种，而不是一个属；像苏格拉底这样的人两者都不是——他只是人们谈论的对象。前面的每一个问题都将一个可推断的或学说的一个要点摆在你面前。","— sure knowledge of why a thing must be so. Weighing an argument in both form and matter at once, this exercise does not yet raise complete demonstrations, but it prepares the mind for those later and higher proofs.":"——确切地知道为什么事情一定会这​​样。同时权衡形式和实质上的论证，这个练习还没有提出完整的论证，但它为后来的更高层次的证明做好了准备。","Compounded — “necessarily: the seated is seated” — the dictum cannot be false, so it is true. Divided, it would make sitting essential to the man — false, for he sits contingently. The famous sophism trades on this.":"复合——“必然：坐着的人就是坐着的”——这句话不可能是假的，所以它是真的。如果分开的话，坐着对这个人来说就变得至关重要——这是错误的，因为他的坐着是偶然的。著名的诡辩就是利用了这一点。","Too much shading. Shade only what the universal premises declare empty — a lens of two cells each. Students often shade the conclusion as well, but its content should appear of itself once the premises are pictured.":"阴影太多。只遮蔽普遍前提所宣告为空的部分——每个都有两个单元的透镜。学生们也经常遮盖结论，但一旦前提被描绘出来，其内容就会自然而然地显现出来。","The tacit premise assigns the cause — and there lies the whole dispute, for perhaps strong hearts choose the sport rather than the sport make the heart. Correlation’s oldest ambush hides, as usual, in what is not said.":"默契的前提指定了原因——这就是整个争论的根源，因为也许坚强的心选择了这项运动，而不是运动塑造了心脏。像往常一样，相关性最古老的伏击隐藏在未言明的内容中。","The × for “Some S are P” belongs in the overlap : the proposition asserts a common member. It is tempting to mark the subject’s own crescent because the sentence begins with S, but the claim concerns what S and P share.":"“Some S are P”的 × 属于重叠：该命题断言有一个共同成员。人们很容易标记主体自己的新月，因为句子以 S 开头，但该主张涉及 S 和 P 共享的内容。","The Topics is a book about FINDING, not about judging. Given something you must show, a topic tells you where to go and look for an argument. Ask what you already have in hand, and which place will turn it into a reason.":"《The Topics》是一本关于发现的书，而不是关于判断的书。给定一些你必须展示的内容，主题会告诉你去哪里寻找论点。问问你手头已有的东西，在什么地方会把它变成理由。","The deduction is flawless, but an argument is only as strong as its matter: a false premise hides easily inside a valid form. Students often stop once the form checks out — always try each premise against the definitions.":"推论是完美的，但论证的强度取决于它的内容：错误的前提很容易隐藏在有效的形式中。一旦表格检查完毕，学生们通常会停下来——总是根据定义尝试每个前提。","Lady Lovelace’s objection, completed. The entire question — whether following rules excludes creation — sits inside the tacit major, assumed rather than argued: the enthymeme as a hiding place for the very point at issue.":"洛夫莱斯夫人的反对已完成。整个问题——遵循规则是否排除创造——位于默认的主要内容中，是假设的而不是争论的：enthymeme作为问题点的隐藏处。","Right region, wrong mark. A universal proposition declares a region empty — that is shading. Students often feel a universal must “put something” into the diagram, but a universal only takes away; it asserts no existence.":"正确的区域，错误的标记。一个普遍的命题宣布一个区域为空——这就是阴影。学生们经常觉得普遍性必须“放入一些东西”到图表中，但普遍性只会带走；它断言不存在。","The single point inside a circle which is the same distance from every point along the curved line bounding the circle is called the circle’s center. The curved line bounding the circle is called the circle’s circumference.":"圆内的一点，与沿着圆的曲线上的每个点的距离相同的点称为圆的中心。包围圆的曲线称为圆的周长。","An enthymeme is a syllogism with a premise left unsaid — first-order when the major is hidden, second-order when the minor. The suppressed premise is where an argument hides its weakness: supply it, and look it in the face.":"延韵素是一种三段论，有一个未言明的前提——当大调被隐藏时为一阶，当小调被隐藏时为二阶。被压抑的前提是论证隐藏其弱点的地方：提供它，并正视它。","Nothing breaks: A and B are still two distinct points, so AB can be joined and the equilateral triangle built on it. The only case needing care is A coinciding with B, and then the line BC already starts at the given point.":"没有任何破坏：A 和 B 仍然是两个不同的点，因此可以连接 AB 并在其上构建等边三角形。唯一需要注意的情况是 A 与 B 重合，然后线 BC 已经从给定点开始。","The moderns call the trap survivorship: we walk past the houses that stood and never past those that fell. The familiar converse is idle here; the work is done by the hidden universal, and the fallen houses vote against it.":"现代人将这种陷阱称为生存：我们走过那些矗立着的房子，却从未走过那些倒塌的房子。熟悉的谈话在这里毫无意义；这项工作是由隐藏的普遍性完成的，而倒下的房子投票反对它。","If in a triangle two angles and the side joining them are respectively equal to two angles and the side joining them in another triangle, then all corresponding sides and angles are equal, and the triangles have equal area.":"如果一个三角形中的两个角和连接它们的边分别等于另一个三角形中两个角和连接它们的边，则所有对应的边和角都相等，并且三角形的面积相等。","Match in order around each triangle: the given side, the given included angle, then the next side. Remaining parts that sit in the same relative place (opposite the same given part, or between the same pair) are corresponding.":"围绕每个三角形按顺序匹配：给定的边、给定的夹角，然后是下一条边。位于相同相对位置（与相同给定部分相对，或在同一对之间）的其余部分是对应的。","A PROPERTY (proprium) is no part of what a thing is, yet follows from it, and belongs to every member of the species, to that species alone, and always — so the two always go together. The power to laugh is the property of man.":"财产（propium）不是事物本身的一部分，但却是事物的本质，并且属于物种的每个成员，并且只属于该物种，而且永远——所以两者总是在一起。笑的能力是人类的财产。","A very common hesitation: on the modern reading this fails, since “some” asserts an existence that universal premises do not supply. The scholastic account grants every term existential import, so the weakened conclusion follows.":"一个非常常见的犹豫：在现代解读中，这是失败的，因为“某些”断言了普遍前提无法提供的存在。学术解释赋予每一个术语存在意义，因此弱化的结论随之而来。","St Thomas’s own pair. The good argument — Socrates is a man, therefore an animal — depends on a true rule: whatever the species is said of, the genus is said of. Reverse it and you get a false rule, and this argument depends on it.":"圣托马斯自己的一双。这个好的论点——苏格拉底是人，因此是动物——依赖于一个真正的规则：无论谈到物种，都谈到属。颠倒它，你会得到一个错误的规则，而这个论证就依赖于它。","An honest enthymeme: the major is dropped because every orchardman knows it, and for orchards it is near enough true. Yet even here the universal quietly rides over its exceptions — wheat and the wind-wed grasses ask no bee’s leave.":"一个诚实的enthymeme：专业被放弃是因为每个果园主都知道它，并且对于果园来说它几乎是正确的。然而，即使在这里，普遍性也安静地超越了它的例外——小麦和风嫁草不请蜜蜂离开。","Too many marks. Each categorical proposition makes exactly one claim — one shaded region or one ×. Students often add what they take to be implied (e.g. shading elsewhere after an ×); diagram only what the proposition itself asserts.":"太多的标记。每个分类命题恰好提出一个主张——一个阴影区域或一个×。学生经常添加他们认为暗示的内容（例如，在×后面的其他地方画上阴影）；仅用图解说明命题本身所主张的内容。","The countryman’s proverb supplies the major, dropped because every hearer owns it already — brevity, not concealment. And it holds often enough: before rain the heavy air keeps the insects low, and the swallows follow their dinner down.":"乡下人的谚语提供了主要内容，被放弃是因为每个听众都已经拥有它——简洁，而不是隐藏。这种情况经常发生：下雨前，沉重的空气使昆虫保持在低处，燕子跟随它们的晚餐而下落。","From the wider kind, the maxim is: whatever belongs to the whole family belongs to each kind within it. When the maxim is true the argument holds. A fallacy depends on a maxim that is false and looks true — the same machinery backwards.":"从更广泛的种类来看，格言是：凡属于整个家庭的，都属于其中的每一个种类。当格言为真时，论证成立。谬误取决于看似错误但看似真实的格言——同样的机器倒退。","Dialectic works from the probable — what seems so to everyone, or to most, or to the wise. Before you use a premise, ask what standing it has: is it demonstrable, granted by all, granted by the learned only, or merely somebody’s opinion?":"辩证法从可能性出发——对每个人、大多数人或智者来说似乎都是如此。在使用某个前提之前，先问问它的地位：它是可证明的、所有人都认可的、只有学者认可的，还是仅仅是某人的观点？","Nothing can complete this one: no arrangement of the remaining term yields a valid mood with that conclusion. The strength of a conclusion can outrun any possible help — a particular or negative premise sets limits no addition overcomes.":"没有什么可以完成这个：剩余期限的任何安排都不能产生带有该结论的有效情绪。结论的力量可能超过任何可能的帮助——一个特定的或否定的前提设定限制了任何额外的克服。","Valid only with the universal — and the universal is false, which is exactly why it stays unspoken. The particular “some politicians…” is true but concludes nothing about this one. The enthymeme’s cloak: tacit premises escape inspection.":"仅对普遍性有效——而普遍性是错误的，这正是它不言而喻的原因。特别的“一些政客……”是真的，但对此没有得出任何结论。 Enthymeme 的斗篷：默契的前提逃脱了检查。","St Thomas gives the definition exactly: probabilia are what seem so to all, or to most, or to the wise — and among the wise, to all of them or the most eminent. It is what a reasonable person may be asked to grant, not a guess about odds.":"圣托马斯给出了准确的定义：概率是对所有人、大多数人或智者来说似乎如此的东西——在智者中，对他们所有人或最杰出的人来说。这是一个理性的人可能会被要求给予的，而不是对可能性的猜测。","If two triangles ABC and abc in the same plane are such that the three lines joining corresponding vertices (Aa, Bb, Cc) meet in a single point V, then the three intersection points of corresponding sides (X, Y, Z) lie on one straight line.":"如果同一平面内的两个三角形ABC和abc，连接相应顶点（Aa，Bb，Cc）的三条线交于一点V，则相应边（X，Y，Z）的三个交点位于一条直线上。","Ignoratio elenchi covers every case of proving something other than what was in dispute. The straw man distorts the claim first and then refutes the distortion; the red herring simply changes the subject. Both are the same fault underneath.":"Ignoratio elenchi 涵盖了证明有争议的内容之外的所有情况。稻草人先歪曲主张，然后反驳歪曲；转移话题只是转移话题。两者都是同一个错误。","“All non-animals are non-foxes.” That is the contrapositive, equivalent to the original (whatever fails to be an animal certainly fails to be a fox). Beware the tempting shortcut of converting first — “All animals are foxes” — for an A does":"“所有非动物都非狐狸。”这是逆否命题，相当于原命题（凡不是动物，就肯定不是狐狸）。请注意先转换的诱人捷径——“所有动物都是狐狸”——因为 A 确实如此","DIVISION is composition run backwards: from what is true of things taken together to what is claimed of each singly. Two and three are five taken together; two by itself is not five. The choir sings beautifully; not every singer in it does.":"划分是倒着进行的组合：从事物组合在一起的真实情况到每个事物单独的主张。二加三等于五；两个本身并不是五个。合唱团的歌声优美动听；并非每个歌手都这样做。","Therefore square ABFG = rectangle BL. In the same way we can show that square ACKH equals rectangle CL by using steps 2 through 7 again, now treating △AMC as the right triangle in question; by that means square ACKH is equal to rectangle CL.":"因此正方形ABFG = 矩形BL。同样，我们可以再次使用步骤 2 到步骤 7 来证明正方形 ACKH 等于矩形 CL，现在将 △AMC 视为所讨论的直角三角形；这意味着正方形ACKH等于矩形CL。","The kinds of division: essential (a general kind into the kinds beneath it), integral (a whole into the parts that make it up), by powers (one thing according to what it can do), accidental (a subject sorted by features it can gain or lose).":"划分的种类：本质（将一般类型划分为它下面的类型）、整体（将整体划分为构成它的部分）、按权力划分（一件事根据它能做什么）、偶然（一个主体根据它可以获得或失去的特征排序）。","Right region, wrong mark. “Some” asserts that something exists — that is the ×. Shading would declare the region empty, the very opposite of what is said. The urge to shade comes from treating every proposition as a claim about a whole region.":"正确的区域，错误的标记。 “某些”断言某物存在——那就是×。阴影将声明该区域为空，与所说的恰恰相反。阴影的冲动来自于将每一个命题都视为对整个地区的主张。","A reasoned opinion, well supported and still open to challenge. Demonstration reaches science, which cannot be otherwise; dialectic reaches the better view. Knowing which of the two you are doing keeps you honest about how much you have shown.":"一个合理的观点，得到很好的支持，并且仍然可以接受挑战。论证达到了科学，否则不可能；辩证法达到更好的视野。知道你正在做的这两项工作中的哪一项可以让你诚实地了解你已经表现出了多少。","Contradiction offends metaphysics; plain falsehood offends natural science and mathematics; the absurd offends dialectic; bad grammar offends grammar; babbling offends rhetoric. Dragging you through all five, the sophist looks universally wise.":"矛盾违背了形而上学；明显的谎言冒犯了自然科学和数学；荒谬违背了辩证法；糟糕的语法会冒犯语法；胡言乱语是一种冒犯性的言辞。把你拖过这五个，诡辩家看起来是普遍明智的。","the modal square : necessary / impossible are contraries — never both true · possible / possible-not are subcontraries — never both false · necessary↔possible-not and impossible↔possible are contradictories · truth descends: necessary ⇒ possible":"模态平方：必要/不可能是对立的 — 决不会同时为真 · 可能/可能 — 不会是次对立 — 决不会同时为假 · 必要↔可能 - 不和不可能↔可能是矛盾 · 真理下降：必要 ⇒ 可能","True only composed: “necessarily: two and three are five” — taken together as one sum the dictum cannot fail. Divided, the parts are split: two is five and three is five — false. Aristotle’s own case of composition and division (Soph. El. 166a).":"真正的唯一组成是：“必然：二加三等于五”——合起来作为一个总和，这个格言不会失败。分开了，各个部分就分开了：二是五，三是五——错误。亚里士多德自己的合成和除法案例（Soph. El. 166a）。","If two triangles stand on the same base and on the same side of it, they cannot have the two sides drawn from one end of the base equal to each other, and the two sides drawn from the other end equal to each other, and yet be different triangles.":"如果两个三角形位于同一底且同一条边上，则它们不能使从底一端引出的两条边相等，从另一端引出的两条边相等，但仍是不同的三角形。","Straight lines inclined towards each other eventually meet, when extended far enough. (Restated with Thm. 11: if two straight lines make less than two right angles on one side of a third straight line, then they will eventually meet on that side.)":"当延伸得足够远时，彼此倾斜的直线最终会相遇。 （Thm. 11 重述：如果两条直线在第三条直线的一侧形成的直角少于两个，那么它们最终将在那一侧相交。）","The classic trap: both extremes are related to the middle term, so they seem related to each other. But unless the middle is taken in its whole extension at least once, each premise may speak of a different part of it — and the extremes never meet.":"经典陷阱：两个极端都与中间项相关，因此它们看起来彼此相关。但除非中间的整个延伸至少被考虑一次，否则每个前提都可能涉及它的不同部分——而极端永远不会相遇。","Here you judge both at once — is the form valid, and are the premises in fact true by the classical definitions? This is not yet full demonstration, for we do not ask whether the premises are first and causal; but it is its nearest gate. To require":"在这里，你可以同时判断两者——形式是否有效，以及根据经典定义，前提实际上是否正确？这还不是完整的证明，因为我们不问前提是否是第一的和因果的；但这是最近的大门。要求","This is the converse of Theorem 36, and Euclid puts it at the very end of Book I. Notice the strategy: build a triangle we *know* is right-angled, show it must be identical with the one we were given, and let the identity carry the right angle back.":"这是定理 36 的逆命题，欧几里得把它放在第一卷的最后。注意策略：建立一个我们“知道”是直角的三角形，证明它必须与我们给出的三角形相同，并让恒等式带回直角。","Every topic carries a MAXIM — the governing proposition an argument drawn from that place depends on. The schools called it the maxima propositio. When the maxim is true the argument holds; when it is false but looks true, you have a fallacy instead.":"每个主题都带有一条准则——从该地方得出的论点所依赖的支配命题。学校称其为极大命题。当格言为真时，论证成立；当它是假的但看起来是真的时，你就有了一个谬误。","You diagrammed the converse — subject and predicate changed places. “All S are P” empties S outside P (not P outside S), and “Some S are not P” marks S outside P. A and O propositions do not convert, so direction matters; this is the most common slip.":"你用图解说明了相反的情况——主语和谓语改变了位置。 “所有S都是P”清空了P之外的S（不是S之外的P），“有些S不是P”标记了P之外的S。A和O命题不转换，所以方向很重要；这是最常见的失误。","If in one triangle a side, the next angle, and the next side are respectively equal to a side, the next angle, and the next side in another triangle, then all the corresponding sides and angles of the two triangles are equal, and they have equal areas.":"如果一个三角形中的一条边、下一个角和下一条边分别等于另一个三角形中的一条边、下一个角和下一条边，则两个三角形的所有对应边和角都相等，并且它们的面积也相等。","it is: of necessity, or impossibly, or possibly. Four doctrines govern them: the four corners of the modal square, equipollence (when two expressions have the same force), the laws that produce equipollences, and the composite versus the divided sense.":"它是：必然，或不可能，或可能。四个学说支配着它们：模态正方形的四个角、等价（当两个表达式具有相同的力时）、产生等价的法则以及复合意义与分割意义。","Theorem 36 only tells us about the triangle we built. To carry its right angle over to the triangle we were given, we must first show the two triangles are identical — and all we know is that their three sides are equal, which is exactly what SSS needs.":"定理 36 只告诉我们关于我们构建的三角形。为了将其直角转移到我们给出的三角形上，我们必须首先证明这两个三角形是相同的——而我们所知道的是它们的三边相等，这正是 SSS 所需要的。","A straight line is a perfectly uniform line. Every part of it is the same “shape” as every other part, regardless of length, and different straight lines differ only in length, location, and orientation. Every other kind of line is called a curved line.":"直线是一条完全均匀的线。它的每个部分与其他部分都是相同的“形状”，无论长度如何，不同的直线仅在长度、位置和方向上有所不同。所有其他类型的线都称为曲线。","“If… then” is the conditional (beware affirming the consequent); “not both” is the conjunctive, which concludes only by positing; “either… or” must confess itself — strict (“but not both”) licenses both moods, broad (“or perhaps both”) only tollendo ponens.":"“如果……那么”是条件句（注意肯定结果）； “不是两者”是连词，仅通过命定得出结论； “要么……或”必须承认——严格的（“但不是两者”）允许两种情绪，广泛的（“或者也许两者”）只允许 tollendo ponens。","Necessary, impossible, possible — after John of St Thomas: judge equipollences (same force, same corner of the square: does “not possible that not” come to “necessary”?), the modal square, and the composite versus the divided sense (may the seated man walk?).":"必要、不可能、可能——遵循圣托马斯的约翰：判断等价性（相同的力，正方形的相同角：“不可能那个不”是否会变成“必要”？），模态正方形，以及复合意义与分割意义（坐着的人可以行走吗？）。","Fold the negations step by step: “impossible” is “necessary not”; a negation before the mode turns “necessary” into “possible not” and “possible” into “necessary not”; a negation after the mode changes only the dictum. Both expressions come to the same corner.":"逐步折叠否定：“不可能”是“不必要”；在模式将“必要”转变为“可能不”和“可能”转变为“必然不”之前进行否定；模式仅改变格言后的否定。两种表达都到达同一个角落。","Grammar considers the judgment in so far as we have correctly combined the words in a meaningful way. Logic considers the judgment in so far as it signifies the truth or falsity of the relation between the two terms that the words of the sentence assert or deny.":"语法考虑的是我们以有意义的方式正确组合单词的判断。逻辑学认为判断是指句子中的词语断言或否认的两个术语之间关系的真假。","Actual ambiguity gives equivocation (in a word) and amphiboly (in a phrase); potential ambiguity gives accent (in a word) and composition and division (in a phrase); apparent ambiguity gives figure of speech. Two, plus three, plus one — six, and not by accident.":"实际的歧义给出了模棱两可（在一个词中）和模棱两可（在一个短语中）；潜在的歧义给出了重音（在一个词中）以及组合和划分（在一个短语中）；明显的歧义给出了修辞手法。二加三，加一——六，这绝非偶然。","St Thomas divides every fallacy in two. If what makes the argument look good comes from the WORD — one sound taken for one thing — the fallacy is in the words. If it comes from the THING — two things that agree somehow taken as simply one — it is outside the words.":"圣托马斯将所有谬论一分为二。如果使论证看起来不错的因素来自于单词——一种声音代表一件事——那么谬误就在单词中。如果它来自于事物——两件以某种方式一致地被视为简单的事物——它就在言语之外。","foxes (every term is non-empty on the traditional account), that part of the animals which contains them must be foxes: hence “some animals are foxes”. Truth is preserved downward only — you cannot climb back from “Some animals are foxes” to “All foxes are animals”.":"狐狸（在传统说法中每个术语都是非空的），包含它们的动物部分一定是狐狸：因此“有些动物是狐狸”。真理只能向下保存——你无法从“有些动物是狐狸”回到“所有狐狸都是动物”。","is what is now called affirming the consequent when it wears an “if,” and the undistributed middle when it does not — modern logic counts those one fault, as the schools did. Each answer here gives you both names, so that you can read either kind of book afterwards.":"现在所谓的当结果带有“如果”时肯定结果，而当它不带有“如果”时则肯定未分配的中间——现代逻辑将这些视为一个错误，就像学校所做的那样。这里的每个答案都会给你两个名字，这样你以后就可以阅读任何一种书。","Mind where the × lands. Shade the universal premises first — the shading then decides which cell of the “some”-zone can still hold a witness. An × in a shaded cell asserts what was declared empty; an × on the wrong side of a circle asserts a membership never claimed.":"注意 × 落在哪里。首先对通用前提进行遮蔽——然后遮蔽决定“某些”区域的哪个单元格仍然可以持有见证人。阴影单元格中的 × 断言被声明为空的内容；圆圈反面的 × 表示从未申请过会员资格。","The same fault under two names. Where the argument has no “if” in it — every thief wants money, this man wants money, so he is a thief — modern books call it the undistributed middle instead, but it is the one fallacy: a link that runs one way is read as running both.":"两个名字下的同一个错误。如果论证中没有“如果”——每个小偷都想要钱，这个人想要钱，所以他是小偷——现代书籍将其称为未分配的中间，但这是一个谬论：单向运行的链接被解读为双向运行。","when the premises could be true and the conclusion still false. That single test is applied here to arguments of every kind — categorical, conjunctive and disjunctive, conditional, modal, and dressed in ordinary speech — the conclusion always following the weaker part.":"当前提可能为真而结论仍然为假时。这个单一的测试在这里适用于各种论证——绝对的、连接的和析取的、条件的、情态的、以及普通言语中的——结论总是在较弱的部分之后。","To conclude validly you need the suspicious premise, not the familiar one: “rain wets streets” is true but yields only the fallacy of affirming the consequent. The valid completion — “wet streets mean rain” — is refuted by every street-sweeper. Aristotle’s refutable sign.":"要得出有效的结论，你需要可疑的前提，而不是熟悉的前提：“雨水打湿街道”是真的，但只会产生肯定结果的谬误。有效的完成——“潮湿的街道意味着下雨”——被每一个街道清洁工所驳斥。亚里士多德的可反驳的符号。","The rules of division: the members together must cover the whole, leaving nothing out; they must not overlap, so that nothing falls under two of them at once; every member must actually belong to the whole being divided; and the whole division must be made on a single basis.":"划分规则：成员加在一起必须覆盖整体，不能遗漏；它们不能重叠，以免没有任何东西同时属于其中两个；每个成员实际上都必须属于分裂的整体；整个划分必须在单一基础上进行。","Notice what we may **not** do: we may not pick up the line BC and carry it over to A. A straight-edge only draws and extends lines; a compass only draws circles. This theorem shows that a length can nevertheless be transferred from one place to another by construction alone.":"请注意我们可能**不**做的事情：我们可能不会拿起线 BC 并将其带到 A。直尺只能绘制和延伸线；指南针只能画圆。该定理表明，仅通过构造就可以将长度从一个地方转移到另一个地方。","A topic (locus) is a standing place an argument can be drawn from: the definition, the wider kind, the narrower kind, the property, opposites, the more and the less, likeness, whole and parts, or authority. Name the topic and you can see at once what would answer the argument.":"主题（轨迹）是一个可以得出论点的立场：定义、更广泛的类型、更窄的类型、属性、对立面、多与少、相似性、整体和部分或权威。说出主题，您就可以立即看到如何回答该论点。","A rectilineal figure is a plane figure contained by straight lines only. A triangle is a plane figure contained by three straight lines. A quadrilateral is a plane figure contained by four straight lines. A polygon is any plane figure contained by more than four straight lines.":"直线图形是仅由直线包含的平面图形。三角形是由三条直线组成的平面图形。四边形是由四条直线组成的平面图形。多边形是由四条以上直线包含的任何平面图形。","There are five ways a general term can be said of a subject — the five predicables of Porphyry. Three of them state part of what the thing is: genus, species, and difference. The other two do not: the property and the accident. Learn to recognize each before you try to name it.":"有五种方式可以表示一个主语的通用术语——斑岩的五个谓语。其中三个陈述了事物的部分内容：属、种和差异。另外两个则不然：财产和事故。在尝试命名之前先学会识别它们。","The purely formal art brought to a point: a chain of syllogisms (a polysyllogism), where each conclusion becomes a premise of the next. Follow the reasoning link by link and judge whether the whole chain holds — for one broken link breaks the chain. Schematic letters; no diagrams.":"纯粹的形式艺术达到了一个点：一系列三段论（多三段论），其中每个结论都成为下一个结论的前提。按照一环一环的推理，判断整个链条是否成立——因为一个断裂的环节就破坏了链条。示意图字母；没有图表。","changes the quality and replaces the predicate with its complement. It works on all four forms and is fully truth-preserving — the obverse is equivalent to the original: “All foxes are animals” ⇄ “No foxes are non-animals”; “Some poets are singers” ⇄ “Some poets are not non-singers”.":"改变质量并用其补语替换谓语。它适用于所有四种形式，并且完全保留事实——正面与原文相同：“所有狐狸都是动物”⇄“没有狐狸是非动物”； “有些诗人是歌手”⇄“有些诗人不是非歌手”。","What follows assumes no prior grammar. It builds from the beginning, in ordinary language, and gives the traditional names as they come. At the end we consider fundamental questions such as the universality of grammar, and why nouns and verbs are what they are. Nothing here is scored.":"以下内容假设没有先验语法。它从一开始就用普通语言构建，并给出了传统的名称。最后，我们考虑一些基本问题，例如语法的普遍性，以及为什么名词和动词是这样的。这里没有任何得分。","The four kinds of disputation: DEMONSTRATIVE, which teaches from what is certain; DIALECTICAL, which weighs what is probable — what seems so to all, or to most, or to the wise; TESTING, which finds out whether a man knows; and SOPHISTICAL, which argues for show, from what only looks true.":"四种争论： 论证性的，从确定的事物中教导；辩证法，衡量可能发生的事情——对所有人、大多数人或智者来说似乎如此的事情；测试，看看一个人是否知道；以及诡辩派，主张表演，只从看起来真实的东西开始。","Six fallacies come from the words: equivocation, amphiboly, accent, composition, division, figure of speech. Seven come from outside the words: accident; in a certain respect taken flatly; missing the point; begging the question; not the cause as cause; the consequent; many questions as one.":"词语产生六种谬误：模棱两可、模棱两可、重音、构成、分割、修辞。七个来自外界的词：意外；在某些方面是直截了当的；没有抓住要点；乞求问题；不以因为因；结果；许多问题合而为一。","of two cells — one inside the third circle and one outside it. A single × placed in one cell asserts several “some”-propositions at once, as the readout below will show. In syllogism mode the readout also states what your marks force about the two outer terms — the conclusion, if one follows.":"两个单元格——一个在第三个圆圈内，一个在第三个圆圈外。放置在一个单元格中的单个 × 可以同时断言多个“某些”命题，如下面的读数所示。在三段论模式下，读数还会说明您的标记对两个外部项的影响力 - 结论（如果有的话）。","The necessary sign, cousin to Aristotle’s milk: water takes ice only in freezing air, so the tacit premise holds of necessity and the enthymeme concludes as firmly as any syllogism. Note that the converse, true as it is, would conclude nothing — validity asks the direction, not merely the truth.":"必要的标志，亚里士多德的牛奶的近亲：水只在冰冷的空气中才能结冰，因此隐含的前提成立了必然性，并且推理素的结论与任何三段论一样坚定。请注意，反之亦然，即使如此，也不会得出任何结论——有效性要求的是方向，而不仅仅是真理。","composite sense — the mode gove
